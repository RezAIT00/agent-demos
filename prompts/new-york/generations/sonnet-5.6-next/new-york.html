const downMat = fsMat(/* glsl */`
  uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThresh; varying vec2 vUv;
  vec3 s(float x, float y) { return min(texture(tSrc, vUv + uTexel * vec2(x, y)).rgb, vec3(24.0)); }
  void main() {
    vec3 e = s(0.0, 0.0);
    vec3 c = e * 0.125 + (s(-2.0, -2.0) + s(2.0, -2.0) + s(-2.0, 2.0) + s(2.0, 2.0)) * 0.03125
           + (s(0.0, -2.0) + s(-2.0, 0.0) + s(2.0, 0.0) + s(0.0, 2.0)) * 0.0625

      float knee = clamp(l - uThresh + 0.45, 0.0, 0.9);

  uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uWeight; varying vec2 vUv;

// ───────────────────────────────────────────────────────────── camera
const camera = new THREE.PerspectiveCamera(25, 1, 60, 2600);
camera.layers.enable(LAYER_NOREFLECT);
const RIG = { az: 9, swing: 20, pitch: 30.5, push: 0.045, dist: 700, target: V3(2, -8, 4) };
function placeCamera(t, rig = RIG) {
  const w = OMEGA * t;
  const az = THREE.MathUtils.degToRad(rig.az + rig.swing * Math.sin(w));          // sweeps 40° and returns
  const el = THREE.MathUtils.degToRad(rig.pitch + 0.7 * Math.sin(w + Math.PI * 0.5) - 0.7);
  const dist = rig.dist * (1 - rig.push * (0.5 - 0.5 * Math.cos(w)));             // push in, pull back
  camera.position.set(
    rig.target.x + dist * Math.sin(az) * Math.cos(el),
    rig.target.y + dist * Math.sin(el),
    rig.target.z + dist * Math.cos(az) * Math.cos(el));
  camera.lookAt(rig.target);
  camera.updateMatrixWorld();
}

// points that must stay comfortably inside the square for the whole orbit
function framingPoints() {
  const pts = [];
  for (const [x, z] of SLAB) { pts.push(V3(x, 1.5, z)); pts.push(V3(x, -16, z)); }
  for (let k = 0; k < ROCK.nz; k += 5) for (let i = 0; i < ROCK.nx; i += 5) {
    for (let j = 0; j < ROCK.ny; j++) if (ROCK.get(i, j, k)) { pts.push(V3(ROCK.min[0] + i + 0.5, ROCK.min[1] + j, ROCK.min[2] + k + 0.5)); break; }
  }
  for (const f of FALLS) for (const s of [f.s0, f.s1]) {
    const q = SLAB_RING.at(s), h = f.h * 0.86, o = fallOut(h, 0.5);
    pts.push(V3(q.x + q.nx * o, -h, q.z + q.nz * o));
  }
  pts.push(V3(POS.esb[0], 99.5, POS.esb[1]), V3(POS.wtc[0], 103, POS.wtc[1]), V3(POS.chrysler[0], 86, POS.chrysler[1]));
  pts.push(V3(POS.liberty[0] - 4.5, 50.5, POS.liberty[1]));
  for (const s of BR.towers) for (const w of [-10, 10]) pts.push(bridgePoint(s, 40, w));
  return pts;
}
const FIT = { margin: 0.944 };
function fitCamera() {
  const pts = framingPoints(), v = V3();
  for (let it = 0; it < 10; it++) {
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (let k = 0; k < 24; k++) {
      placeCamera((k / 24) * LOOP);
      for (const p of pts) {
        v.copy(p).project(camera);
        if (v.x < x0) x0 = v.x; if (v.x > x1) x1 = v.x; if (v.y < y0) y0 = v.y; if (v.y > y1) y1 = v.y;
      }
    }
    FIT.box = [x0, x1, y0, y1];
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const half = Math.max((x1 - x0) / 2, (y1 - y0) / 2);
    const worldPerNdc = RIG.dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const az = THREE.MathUtils.degToRad(RIG.az), el = THREE.MathUtils.degToRad(RIG.pitch);
    const right = V3(Math.cos(az), 0, -Math.sin(az));
    const up = V3(-Math.sin(az) * Math.sin(el), Math.cos(el), -Math.cos(az) * Math.sin(el));
    RIG.target.addScaledVector(right, cx * worldPerNdc * 0.8).addScaledVector(up, cy * worldPerNdc * 0.8);
    RIG.dist *= 1 + (half / FIT.margin - 1) * 0.85;

// ───────────────────────────────────────────────────────────── posing: a pure function of t
function pose(t) {
  U.uTime.value = t;
  placeCamera(t);
  poseTraffic(t);
  posePedestrians(t);
  poseBoats(t);
  poseGulls(t);
}
function drawFrame() {
  renderReflection(camera);
  renderer.setRenderTarget(hdrRT);
  renderer.clear();
  renderer.render(scene, camera);
  bloom();
  finalMat.uniforms.tHDR.value = hdrRT.texture;
  finalMat.uniforms.tBloom.value = mips[0].texture;
  pass(finalMat, null);
}

const NOWRAP = PARAMS.get('nowrap') === '1';
function renderAt(t) {
  pose(NOWRAP ? t : mod(t, LOOP));
  drawFrame();
}

function boot() {
  buildWorld();
  const canvas = renderer.domElement;
  let width = RENDER_MODE ? parseInt(PARAMS.get('size') || '1080', 10) : 1080;
  const layout = () => {
    const css = RENDER_MODE ? width : Math.max(240, Math.min(window.innerWidth, window.innerHeight));
    canvas.style.width = css + 'px'; canvas.style.height = css + 'px';
    if (RENDER_MODE) resize(width, SS);
    else resize(Math.min(1440, Math.round(css * Math.min(window.devicePixelRatio || 1, 1.5))), SS);
  };
  layout();
  fitCamera();
  renderAt(0);
  document.getElementById('boot')?.remove();

  window.renderAt = renderAt;
  window.__nyc = {
    stats: () => ({ ...STATS, calls: renderer.info.render.calls, walkers: WALKERS.length, lights: LIGHTS.length, glints: GLINTS.length, fit: FIT.box, dist: RIG.dist, target: RIG.target.toArray() }),
    project: (list) => list.map((p) => { const v = V3(...p).project(camera); return [Math.round((v.x * 0.5 + 0.5) * 1080), Math.round((0.5 - v.y * 0.5) * 1080)]; }),
    context: () => renderer.getContext(),
    THREE, camera, scene, renderer, RIG, U, finalMat, placeCamera, drawFrame,
    // oriented-box test between every pair of vehicles across the whole loop
    overlaps: () => {
      const hits = [], kinds = { cab: 0, car: 0, bus: 0 };
      LANES.forEach((l) => l.spawns.forEach((s) => kinds[s.kind]++));
      const corners = (v) => { const fx = Math.cos(v.yaw), fz = -Math.sin(v.yaw), a = v.len / 2 - 0.08, b = v.wid / 2 - 0.05; return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([p, q]) => [v.x + fx * a * p - fz * b * q, v.z + fz * a * p + fx * b * q]); };
      const sat = (A, B) => { for (const P of [A, B]) for (let i = 0; i < 2; i++) { const nx = -(P[i + 1][1] - P[i][1]), nz = P[i + 1][0] - P[i][0]; const pa = A.map((c) => c[0] * nx + c[1] * nz), pb = B.map((c) => c[0] * nx + c[1] * nz); if (Math.max(...pa) < Math.min(...pb) || Math.max(...pb) < Math.min(...pa)) return false; } return true; };
      for (let k = 0; k < 120; k++) {
        const list = [];
        vehiclesAt(k / 10, (lane, sp, x, y, z, yaw, pitch, s) => { if (s > 5 && s < LANES[lane].L - 5) list.push({ lane, x, y, z, yaw, len: VEH[sp.kind].len, wid: sp.kind === 'bus' ? 1.92 : 1.52 }); });
        for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          if (Math.abs(a.y - b.y) > 1.6 || Math.hypot(a.x - b.x, a.z - b.z) > 7.5) continue;
          if (sat(corners(a), corners(b))) hits.push([k / 10, a.lane, b.lane, Math.round(a.x), Math.round(a.z)]);
        }
      }
      return { kinds, count: hits.length, drift: LANES.map((l) => +l.drift.toFixed(2)), sample: hits.slice(0, 30) };
    },
    signals: () => [0, 1.5, 3, 4.5, 6, 7.5, 9, 10.5].map((t) => { let on = 0, stopped = 0; vehiclesAt(t, (li, sp, x, y, z, yaw, p, s, v) => { if (s > 6 && s < LANES[li].L - 6) { on++; if (v < 0.4) stopped++; } }); return [t, on, stopped]; }),
    // every moving thing sampled against every solid voxel grid (plus the One WTC podium)
    collisions: () => {
      const solid = (x, y, z) => {
        for (const g of ALL_GRIDS) {
          if (!g.occ) continue;
          const dx = x - g.pos[0], dz = z - g.pos[2], c = Math.cos(g.yaw), n = Math.sin(g.yaw);
          if (g.at(dx * c - dz * n, y - g.pos[1], dx * n + dz * c)) return true;
        }
        const [wx, wz] = POS.wtc;
        return y < 13 && Math.abs(x - wx) < 7.5 && Math.abs(z - wz) < 7.5;
      };
      const out = { vehicles: [], boats: [], walkers: [] };
      LANES.forEach((lane, li) => {
        for (let s = 0; s <= lane.L; s += 0.5) {
          const [x, y, z, yaw, pitch] = lane.pose(s), fx = Math.cos(yaw), fz = -Math.sin(yaw);
          for (const [a, b] of [[0, 0], [1.45, 0.7], [1.45, -0.7], [-1.45, 0.7], [-1.45, -0.7]]) {
            const px = x + fx * a - fz * b, pz = z + fz * a + fx * b;
            if (solid(px, y + 0.95 + a * Math.tan(pitch), pz)) { out.vehicles.push([li, Math.round(s), Math.round(px), Math.round(pz)]); s += 8; break; }
          }
        }
      });
      for (const b of BOATS) for (let s = 0; s <= b.route.len; s += 0.8) {
        const p = b.route.at(s), [hx, hz] = b.route.heading(s, b.len * 0.45);
        for (const [a, w] of [[0.48, 0], [0.3, 0.45], [0.3, -0.45], [-0.3, 0.45], [-0.3, -0.45], [-0.48, 0]]) {
          const px = p.x + hx * a * b.len - hz * w * b.beam, pz = p.z + hz * a * b.len + hx * w * b.beam;
          if (solid(px, 1.1, pz)) { out.boats.push([b.len, Math.round(s), Math.round(px), Math.round(pz)]); s += 6; break; }
        }
      }
      WALKERS.forEach((w, i) => {
        for (let t = 0; t < 12; t += 0.5) { const [x, y, z] = w.at(t); if (solid(x, y + 0.85, z)) { out.walkers.push([i, Math.round(x), Math.round(y), Math.round(z)]); break; } }
      });
      return { nv: out.vehicles.length, nb: out.boats.length, nw: out.walkers.length, vehicles: out.vehicles.slice(0, 30), boats: out.boats.slice(0, 20), walkers: out.walkers.slice(0, 40) };
    },
    // first voxel hit on the sightline from a world point toward the camera
    sightline: (t, p) => { placeCamera(t); const a = V3(...p), d = camera.position.clone().sub(a).normalize(); for (let s = 1.2; s < 260; s += 0.4) { const q = a.clone().addScaledVector(d, s); if (CITY.at(q.x, q.y, q.z)) return [Math.round(q.x), Math.round(q.y), Math.round(q.z)]; } return null; },
  };
  window.__ready = true;

  if (!RENDER_MODE) {
    window.addEventListener('resize', layout);
    const t0 = performance.now();
    const tick = (now) => { renderAt(((now - t0) / 1000) % LOOP); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
}

try {
  setTimeout(() => {
    try { boot(); } catch (err) {
      console.error(err); window.__error = String(err && err.stack || err);
      const el = document.getElementById('boot'); if (el) el.textContent = 'Could not build the scene: ' + err.message;
    }
  }, 30);
} catch (err) {
  console.error(err);
}
</script>
</body>
</html>
