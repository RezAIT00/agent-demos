// seeded RNG: each system owns a stream so edits stay local
function RNG(seed) {

    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  return f;
}

function ihash(x, y = 0, z = 0) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);

}
function noise3(x, y, z) {

function inPoly(x, z, P) {

// palette → float texture (4 rows)
function buildPaletteTexture() {
  const n = 256;
  const data = new Float32Array(n * 4 * 4);
  const col = new THREE.Color(), em = new THREE.Color();
  MATS.forEach((m, i) => {
    col.setHex(m.c); em.setHex(m.e ?? 0);
    const set = (row, a, b, c, d) => data.set([a, b, c, d], (row * n + i) * 4);
    set(0, col.r, col.g, col.b, m.r ?? 0.9);
    set(1, em.r * (m.ei || 0), em.g * (m.ei || 0), em.b * (m.ei || 0), m.m || 0);
    set(2, m.type || 0, m.lit || 0, m.vary || 0, m.cool || 0);
    const cc = m.cell || [1, 1, 1];
    set(3, cc[0], cc[1], cc[2], 0);
  });
  const t = new THREE.DataTexture(data, n, 4, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true;
  return t;
}

// ───────────────────────────────────────────────────────────── geometry builder

      const b = new this.T(c); b.set(this.a.subarray(0, this.n)); this.a = b;
    }
  }
  view() { return this.a.slice(0, this.n); }
}

  constructor() {

// ───────────────────────────────────────────────────────────── light + occlusion volume
const VOL = { min: [-142, -28, -192], cell: 2, n: [143, 66, 186], scale: 2.6 };

const SLAB_BASE = [[-97, 143], [-78, 156], [-46, 167], [-6, 171], [34, 167], [68, 158], [97, 141], [117, 117], [129, 88], [135, 52], [134, 8], [136, -38], [128, -82], [121, -112], [103, -143], [76, -165], [44, -177], [0, -181], [-48, -182], [-88, -184], [-112, -177], [-116, -150], [-113, -120], [-108, -98], [-105, -86], [-108, -66], [-111, -30], [-115, 8], [-116, 48], [-114, 84], [-108, 116]];

const SLAB = (() => {
  const out = [];
  for (let i = 0; i < SLAB_BASE.length; i++) {
    const a = SLAB_BASE[i], b = SLAB_BASE[(i + 1) % SLAB_BASE.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.round(len / 4));
    const nx = (b[1] - a[1]) / len, nz = -(b[0] - a[0]) / len;
    for (let k = 0; k < n; k++) {
      const t = k / n;
      const x = lerp(a[0], b[0], t), z = lerp(a[1], b[1], t);
      const amp = (x < -96 && z < -90) ? 1.6 : 4.2;
      const j = (noise2(x * 0.13, z * 0.13, 71) - 0.5) * amp;
      out.push([x + nx * j, z + nz * j]);
    }
  }
  return out;
})();

const MANHATTAN = [[-6, 62], [-14, 61], [-26, 55], [-38, 46], [-48, 36], [-54, 20], [-57, -4], [-58, -30], [-58, -56], [-58, -80], [-62, -88], [-74, -93], [-96, -95], [-136, -99], [-136, -196], [54, -196], [52, -160], [50, -130], [46, -106], [40, -80], [34, -60], [29, -40], [27, -22], [26, -4], [22, 14], [18, 30], [12, 44], [6, 54], [1, 60]];

  const pts = [], rot = 0.35;

const isManhattan = (x, z) => inPoly(x, z, MANHATTAN) && inPoly(x, z, SLAB);

// ── Brooklyn Bridge frame: s along the deck (Manhattan → Brooklyn), w across ──
const BR = (() => {
  const ax = 18, az = -37, dx = 0.766044, dz = 0.642788;
  return {
    ax, az, dx, dz, yaw: -Math.atan2(dz, dx),
    towers: [24, 82], L: 108,
    toWorld: (s, w) => [ax + s * dx - w * dz, az + s * dz + w * dx],
    toLocal: (x, z) => [(x - ax) * dx + (z - az) * dz, -(x - ax) * dz + (z - az) * dx],
    deckY(s) {
      if (s < -3) return lerp(2.45, 10.0, clamp((s + 13) / 10, 0, 1));
      if (s > 111) return lerp(10.0, 2.45, clamp((s - 111) / 11, 0, 1));
      return 10.0 + 1.5 * Math.sin((Math.PI * (s + 3)) / 114);
    },
  };
})();
const inBridgeCorridor = (x, z, pad = 0) => {
  const [s, w] = BR.toLocal(x, z);
  return (s > -23 - pad && s < 27 + pad && Math.abs(w) < 9.2 + pad) || (s > 98 - pad && s < 135 + pad && Math.abs(w) < 9.2 + pad);
};

const inRect = (x, z, r) => x >= r[0] && z >= r[1] && x < r[2] && z < r[3];
function shoreRoadAt(x, z) {
  if (z < -96 || z > 58) return false;

  return d >= 2.2 && d < 5.2;

  for (const r of ROAD_RECTS) if (inRect(x, z, r)) return true;
  if (lineDist(x, z, BROADWAY) < 2.4) return true;

// ── ground decal: lane paint, crosswalks, plaza paving ────────────────────
const DECAL = { x0: -126, z0: -188, w: 272, h: 364, ppu: 7 };
function buildGroundDecal(signalCrossings) {
  const cv = document.createElement('canvas');
  cv.width = DECAL.w * DECAL.ppu; cv.height = DECAL.h * DECAL.ppu;
  const g = cv.getContext('2d');
  const X = (x) => (x - DECAL.x0) * DECAL.ppu, Z = (z) => (z - DECAL.z0) * DECAL.ppu;
  const fill = (x0, z0, x1, z1, style) => { g.fillStyle = style; g.fillRect(X(x0), Z(z0), (x1 - x0) * DECAL.ppu, (z1 - z0) * DECAL.ppu); };
  const white = 'rgba(214,214,204,0.78)', yellow = 'rgba(222,170,60,0.85)';
  for (const a of AVENUES) {
    const cx = (a[0] + a[2]) / 2, w = a[2] - a[0];
    for (let z = a[1]; z < a[3]; z += 3.2) fill(cx - 0.13, z, cx + 0.13, z + 1.5, w >= 5 ? white : yellow);
    if (w >= 5) { fill(a[0] + 0.18, a[1], a[0] + 0.34, a[3], 'rgba(200,200,196,0.45)'); fill(a[2] - 0.34, a[1], a[2] - 0.18, a[3], 'rgba(222,170,60,0.55)'); }
  }
  for (const c of CROSS) {
    const cz = (c[1] + c[3]) / 2;
    for (let x = c[0]; x < c[2]; x += 2.6) fill(x, cz - 0.1, x + 1.2, cz + 0.1, 'rgba(210,190,120,0.55)');
  }
  // zebra crossings + stop lines where avenues meet cross streets
  for (const a of AVENUES) {
    if (a[2] - a[0] < 5) continue;
    for (const c of CROSS) {
      if (c[0] > a[0] || c[2] < a[2] || c[1] < a[1] || c[3] > a[3]) continue;
      fill(a[0], c[1], a[2], c[3], 'rgba(40,43,52,1)');
      for (let x = a[0] + 0.35; x < a[2] - 0.2; x += 0.85) { fill(x, c[1] - 1.45, x + 0.42, c[1] - 0.15, white); fill(x, c[3] + 0.15, x + 0.42, c[3] + 1.45, white); }
      for (let z = c[1] + 0.2; z < c[3] - 0.2; z += 0.8) { fill(a[0] - 1.35, z, a[0] - 0.15, z + 0.4, white); fill(a[2] + 0.15, z, a[2] + 1.35, z + 0.4, white); }
    }
  }
  // Times Square paving: warm tiles with a dotted light grid
  for (let x = TS_RECT[0]; x < TS_RECT[2]; x += 1.5) for (let z = TS_RECT[1]; z < TS_RECT[3]; z += 1.5) {
    if (roadAt(x + 0.7, z + 0.7)) continue;
    fill(x + 0.08, z + 0.08, x + 1.42, z + 1.42, ihash(Math.round(x * 2), Math.round(z * 2)) < 0.5 ? 'rgba(128,112,120,0.75)' : 'rgba(104,94,108,0.75)');
    if (ihash(Math.round(x * 3), Math.round(z * 3), 4) < 0.08) fill(x + 0.55, z + 0.55, x + 0.95, z + 0.95, 'rgba(255,214,150,0.9)');
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.flipY = false;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  U.uGround.value = tex;
  U.uGroundXf.value.set(DECAL.x0, DECAL.z0, 1 / DECAL.w, 1 / DECAL.h);
}

// ── waterfall ribbons along the rim ───────────────────────────────────────
const SLAB_RING = (() => {
  const cum = [0];
  for (let i = 1; i <= SLAB.length; i++) {
    const a = SLAB[i - 1], b = SLAB[i % SLAB.length];
    cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  const len = cum[SLAB.length];
  // outward normal sign from polygon winding
  let area = 0;
  for (let i = 0; i < SLAB.length; i++) { const a = SLAB[i], b = SLAB[(i + 1) % SLAB.length]; area += a[0] * b[1] - b[0] * a[1]; }
  const sgn = area > 0 ? 1 : -1;
  return {
    len, cum,
    at(s) {
      s = mod(s, len);
      let lo = 0, hi = SLAB.length;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
      const a = SLAB[lo], b = SLAB[(lo + 1) % SLAB.length];
      const L = cum[lo + 1] - cum[lo], t = (s - cum[lo]) / L;
      const tx = (b[0] - a[0]) / L, tz = (b[1] - a[1]) / L;
      return { x: lerp(a[0], b[0], t), z: lerp(a[1], b[1], t), tx, tz, nx: tz * sgn, nz: -tx * sgn };
    },
    nearest(x, z) {
      let best = 1e9, bs = 0;
      for (let i = 0; i < SLAB.length; i++) {
        const a = SLAB[i], b = SLAB[(i + 1) % SLAB.length];
        const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz;
        const t = clamp(((x - a[0]) * dx + (z - a[1]) * dz) / L2, 0, 1);
        const d = Math.hypot(x - a[0] - dx * t, z - a[1] - dz * t);
        if (d < best) { best = d; bs = cum[i] + t * (cum[i + 1] - cum[i]); }
      }
      return [best, bs];
    },
  };
})();

const FALLS = (() => {
  // classify the rim into runs of open water, then cut ribbons out of each run
  const rnd = RNG(4411), out = [];
  const step = 1;
  const kindAt = (s) => {
    const p = SLAB_RING.at(s);
    const ix = p.x - p.nx * 3.2, iz = p.z - p.nz * 3.2;
    if (inPoly(ix, iz, MANHATTAN) || inPoly(ix, iz, BROOKLYN)) return null;
    if (p.z > 132 && p.x > -98 && p.x < 118) return 'front';
    return 'side';
  };
  let s = 0;
  while (s < SLAB_RING.len) {
    const k = kindAt(s);
    if (!k) { s += step; continue; }
    const w = k === 'front' ? rnd.pick([10, 15, 7, 18, 12, 5, 13]) : rnd.range(2.2, 5.0);
    let e = s;
    while (e < s + w && e < SLAB_RING.len && kindAt(e) === k) e += step;
    if (e - s >= 2) {
      out.push({ s0: s, s1: e, kind: k, h: k === 'front' ? rnd.range(28, 43) : rnd.range(24, 38), seed: rnd() * 100 });
      s = e + (k === 'front' ? rnd.range(6.5, 12) : rnd.range(13, 28));
    } else s = e + step;
  }
  return out;
})();
const fallAt = (s, pad = 0) => FALLS.some((f) => s >= f.s0 - pad && s <= f.s1 + pad);

// ───────────────────────────────────────────────────────────── floating island
const CITY = new VoxelGrid(272, 140, 364, { size: 1, min: [-126, -76, -188] });
const ROCK = new VoxelGrid(272, 100, 364, { size: 1, min: [-126, -98, -188], occ: false });   // strata, skipped by reflections

function strataMat(x, y, z) {
  const wy = y + (fbm2(x * 0.05, z * 0.05, 3, 21) - 0.5) * 6 + (noise2(x * 0.22, z * 0.22, 5) - 0.5) * 1.6;
  const streak = mod((x * 0.55 + z * 0.35 + y * 1.55) * 0.12 + noise3(x * 0.09, y * 0.09, z * 0.09) * 1.4, 1);
  const vein = noise3(x * 0.21, y * 0.34, z * 0.21);
  const park = x < -96 && z < -96;
  if (wy > -3.4) return M.soilTop;
  if (wy > (park ? -10.5 : -7.2)) return noise3(x * 0.3, y * 0.6, z * 0.3) > 0.52 ? M.soil2 : M.soil;
  if (wy > (park ? -12.5 : -10.4)) return vein > 0.64 ? M.paleStone2 : M.paleStone;
  if (wy > -22.5) return streak < 0.13 ? M.mica : (noise3(x * 0.12, y * 0.2, z * 0.12) > 0.5 ? M.schist : M.schist2);
  if (wy > -25.8) return vein > 0.55 ? M.soil2 : M.soil;
  if (wy > -33) return streak < 0.09 ? M.mica : (vein > 0.7 ? M.paleStone2 : M.schist2);
  if (wy > -36.8) return vein > 0.46 ? M.paleStone : M.paleStone2;
  if (wy > -47) return streak < 0.08 ? M.schist : (vein > 0.74 ? M.paleStone2 : M.schistDark);
  if (wy > -50) return vein > 0.5 ? M.soil : M.rimRock;
  return streak < 0.07 ? M.schist2 : (vein > 0.76 ? M.paleStone2 : (noise3(x * 0.17, y * 0.17, z * 0.17) > 0.55 ? M.deep : M.schistDark));
}

const SPIKES = (() => {
  const r = RNG(991), out = [];
  while (out.length < 110) {
    const x = r.range(-110, 130), z = r.range(-168, 158);
    if (inPoly(x, z, SLAB)) out.push({ x, z, r: r.range(3, 9.5), h: r.range(9, 30) });
  }
  return out;
})();

function buildTerrain() {
  const G = CITY, R = ROCK;
  const WATER_RIM = [];
  for (let k = 0; k < G.nz; k++) {
    const z = G.min[2] + k + 0.5;
    for (let i = 0; i < G.nx; i++) {
      const x = G.min[0] + i + 0.5;
      if (!inPoly(x, z, SLAB)) continue;
      const [d, ringS] = SLAB_RING.nearest(x, z);
      // ── underside: inverted, terraced, fractured ──
      let maxD = 32 + 52 * smooth(0, 74, d) + (fbm2(x * 0.045, z * 0.045, 3, 5) - 0.5) * 28;
      for (const s of SPIKES) { const q = Math.hypot(x - s.x, z - s.z) / s.r; if (q < 1) maxD += s.h * Math.pow(1 - q, 1.4); }
      maxD += (noise2(x * 0.3, z * 0.3, 8) - 0.5) * 7;
      maxD = Math.min(maxD, 95);
      const qn = noise2(x * 0.07, z * 0.07, 12) * 4.2;
      const gr = Math.max(0, noise2(x * 0.24, z * 0.24, 9) - 0.57) * 15;
      const bkCut = d < 4.6 && inPoly(x, z, BROOKLYN) && z < 84;
      for (let m = 1; m < 97; m++) {
        const y = -m - 0.5;
        const depth = m + 0.5;
        if (depth > maxD) break;
        const q = Math.floor((depth + qn) / 5.6);
        const inset = Math.max(0, q * 5.6 - 22) * 0.58;
        const ledge = ihash(q, 3, Math.floor((x + z * 0.6) / 15)) < 0.45 ? -2.1 : 1.3;
        const jag = (noise3(x * 0.17, depth * 0.23, z * 0.17) - 0.5) * 7.4;
        const lim = inset + jag * smooth(2, 9, depth) + gr * smooth(3, 8, depth) + (depth > 9 ? ledge : 0);
        if (d <= Math.max(0, lim)) continue;
        const j = R.iy(y);
        let mm = strataMat(x, y, z);
        // timber pilings holding the streets, exposed in the cut under Brooklyn
        if (bkCut && depth < 9.5) {
          if (d < 2.4) {
            const post = mod(Math.floor(z), 3) === 0;
            if (!post) continue;
            mm = M.piling;
          } else mm = M.seawall;
        }
        R.set(i, j, k, mm);
      }
      // ── top: land, or water bed with a rocky rim where nothing spills ──
      const man = inPoly(x, z, MANHATTAN), bk = inPoly(x, z, BROOKLYN), lib = isLibertyIsle(x, z);
      if (man || bk || lib) {
        const shore = Math.min(man ? polyEdgeDist(x, z, MANHATTAN) : 99, bk ? polyEdgeDist(x, z, BROOKLYN) : 99, lib ? polyEdgeDist(x, z, LIBERTY_ISLE) : 99);
        const side = shore < 1.5 || d < 1.6 ? M.seawall : M.dirt;
        G.box(x - 0.5, -2, z - 0.5, x + 0.5, 1, z + 0.5, side);
        if (bkCut && d < 2.4) G.box(x - 0.5, -2, z - 0.5, x + 0.5, 1, z + 0.5, mod(Math.floor(z), 3) === 0 ? M.piling : 0);
        let top = M.lot;
        if (bk) {
          if (BK_COBBLE.some((r) => inRect(x, z, r))) top = M.cobble;
          else if (BK_ROADS.some((r) => inRect(x, z, r))) top = M.asphalt;
          else if ((x < 92.5 && z > -2) || (z > 58 && z < 100)) top = M.grass;
          else if (BK_COBBLE.concat(BK_ROADS).some((r) => inRect(x, z, [r[0] - 1, r[1] - 1, r[2] + 1, r[3] + 1]))) top = M.sidewalk;
        } else if (lib) {
          top = shore < 1.5 ? M.seawall : M.grass;
        } else if (isPark(x, z)) {
          top = M.grass;
        } else {
          if (inRect(x, z, TS_RECT)) top = roadAt(x, z) ? M.asphalt : M.plaza;
          else if (roadAt(x, z)) top = M.asphalt;
          else if (roadAt(x - 1, z) || roadAt(x + 1, z) || roadAt(x, z - 1) || roadAt(x, z + 1) || shore < 2.2) top = M.sidewalk;
          else if (z > 49) top = noise2(x * 0.2, z * 0.2, 4) > 0.5 ? M.grass : M.grassFall;
        }
        G.box(x - 0.5, 1, z - 0.5, x + 0.5, 2, z + 0.5, top);
      } else if (d < 2.1 && !fallAt(ringS, 0.6)) {
        const h = noise2(x * 0.42, z * 0.42, 33);
        const topY = h > 0.62 ? 2 : (h > 0.28 ? 1 : 0);
        R.box(x - 0.5, -2, z - 0.5, x + 0.5, topY, z + 0.5, h > 0.5 ? M.rimRock : M.schist2);
        if (h > 0.8) R.put(x, topY + 0.5, z, M.schist);
      }
    }
  }

  // dark pilings along Manhattan's seawall
  for (let k = 0; k < G.nz; k++) {
    const z = G.min[2] + k + 0.5;
    for (let i = 0; i < G.nx; i++) {
      const x = G.min[0] + i + 0.5;
      if (z < -96 || mod(i + k, 3) !== 0 || isLand(x, z) || !inPoly(x, z, SLAB)) continue;
      const nearMan = isManhattan(x - 1, z) || isManhattan(x + 1, z) || isManhattan(x, z - 1) || isManhattan(x, z + 1);
      const nearBk = isBrooklyn(x - 1, z) || isBrooklyn(x + 1, z) || isBrooklyn(x, z - 1) || isBrooklyn(x, z + 1);
      if (nearMan || nearBk) G.box(x - 0.5, -2, z - 0.5, x + 0.5, 1, z + 0.5, M.piling);
    }
  }

  // warm work lamps tucked behind the pilings pick the posts out of the cut
  for (let z = -104; z < 80; z += 7) {
    let x = 142;
    while (x > 90 && !(inPoly(x, z + 0.5, SLAB) && inPoly(x, z + 0.5, BROOKLYN))) x -= 1;
    if (x <= 90) continue;
    addLight(x - 0.9, -4.5, z + 0.5, 0xffa04a, 0.95, 5.5);
  }
  buildRoots();
}

// roots that break out of the cut below Central Park
function buildRoots() {
  const R = ROCK, rnd = RNG(2027);
  const solid = (x, y, z) => R.at(x, y, z) !== 0;
  const faceX = (y, z) => { for (let x = -125.5; x < -80; x += 1) if (solid(x, y, z)) return x; return null; };
  function root(x, y, z, len, thick) {
    let cx = x, cz = z;
    for (let s = 0; s < len; s++) {
      const cy = y - s;
      const f = faceX(cy, cz);
      if (f !== null && cx > f - 1) cx = f - 1;
      if (rnd() < 0.3) cx -= 1;
      else if (rnd() < 0.18 && f === null) cx += 1;
      if (rnd() < 0.28) cz += rnd() < 0.5 ? -1 : 1;
      const m = s < len * 0.55 ? M.root : M.rootDark;
      R.put(cx, cy, cz, m);
      if (thick && s < len * 0.45) { R.put(cx, cy, cz + 1, m); R.put(cx + 1, cy, cz, M.rootDark); }
      if (rnd() < 0.5) R.put(cx, cy - 0.01, cz + (rnd() < 0.5 ? 0.0 : 1.0), m);
      if (thick && s > 3 && rnd() < 0.14) root(cx - 1, cy, cz + (rnd() < 0.5 ? -1 : 1), Math.floor((len - s) * 0.75) + 2, false);
    }
  }
  for (let n = 0; n < 30; n++) {
    const z = -174 + n * 2.55 + rnd.range(-1, 1) + 0.5;
    const y = -2.5 - rnd.int(0, 5);
    const f = faceX(y, z);
    if (f === null) continue;
    root(f - 1, y, z, rnd.int(9, n % 4 === 0 ? 30 : 19), n % 3 === 0);
  }
  // trailing vines spilling over the park wall
  for (let n = 0; n < 55; n++) {
    const z = -176 + rnd() * 78 + 0.5;
    const f = faceX(-1.5, z);
    if (f === null) continue;
    const L = rnd.int(1, 5);
    for (let s = 0; s < L; s++) R.put(f - 1, -0.5 - s, z, rnd() < 0.5 ? M.vine : (rnd() < 0.5 ? M.leafRust : M.leafGold));
  }
}

// ───────────────────────────────────────────────────────────── city fabric

const STEAM = [];                     // {x,y,z,s} steam emitters
const WATER_TOWERS = [];              // {x,y,z,s,r}

const isReserved = (x, z) => RESERVED.some((r) => inRect(x, z, r));

const CROSS_ROUTES = [

const PAL_BRICK = ['brickRed', 'brickBrown', 'brickTan', 'brickDark', 'brickOrange', 'brickRed', 'brickBrown'];
const PAL_LIME = ['limestone', 'limestone2', 'stoneGrey', 'whiteBrick', 'limestone'];

function styleSpec(style, rnd) {
  switch (style) {
    case 'brick': return { style, wall: M[rnd.pick(PAL_BRICK)], win: M[rnd.pick(['brickWin', 'brickWin', 'winSparse'])], trim: M[rnd.pick(['cornice', 'limestone', 'brickDark'])] };
    case 'lime': return { style, wall: M[rnd.pick(PAL_LIME)], win: M[rnd.pick(['winWarm', 'winWarm', 'winSparse'])], trim: M.cornice };
    case 'glass': return { style, wall: M[rnd.pick(['darkSteel', 'blueSteel', 'metalDark'])], win: M[rnd.pick(['winGlass', 'winGlass', 'winGlassDark'])], trim: M.metal };
    case 'dark': return { style, wall: M.darkSteel, win: M[rnd.pick(['winOffice', 'winDim'])], trim: M.metalDark };
    default: return { style: 'band', wall: M[rnd.pick(['whiteBrick', 'concrete', 'limestone2'])], win: M[rnd.pick(['winOffice', 'winWarm'])], trim: M.white };
  }
}

// choose the voxel for a facade position; ix = running index along the face, j = grid row
function facadeVoxel(S, ix, j, corner, yRel, tierTop) {
  if (yRel === tierTop - 1) return S.style === 'brick' || S.style === 'lime' ? S.trim : S.wall;
  if (corner) return S.wall;
  switch (S.style) {
    case 'brick': return mod(ix, 2) === 0 && mod(j, 3) !== 0 ? S.win : S.wall;
    case 'lime': return mod(ix, 3) !== 0 && mod(j, 6) !== 0 ? (mod(j, 3) === 0 ? M.stoneGrey : S.win) : S.wall;
    case 'glass': return mod(ix, 4) === 0 ? S.wall : S.win;
    case 'dark': return mod(ix, 3) === 0 || mod(j, 2) === 0 ? S.wall : S.win;
    default: return mod(j, 3) === 0 ? S.wall : S.win;
  }
}

// footprint: array of [x,z] integer cell corners (world)
function building(cells, h, S, rnd, o = {}) {
  const G = CITY;
  const set = new Set(cells.map((c) => c[0] + ',' + c[1]));
  const has = (s, x, z) => s.has(x + ',' + z);
  const erode = (s) => {
    const out = new Set();
    for (const key of s) {
      const [x, z] = key.split(',').map(Number);
      if (has(s, x - 1, z) && has(s, x + 1, z) && has(s, x, z - 1) && has(s, x, z + 1)) out.add(key);
    }
    return out;
  };
  const tiers = [];
  if ((S.style === 'lime' || S.style === 'brick') && h > 18 && cells.length >= 24) {
    const a = Math.round(h * rnd.range(0.52, 0.66)), t1 = erode(set);
    if (t1.size >= 8) {
      if (h > 27 && t1.size >= 20 && rnd() < 0.7) {
        const b = Math.round(h * 0.84), t2 = erode(t1);
        if (t2.size >= 6) tiers.push([0, a, set], [a, b, t1], [b, h, t2]); else tiers.push([0, a, set], [a, h, t1]);
      } else tiers.push([0, a, set], [a, h, t1]);
    }
  } else if (h > 26 && cells.length >= 30 && rnd() < 0.35) {
    const t1 = erode(set);
    if (t1.size >= 9) tiers.push([0, h - 6, set], [h - 6, h, t1]);
  }
  if (!tiers.length) tiers.push([0, h, set]);

  const roofM = M[rnd.pick(['roofTar', 'roofTar', 'roofGravel', 'roofGravel', 'roofGreen'])];
  const shopSide = rnd() < 0.7;
  tiers.forEach(([y0, y1, fp], ti) => {
    const next = tiers[ti + 1];
    for (const key of fp) {
      const [x, z] = key.split(',').map(Number);
      const nx = !has(fp, x - 1, z) || !has(fp, x + 1, z), nz = !has(fp, x, z - 1) || !has(fp, x, z + 1);
      const edge = nx || nz;
      const i = G.ix(x + 0.5), k = G.iz(z + 0.5);
      for (let y = y0; y < y1; y++) {
        const j = G.iy(2 + y + 0.5);
        let v = S.wall;
        if (edge) {
          v = facadeVoxel(S, nz ? i : k, j, nx && nz, y, y1);
          if (y === 0 && ti === 0 && shopSide && !(nx && nz)) v = mod(nz ? i : k, 4) === 0 ? S.wall : M.winShop;
          else if (y === 0 && ti === 0) v = M.stoneGrey;
        }
        G.set(i, j, k, v);
      }
      const covered = next && has(next[2], x, z);
      if (!covered) {
        if (edge) G.put(x + 0.5, 2 + y1 + 0.5, z + 0.5, S.style === 'glass' || S.style === 'dark' ? S.wall : S.trim);
        else G.put(x + 0.5, 2 + y1 - 0.5, z + 0.5, roofM);
        if (edge) G.put(x + 0.5, 2 + y1 - 0.5, z + 0.5, S.wall);
      }
    }
  });

  if (!o.noProps) roofProps(tiers[tiers.length - 1][2], 2 + h, S, rnd, o);

  if (S.style === 'brick' && h >= 7 && h <= 20 && rnd() < 0.8) fireEscape(set, h, rnd);
}

function roofProps(fp, top, S, rnd, o) {
  const inner = [];
  for (const key of fp) {
    const [x, z] = key.split(',').map(Number);
    if (fp.has((x - 1) + ',' + z) && fp.has((x + 1) + ',' + z) && fp.has(x + ',' + (z - 1)) && fp.has(x + ',' + (z + 1))) inner.push([x, z]);
  }
  if (!inner.length) return;
  const used = [];
  const free = (x, z, r) => used.every((u) => Math.abs(u[0] - x) > r || Math.abs(u[1] - z) > r);
  const take = (r) => {
    for (let t = 0; t < 12; t++) {
      const c = inner[Math.floor(rnd() * inner.length)];
      if (free(c[0], c[1], r)) { used.push(c); return c; }
    }
    return null;
  };
  if (!o.noTank && (S.style === 'brick' || S.style === 'lime') && inner.length >= 4 && rnd() < (S.style === 'brick' ? 0.6 : 0.34)) {
    const c = take(2);
    if (c) WATER_TOWERS.push({ x: c[0] + 0.5, y: top, z: c[1] + 0.5, s: rnd.range(0.72, 1.0), r: rnd() * TAU });
  }
  if (rnd() < 0.75) {   // stair bulkhead with a lit door
    const c = take(1);
    if (c) {
      CITY.box(c[0], top, c[1], c[0] + 1, top + 2, c[1] + 1, S.wall);
      CITY.box(c[0], top + 2, c[1], c[0] + 1, top + 3, c[1] + 1, M.roofTar);
      if (rnd() < 0.6) PROPS.box(c[0] + 0.28, top + 0.0, c[1] + 1.0, c[0] + 0.72, top + 0.95, c[1] + 1.06, M.roofLight);
    }
  }
  const n = rnd.int(1, 4);
  for (let q = 0; q < n; q++) {
    const c = take(0);
    if (!c) break;
    const kind = rnd();
    if (kind < 0.45) {
      PROPS.box(c[0] + 0.1, top, c[1] + 0.15, c[0] + 0.95, top + 0.55, c[1] + 0.85, M.metal);
      PROPS.cyl(c[0] + 0.52, c[1] + 0.5, top + 0.55, top + 0.68, 0.24, 0.24, 8, M.metalDark);
    } else if (kind < 0.7) {
      const hh = rnd.range(0.5, 1.2);
      PROPS.cyl(c[0] + 0.5, c[1] + 0.5, top, top + hh, 0.14, 0.14, 6, M.metalDark);
      PROPS.cyl(c[0] + 0.5, c[1] + 0.5, top + hh, top + hh + 0.14, 0.27, 0.2, 6, M.metal);
      if (rnd() < 0.2 && STEAM.length < 44) STEAM.push({ x: c[0] + 0.5, y: top + hh + 0.2, z: c[1] + 0.5, s: rnd.range(0.7, 1.15) });
    } else if (kind < 0.86) {
      const hh = o.noTank ? rnd.range(0.8, 1.4) : rnd.range(1.6, 4.2);
      PROPS.box(c[0] + 0.45, top, c[1] + 0.45, c[0] + 0.55, top + hh, c[1] + 0.55, M.metal);
      PROPS.box(c[0] + 0.15, top + hh * 0.72, c[1] + 0.47, c[0] + 0.85, top + hh * 0.72 + 0.08, c[1] + 0.53, M.metal);
      if (hh > 3.2 && rnd() < 0.4) PROPS.cbox(c[0] + 0.5, top + hh + 0.1, c[1] + 0.5, 0.24, 0.24, 0.24, M.beaconRed);
    } else {
      PROPS.box(c[0] + 0.12, top, c[1] + 0.12, c[0] + 0.88, top + 0.22, c[1] + 0.88, rnd() < 0.5 ? M.roofLight : M.roofGreen);
    }
  }
}

// zig-zag fire escapes on a camera-facing (south or east) wall
function fireEscape(set, h, rnd) {
  const cells = [...set].map((k) => k.split(',').map(Number));
  const faceDir = rnd() < 0.68 ? 'south' : 'east';
  const runs = cells.filter(([x, z]) => (faceDir === 'south'

}

function buildEmpireState() {
  const [cx, cz] = POS.esb;
  const G = VoxelGrid.around(cx - 12, 2, cz - 10, cx + 12, 90, cz + 10, 0.5);
  // masonry tier with recessed vertical window bands
  function tier(x, z, hx, hz, y0, y1, lit) {
    G.box(x - hx, y0, z - hz, x + hx, y1, z + hz, lit ? M.esbCrown : M.esbStone);
    const faces = [['z', 1], ['z', -1], ['x', 1], ['x', -1]];
    for (const [ax, sg] of faces) {
      const half = ax === 'z' ? hx : hz;
      for (let u = -half + 0.25; u < half; u += 0.5) {
        const cu = Math.floor(Math.abs(u) / 0.5 + 0.001);
        const isBand = mod(cu, 4) >= 2 && Math.abs(u) < half - 0.9;
        if (!isBand) continue;
        for (let y = y0 + 0.25; y < y1 - 0.6; y += 0.5) {
          const outer = ax === 'z' ? [x + u, y, z + sg * (hz - 0.25)] : [x + sg * (hx - 0.25), y, z + u];
          const inner = ax === 'z' ? [x + u, y, z + sg * (hz - 0.75)] : [x + sg * (hx - 0.75), y, z + u];
          // only carve where this wall is actually exposed
          const beyond = ax === 'z' ? [x + u, y, z + sg * (hz + 0.25)] : [x + sg * (hx + 0.25), y, z + u];
          if (G.at(...beyond)) continue;
          G.put(...outer, 0);
          const row = mod(Math.floor((y - 2) / 0.5), 3);
          G.put(...inner, lit ? M.esbCrownHi : (row === 0 ? M.esbSpandrel : M.esbWin));
        }
      }
    }
    // parapet cap
    G.box(x - hx, y1 - 0.5, z - hz, x + hx, y1, z + hz, lit ? M.esbCrownHi : M.esbStoneHi);
  }
  tier(cx, cz, 11, 8.5, 2, 9, false);
  tier(cx, cz, 9.5, 7.5, 9, 16, false);
  tier(cx, cz, 8.5, 6.5, 16, 24, false);
  // main shaft: recessed core with projecting centre bays
  tier(cx, cz, 7, 4.5, 24, 57, false);
  tier(cx, cz, 4, 5.5, 24, 61, false);
  tier(cx, cz, 5.5, 5, 57, 62, false);
  tier(cx, cz, 5, 4, 62, 67, false);
  tier(cx, cz, 3.5, 4.5, 62, 69, false);
  // floodlit crown
  tier(cx, cz, 4, 3.5, 67, 71, true);
  tier(cx, cz, 3, 3, 71, 75, true);
  tier(cx, cz, 2.5, 2.5, 75, 77.5, true);
  // art-deco mooring mast with four fins
  G.sculpt(cx - 3, 77.5, cz - 3, cx + 3, 88, cz + 3, (x, y, z) => {
    const dx = x - cx, dz = z - cz, r = Math.hypot(dx, dz);
    if (y < 83 && r < 1.55) return mod(Math.floor((Math.atan2(dz, dx) / TAU) * 12 + 24), 2) ? M.esbMast : M.metal;
    const fin = Math.min(Math.abs(dx), Math.abs(dz)) < 0.4 && r < lerp(2.7, 1.1, clamp((y - 77.5) / 6.5, 0, 1));
    if (y < 84 && fin) return M.esbCrownHi;
    if (y >= 83 && y < 85 && r < 1.15) return M.esbCrownHi;
    if (y >= 85 && r < 0.9 - (y - 85) * 0.22) return M.metal;
    return undefined;
  });
  const B = PROPS;
  B.cyl(cx, cz, 87.4, 91, 0.42, 0.34, 8, M.metal);
  B.cyl(cx, cz, 91, 95, 0.24, 0.18, 6, M.metal);
  B.cyl(cx, cz, 95, 98.2, 0.11, 0.08, 6, M.metal);
  for (const y of [88.8, 91, 93]) B.cyl(cx, cz, y, y + 0.22, 0.75, 0.75, 8, M.esbMast);
  B.cbox(cx, 98.5, cz, 0.45, 0.45, 0.45, M.beaconRed);
  // observation deck rails
  for (const [hx, hz, y] of [[4.6, 4.1, 67], [8.5, 6.5, 24]]) {
    for (const sg of [-1, 1]) {
      B.box(cx - hx, y + 0.55, cz + sg * hz - 0.06, cx + hx, y + 0.66, cz + sg * hz + 0.06, M.metal);
      B.box(cx + sg * hx - 0.06, y + 0.55, cz - hz, cx + sg * hx + 0.06, y + 0.66, cz + hz, M.metal);
    }
  }

  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    addLight(cx + sx * 6.2, 68.5, cz + sz * 5.4, 0xffcf8c, 0.72, 7);
    addLight(cx + sx * 4.6, 76, cz + sz * 4.4, 0xffe6bc, 0.46, 6);

// ───────────────────────────────────────────────────────────── Chrysler Building
function buildChrysler() {
  const [cx, cz] = POS.chrysler;
  const G = VoxelGrid.around(cx - 8, 2, cz - 8, cx + 8, 70, cz + 8, 0.4);
  function shaft(h, y0, y1, bandEvery) {
    G.sculpt(cx - h, y0, cz - h, cx + h, y1, cz + h, (x, y, z, i, j, k) => {
      const ax = Math.abs(x - cx), az = Math.abs(z - cz);
      const onX = ax > h - 0.4, onZ = az > h - 0.4;
      if (!onX && !onZ) return M.chrysBrick;
      if (y > y1 - 0.8) return M.chromeDark;
      const u = onZ ? ax : az, c = Math.floor(u / 0.4);
      if (u > h - 1.2) return mod(Math.floor(y / 0.8), 3) === 0 ? M.chrysDark : M.chrysBrick;   // banded corners
      if (mod(c, 4) >= 2) return mod(Math.floor((y - 2) / 0.4), 4) === 0 ? M.chrysDark : M.chrysWin;
      return bandEvery && mod(Math.floor((y - 2) / 0.4), bandEvery) === 0 ? M.chrysDark : M.chrysBrick;
    });
  }
  shaft(6, 2, 12, 12);
  shaft(5.2, 12, 20, 0);
  shaft(4.8, 20, 44, 0);
  shaft(4.4, 44, 52.4, 8);
  // radiator-cap frieze and eagle gargoyles
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const a = V3(cx + sx * 4.4, 44.4, cz + sz * 4.4), b = V3(cx + sx * 5.5, 45.0, cz + sz * 5.5);
    PROPS.beam(a, b, 0.42, M.chromeDark);
    PROPS.cbox(b.x, b.y + 0.1, b.z, 0.5, 0.45, 0.5, M.chromeDark);
    PROPS.beam(V3(cx + sx * 4.7, 35, cz + sz * 4.7), V3(cx + sx * 5.7, 35.3, cz + sz * 5.7), 0.38, M.chromeDark);
    addLight(cx + sx * 5.4, 46, cz + sz * 5.4, 0xcfe2ff, 0.16, 6);
    addLight(cx + sx * 5.0, 55, cz + sz * 5.0, 0xffe4b0, 0.2, 7);
  }
  // seven nested sunburst arches
  const TIERS = [[4.4, 52.4, 5.6], [4.0, 54.8, 5.2], [3.6, 57.2, 4.8], [2.8, 59.6, 4.4], [2.4, 61.6, 3.8], [1.6, 63.6, 3.6], [1.2, 65.6, 3.0]];
  TIERS.forEach(([w, base, H], t) => {
    G.sculpt(cx - w, base - 1.2, cz - w, cx + w, base + H + 0.4, cz + w, (x, y, z) => {
      const dx = x - cx, dz = z - cz;
      const inArch = (u) => { const q = u / w; return y < base + H * Math.sqrt(Math.max(0, 1 - q * q)); };
      if (!(inArch(dx) || inArch(dz))) return undefined;
      const u = Math.abs(dx) > Math.abs(dz) ? dz : dx;
      const rr = Math.hypot(u / w, (y - base) / H);
      if (rr > 0.84) return M.chrome;
      return mod(Math.floor(Math.atan2(u / w, (y - base) / H) * 7 + 20), 2) && rr > 0.62 ? M.chrome : M.chromeDark;
    });
    // triangular windows radiating inside each arch
    const prev = t > 0 ? TIERS[t - 1] : null;
    const angles = t < 3 ? [-54, -27, 0, 27, 54] : t < 5 ? [-44, 0, 44] : [0];
    for (const [fx, fz] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const N = V3(fx, 0, fz), Ux = V3(fz, 0, -fx);
      for (const deg of angles) {
        const th = (deg * Math.PI) / 180;
        const tip = [0.9 * w * Math.sin(th), base + 0.9 * H * Math.cos(th)];
        let bs = [0.46 * w * Math.sin(th), base + 0.46 * H * Math.cos(th)];
        if (prev) {
          const [pw, pb, pH] = prev;
          for (let it = 0; it < 14; it++) {
            const q = bs[0] / pw;
            if (bs[1] > pb + pH * Math.sqrt(Math.max(0, 1 - q * q)) + 0.12) break;
            bs = [lerp(bs[0], tip[0], 0.12), lerp(bs[1], tip[1], 0.12)];
          }
        }
        const du = tip[0] - bs[0], dv = tip[1] - bs[1], len = Math.hypot(du, dv);
        if (len < 0.55) continue;
        const hw = clamp(0.13 * w, 0.2, 0.52);
        const pu = (-dv / len) * hw, pv = (du / len) * hw;
        const P = (u, v) => V3(cx, v, cz).addScaledVector(N, w + 0.07).addScaledVector(Ux, u);
        const a = P(bs[0] + pu, bs[1] + pv), b = P(bs[0] - pu, bs[1] - pv), c = P(tip[0], tip[1]);
        const nn = V3().subVectors(b, a).cross(V3().subVectors(c, a));
        PROPS.face(nn.dot(N) > 0 ? [a, b, c] : [a, c, b], M.chrysTri, null, N);
      }
    }
  });
  // needle spire
  PROPS.cyl(cx, cz, 67.4, 71, 0.75, 0.48, 4, M.chrome, { rot: Math.PI / 4 });
  PROPS.cyl(cx, cz, 71, 75.5, 0.48, 0.28, 4, M.chrome, { rot: Math.PI / 4 });
  PROPS.cyl(cx, cz, 75.5, 80, 0.28, 0.14, 4, M.chrome, { rot: Math.PI / 4 });
  PROPS.cyl(cx, cz, 80, 84.5, 0.11, 0.04, 4, M.chrome, { rot: Math.PI / 4 });
  PROPS.cbox(cx, 84.7, cz, 0.32, 0.32, 0.32, M.lampWhite);
  addLight(cx, 65, cz + 3.5, 0xffe8c0, 0.3, 7);
}

function buildOneWTC() {
  const [cx, cz] = POS.wtc;

  for (let u = -hb + 0.7; u < hb; u += 1.15) {

      B.box(cx + sg * (hb + 0.32) - 0.17, 3.6, cz + u - 0.09, cx + sg * (hb + 0.32) + 0.17, y0 - 0.5, cz + u + 0.09, M.wtcEdge);
    }

  B.box(cx - hb - 0.4, y0 - 0.45, cz - hb - 0.4, cx + hb + 0.4, y0, cz + hb + 0.4, M.metal);

  // eight tapering isosceles facets: square base to a top square turned 45°
  const bot = [[hb, hb], [-hb, hb], [-hb, -hb], [hb, -hb]].map(([x, z]) => V3(cx + x, y0, cz + z));
  const top = [[0, hb], [-hb, 0], [0, -hb], [hb, 0]].map(([x, z]) => V3(cx + x, y1, cz + z));
  const tris = [];
  for (let i = 0; i < 4; i++) {
    tris.push([bot[i], bot[(i + 1) % 4], top[i]]);                 // upright triangle
    tris.push([top[i], bot[(i + 1) % 4], top[(i + 1) % 4]]);       // inverted triangle
  }
  tris.forEach((t, f) => {
    let n = V3().subVectors(t[1], t[0]).cross(V3().subVectors(t[2], t[0])).normalize();
    const mid = V3().add(t[0]).add(t[1]).add(t[2]).multiplyScalar(1 / 3).sub(V3(cx, (y0 + y1) / 2, cz)); mid.y = 0;
    let pts = t;
    if (n.dot(mid) < 0) { pts = [t[0], t[2], t[1]]; n.negate(); }
    const tan = V3(0, 1, 0).cross(n).normalize();
    B.face(pts, M.wtcGlass, pts.map((p) => [p.dot(tan) / 0.95 + 400, p.y / 1.05, f * 3 + 0.5]), n);
  });
  // stainless creases that make every triangle read
  for (let i = 0; i < 4; i++) {
    B.beam(bot[i], top[i], 0.3, M.wtcEdge);

    B.beam(top[i], top[(i + 1) % 4], 0.45, M.wtcEdge);
  }
  B.face([top[0], top[3], top[2], top[1]], M.roofTar, null, V3(0, 1, 0));
  for (let i = 0; i < 4; i++) {
    const a = top[i].clone(), b = top[(i + 1) % 4].clone();
    a.y += 1.5; b.y += 1.5;
    B.beam(a, b, 0.28, M.wtcEdge);
    for (let k = 0; k <= 4; k++) { const p = top[i].clone().lerp(top[(i + 1) % 4], k / 4); B.beam(p, V3(p.x, p.y + 1.5, p.z), 0.14, M.metal); }
  }
  // antenna: communications rings and mast
  B.cyl(cx, cz, 77, 78.3, 2.7, 2.5, 12, M.metalDark);
  B.cyl(cx, cz, 78.3, 78.7, 3.0, 3.0, 12, M.wtcEdge);
  B.cyl(cx, cz, 78.7, 86, 0.72, 0.62, 8, M.metal);
  for (const y of [80.6, 83, 85.4]) B.cyl(cx, cz, y, y + 0.28, 1.45, 1.45, 10, M.metal);
  B.cyl(cx, cz, 86, 93, 0.44, 0.3, 8, M.white);
  B.cyl(cx, cz, 93, 98, 0.24, 0.15, 6, M.metal);
  B.cyl(cx, cz, 98, 102, 0.11, 0.06, 6, M.white);
  for (let a = 0; a < 4; a++) {
    const ang = a * Math.PI / 2 + Math.PI / 4;
    B.beam(V3(cx + Math.cos(ang) * 2.5, 78.5, cz + Math.sin(ang) * 2.5), V3(cx, 86, cz), 0.14, M.metal);
  }
  B.cbox(cx, 102.3, cz, 0.45, 0.45, 0.45, M.beaconRed);
  B.cbox(cx, 93.2, cz, 0.38, 0.38, 0.38, M.beaconRed);
  makeMesh(B);
  WTC_SOLIDS.push([cx - 6, 2, cz - 6, cx + 6, 40, cz + 6], [cx - 4, 40, cz - 4, cx + 4, 70, cz + 4]);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) addLight(cx + sx * 8.4, 4, cz + sz * 8.4, 0x9cc8ff, 0.75, 7);
  addLight(cx, 79.5, cz + 2.5, 0xbfdcff, 0.8, 6);

  // memorial pool and plaza trees
  const P = PROPS;
  for (const [px, pz] of [[-38, 36.2]]) {
    P.box(px - 2.6, 2.0, pz - 2.9, px + 2.6, 2.28, pz + 2.9, M.black);
    P.box(px - 2.2, 2.28, pz - 2.5, px + 2.2, 2.34, pz + 2.5, M.lakeBed);
    for (const sg of [-1, 1]) {
      P.box(px - 2.35, 2.28, pz + sg * 2.62 - 0.1, px + 2.35, 2.42, pz + sg * 2.62 + 0.1, M.roofLight);
      P.box(px + sg * 2.32 - 0.1, 2.28, pz - 2.6, px + sg * 2.32 + 0.1, 2.42, pz + 2.6, M.roofLight);
    }

    addLight(px, 3, pz, 0xffd9a8, 0.7, 6);
  }
  const rnd = RNG(911);
  for (const [tx, tz] of [[-52.5, 15], [-52.5, 20], [-52.5, 25], [-52.5, 30.5], [-33.8, 15.5], [-47, 31.4], [-43, 31.4]]) {

function billboardAtlas() {
  const TW = 512, TH = 384;
  const cv = document.createElement('canvas'); cv.width = TW * 4; cv.height = TH * 4;
  const g = cv.getContext('2d');
  const FONT = 'Impact, "Arial Black", "Segoe UI", sans-serif';
  const text = (s, x, y, size, color, o = {}) => {
    g.font = `${o.weight || 900} ${size}px ${o.font || FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(s).width, max = o.max || TW - 36, k = Math.min(1, max / w);
    g.save(); g.translate(x, y); g.scale(k, 1);
    if (o.stroke) { g.lineWidth = o.lw || 10; g.strokeStyle = o.stroke; g.lineJoin = 'round'; g.strokeText(s, 0, 0); }
    g.fillStyle = color; g.fillText(s, 0, 0); g.restore();

function billboardMaterial(atlas, ticker, o) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uAtlas: { value: atlas }, uTick: { value: ticker }, uTime: U.uTime, uD: { value: new THREE.Vector3(...o.designs) },
      uMode: { value: o.mode }, uPhase: { value: o.phase }, uAspect: { value: o.aspect }, uFogStart: U.uFogStart, uFogDens: U.uFogDens, uGain: { value: o.gain },
    },
    vertexShader: /* glsl */`
      varying vec2 vUv; varying vec3 vW;
      void main() { vUv = vec2(uv.x, 1.0 - uv.y); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uAtlas; uniform sampler2D uTick; uniform float uTime, uMode, uPhase, uAspect, uGain; uniform vec3 uD;
      varying vec2 vUv; varying vec3 vW;
      ${AERIAL_GLSL}
      vec3 tile(float id, vec2 uv) {
        vec2 c = vec2(mod(id, 4.0), floor(id / 4.0));
        uv = clamp(uv, vec2(0.004), vec2(0.996));
        return textureGrad(uAtlas, (c + uv) * 0.25, dFdx(vUv) * 0.25, dFdy(vUv) * 0.25).rgb;
      }
      void main() {
        vec2 uv = vUv; vec3 col;
        if (uMode < 0.5) {
          float lt = mod(uTime + uPhase, 12.0);
          float idx = floor(lt / 4.0), f = lt - idx * 4.0;
          float cur = idx < 0.5 ? uD.x : (idx < 1.5 ? uD.y : uD.z);
          float nxt = idx < 0.5 ? uD.y : (idx < 1.5 ? uD.z : uD.x);
          float tr = smoothstep(3.35, 4.0, f);
          col = uv.y < tr ? tile(nxt, vec2(uv.x, uv.y + 1.0 - tr)) : tile(cur, vec2(uv.x, uv.y - tr));
          col += vec3(1.0, 0.9, 0.7) * exp(-abs(uv.y - tr) * 60.0) * step(0.001, tr) * step(tr, 0.999) * 0.6;
        } else if (uMode < 1.5) {
          vec2 tuv = vec2(uv.x * uAspect / 21.3 + uTime / 12.0 + uPhase, uv.y);
          col = textureGrad(uTick, tuv, dFdx(vec2(vUv.x * uAspect / 21.3, vUv.y)), dFdy(vec2(vUv.x * uAspect / 21.3, vUv.y))).rgb * 1.2;
        } else {
          col = tile(uD.x, uv);
          float sweep = fract(uTime / 4.0 + uPhase * 0.083) * 2.2 - 0.4;
          col += col * exp(-pow((uv.x + uv.y * 0.35 - sweep) * 7.0, 2.0)) * 0.9;
          col *= 0.9 + 0.1 * sin(uTime * 1.0471976 + uPhase);
        }
        vec2 b = min(uv, 1.0 - uv);
        float frame = step(0.018, min(b.x, b.y * 0.9));
        vec3 outc = mix(vec3(0.015, 0.017, 0.025), col * uGain, frame);
        gl_FragColor = vec4(aerial(outc, vW, cameraPosition), 1.0);
      }`,
  });
}

const bridgePoint = (s, y, w) => { const p = BR.toWorld(s, w); return V3(p[0], y, p[1]); };

function cableY(s, inner) {
  const top = 35.7, [t1, t2] = BR.towers, mid = (t1 + t2) / 2, half = (t2 - t1) / 2;
  if (s >= t1 && s <= t2) {
    const low = BR.deckY(mid) + (inner ? 3.9 : 1.15);
    const q = (s - mid) / half;
    return low + (top - low) * q * q;
  }
  const [end, tower] = s < t1 ? [2, t1] : [106, t2];
  const u = clamp((s - tower) / (end - tower), 0, 1);
  const low = BR.deckY(end) + (inner ? 2.9 : 0.8);
  return lerp(top, low, u) - 2.1 * 4 * u * (1 - u) * 0.62;
}
// the promenade parts around each tower's central pier
function promenadeAt(s) {
  const nt = Math.min(...BR.towers.map((t) => Math.abs(s - t)));
  const split = smooth(10, 4.6, nt);
  const rise = smooth(1, 11, s) * (1 - smooth(97, 107, s));
  return { o: lerp(0.86, 2.62, split), y: BR.deckY(s) + 0.22 + 2.35 * rise, split };
}

function buildBridge() {
  const G = VoxelGrid.around(-26, -2, -12, 138, 40, 12, 0.5, { pos: [BR.ax, 0, BR.az], yaw: BR.yaw });
  const B = PROPS;

  // ── masonry towers with paired pointed arches ──
  for (const tc of BR.towers) {
    const spring = 22, R = 5.0;
    const HALF = 2.78, CEN = 4.08;
    const openHalf = (y) => {
      if (y < spring) return HALF;
      const dy = y - spring;
      const q = R * R - dy * dy;
      return q <= (R - HALF) * (R - HALF) ? -1 : Math.sqrt(q) - (R - HALF);
    };
    G.sculpt(tc - 5, -2, -12, tc + 5, 37.5, 12, (s, y, w) => {
      const du = Math.abs(s - tc), aw = Math.abs(w);
      if (y < 4.6) {   // caisson with chamfered cutwaters
        if (du < 4.0 && aw < 11.2 - Math.max(0, du - 2.0) * 1.3) return y < 1.6 ? M.bridgeStoneD : (y > 4.0 ? M.bridgeStoneL : M.bridgeStone);
        return undefined;
      }
      if (y >= 32 && y < 33) return du < 3.0 && aw < 10.4 ? M.bridgeStoneL : undefined;
      if (y >= 33 && y < 33.5) return du < 2.5 && aw < 9.9 ? M.bridgeStone : undefined;
      if (y >= 33.5) {
        const onLeg = (aw > 6.0 && aw < 9.6) || aw < 1.5;
        if (y < 35.5) return du < 2.1 && onLeg ? M.bridgeStone : (y < 34.2 && du < 1.6 && aw < 9.4 ? M.bridgeStone : undefined);
        if (y < 36.5) return du < 2.5 && ((aw > 5.6 && aw < 9.9) || aw < 1.9) ? M.bridgeStoneL : undefined;
        return du < 1.5 && ((aw > 6.6 && aw < 8.9) || aw < 0.9) && y < 37 ? M.bridgeStone : undefined;
      }
      const ht = y < 19 ? 2.25 : 2.0;
      const rib = (aw > 7.7 && aw < 9.6) || aw < 0.9;
      const reach = ht + (rib ? 0.55 : 0);
      const deck = BR.deckY(s) - 0.55;
      const oc = Math.abs(aw - CEN), hw = openHalf(y);
      if (y >= deck && hw > 0 && oc < hw) return undefined;                       // the Gothic opening
      // deep-shadow reveals: seen at an angle the arches still read as pointed voids
      if (y >= deck && du < ht - 0.4 && openHalf(y - 0.55) > 0 && oc < openHalf(y - 0.55) + 0.55) return M.bridgeShadow;
      // moulded archivolt around each opening
      const hwOuter = y < spring ? HALF + 0.65 : (y - spring >= 5.75 ? -1 : Math.sqrt(Math.max(0, 5.75 * 5.75 - (y - spring) ** 2)) - (5.75 - HALF - 0.65));
      const archivolt = y >= deck && hwOuter > 0 && oc < hwOuter;
      if (archivolt && du < ht + 0.55 && aw < 9.5) return M.bridgeArch;
      if (du < reach && aw < 9.5) {
        // recessed spandrel and plinth panels give the stone relief
        if (du > ht - 0.55 && aw > 2.7 && aw < 5.3 && ((y > 28.2 && y < 30.8) || (y > 5.6 && y < 8.4))) return undefined;
        if (y > 31.2) return M.bridgeStoneL;
        return M.bridgeStone;
      }
      if (du < reach + 0.45 && aw < 9.9 && rib && ((y > 21.5 && y < 22.5) || (y > 9.0 && y < 9.9))) return M.bridgeStoneL;
      return undefined;
    });
    // warm uplighting on both faces
    for (const du of [-4.4, 4.4]) {
      for (const w of [-8.4, -1.6, 1.6, 8.4]) {
        const a = BR.toWorld(tc + du, w);
        addLight(a[0], 7.2, a[1], 0xffa655, 0.8, 7.5);
        addLight(a[0], 16.5, a[1], 0xffb46c, 0.38, 8);
        addLight(a[0], 29.5, a[1], 0xffc080, 0.36, 7);
      }
      for (const w of [-9, 9]) { const p = bridgePoint(tc + du * 0.9, 4.9, w); B.cbox(p.x, p.y, p.z, 0.45, 0.35, 0.45, M.amber); addGlint(p.x, 4.6, p.z, 0xff9a30, 1.5); }
    }
  }

  // ── deck, anchorages and arched approach ramps ──
  for (let s = -13; s < 122; s += 0.5) {
    const y = Math.round(BR.deckY(s + 0.25) * 2) / 2;
    G.box(s, y - 0.5, -6.5, s + 0.5, y, 6.5, M.bridgeRoad);
  }
  const masonry = (s0, s1, hwid, arches) => {
    G.sculpt(s0, -2, -hwid - 0.5, s1, 14, hwid + 0.5, (s, y, w) => {
      const top = Math.round(BR.deckY(s) * 2) / 2 - 0.5;
      const aw = Math.abs(w);
      if (y > top + 0.5) return undefined;
      if (y > top) return aw > hwid - 0.6 && aw < hwid + 0.1 ? M.bridgeStoneL : undefined;
      // street underpass: the DUMBO cobbles run straight through the Brooklyn masonry
      const wx = BR.toWorld(s, w)[0];
      if (wx > 92.9 && wx < 97.1 && y < 6.4) return undefined;
      if (aw > hwid) return y > top - 0.9 ? M.bridgeStoneL : undefined;
      for (const [ac, ar] of arches) {
        const q = Math.abs(s - ac);
        const crown = Math.min(top - 1.0, 5.2) - ar;
        if (q < ar && y < crown + Math.sqrt(ar * ar - q * q) && y > -2 && aw > hwid - 1.2) return undefined;

// ───────────────────────────────────────────────────────────── blue-hour sky
const SKY_GLSL = /* glsl */`
float sh13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float snoise(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(sh13(i), sh13(i + vec3(1,0,0)), f.x), mix(sh13(i + vec3(0,1,0)), sh13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(sh13(i + vec3(0,0,1)), sh13(i + vec3(1,0,1)), f.x), mix(sh13(i + vec3(0,1,1)), sh13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float sfbm(vec3 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * snoise(p); p *= 2.07; a *= 0.5; } return v / 0.9375; }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
vec3 ramp(float x, float a, vec3 ca, float b, vec3 cb, vec3 acc) { return x >= a && x < b ? mix(ca, cb, smoothstep(0.0, 1.0, (x - a) / (b - a))) : acc; }

// phys = 0: the composed backdrop, horizon band tucked behind the island's far rim
// phys = 1: a true-horizon version for reflections and the environment map
vec3 skyColor(vec3 d, float phys, float h0, float t) {
  float el = degrees(asin(clamp(d.y, -1.0, 1.0)));
  vec2 hd = normalize(d.xz + vec2(1e-5, 0.0));
  float west = smoothstep(-0.55, 0.75, -hd.x * 0.9 - hd.y * 0.12);
  vec3 peach = lin(mix(vec3(0.82, 0.52, 0.58), vec3(1.0, 0.70, 0.47), west));
  vec3 rose = lin(mix(vec3(0.62, 0.45, 0.64), vec3(0.93, 0.58, 0.53), west));
  float h = phys > 0.5 ? el * 0.42 : el - h0;
  vec3 c = lin(vec3(0.035, 0.058, 0.135));
  if (h < -26.0) c = lin(vec3(0.028, 0.042, 0.105));
  c = ramp(h, -26.0, lin(vec3(0.028, 0.042, 0.105)), -14.0, lin(vec3(0.070, 0.105, 0.230)), c);
  c = ramp(h, -14.0, lin(vec3(0.070, 0.105, 0.230)), -7.0, lin(vec3(0.150, 0.165, 0.345)), c);
  c = ramp(h, -7.0, lin(vec3(0.150, 0.165, 0.345)), -3.2, lin(vec3(0.330, 0.250, 0.430)), c);
  c = ramp(h, -3.2, lin(vec3(0.330, 0.250, 0.430)), -1.2, rose, c);
  c = ramp(h, -1.2, rose, 0.2, peach * 1.12, c);
  c = ramp(h, 0.2, peach * 1.12, 1.7, rose * 1.02, c);
  c = ramp(h, 1.7, rose * 1.02, 3.3, lin(vec3(0.495, 0.430, 0.640)), c);
  c = ramp(h, 3.3, lin(vec3(0.495, 0.430, 0.640)), 5.4, lin(vec3(0.225, 0.315, 0.575)), c);
  c = ramp(h, 5.4, lin(vec3(0.225, 0.315, 0.575)), 9.0, lin(vec3(0.085, 0.170, 0.415)), c);
  c = ramp(h, 9.0, lin(vec3(0.085, 0.170, 0.415)), 17.0, lin(vec3(0.040, 0.092, 0.265)), c);
  c = ramp(h, 17.0, lin(vec3(0.040, 0.092, 0.265)), 40.0, lin(vec3(0.028, 0.058, 0.172)), c);
  if (h >= 40.0) c = lin(vec3(0.032, 0.066, 0.185));
  // afterglow bloom toward the west
  c += lin(vec3(1.0, 0.55, 0.30)) * 0.30 * west * west * exp(-pow((h - 0.1) / 2.4, 2.0));

  if (phys < 0.5) {
    float az = atan(d.x, -d.z);
    vec3 drift = vec3(cos(t * 0.5235988), sin(t * 0.5235988), 0.0) * 0.07;
    // long thin evening clouds lit from beneath
    float band = exp(-pow((h - 2.3) / 2.6, 2.0));
    float cl = sfbm(vec3(az * 4.2, h * 0.95, 2.0) + drift);
    float cm = smoothstep(0.54, 0.74, cl) * band;
    float under = smoothstep(0.50, 0.60, sfbm(vec3(az * 4.2, (h + 0.55) * 0.95, 2.0) + drift)) * band;
    c = mix(c, lin(vec3(0.255, 0.225, 0.415)), cm * 0.82);
    c += lin(vec3(1.0, 0.60, 0.42)) * clamp(cm - under, 0.0, 1.0) * 0.42;
    // soft cloud sea far below the floating island
    float low = smoothstep(-4.5, -10.0, h);
    if (low > 0.0) {
      vec2 q = d.xz / max(-d.y, 0.14);
      float puffs = sfbm(vec3(q * 2.3, 5.0) + drift * 1.4);
      float wisps = sfbm(vec3(q * 6.1 + 11.0, 9.0) - drift);
      float pm = smoothstep(0.46, 0.75, puffs * 0.78 + wisps * 0.22);
      vec3 lit = mix(lin(vec3(0.235, 0.235, 0.450)), lin(vec3(0.390, 0.285, 0.455)), smoothstep(-16.0, -7.0, h));
      c = mix(c, lit, pm * low * 0.72);
    }
    // first stars
    if (h > 5.0) {
      vec3 sp = d * 330.0; vec3 id = floor(sp);
      float s = sh13(id);
      if (s > 0.9965) {
        float tw = 0.7 + 0.3 * sin(t * 0.5235988 * (3.0 + floor(s * 4000.0 - 3986.0)) + s * 900.0);
        float dist = length(fract(sp) - 0.5);
        c += vec3(0.75, 0.82, 1.0) * smoothstep(0.42, 0.05, dist) * tw * smoothstep(5.0, 11.0, h) * 0.75;
      }
    }
  }
  return c;
}
`;

const skyUniforms = { uTime: U.uTime, uPhys: { value: 0 }, uH0: { value: -24.1 }, uGain: { value: 1.0 } };

  env.add(new THREE.Mesh(new THREE.SphereGeometry(100, 48, 32), mat2));
  const glow = (x, y, z, r, color) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, y, z); env.add(m);
  };
  glow(-86, 9, 12, 9, new THREE.Color(3.4, 1.5, 0.75));
  glow(-60, 22, 62, 7, new THREE.Color(1.1, 0.72, 0.62));
  glow(62, 40, 50, 10, new THREE.Color(0.28, 0.40, 0.80));
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * TAU;
    glow(Math.cos(a) * 92, -4 + (i % 3) * 2, Math.sin(a) * 92, 1.3, new THREE.Color(2.2, 1.25, 0.5));
  }
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.015).texture;
  pm.dispose();
}

// ───────────────────────────────────────────────────────────── harbor water
function buildDistanceTexture() {
  const W = DECAL.w, H = DECAL.h;
  const solid = new Float32Array(W * H).fill(1e6);
  for (let k = 0; k < H; k++) for (let i = 0; i < W; i++) {
    const x = DECAL.x0 + i + 0.5, z = DECAL.z0 + k + 0.5;
    if ((isLand(x, z) && !(isPark(x, z) && inPoly(x, z, LAKE))) || FOOT.some((r) => inRect(x, z, r))) solid[i + W * k] = 0;
  }
  const pass = (fwd) => {
    for (let n = 0; n < H; n++) {
      const k = fwd ? n : H - 1 - n;
      for (let m = 0; m < W; m++) {
        const i = fwd ? m : W - 1 - m;
        const o = i + W * k;
        const s = fwd ? -1 : 1;
        const tryN = (di, dk, c) => {
          const a = i + di, b = k + dk;
          if (a >= 0 && b >= 0 && a < W && b < H && solid[a + W * b] + c < solid[o]) solid[o] = solid[a + W * b] + c;
        };
        tryN(s, 0, 1); tryN(0, s, 1); tryN(s, s, 1.414); tryN(-s, s, 1.414);
      }
    }
  };
  pass(true); pass(false);
  const data = new Uint8Array(W * H * 4);
  for (let k = 0; k < H; k++) for (let i = 0; i < W; i++) {
    const x = DECAL.x0 + i + 0.5, z = DECAL.z0 + k + 0.5;
    const o = i + W * k;
    let fallD = 31, edgeD = 31;
    const [d, s] = SLAB_RING.nearest(x, z);
    edgeD = Math.min(31, d);
    if (fallAt(s)) fallD = Math.min(31, d);
    data[o * 4] = Math.round(Math.min(31, Math.max(0, solid[o] - 0.5)) * 8);
    data[o * 4 + 1] = Math.round(fallD * 8);
    data[o * 4 + 2] = Math.round(edgeD * 8);
    data[o * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

const N_BOATS = 4, TRAIL = 14, MAX_GLINT = 72;
const waterUniforms = {
  uTime: U.uTime, uFogStart: U.uFogStart, uFogDens: U.uFogDens,
  uRefl: { value: null }, uReflM: { value: new THREE.Matrix4() }, uDist: { value: null },
  uDistXf: { value: new THREE.Vector4(DECAL.x0, DECAL.z0, 1 / DECAL.w, 1 / DECAL.h) },
  uGP: { value: Array.from({ length: MAX_GLINT }, () => new THREE.Vector4()) },
  uGC: { value: Array.from({ length: MAX_GLINT }, () => V3()) },
  uTrail: { value: Array.from({ length: N_BOATS * TRAIL }, () => new THREE.Vector4()) },
  uBoat: { value: Array.from({ length: N_BOATS }, () => new THREE.Vector4()) },
  uBoatDir: { value: Array.from({ length: N_BOATS }, () => new THREE.Vector4()) },
};
// filled by the life module each frame: static glints come first, boat cabin lights after them
let staticGlints = 0;
function setGlint(i, x, y, z, color, intensity) {
  waterUniforms.uGP.value[i].set(x, y, z, intensity);
  waterUniforms.uGC.value[i].set(color.r, color.g, color.b);
}

const waterMaterial = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: /* glsl */`
    uniform mat4 uReflM; varying vec3 vW; varying vec4 vR;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vR = uReflM * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform float uTime; uniform sampler2D uRefl, uDist; uniform vec4 uDistXf;
    uniform vec4 uGP[${MAX_GLINT}]; uniform vec3 uGC[${MAX_GLINT}];
    uniform vec4 uTrail[${N_BOATS * TRAIL}]; uniform vec4 uBoat[${N_BOATS}]; uniform vec4 uBoatDir[${N_BOATS}];
    varying vec3 vW; varying vec4 vR;
    ${AERIAL_GLSL}
    float wh(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
    float wn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(wh(i), wh(i + vec2(1, 0)), f.x), mix(wh(i + vec2(0, 1)), wh(i + vec2(1, 1)), f.x), f.y); }
    const float W0 = 0.5235988;
    vec2 wave(vec2 p, float ang, float len, float slope, float cyc, float ph, float px) {
      vec2 d = vec2(cos(ang), sin(ang));
      float k = 6.2831853 / len;
      float aa = clamp(1.35 - px * k * 0.55, 0.0, 1.0);
      return d * slope * aa * cos(dot(d, p) * k - W0 * cyc * uTime + ph);
    }
    void main() {
      vec2 p = vW.xz;
      float px = max(length(dFdx(p)), 0.001) * 0.9;
      vec4 dm = texture(uDist, (p - uDistXf.xy) * uDistXf.zw) * (255.0 / 8.0);
      float dLand = dm.r, dFall = dm.g;
      vec2 circ = vec2(cos(W0 * uTime), sin(W0 * uTime));
      float gust = wn(p * 0.045 + circ * 0.35);
      vec2 warp = vec2(wn(p * 0.11 + 3.0), wn(p * 0.11 + 9.0)) * 3.2;
      vec2 q = p + warp;
      vec2 g = wave(q, 0.35, 12.5, 0.030, 3.0, 0.0, px) + wave(q, 1.92, 8.3, 0.036, 4.0, 1.7, px) + wave(q, -0.83, 5.7, 0.040, 5.0, 4.1, px)
             + wave(q, 2.74, 3.9, 0.046, 6.0, 2.3, px) + wave(q, 1.12, 2.75, 0.044, 8.0, 5.2, px) + wave(q, -2.19, 2.05, 0.036, 9.0, 0.9, px)
             + wave(q, 0.66, 1.6, 0.028, 11.0, 3.3, px) + wave(q, -1.41, 4.6, 0.030, 5.0, 2.9, px);
      g *= 0.65 + 0.8 * gust;
      // blocky chop: facets on a voxel lattice that glint in turn
      vec2 vc = floor(p / 0.85);
      float hc = wh(vc);
      float pulse = max(0.0, sin(W0 * uTime * (3.0 + floor(hc * 4.0)) + hc * 40.0));
      vec2 chop = (vec2(wh(vc + 7.1), wh(vc + 3.7)) - 0.5) * 0.115 * pulse * clamp(1.4 - px * 1.1, 0.0, 1.0) * (0.5 + gust);
      g += chop;

      // ── wakes and bow waves ──
      float foam = 0.0;
      for (int b = 0; b < ${N_BOATS}; b++) {
        vec4 info = uBoat[b];        // x beam, y length, z strength, w cull radius
        if (info.z <= 0.001) continue;
        vec4 bd = uBoatDir[b];       // xz position, zw heading
        vec2 rel = p - bd.xy;
        if (dot(rel, rel) > info.w * info.w) continue;
        float hw = info.x * 0.5;
        float best = 1e5, back = 0.0, fade = 0.0, side = 1.0;
        for (int s = 0; s < ${TRAIL - 1}; s++) {
          vec4 a = uTrail[b * ${TRAIL} + s], c = uTrail[b * ${TRAIL} + s + 1];
          if (a.w <= 0.0 && c.w <= 0.0) continue;
          vec2 ab = c.xy - a.xy; float L2 = max(dot(ab, ab), 1e-4);
          float t = clamp(dot(p - a.xy, ab) / L2, 0.0, 1.0);
          vec2 e = p - a.xy - ab * t;
          float d = length(e);
          if (d < best) { best = d; back = mix(a.z, c.z, t); fade = mix(a.w, c.w, t); side = sign(ab.x * e.y - ab.y * e.x); }
        }
        float rag = wn(p * 0.85 + circ * 0.6) * 0.65 + wn(p * 2.3 - circ * 0.9) * 0.35;
        if (best < 1e4) {
          float spread = hw * 0.85 + back * 0.30;
          float wid = 0.45 + back * 0.055;
          float arm = 1.0 - smoothstep(0.0, wid, abs(best - spread));
          float core = (1.0 - smoothstep(hw * 0.25, hw * 0.95 + back * 0.05, best)) * exp(-back / 11.0);
          float lace = 1.0 - smoothstep(0.0, 0.28, abs(best - spread * 0.55));
          float startF = smoothstep(0.0, 1.6, back);
          foam += (arm * smoothstep(0.22, 0.62, rag + arm * 0.2) * 0.95 + lace * 0.25 * rag + core * (0.35 + 0.85 * rag)) * fade * info.z * startF;
          float inside = 1.0 - smoothstep(spread * 0.9, spread + 0.9, best);
          vec2 hd = bd.zw;
          g += vec2(-hd.y, hd.x) * side * cos((best - back * 0.30) * 3.4) * 0.09 * inside * fade * info.z;
        }
        // bow wave
        float u = dot(rel, bd.zw), v = abs(rel.x * -bd.w + rel.y * bd.z);
        float aft = info.y * 0.5 + 0.35 - u;
        if (aft > -0.4 && aft < info.y * 1.15) {
          float lineV = max(aft, 0.0) * 0.44 + smoothstep(0.0, info.y * 0.3, aft) * hw * 0.95;
          float bow = (1.0 - smoothstep(0.0, 0.38 + aft * 0.05, abs(v - lineV))) * (1.0 - smoothstep(info.y * 0.4, info.y * 1.15, aft)) * smoothstep(-0.4, 0.3, aft);
          foam += bow * (0.65 + 0.7 * rag) * min(1.0, info.z * 1.4);
          g += vec2(-bd.w, bd.z) * sign(rel.x * -bd.w + rel.y * bd.z) * bow * 0.16;
        }
      }

      vec3 N = normalize(vec3(-g.x, 1.0, -g.y));
      vec3 V = normalize(cameraPosition - vW);
      float cosT = clamp(dot(N, V), 0.0, 1.0);

      // planar reflection, smeared vertically into broken ribbons
      vec2 ruv = vR.xy / vR.w;
      vec2 off = vec2(g.x * 0.055, g.y * 0.12);
      float spreadY = 0.0030 + 0.016 * abs(g.y) + 0.0022 * gust;
      vec3 refl = texture(uRefl, ruv + off).rgb * 0.30
        + texture(uRefl, ruv + off + vec2(0.0, spreadY)).rgb * 0.22 + texture(uRefl, ruv + off - vec2(0.0, spreadY)).rgb * 0.22
        + texture(uRefl, ruv + off + vec2(g.x * 0.01, spreadY * 2.4)).rgb * 0.13 + texture(uRefl, ruv + off - vec2(g.x * 0.01, spreadY * 2.4)).rgb * 0.13;
      refl = min(refl, vec3(6.0));
      float fres = 0.30 + 0.70 * pow(1.0 - cosT, 2.2);
      float lum = dot(refl, vec3(0.299, 0.587, 0.114));

      vec3 deep = mix(vec3(0.0042, 0.0150, 0.0335), vec3(0.0075, 0.0260, 0.0500), gust);
      deep = mix(vec3(0.010, 0.044, 0.056), deep, smoothstep(0.5, 8.0, dLand));
      vec3 col = deep * (0.9 + 0.5 * N.x * -1.0) + refl * fres * 0.95 + refl * smoothstep(0.35, 1.6, lum) * 0.42;
      col += vec3(0.010, 0.020, 0.040) * pulse * hc * clamp(1.2 - px, 0.0, 1.0);

      // sheen from the western afterglow
      vec3 R = reflect(-V, N);
      vec3 sunL = normalize(vec3(-0.80, 0.30, -0.45));
      col += vec3(1.0, 0.46, 0.24) * pow(max(dot(R, sunL), 0.0), 42.0) * 0.30;

      // lamp, bridge and cabin glints: stretched toward the viewer, broken by the chop
      vec3 rightAxis = normalize(cross(V, vec3(0.0, 1.0, 0.0)));
      vec3 upAxis = normalize(cross(rightAxis, V));
      for (int i = 0; i < ${MAX_GLINT}; i++) {
        vec4 gp = uGP[i];
        if (gp.w <= 0.0) continue;
        vec3 L = gp.xyz - vW;
        float d2 = dot(L, L);
        if (d2 > 1500.0) continue;
        L *= inversesqrt(d2);
        vec3 df = R - L;
        float ax = dot(df, rightAxis), ay = dot(df, upAxis);
        float e = ax * ax * 300.0 + ay * ay * 16.0;
        if (e > 9.0) continue;
        col += uGC[i] * exp(-e) * gp.w * 1.45 / (1.0 + d2 * 0.0042) * (0.55 + 0.9 * wn(p * 1.9 + circ * 2.0));
      }

      // contact shading, surf along the shore, and the rush toward each lip
      col *= mix(0.60, 1.0, smoothstep(0.0, 3.4, dLand));
      float sn = wn(p * 1.15 + circ * 0.8);
      float surf = (1.0 - smoothstep(0.15, 1.35, dLand)) * smoothstep(0.34, 0.74, sn);
      float ring = (1.0 - smoothstep(0.0, 0.3, abs(dLand - 1.35 - 0.55 * sin(W0 * uTime * 3.0 + wn(p * 0.2) * 9.0)))) * smoothstep(0.45, 0.8, wn(p * 0.75 - circ));
      foam += surf * 0.55 + ring * 0.22;
      float lip = 1.0 - smoothstep(0.1, 7.0, dFall);
      if (lip > 0.0) {
        float along = floor((p.x + p.y * 0.8) * 1.35);
        float cellV = mod(floor((dFall + uTime * 3.0) / 0.9), 40.0);
        float st = wh(vec2(along, cellV));
        foam += lip * lip * (0.16 + 0.75 * smoothstep(0.55, 0.92, st));
        col += vec3(0.010, 0.034, 0.046) * lip;
      }
      foam = clamp(foam, 0.0, 1.0);
      vec3 foamCol = vec3(0.235, 0.325, 0.455) + vec3(0.12, 0.07, 0.04) * smoothstep(30.0, -80.0, p.x);
      col = mix(col, foamCol, foam * 0.86);

      gl_FragColor = vec4(aerial(col, vW, cameraPosition), 1.0);
    }`,
});

let waterMesh = null, reflRT = null;
const reflCam = new THREE.PerspectiveCamera();
function buildWater() {
  const shape = new THREE.Shape(SLAB.map((p) => new THREE.Vector2(p[0], -p[1])));
  shape.holes.push(new THREE.Path(LAKE.map((p) => new THREE.Vector2(p[0], -p[1]))));
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  waterMesh = new THREE.Mesh(geo, waterMaterial);
  waterMesh.position.y = WATER_Y;
  waterMesh.layers.set(LAYER_NOREFLECT);
  scene.add(waterMesh);
  waterUniforms.uDist.value = buildDistanceTexture();

  // keep the brightest, best spread glints
  const sorted = GLINTS.slice().sort((a, b) => b.i - a.i);
  const kept = [];
  for (const g of sorted) {
    if (kept.length >= MAX_GLINT - 8) break;
    if (kept.every((k) => Math.hypot(k.x - g.x, k.z - g.z) > 3.4)) kept.push(g);
  }
  kept.forEach((g, i) => setGlint(i, g.x, g.y, g.z, g.c, g.i));
  staticGlints = kept.length;
}

function resizeReflection(w, h) {
  if (reflRT) reflRT.dispose();
  reflRT = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 2 });
  reflRT.texture.minFilter = reflRT.texture.magFilter = THREE.LinearFilter;
  waterUniforms.uRefl.value = reflRT.texture;
}

function renderReflection(camera) {
  const n = V3(0, 1, 0), m = V3(0, WATER_Y, 0);
  const camPos = V3().setFromMatrixPosition(camera.matrixWorld);
  const view = V3().subVectors(m, camPos).reflect(n).negate().add(m);
  const rot = new THREE.Matrix4().extractRotation(camera.matrixWorld);
  const look = V3(0, 0, -1).applyMatrix4(rot).add(camPos);
  const target = V3().subVectors(m, look).reflect(n).negate().add(m);
  reflCam.position.copy(view);
  reflCam.up.set(0, 1, 0).applyMatrix4(rot).reflect(n);
  reflCam.lookAt(target);
  reflCam.near = camera.near; reflCam.far = camera.far;
  reflCam.updateMatrixWorld();
  reflCam.projectionMatrix.copy(camera.projectionMatrix);
  const tm = waterUniforms.uReflM.value;
  tm.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  tm.multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
  // oblique near plane clips everything below the surface
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, m).applyMatrix4(reflCam.matrixWorldInverse);
  const clip = new THREE.Vector4(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
  const e = reflCam.projectionMatrix.elements;
  const q = new THREE.Vector4((Math.sign(clip.x) + e[8]) / e[0], (Math.sign(clip.y) + e[9]) / e[5], -1, (1 + e[10]) / e[14]);
  clip.multiplyScalar(2 / clip.dot(q));
  e[2] = clip.x; e[6] = clip.y; e[10] = clip.z + 1 - 0.0005; e[14] = clip.w;

  skyUniforms.uPhys.value = 1; skyUniforms.uGain.value = 1.05;
  renderer.setRenderTarget(reflRT);
  renderer.clear();
  renderer.render(scene, reflCam);
  skyUniforms.uPhys.value = 0; skyUniforms.uGain.value = 1.0;
}

// ── Central Park lake: a clear dark mirror over a flipped copy of Bow Bridge ──
const LAKE_Y = 1.72;
function buildLake() {
  const shape = new THREE.Shape(LAKE.map((p) => new THREE.Vector2(p[0], -p[1])));
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const matL = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.uTime, uFogStart: U.uFogStart, uFogDens: U.uFogDens },
    vertexShader: /* glsl */`varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      uniform float uTime; varying vec3 vW;
      ${AERIAL_GLSL}
      ${SKY_GLSL}
      void main() {
        vec2 p = vW.xz; float k = 0.5235988;
        vec2 g = vec2(cos(p.x * 1.7 + p.y * 0.6 - k * 4.0 * uTime) + cos(p.x * 0.5 - p.y * 2.3 + k * 5.0 * uTime),
                      cos(p.y * 1.9 + p.x * 0.4 - k * 3.0 * uTime) + cos(p.y * 0.8 + p.x * 2.6 + k * 6.0 * uTime)) * 0.012;
        vec3 N = normalize(vec3(-g.x, 1.0, -g.y)), V = normalize(cameraPosition - vW);
        vec3 R = reflect(-V, N);
        vec3 sky = skyColor(R, 1.0, 0.0, 0.0);
        float fres = 0.34 + 0.66 * pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.0);
        vec3 col = vec3(0.004, 0.017, 0.024) + sky * fres * 0.85;
        float streak = smoothstep(0.86, 1.0, sin(p.y * 5.0 + sin(p.x * 1.3) * 2.0 - k * 6.0 * uTime)) * smoothstep(0.4, 1.0, sin(p.x * 0.9 + p.y * 0.37));
        col += vec3(0.05, 0.07, 0.11) * streak;
        gl_FragColor = vec4(aerial(col, vW, cameraPosition), 0.85);
      }`,
  });
  const mesh = new THREE.Mesh(geo, matL);
  mesh.position.y = LAKE_Y; mesh.layers.set(LAYER_NOREFLECT); mesh.renderOrder = 12;
  scene.add(mesh);
}
function carveLakeBed() {
  for (let x = -102; x < -70; x++) for (let z = -153; z < -106; z++) {
    if (!inPoly(x + 0.5, z + 0.5, LAKE)) continue;
    CITY.box(x, -5, z, x + 1, 2, z + 1, 0);
    CITY.box(x, -6, z, x + 1, -5, z + 1, M.lakeBed);
    ROCK.box(x, -6, z, x + 1, 2, z + 1, 0);
  }
}
function mirrorMesh(src, planeY) {
  const g = src.geometry.clone();
  const pos = g.attributes.position, nrm = g.attributes.normal, idx = g.index.array;
  for (let i = 0; i < pos.count; i++) { pos.setY(i, 2 * planeY - pos.getY(i)); nrm.setY(i, -nrm.getY(i)); }
  for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
  const m = new THREE.Mesh(g, voxelMaterial);
  m.layers.set(LAYER_NOREFLECT);
  scene.add(m);
  return m;
}

// ───────────────────────────────────────────────────────────── waterfalls
const fallOut = (drop, jit) => 0.12 + Math.sqrt(Math.max(drop, 0)) * 0.62 + jit;
function buildFalls() {
  const pos = [], data = [], nrm = [], idx = [];
  const spray = [], mist = [];
  const rnd = RNG(3003);
  let v = 0, colId = 0;
  const push = (x, y, z, n, d) => { pos.push(x, y, z); nrm.push(n.nx, 0, n.nz); data.push(...d); return v++; };
  FALLS.forEach((f) => {
    const W = f.s1 - f.s0, cols = Math.max(2, Math.round(W)), cw = W / cols;
    for (let c = 0; c < cols; c++, colId++) {
      const sa = f.s0 + c * cw, sb = sa + cw;
      const a = SLAB_RING.at(sa), b = SLAB_RING.at(sb - 0.02), m = SLAB_RING.at((sa + sb) / 2);
      const u = (c + 0.5) / cols;
      const edgeFade = Math.min(1, Math.min(u, 1 - u) * cols * 0.55 + 0.25);
      for (let layer = 0; layer < 2; layer++) {
        const jit = (rnd() - 0.5) * 0.6 - layer * 0.55 + 0.25;
        const H = f.h * (0.68 + 0.4 * rnd()) * (0.7 + 0.3 * edgeFade) * (layer ? 0.8 : 1);
        const R = 20;
        let prev = null;
        for (let j = 0; j <= R; j++) {
          const drop = H * Math.pow(j / R, 1.55);

const AVE_PHASE = [0, 0.5, 4.2, 8.1, 2.4];
// signal state at an intersection keyed by the avenue's phase offset: 'G' | 'Y' | 'R'
function signalState(kind, off, t) {
  const p = mod(t - off, 12);
  if (kind === 'ave') return p < 4.9 ? 'G' : p < 5.6 ? 'Y' : 'R';
  return p >= 7.5 && p < 9.8 ? 'G' : p >= 9.8 && p < 10.3 ? 'Y' : 'R';
}
const VEH = {
  cab: { len: 3.2, v0: 8.2 }, car: { len: 3.2, v0: 7.4 }, bus: { len: 7.0, v0: 6.3 },
};
const LANES = [];
const SIGNALS = [];   // {x, z, off, kind, nx, nz}

function defineLanes() {
  const rnd = RNG(606);
  const pickKind = (bus) => { const r = rnd(); return bus ? 'bus' : r < 0.72 ? 'cab' : 'car'; };
  const spawnsFor = (n, bus) => {
    const base = rnd() * 12;
    return Array.from({ length: n }, (_, j) => ({ t0: mod(base + (j * 12) / n + rnd.range(-0.55, 0.55), 12), kind: pickKind(bus && j === 0), tint: rnd() }));
  };
  // avenues: one-way, two lanes each
  AVE_ROUTES.forEach((a, ai) => {
    const dir = Math.sign(a.to - a.from), L = Math.abs(a.to - a.from);
    for (const side of [-1.2, 1.2]) {
      const x = a.cx + side;
      const stops = [];
      for (const c of CROSS_ROUTES) {
        const d = c.narrow ? 2 : 3;
        if (!(a.cx > c.w[1] && a.cx < c.e[0])) continue;
        const edge = dir > 0 ? c.z0 : c.z0 + d;
        const s = (edge - a.from) * dir;
        if (s > 1 && s < L - 1) stops.push({ s, w: d, kind: 'ave', off: AVE_PHASE[ai] });
      }
      stops.sort((p, q) => p.s - q.s);
      LANES.push({ L, stops, spawns: spawnsFor(2, side < 0), pose: (s) => [x, 2.0, a.from + dir * s, -dir * Math.PI / 2, 0] });
    }
  });
  // cross streets
  for (const c of CROSS_ROUTES) {
    const d = c.narrow ? 2 : 3, z = c.z0 + d / 2;
    const west = c.w[0] + 2.9, east = c.e[0] + 4.8;
    const from = c.dir > 0 ? west : east, to = c.dir > 0 ? east : west;
    const L = Math.abs(to - from);
    const stops = [];
    AVE_ROUTES.forEach((a, ai) => {
      if (!(a.cx > c.w[1] && a.cx < c.e[0])) return;
      const edge = c.dir > 0 ? a.cx - 2.5 : a.cx + 2.5;
      const s = (edge - from) * c.dir;
      if (s > 1) stops.push({ s, w: 5, kind: 'cross', off: AVE_PHASE[ai] });
    });
    stops.sort((p, q) => p.s - q.s);
    // one vehicle per cycle: the short cross-town blocks can never back up into an intersection
    LANES.push({ L, stops, spawns: spawnsFor(1, false), pose: (s) => [from + c.dir * s, 2.0, z, c.dir > 0 ? 0 : Math.PI, 0] });
  }
  // Brooklyn Bridge roadways
  for (const dir of [1, -1]) {
    const from = dir > 0 ? -19.6 : 131, to = dir > 0 ? 131 : -19.6;
    const L = Math.abs(to - from), w = dir * 4.1;
    LANES.push({
      L, stops: [], spawns: spawnsFor(7, false),
      pose: (s) => {
        const bs = from + dir * s, p = BR.toWorld(bs, w);
        const slope = (BR.deckY(bs + 1) - BR.deckY(bs - 1)) / 2;
        return [p[0], BR.deckY(bs) + 0.02, p[1], BR.yaw + (dir > 0 ? 0 : Math.PI), Math.atan(slope * dir)];
      },
    });
  }
  // Brooklyn through-street
  LANES.push({ L: 126, stops: [], spawns: spawnsFor(2, true), pose: (s) => [111.5, 2.0, -111.5 + s, -Math.PI / 2, 0] });

  // signal heads at each signalled intersection
  AVE_ROUTES.forEach((a, ai) => {
    for (const c of CROSS_ROUTES) {
      const d = c.narrow ? 2 : 3;
      if (!(a.cx > c.w[1] && a.cx < c.e[0])) continue;
      if (c.z0 <= Math.min(a.from, a.to) + 1 || c.z0 + d >= Math.max(a.from, a.to) - 1) continue;
      SIGNALS.push({ x: a.cx - 2.9, z: c.z0 + d + 0.4, off: AVE_PHASE[ai], arm: 1 });
      SIGNALS.push({ x: a.cx + 2.9, z: c.z0 - 0.4, off: AVE_PHASE[ai], arm: -1 });
    }
  });
}

// intelligent-driver model; every spawn repeats each loop, so one converged
// cycle gives an exactly periodic trajectory
function simulateLane(lane) {
  const dt = 1 / 60, T0 = -84, T1 = 80;
  const events = [];
  lane.spawns.forEach((sp, j) => { for (let m = -7; m <= 3; m++) { const t = sp.t0 + 12 * m; if (t >= T0 && t < T1) events.push({ t, j, m }); } });
  events.sort((a, b) => a.t - b.t);
  const cars = [], traj = lane.spawns.map(() => ({ s: [], v: [], t: null })), prior = lane.spawns.map(() => []);
  let ev = 0;
  for (let t = T0; t < T1; t += dt) {
    while (ev < events.length && events[ev].t <= t) {
      const e = events[ev++], sp = lane.spawns[e.j], K = VEH[sp.kind];
      const last = cars[cars.length - 1];
      let v = K.v0;
      if (last && last.s - (last.len + K.len) / 2 < 3.5) v = Math.min(v, last.v * 0.8);
      // enter slowly enough to hold at the first stop line, even when the portal sits close to it
      if (lane.stops.length) v = Math.min(v, Math.sqrt(2 * 4.0 * Math.max(0, lane.stops[0].s - 0.55 - K.len / 2)));
      cars.push({ j: e.j, m: e.m, s: t - e.t > 0 ? v * (t - e.t) : 0, v, len: K.len, v0: K.v0, pass: new Set(), born: e.t });
    }
    for (let i = 0; i < cars.length; i++) {
      const c = cars[i], lead = i > 0 ? cars[i - 1] : null;
      const aMax = 5.2, b = 6.5, s0 = 0.9, T = 0.42;
      const idm = (gap, dv) => {
        const star = s0 + Math.max(0, c.v * T + (c.v * dv) / (2 * Math.sqrt(aMax * b)));
        return aMax * (1 - Math.pow(c.v / c.v0, 4) - Math.pow(star / Math.max(gap, 0.12), 2));
      };
      let a = aMax * (1 - Math.pow(c.v / c.v0, 4));
      if (lead) a = Math.min(a, idm(lead.s - c.s - (lead.len + c.len) / 2, c.v - lead.v));
      for (let q = 0; q < lane.stops.length; q++) {
        const st = lane.stops[q];
        const line = st.s - 0.55 - c.len / 2;
        const dist = line - c.s;
        if (dist < -0.35 || c.pass.has(q)) continue;
        let state = signalState(st.kind, st.off, t);
        // never block the box: wait at the line unless there is room to clear the intersection
        if (state === 'G' && lead && lead.v < 3.2 && lead.s - lead.len / 2 < st.s + st.w + c.len + 0.7 && lead.s > st.s) state = 'R';
        if (state === 'G') break;
        if (dist < (c.v * c.v) / (2 * 7.5) - 0.1) { c.pass.add(q); break; }
        a = Math.min(a, idm(dist + s0, c.v));
        break;
      }
      c.a = clamp(a, -14, aMax);
    }
    for (const c of cars) {
      c.v = Math.max(0, c.v + c.a * dt);
      c.s += c.v * dt;
      if (c.m === -1) prior[c.j].push(c.s);
      if (c.m === 0) {
        const tr = traj[c.j];
        if (tr.t === null) tr.t = t + dt - c.born;
        tr.s.push(c.s); tr.v.push(c.v);
      }
    }
    while (cars.length && cars[0].s > lane.L) cars.shift();
  }
  // steady state check: the previous cycle must have driven the same path
  lane.drift = 0;
  traj.forEach((tr, j) => { for (let i = 0; i < Math.min(tr.s.length, prior[j].length); i++) if (tr.s[i] <= lane.L) lane.drift = Math.max(lane.drift, Math.abs(tr.s[i] - prior[j][i])); });
  lane.traj = traj.map((tr) => {
    let n = tr.s.findIndex((s) => s > lane.L);
    if (n < 0) n = tr.s.length;
    return { s: Float32Array.from(tr.s.slice(0, n)), v: Float32Array.from(tr.v.slice(0, n)), t0: tr.t ?? 0, dur: (tr.t ?? 0) + (n - 1) * dt, dt };
  });
}

const WALKERS = [];    // {at(t) -> [x,y,z,heading,walking], color, steps, phase}
const SHIRTS = [0xc0392b, 0x2f6fb3, 0xe8e4da, 0xe0a82e, 0x2e8b57, 0x7d4fa3, 0x222428, 0xd2691e, 0x4fb3bf, 0xd65a8b, 0x8a8f99, 0x274060];

// a stream of walkers circling a closed route; colours repeat in step with the loop
function stream(points, spacing, yOf, rnd, o = {}) {
  const path = new Path([...points, points[0]]);
  const m = clamp(Math.round((12 * (o.speed || 1.0)) / spacing), 1, 8);
  const N = Math.max(m, Math.round(path.len / spacing / m) * m);
  const v = (m * path.len) / (N * 12);
  const spread = o.lat ?? 0.28;
  const looks = Array.from({ length: m }, () => ({ color: rnd.pick(SHIRTS), lat: rnd.range(-spread, spread), jit: rnd.range(-0.3, 0.3) * spacing, steps: rnd.int(19, 24), phase: rnd() * TAU, size: rnd.range(0.9, 1.08) }));

      color: L.color, steps: L.steps, phase: L.phase, size: L.size * (o.size || 1),
      at(t) {

    const stern = Math.min(raw - b.len * 0.42, L - b.len * 0.42);
    const stepLen = b.wake / (TRAIL - 1);
    const sternRaw = raw - b.len * 0.42;
    for (let i = 0; i < TRAIL; i++) {
      const si = stern - i * stepLen;
      const q = b.route.at(Math.max(si, 0));
      const back = Math.max(0, sternRaw - si);
      const fadeW = si < 0 ? 0 : Math.pow(clamp(1 - back / b.wake, 0, 1), 0.8);
      waterUniforms.uTrail.value[bi * TRAIL + i].set(q.x, q.z, back, fadeW);
    }

    const cast = smooth(1.5, 9, raw);

    waterUniforms.uBoat.value[bi].set(b.beam, b.len, b.strength * cast * Math.max(moving, wakeLeft * 0.75), b.wake + b.len + 6);
    waterUniforms.uBoatDir.value[bi].set(p.x, p.z, hx * Math.max(moving, 0.001), hz * Math.max(moving, 0.001));

      setGlint(gi++, p.x + hx * u * b.len, 3.0, p.z + hz * u * b.len + b.beam * 0.55, b.light, 2.6 * lamp);

// ───────────────────────────────────────────────────────────── gulls
const GULLS = [];
const gulls = {};
function buildGulls() {
  const rnd = RNG(77);
  const flocks = [[2, 20, 68, 9, 5, 9], [-25, 15, 68, 11, 5, 5], [66, 17, 40, 12, 9, 5], [86, 14, 62, 7, 6, 4], [-47, 22, 124, 9, 8, 4], [-70, 27, 38, 8, 7, 4], [36, 21, 16, 8, 6, 4], [-90, 14, 92, 9, 8, 3]];
  for (const [x, y, z, rx, rz, n] of flocks) {
    const dir = rnd() < 0.5 ? 1 : -1;
    for (let i = 0; i < n; i++) {
      GULLS.push({ x: x + rnd.range(-4, 4), y: y + rnd.range(-3, 4), z: z + rnd.range(-3, 3), rx: rx * rnd.range(0.55, 1.1), rz: rz * rnd.range(0.55, 1.1), dir, ph: rnd() * TAU, ph2: rnd() * TAU, flap: rnd.int(24, 31), size: rnd.range(0.75, 1.05) });
    }
  }

  body.box(-0.36, -0.1, -0.13, 0.32, 0.12, 0.13, M.gullWhite);
  body.box(0.32, -0.02, -0.09, 0.52, 0.14, 0.09, M.gullWhite);
  body.box(0.52, 0.01, -0.035, 0.66, 0.07, 0.035, M.routeSign);
  body.box(-0.62, -0.03, -0.17, -0.36, 0.04, 0.17, M.gullGrey);

    const w = new Builder();
    const bx = (a, b, c, d, m) => w.box(a, 0.0, Math.min(sg * c, sg * d), b, 0.07, Math.max(sg * c, sg * d), m);
    bx(-0.2, 0.2, 0.06, 0.58, M.gullWhite); bx(-0.24, 0.1, 0.58, 0.98, M.gullGrey); bx(-0.28, -0.02, 0.98, 1.2, M.black);
    return w.geometry();

  gulls.body = makeInstanced(body.geometry(), GULLS.length, { cast: false });
  gulls.l = makeInstanced(wing(-1), GULLS.length, { cast: false });
  gulls.r = makeInstanced(wing(1), GULLS.length, { cast: false });
}
const _w = new THREE.Matrix4(), _rx = new THREE.Matrix4();
function poseGulls(t) {
  GULLS.forEach((g, i) => {
    const a = g.ph + g.dir * OMEGA * t;
    const x = g.x + Math.cos(a) * g.rx, z = g.z + Math.sin(a) * g.rz;
    const y = g.y + Math.sin(a * 2 + g.ph2) * 1.6 + Math.sin(OMEGA * 3 * t + g.ph) * 0.35;
    const vx = -Math.sin(a) * g.rx * g.dir, vz = Math.cos(a) * g.rz * g.dir;

// ───────────────────────────────────────────────────────────── rooftop & street steam
function buildSteam() {
  const rnd = RNG(1305);
  const puffs = [];
  for (const e of STEAM) {
    const base = rnd();
    for (let i = 0; i < 9; i++) puffs.push({ x: e.x, y: e.y, z: e.z, s: e.s * rnd.range(0.85, 1.2), phase: base + i / 9, drift: rnd.range(0.6, 1.4), seed: rnd() * 40 });
  }

  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', quad.attributes.position); g.setAttribute('uv', quad.attributes.uv); g.setIndex(quad.index);
  const attr = (n, size, fn) => { const a = new Float32Array(puffs.length * size); puffs.forEach((p, i) => a.set(fn(p), i * size)); g.setAttribute(n, new THREE.InstancedBufferAttribute(a, size)); };
  attr('iPos', 3, (p) => [p.x, p.y, p.z]); attr('iCyc', 4, (p) => [p.phase, p.s, p.drift, p.seed]);
  g.instanceCount = puffs.length;
  const mat_ = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.uTime, uFogStart: U.uFogStart, uFogDens: U.uFogDens },
    vertexShader: /* glsl */`
      uniform float uTime; attribute vec3 iPos; attribute vec4 iCyc; varying vec2 vUv; varying float vA; varying float vL; varying float vSeed; varying vec3 vW;
      void main() {
        float life = fract(uTime / 3.0 + iCyc.x);
        vec3 c = iPos + vec3(life * life * 2.1 * iCyc.z + sin(life * 7.0 + iCyc.w) * 0.22, life * 4.6, life * 0.5 * sin(iCyc.w));
        float s = iCyc.y * (0.55 + life * 2.3);
        vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        vUv = uv; vL = life; vSeed = iCyc.w; vW = c;
        vA = smoothstep(0.0, 0.14, life) * pow(1.0 - life, 1.25) * 0.50;

    fragmentShader: /* glsl */`
      varying vec2 vUv; varying float vA; varying float vL; varying float vSeed; varying vec3 vW;

      float th(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

}

// ───────────────────────────────────────────────────────────── post: HDR → bloom → ACES
const FSQ_VERT = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const fsScene = new THREE.Scene(), fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
