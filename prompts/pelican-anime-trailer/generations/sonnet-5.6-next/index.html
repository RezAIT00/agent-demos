}

vec3 horizonColor(vec3 rd){
  vec3 s=normalize(uSunDir); float a=acos(clamp(dot(normalize(vec3(rd.x,.02,rd.z)),s),-1.,1.)); float gl=exp(-a*3.2);
  if(uMode==0) return vec3(.80,.79,.88);
  if(uMode==1) return vec3(.88,.86,.78)+vec3(.14,.10,.02)*gl;
  if(uMode==2) return vec3(.14,.20,.33);
  if(uMode==3) return vec3(.24,.18,.43);
  if(uMode==4) return vec3(.96,.64,.50)+vec3(.20,.16,.04)*gl;
  if(uMode==5) return vec3(.46,.18,.43);
  if(uMode==6) return vec3(.70,.83,.96);
  if(uMode==7) return vec3(.86,.36,.28)+vec3(.30,.28,.04)*gl;
  if(uMode==9) return vec3(.90,.55,.42)+vec3(.20,.18,.06)*gl;

}
vec3 groundAlbedo(float along, float lat, float aa, out float wet){
  wet=0.;
  float n=vnoise(vec2(along*3.1,lat*9.))*.6+vnoise(vec2(along*11.,lat*31.))*.4;
  float blurK = clamp(aa*2.,0.,1.);
  n = mix(n, .5, blurK*.7);
  float streak = vnoise(vec2(along*.35, lat*14.));
  vec3 asphalt=vec3(.33,.33,.40), shoulder=vec3(.55,.47,.40), lineC=vec3(.96,.93,.82), outer=vec3(.30,.50,.30);
  bool lines=true;
  if(uMode==1){ asphalt=vec3(.80,.62,.43); shoulder=vec3(.72,.55,.38); outer=vec3(.46,.66,.28); lines=false; }
  if(uMode==2){ asphalt=vec3(.070,.095,.16); shoulder=vec3(.055,.075,.12); lineC=vec3(.42,.50,.62); outer=vec3(.035,.07,.085); wet=1.; }
  if(uMode==3){ asphalt=vec3(.095,.090,.20); shoulder=vec3(.12,.10,.20); lineC=vec3(.62,.58,.60); outer=vec3(.045,.060,.13); }
  if(uMode==4){ asphalt=vec3(.40,.28,.42); shoulder=vec3(.60,.38,.40); lineC=vec3(1.0,.84,.66); outer=vec3(.34,.30,.30); }
  if(uMode==5){ asphalt=vec3(.13,.07,.19); shoulder=vec3(.16,.08,.21); outer=vec3(.09,.04,.14); lines=false; }
  if(uMode==6){ asphalt=vec3(.35,.37,.45); shoulder=vec3(.60,.54,.48); outer=vec3(.22,.44,.28); }
  if(uMode==7){ asphalt=vec3(.40,.18,.28); shoulder=vec3(.66,.28,.22); lineC=vec3(1.0,.74,.42); outer=vec3(.55,.20,.20); }
  if(uMode==9){ asphalt=vec3(.37,.24,.38); shoulder=vec3(.62,.34,.34); lineC=vec3(1.0,.84,.64); outer=vec3(.46,.24,.28); }
  if(uMode==11){ asphalt=vec3(.16,.13,.22); shoulder=asphalt; outer=asphalt; lines=false; }
  if(uMode==0){ vec2 g=abs(fract(vec2(along,lat)*2.+.5)-.5); float l=1.-smoothstep(.004,.012,min(g.x,g.y)); return mix(vec3(.80,.78,.84), vec3(.60,.58,.68), l); }
  vec3 c;
  if(lat>-3.35 && lat<1.45){
    c=asphalt*(.92+.16*n)*(.95+.10*streak);
    if(uMode==1){ if(abs(lat+.05)<.22||abs(lat+1.55)<.22) c*=.90; float pb=step(.86,vnoise(vec2(along*9.,lat*13.))); c=mix(c,c*.72,pb*(1.-blurK)); }
    if(lines){
      float dash = step(fract(along/5.),.5);
      float d1=abs(lat+1.05); if(d1<.065) c=mix(c,lineC,dash*(1.-smoothstep(.055,.065,d1)));
      if(abs(lat-1.18)<.055 || abs(lat+3.08)<.055) c=lineC;
    }
  } else if(lat>-4.0 && lat<2.1){ c=shoulder*(.88+.24*n); if(vnoise(vec2(along*14.,lat*16.))>.70) c*=mix(.76,1.,blurK); }
  else { float g=vnoise(vec2(along*1.1,lat*1.3))*.65+vnoise(vec2(along*5.,lat*5.))*.35; g=mix(g,.5,blurK); c=outer*(.80+.4*step(.5,g)+.1*n); }
  if((uMode==1||uMode==4) && lat<-6.2){ // sea
    float band=vnoise(vec2(along*.22+uTime*.25, lat*1.7));
    c = uMode==1? mix(vec3(.10,.46,.68), vec3(.24,.66,.80), step(.55,band)) : mix(vec3(.42,.26,.52), vec3(.80,.44,.52), step(.55,band));
    float glit=step(.80,vnoise(vec2(along*1.6+uTime*1.3, lat*6.)))*step(.6,vnoise(vec2(along*.4,lat*.8-uTime*.5)));
    c=mix(c, uMode==1?vec3(.95,.99,1.0):vec3(1.0,.88,.62), glit);
    if(lat>-6.75) c = mix(vec3(.97,.97,.95), c, smoothstep(-6.2,-6.75,lat)+ .3*sin(along*3.+uTime*2.));
  }
  if(uMode==9 && uP.w>0.){ float a=along-uP.w; if(a>0.&&a<1.1&&lat>-3.1&&lat<1.2){ float ck=mod(floor(a/.275)+floor(lat/.275),2.); c=mix(vec3(.93,.90,.84),vec3(.10,.06,.14),ck); } }
  return c;
}

void main(){
  vec2 ndc = gl_FragCoord.xy/uRes*2.-1.;
  vec4 pa = uIVP*vec4(ndc,-1.,1.), pb=uIVP*vec4(ndc,1.,1.);
  vec3 rd = normalize(pb.xyz/pb.w - pa.xyz/pa.w);
  vec2 sc = gl_FragCoord.xy/uRes;
  gl_FragDepth = .99999999;
  oG = vec4(0.,1000.,0.,0.);
  vec3 col;
  if(uMode==8){ // speed tunnel
    vec2 q=(sc-uVanish)*vec2(1.7778,1.); float r=length(q), a=atan(q.y,q.x);
    col=mix(vec3(.30,.07,.30), vec3(.035,.01,.10), smoothstep(.05,1.0,r));
    for(int L=0;L<3+uZ;L++){
      float N = 70.+float(L)*55.; float x=(a/6.2831853+.5)*N; float c=floor(x); float h=h11(c+float(L)*131.);
      float ph=fract(log(r+.04)*(.75+.2*h) - uTime*(1.4+1.8*h) + h*9.);
      float wid = (.10+.34*h11(c*3.+float(L)))*smoothstep(0.,.55,ph)*(1.-smoothstep(.75,1.,ph));
      if(h>.42 && abs(fract(x)-.5)<wid && r>.07+.13*h11(c+5.)){
        vec3 sc2 = h>.86? vec3(1.0,.97,.84) : h>.66? vec3(1.0,.70,.20) : vec3(.90,.18,.30);
        col=mix(col,sc2,.92-float(L)*.14);
      }
    }
    col += vec3(1.0,.80,.45)*exp(-r*5.2)*.95;
    oColor=vec4(col*uDim,1.); return;
  }
  if(uMode==10){ // title burst
    vec2 q=(sc-uVanish)*vec2(1.7778,1.); float r=length(q), a=atan(q.y,q.x);
    col=mix(vec3(.17,.08,.28), vec3(.015,.008,.05), smoothstep(.02,.95,r));
    float k=a*26./6.2831853+uTime*.22; float ray=step(.5,fract(k))*(.55+.45*h11(floor(k)));
    col=mix(col, vec3(.55,.20,.30), ray*.34*smoothstep(.06,.5,r));
    float k2=a*58./6.2831853-uTime*.35; col=mix(col, vec3(1.0,.66,.20), step(.78,fract(k2))*.22*smoothstep(.12,.7,r)*step(.45,h11(floor(k2))));
    col += vec3(1.0,.62,.22)*exp(-r*3.4)*.55;
    vec2 hp=gl_FragCoord.xy/(uRes.y/108.); hp=mat2(.707,-.707,.707,.707)*hp; float dotr=length(fract(hp)-.5); col*=1.-.28*smoothstep(.46,.36,dotr)*smoothstep(.35,1.0,r)*.0-.0; col=mix(col,vec3(.62,.24,.34), step(dotr, .38*smoothstep(.42,1.05,r))*.35);
    col *= .96+.08*vnoise(q*vec2(3.,90.));
    oColor=vec4(col*uDim,1.); return;
  }
  if(uMode==12){ // rival void
    col=mix(vec3(.075,.025,.13), vec3(.006,.003,.014), smoothstep(0.,.5,abs(rd.y)));
    if(rd.y<0.){ float s=-uCam.y/rd.y; vec3 p=uCam+rd*s; float g=exp(-dot(p.xz-vec2(0.,0.),p.xz)*.35); col=vec3(.012,.006,.025)+vec3(.20,.07,.36)*g;
      float li=1.-smoothstep(.006,.018,abs(fract((p.x+uScroll)*.8)-.5)); col+=vec3(.20,.09,.38)*li*exp(-length(p.xz)*.4);
      col*=mix(.35,1.,shadowAt(p+vec3(0,.003,0)));
      vec4 cl=uVP*vec4(p,1.); gl_FragDepth=clamp(cl.z/cl.w*.5+.5,0.,.9999999); oG.y=s; }
    oColor=vec4(col*uDim,1.); return;
  }
  if(uMode==11){ // macro backdrop with bokeh
    col=mix(vec3(.17,.09,.20), vec3(.035,.025,.09), smoothstep(-.05,.35,rd.y));
    float az=atan(rd.x,-rd.z);
    for(int k=0;k<2;k++){ vec2 q=vec2(az, rd.y)*(k==0?14.:23.)+vec2(uScroll*.1,float(k)*7.); vec2 c=floor(q); vec2 o=h22(c)*.6+.2; float d=length(fract(q)-o); float h=h21(c+21.); if(h>.62){ float rr=.14+.22*h11(c.x*7.+c.y); vec3 bc= h>.86? vec3(1.0,.62,.24): h>.74? vec3(.40,.75,1.0):vec3(.85,.30,.52); col+=bc*(1.-smoothstep(rr-.04,rr,d))*.20*smoothstep(-.1,.1,rd.y+.03); } }
  } else col = skyColor(rd);

  float gden = rd.y + uSlope*rd.x;
  if(gden<-.0005 && uGround>.5){
    float s=-(uCam.y+uSlope*uCam.x)/gden; vec3 p=uCam+rd*s;
    if(s>0. && s<300.){
      float along=p.x+uScroll, lat=p.z;
      if(uP.x!=0.){ float R=uP.x; vec2 v=vec2(p.x, p.z+R); lat=length(v)-abs(R); along=atan(v.x, v.y*sign(R))*abs(R)+uScroll; }
      bool gap = uP.y<uP.z && along>uP.y && along<uP.z;
      vec3 g; float depthS=s;
      if(!gap){
        float wet; float px = s*.0011/max(.08,-gden);
        float blur=uSpeed/55.;
        if(blur>.04){ g=vec3(0); for(int i=0;i<7+uZ;i++){ float off=(float(i)/6.-.5)*blur; g+=groundAlbedo(along+off, lat, max(px,blur*.6), wet); } g/=7.; }
        else g=groundAlbedo(along, lat, px, wet);
        float sh=shadowAt(p+vec3(0,.004,0));
        g *= mix(uMode==0?vec3(.74,.72,.84):vec3(.45,.40,.60), vec3(1.), sh);
        if(uSpeed>3. && uMode!=11){ float st=step(.83,vnoise(vec2(along/(1.+uSpeed*.14), lat*23.))); g=mix(g, g*1.45+.07, st*smoothstep(3.,14.,uSpeed)*.5); }
        if(uMode==3 || uMode==2){
          float sp=9.; float k0=floor((along)/sp+.5);
          for(int j=-2;j<=2+uZ;j++){
            float la=(k0+float(j))*sp; float lx=la-uScroll;
            if(uMode==3){ float pool=exp(-(pow(along-la,2.)/3.6+pow(lat+.55,2.)/5.0)); float band = pool>.55?1.:pool>.22?.55:pool>.07?.22:0.; g += vec3(.62,.44,.20)*band*.50*mix(.35,1.,sh); }
            vec3 lp=vec3(lx,3.0,-3.9); vec3 R=normalize(vec3(rd.x,-rd.y,rd.z)); vec3 L=normalize(lp-p);
            float daz=atan(L.x,-L.z)-atan(R.x,-R.z); daz=mod(daz+PI,2.*PI)-PI; float del=L.y-R.y;
            float rip = .55+.9*vnoise(vec2(along*2.2, lat*17.));
            float str = exp(-(daz*daz*(uMode==2?700.:1600.)+del*del*(uMode==2?5.:30.)))*rip;
            g += (uMode==2? vec3(.45,.68,1.0):vec3(1.0,.75,.35))*str*(uMode==2?.70:.30);
          }
        }
        if(uMode==2){
          float el2=clamp(-rd.y*2.2,0.,1.); vec3 refl=mix(vec3(.20,.30,.48),vec3(.05,.08,.17),el2)+uFlashL*vec3(.4); g += refl*.34*step(.46,vnoise(vec2(along*.55+rd.x*6.,lat*1.4+vnoise(vec2(along*4.,lat*7.))*.4)));
          vec2 q=vec2(along,lat)*2.6; vec2 c=floor(q);
          for(int a=-1;a<=1;a++) for(int b=-1;b<=1;b++){ vec2 cc=c+vec2(a,b); vec2 o=h22(cc); float ph=fract(uTime*1.9+h21(cc+5.)); float d=length(q-cc-o); float ring=(1.-smoothstep(.008,.045,abs(d-ph*.55)))*(1.-ph); g+=vec3(.45,.60,.85)*ring*.55*smoothstep(14.,3.,s); }
        }
        if(uMode==4){ vec3 sd=normalize(uSunDir); float daz=atan(rd.x,-rd.z)-atan(sd.x,-sd.z); g += vec3(1.0,.62,.36)*exp(-daz*daz*30.)*.18; }
        if(uMode==5) g += uFlashL*vec3(.25,.16,.40);
      } else {
        // canyon below the gap
        float depth=26.; vec3 g1;
        float best=1e9; float wy=0.; float wz=0.;
        for(int w=0;w<2;w++){ float wx=(w==0?uP.y:uP.z)-uScroll; float tw=(wx-uCam.x)/(abs(rd.x)<1e-5?1e-5:rd.x); if(tw>s*.999){ float y=uCam.y+rd.y*tw; if(y<0.&&y>-depth&&tw<best){best=tw;wy=y;wz=uCam.z+rd.z*tw;} } }
        float tf=(-depth-uCam.y)/rd.y;
        if(best<tf){
          float strata=vnoise(vec2(wy*.9+vnoise(vec2(wz*.4,wy*.3))*1.6, 2.));
          g1 = strata>.62? vec3(.60,.25,.24) : strata>.40? vec3(.46,.16,.24) : vec3(.32,.09,.22);
          g1 *= .86+.28*step(.5,vnoise(vec2(wz*1.7, wy*.22)));
          g1 = mix(g1, vec3(.17,.05,.20), smoothstep(-3.,-17.,wy));
          if(wy>-.28) g1=vec3(.96,.46,.24);
          depthS=best;
        } else {
          vec3 fp=uCam+rd*tf; float riv=abs(fp.z+ 3.*sin((fp.x+uScroll)*.25)+5.);
          g1 = riv<1.8? vec3(.96,.52,.30) : vec3(.13,.035,.18)*(1.+.5*step(.55,vnoise(fp.xz*.35)));
          depthS=tf;
        }
        g=g1;
      }
      float fogK = uMode==2?.030 : uMode==3?.016 : uMode==5?.03 : uMode==0?.02 : uMode==11?.05 : .011;
      vec3 hz = horizonColor(rd);
      float fog=1.-exp(-max(0.,depthS-5.)*fogK);
      if(uMode==1||uMode==4) fog*=.78;
      col=mix(g,hz,fog);
      vec4 cl=uVP*vec4(p,1.); gl_FragDepth=clamp(cl.z/cl.w*.5+.5,0.,.9999999); oG.y=gap?1000.:s;

function headBasis(pitch, yaw = 0, roll = 0) {

// eye decal hugging the head ellipsoid
function eyeDecal(mb, Hc, hb, radii, side, k, mat, part, fwdBias, upBias) {
  const { f, u, s } = hb;

function buildWing(mb, out, cfg) {

  const z = side;

  const Es = rot(add(S, [-0.075 * scale, 0.215 * scale, z * 0.420 * scale]));

  mb.sphere(Wr, 0.028 * scale * (1 - 0.50 * sp), { mat: mats.arm, part: parts.arm });

  const flut = (wind || 0) * (1 - sp * 0.5) + sp * 0.25;

      const q = i / n;

      const d = norm(q < 0.5 ? vlerp(dA, dB, q / 0.5) : vlerp(dB, dC, (q - 0.5) / 0.5));

function legSolve(hip, pf, side, L) {
  const A = comb([pf.P, 1], [pf.ex, -0.054], [pf.ey, 0.064]);
  const h = clamp((pf.P[1] - (BG.BB[1] - BG.crankL)) / (2 * BG.crankL));
  const phi = lerp(-1.17, -0.66, h);
  const K = [hip[0] + Math.cos(phi) * L.femur, hip[1] + Math.sin(phi) * L.femur, side * 0.124];
  const J = ik2(K, A, L.shank, L.tarsus, norm([-1, 0.12, side * 0.10]));
  return { H: hip, K, J, A, reach: dist(K, A) / (L.shank + L.tarsus) };

// webbed foot lying on a pedal frame
function buildFoot(mb, pf, side, A, parts, mats, scale = 1) {
  const L = (x, y, z) => comb([pf.P, 1], [pf.ex, x * scale], [pf.ey, y], [pf.ez, z * scale]);
  const sole = BG.pedalH + 0.0015;
  const heel = L(-0.046, sole + 0.0145, 0), ball = L(-0.018, sole + 0.0214, 0);
  mb.capsule(A, ball, 0.0205, 0.0215, { mat: mats.leg, part: parts.foot, nv: 12 });
  mb.capsule(heel, ball, 0.014, 0.021, { mat: mats.leg, part: parts.foot, nv: 10 });
  const tips = [[0.092, side * 0.066], [0.122, side * 0.022], [0.106, -side * 0.026], [0.048, -side * 0.060]];
  for (let i = 0; i < 4; i++) {
    const [tx, tz] = tips[i];
    const tip = L(tx, sole + 0.0068, tz), mid = L(tx * 0.52 - 0.012, sole + 0.0205, tz * 0.55);
    mb.tube([ball, mid, L(tx * 0.82, sole + 0.0125, tz * 0.85), tip], 0.0140, 0.0066, { mat: mats.leg, part: parts.foot, nv: 8, nu: 14, lw: 0.75 });
    mb.capsule(tip, L(tx + 0.017, sole + 0.0038, tz * 1.07), 0.0052, 0.0012, { mat: mats.claw, part: parts.claw, nv: 6, nu: 6, lw: 0.4 });
  }

  for (let i = 0; i < 4; i++) {
    const [tx, tz] = tips[i]; outline.push(L(tx, sole + 0.0016, tz));
    if (i < 3) { const [ux, uz] = tips[i + 1]; outline.push(L((tx + ux) * 0.5 - 0.026, sole + 0.0016, (tz + uz) * 0.5)); }
  }
  outline.push(L(-0.044, sole, -side * 0.016), L(-0.050, sole, 0));
  mb.fan(L(-0.004, sole + 0.0045, 0), outline.concat([outline[0]]), pf.ey, { mat: mats.web, part: parts.web, lw: 0.8 });

function buildLeg(mb, out, cfg) {
  const { side, hip, pf, L, parts, mats, t, wind } = cfg;
  const S = cfg.solve || legSolve(hip, pf, side, L);
  const { H, K, J, A } = S;
  if (cfg.onPedal && window.__legStats) window.__legStats(cfg.pre || '', S.reach);
  // feathered thigh: hip -> forward knee
  mb.loft(u => bez3(add(H, [-0.02, 0.012, -side * 0.012]), vlerp(H, K, 0.3), vlerp(H, K, 0.7), K, u), u => { const p = profile([[0, 0.060, 0.050], [0.3, 0.082, 0.062], [0.75, 0.062, 0.050], [1, 0.044, 0.040]], u); return [p[0] * (cfg.fat || 1), p[1] * (cfg.fat || 1)]; }, { mat: mats.thigh, part: parts.thigh, nu: 14, nv: 14, caps: true });

    const a = i / 4 * TAU + 0.5;

    mb.blade(add(vlerp(K, mid, 0.55), o), norm(add(norm(sub(J, K)), mul(o, 6 + Math.sin(t * 19 + i) * (wind || 0) * 2))), [0, -Math.sin(a), Math.cos(a)], 0.075, 0.030, { mat: mats.thigh, part: parts.thigh, lw: 0.55, shape: 'spike' });
  }

  mb.sphere(J, 0.0278, { mat: mats.leg, part: parts.leg });

// ribbon scarf tail
function scarfTail(mb, knot, o) {
  const { len, t, wind, phase, zoff, lift, part, width } = o;
  const dir = norm(vlerp([-0.30, -1.0, zoff * 0.8], [-1.0, lift, zoff], clamp(wind)));
  const Lp = [], Rp = [], N = 30;
  let side = norm(cross(dir, [0, 0, 1])); if (side[1] < 0) side = mul(side, -1);
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const w1 = Math.sin(s * 9.5 - t * 17 + phase) * 0.050 * s * (0.25 + wind) + Math.sin(s * 4.4 - t * 7.6 + phase * 2) * 0.034 * s * wind;
    const w2 = Math.sin(s * 7.4 - t * 12.2 + phase * 1.3) * 0.045 * s * (0.3 + wind);
    let p = comb([knot, 1], [dir, s * len], [side, w1], [[0, 0, 1], w2 + zoff * s * 0.18]);
    p[1] -= (1 - clamp(wind)) * 0.20 * s * s;
    if (o.floorY !== undefined && p[1] < o.floorY) p[1] = o.floorY + (p[1] - o.floorY) * 0.1;
    const tw = Math.sin(s * 5.2 - t * 9.4 + phase) * 0.75 * s + 0.25;
    const wv = norm(comb([side, Math.cos(tw)], [[0, 0, 1], Math.sin(tw)]));
    const wd = width * (0.55 + 0.75 * Math.sin(Math.min(1, s * 1.25) * PI * 0.62));
    let a = mad(p, wv, wd * 0.5), b = mad(p, wv, -wd * 0.5);
    if (i === N) { a = mad(a, dir, 0.045); b = mad(b, dir, -0.012); }
    Lp.push(a); Rp.push(b);
  }
  mb.ribbon(Lp, Rp, { mat: o.mat || MAT.scarf, part, lw: 1.0, fold: u => mul([-0.0, 0.006, 0.006], Math.sin(u * 23 - t * 14 + phase)) });
  return vlerp(Lp[N], Rp[N], 0.5);
}

/* state:
   crank, neck, head{pitch,yaw,roll,dx,dy}, beakOpen, pouch, wiggle, fishTail, wing{spread,flap,targets,free},
   body{pitch,bob}, wind, t, scarf{wind,lift,len,off}, crestRaise, legs (custom {r:{pf}, l:{pf}}), squash, fishInPouch

function buildPelican(mb, out, st) {
  const t = st.t || 0, wind = st.wind === undefined ? 0.7 : st.wind;
  if (st.root) mb.push(st.root);
  const bp = (st.body && st.body.pitch) || 0, bob = (st.body && st.body.bob) || 0;

// ---------- set dressing ----------
function earClip(poly) {
  const idx = poly.map((_, i) => i), tris = [];
  let area = 0; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; area += a[0] * b[1] - b[0] * a[1]; }
  const sgn = area > 0 ? 1 : -1;
  const cr = (a, b, c) => ((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])) * sgn;
  let guard = 0;
  while (idx.length > 3 && guard++ < 2000) {
    let cut = false;
    for (let i = 0; i < idx.length; i++) {
      const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
      const a = poly[i0], b = poly[i1], c = poly[i2];
      if (cr(a, b, c) <= 0) continue;
      let inside = false;
      for (const j of idx) { if (j === i0 || j === i1 || j === i2) continue; const p = poly[j]; if (cr(a, b, p) > 0 && cr(b, c, p) > 0 && cr(c, a, p) > 0) { inside = true; break; } }
      if (inside) continue;
      tris.push([i0, i1, i2]); idx.splice(i, 1); cut = true; break;
    }
    if (!cut) break;
  }
  if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
  return tris;
}
// extrude a polygon (x,y) between z0..z1
function buildPrism(mb, poly, z0, z1, mat, part, lw = 1) {
  const tris = earClip(poly);
  for (const z of [z0, z1]) {
    const base = mb.nv; for (const p of poly) mb.vert([p[0], p[1], z], [0, 0, z === z1 ? 1 : -1], p[0], p[1], mat, part, lw, z === z1 ? -0.25 : 0);
    for (const [a, b, c] of tris) mb.tri(base + a, base + b, base + c);
  }
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    let n = norm([b[1] - a[1], -(b[0] - a[0]), 0]);
    let area = 0; for (let k = 0; k < poly.length; k++) { const p = poly[k], q = poly[(k + 1) % poly.length]; area += p[0] * q[1] - q[0] * p[1]; }

    const q = [[a, z0], [b, z0], [b, z1], [a, z1]].map(([p, z]) => mb.vert([p[0], p[1], z], n, 0, 0, mat, part + (i % 2), lw, 0));
    mb.tri(q[0], q[1], q[2]); mb.tri(q[0], q[2], q[3]);
  }
}

// whole-film rig check: every pedalling leg in every frame must reach its pedal without locking out
window.filmRigCheck = () => {
  const per = {}; let cur = null;
  window.__legStats = (who, reach) => { const k = cur + (who ? ' (rival)' : ''); const e = per[k] || (per[k] = { legs: 0, min: 9, max: 0, over: 0 }); e.legs++; e.min = Math.min(e.min, reach); e.max = Math.max(e.max, reach); if (reach > 0.995) e.over++; };

  let calls = [], prev = null, prevShot = null;
  const D = { pedallingSteps: 0, coastingSteps: 0, maxPedalError_rad: 0, wheelLagsDrive: 0, badShots: {} };
  window.__driveStats = (rival, wheel, crank) => calls.push({ rival, wheel, crank });
  for (let i = 0; i < n; i++) {
    cur = TL.shotAt(i / 24).id; calls = []; window.renderAt(i / 24);
    // flashback replays earlier footage; in the crash the rider has left the bike
    if (prev && prevShot === cur && prev.length === calls.length && cur !== 'flashback' && cur !== 'crash') {
      calls.forEach((c, k) => {
        const dc = c.crank - prev[k].crank, dw = c.wheel - prev[k].wheel;
        if (Math.abs(dc) > 1e-9) { D.pedallingSteps++; const e = Math.abs(dw - BG.gear * dc); D.maxPedalError_rad = Math.max(D.maxPedalError_rad, e); if (e > 1e-6) D.badShots[cur] = (D.badShots[cur] || 0) + 1; }
        else if (Math.abs(dw) > 1e-9) { D.coastingSteps++; if (dw < 0) { D.wheelLagsDrive++; D.badShots[cur] = (D.badShots[cur] || 0) + 1; } }
      });
    }
    prev = calls; prevShot = cur;
  }
  window.__legStats = null; window.__driveStats = null;
  D.maxPedalError_rad = +D.maxPedalError_rad.toExponential(2);
  let legs = 0, mx = 0, mn = 9, over = 0, worst = '';
  for (const [k, e] of Object.entries(per)) { legs += e.legs; over += e.over; mn = Math.min(mn, e.min); if (e.max > mx) { mx = e.max; worst = k; } }

};
// every frame must be a pure function of t: render in order, then shuffled, and compare the pixels
window.determinismCheck = (n = 48) => {
  const times = Array.from({ length: n }, (_, i) => Math.round(((i + 0.37) / n) * window.DURATION * 24) / 24);
  const a = new Uint8Array(W * H * 4), hashOf = () => { R.read(a); let h = 2166136261 >>> 0; for (let i = 0; i < a.length; i += 1) { h ^= a[i]; h = Math.imul(h, 16777619) >>> 0; } return h; };
  const first = times.map(t => { window.renderAt(t); return hashOf(); });
  const order = times.map((_, i) => i).sort((x, y) => hash(x * 97 + 3) - hash(y * 97 + 3));
  const bad = [];

function heroOnBike(mb, out, st, bikeExtra) {
  buildBike(mb, out, Object.assign({ wheel: (st.crank || 0) * BG.gear, crank: st.crank || 0, blur: 0 }, bikeExtra || {}));
  buildPelican(mb, out, st);
}
function renderStill(view, post) {
  meshUse = 0;
  R.render({ t: 0, draw: 0, views: [view], post: Object.assign({ vig: 0.12, bloom: 0.12, grain: 0.006 }, post || {}) });
}
function sheetView(st, cam, extra) {
  const s = makeScene((mb, out) => heroOnBike(mb, out, st, extra && extra.bike));
  return Object.assign({ cam, env: { mode: 0 }, light: SHEET_LIGHT, mesh: s.mesh, spokes: s.spokes, focus: [0.05, 0.8, 0], shadowSize: 1.5, eyes: { hero: (extra && extra.eye) || { open: 1, brow: 0.8 } }, scene: s }, extra && extra.view);
}
const orbit = (az, el, dist, tgt, fov = 30) => ({ pos: [tgt[0] + Math.sin(az) * Math.cos(el) * dist, tgt[1] + Math.sin(el) * dist, tgt[2] + Math.cos(az) * Math.cos(el) * dist], tgt, fov });
const BASE_ST = { crank: 0.55, neck: 'ride', t: 0.31, wind: 0.55, scarf: { wind: 0.8 } };

function label(g, text, x, y, size, col = '#1a1028', align = 'center') { strokeText(g, text, x, y, size, { color: col, align, weight: size * 0.14 }); }

window.renderTurnaround = () => {
  const cv = mkCanvas(3840, 1620), g = cv.getContext('2d');
  g.fillStyle = '#141024'; g.fillRect(0, 0, cv.width, cv.height);
  heavyText(g, 'TURNAROUND · THE PELICAN ON THE BIKE', 1920, 70, 74, { fill: '#fff', skew: 0.12 });
  const views = [['DRIVE SIDE', 0, 0.04], ['FRONT 3/4', 0.9, 0.12], ['FRONT', PI / 2, 0.05], ['FRONT 3/4 NON-DRIVE', 2.35, 0.16], ['NON-DRIVE SIDE', PI, 0.04], ['REAR 3/4', -2.3, 0.2], ['REAR', -PI / 2, 0.08], ['HIGH 3/4', 0.55, 0.62]];
  views.forEach((v, i) => {
    renderStill(sheetView(BASE_ST, orbit(v[1], v[2], 4.35, [0.07, 0.86, 0])));
    const x = (i % 4) * 960, y = 140 + Math.floor(i / 4) * 740;
    g.drawImage(glCanvas, 240, 0, 1440, 1080, x + 6, y, 948, 711);
    g.fillStyle = 'rgba(255,255,255,0.88)'; g.fillRect(x + 6, y + 663, 948, 48);
    label(g, v[0], x + 480, y + 687, 26);
  });
  return cv.toDataURL('image/png');
};

window.renderCharacterSheet = () => {
  const cv = mkCanvas(3840, 3200), g = cv.getContext('2d');
  g.fillStyle = '#141024'; g.fillRect(0, 0, cv.width, cv.height);
  heavyText(g, 'THE PELICAN · CHARACTER SHEET', 1920, 78, 82, { fill: '#fff', skew: 0.12 });
  strokeText(g, 'BEAK VELOCITY · ORIGINAL DESIGN · EVERY PIXEL DRAWN BY CODE', 1920, 150, 30, { color: '#ffbe3a' });
  // 1. five expressions
  heavyText(g, '1 · FIVE EXPRESSIONS', 60, 230, 44, { fill: '#ffbe3a', align: 'left' });
  const ex = [
    ['DETERMINED', { open: 1, brow: 0.95, mode: 0, glint: 0.3 }, { beakOpen: 0, neck: 'ride' }],
    ['SHOCKED', { open: 1, brow: -0.55, mode: 1 }, { beakOpen: 0.42, neck: 'tall', crestRaise: 0.9, brow: -0.4 }],
    ['IN PAIN', { open: 1, brow: -0.35, mode: 2 }, { beakOpen: 0.16, neck: 'ride', head: { pitch: -0.18 }, wind: 0.1, brow: -0.2 }],
    ['PURE JOY', { open: 1, brow: -0.15, mode: 3 }, { beakOpen: 0.30, neck: 'proud', crestRaise: 0.35, brow: 0.1 }],
    ['SMUG', { open: 0.9, brow: 0.35, mode: 4, lookX: 0.2 }, { beakOpen: 0, neck: 'proud', head: { pitch: 0.04 }, pouch: 0.35, brow: 0.35 }]
  ];
  ex.forEach((e, i) => {
    const st = Object.assign({}, BASE_ST, e[2], { t: 0.4 + i * 0.21 });
    const N = neckPose(st.neck);
    const tgt = [N.H[0] + 0.09, N.H[1] - 0.045, 0];
    renderStill(sheetView(st, orbit(0.34, 0.02, 1.38, tgt, 30), { eye: e[1] }));
    const x = i * 768;
    g.drawImage(glCanvas, 420, 0, 1080, 1080, x + 8, 280, 752, 752);
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(x + 8, 976, 752, 56); label(g, e[0], x + 384, 1004, 30);
  });
  // 2. pedal cycle with contact report
  heavyText(g, '2 · PEDAL CYCLE · ONE FULL CRANK TURN, FEET ON PEDALS', 60, 1100, 44, { fill: '#ffbe3a', align: 'left' });
  for (let i = 0; i < 8; i++) {
    const th = i / 8 * TAU;
    const st = Object.assign({}, BASE_ST, { crank: th, t: 0.31 });
    const view = sheetView(st, { pos: [0.0, 0.50, 2.95], tgt: [0.0, 0.50, 0], fov: 30 });
    renderStill(view);
    const x = (i % 4) * 960, y = 1150 + Math.floor(i / 4) * 640;
    g.drawImage(glCanvas, 160, 70, 1600, 920, x + 6, y, 948, 545);
    const cm = camMatrices(view.cam);
    for (const [key, col, side] of [['footR', '#ff2d55', 1], ['footL', '#2d7dff', -1]]) {
      const pf = pedalFrame(th, side);
      const p = project(cm, [pf.P[0], pf.P[1], pf.P[2]]);
      const sx = x + 6 + (p[0] - 160) * 948 / 1600, sy = y + (p[1] - 70) * 545 / 920;
      g.strokeStyle = col; g.lineWidth = 5; g.beginPath(); g.arc(sx, sy, 15, 0, TAU); g.stroke(); g.beginPath(); g.moveTo(sx - 24, sy); g.lineTo(sx + 24, sy); g.moveTo(sx, sy - 24); g.lineTo(sx, sy + 24); g.stroke();
    }
    const rep = contactReport(th);
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(x + 6, y + 548, 948, 74);
    label(g, 'CRANK ' + Math.round(i * 45) + ' DEG · WHEEL ' + Math.round(i * 45 * BG.gear) + ' DEG', x + 480, y + 570, 24);
    label(g, 'SOLE GAP R ' + rep.footR.toFixed(1) + ' / L ' + rep.footL.toFixed(1) + ' MM · LEG REACH ' + Math.round(rep.reachR * 100) + '% / ' + Math.round(rep.reachL * 100) + '%', x + 480, y + 602, 20, '#7a1740');
  }
  // 3. contact close-ups
  heavyText(g, '3 · CONTACT POINTS UP CLOSE', 60, 2480, 44, { fill: '#ffbe3a', align: 'left' });
  const closes = [
    ['WING FINGERS WRAP THE BAR', { pos: [1.02, 1.04, 0.86], tgt: [0.585, 0.89, 0.19], fov: 27 }, { crank: 0.55 }],
    ['WEBBED FOOT ON PEDAL · CHAINRING', { pos: [0.40, 0.46, 0.90], tgt: [0.04, 0.30, 0.08], fov: 30 }, { crank: 0.2 }],
    ['SEATED ON THE SADDLE', { pos: [-0.55, 1.02, 1.55], tgt: [-0.17, 0.94, 0], fov: 30 }, { crank: 2.2 }],
    ['CHAIN · COG · SPOKES', { pos: [-0.54, 0.45, 1.05], tgt: [-0.33, 0.33, 0], fov: 32 }, { crank: 1.0 }]
  ];
  closes.forEach((c, i) => {
    renderStill(sheetView(Object.assign({}, BASE_ST, c[2]), c[1]));
    const x = i * 960;
    g.drawImage(glCanvas, 240, 0, 1440, 1080, x + 6, 2530, 948, 640);
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(x + 6, 3122, 948, 50); label(g, c[0], x + 480, 3147, 24);
  });
  return cv.toDataURL('image/png');
};

// measure contact points from the real vertex buffers
function contactReport(theta) {
  const mb = MESHES[3].reset(); const out = { spokes: [], anchors: {}, legs: {} };
  buildPelican(mb, out, Object.assign({}, BASE_ST, { crank: theta }));
  const res = {};
  const partVerts = pred => { const a = []; for (let i = 0; i < mb.nv; i++) { const o = i * VSTR; if (pred(mb.v[o + 9])) a.push([mb.v[o], mb.v[o + 1], mb.v[o + 2]]); } return a; };
  for (const [key, side, parts] of [['footR', 1, [63, 64, 65]], ['footL', -1, [73, 74, 75]]]) {
    const pf = pedalFrame(theta, side); let minY = 1e9, penetr = 0, over = 0;
    for (const p of partVerts(q => parts.includes(q))) {
      const d = sub(p, pf.P), lx = dot(d, pf.ex), ly = dot(d, pf.ey), lz = d[2];
      if (Math.abs(lx) <= 0.050 && Math.abs(lz) <= 0.042 && ly > -0.002) { minY = Math.min(minY, ly - BG.pedalH); over++; }
    }
    res[key] = minY * 1000; res[key + 'Verts'] = over;
  }
  res.reachR = out.legs.footR.reach; res.reachL = out.legs.footL.reach;
  // fingers vs bar tape surface (tape radius 15.2 mm)
  for (const [key, side, parts] of [['gripR', 1, [15, 16, 17, 18]], ['gripL', -1, [55, 56, 57, 58]]]) {
    const G = [BG.grip[0], BG.grip[1], side * BG.grip[2]], ax = BG.gripAxis; let m = 1e9, near = 0;
    for (const p of partVerts(q => parts.includes(q))) { const d = sub(p, G), along = dot(d, ax); if (Math.abs(along) > 0.06) continue; const r = vlen(sub(d, mul(ax, along))) - 0.0152; m = Math.min(m, r); if (r < 0.006) near++; }
    res[key] = m * 1000; res[key + 'Near'] = near;
  }
  // body resting on saddle
  let mb1 = 1e9; for (const p of partVerts(q => q === 1)) if (p[0] > BG.saddleX - 0.09 && p[0] < BG.saddleX + 0.12 && Math.abs(p[2]) < 0.045) mb1 = Math.min(mb1, p[1]);
  res.saddle = (mb1 - BG.saddleTop) * 1000;
  // leg clearance to frame tubes and front wheel
  const L = out.legs; let clear = 1e9;
  const seat = [[BG.BB, BG.ST, 0.0175], [BG.BB, BG.HTB, 0.020], [BG.ST, BG.HTT, 0.016]];
  for (const k of ['footR', 'footL']) { const g = L[k]; for (const [a, b, r] of seat) { clear = Math.min(clear, segDist(g.J, g.A, a, b) - r - 0.022, segDist(g.K, g.J, a, b) - r - 0.026); } }
  res.legFrameClear = clear * 1000;
  let toe = 1e9; for (const p of partVerts(q => [63, 64, 65, 73, 74, 75].includes(q))) { const ring = Math.hypot(p[0] - BG.FA[0], p[1] - BG.FA[1]) - (BG.tireOut - BG.tireR); toe = Math.min(toe, Math.hypot(ring, p[2]) - BG.tireR); }
  res.toeWheelClear = toe * 1000;
  return res;
}
window.verifyRig = () => {
  const agg = {}; const upd = (k, v) => { if (!agg[k]) agg[k] = [v, v]; agg[k][0] = Math.min(agg[k][0], v); agg[k][1] = Math.max(agg[k][1], v); };
  for (let d = 0; d < 360; d += 5) { const r = contactReport(d * D2R); for (const k in r) upd(k, r[k]); }
  const round = {}; for (const k in agg) round[k] = agg[k].map(v => Math.round(v * 1000) / 1000);
  // drivetrain consistency
  const dt = 0.37, travel = dt * BG.ringR;
  round.drivetrain = { gear: BG.gear, ringRadius: +BG.ringR.toFixed(4), cogRadius: +BG.cogR.toFixed(4), chainTravelPerRadCrank_mm: +(travel / dt * 1000).toFixed(2), cogTravelPerRadCrank_mm: +(BG.gear * BG.cogR * 1000).toFixed(2), chainLoop_m: +CHAIN.L.toFixed(4) };
  const mb = MESHES[3].reset(); const out = { spokes: [], anchors: {}, legs: {} }; buildBike(mb, out, { crank: 0.4, wheel: 1.0 });
  let low = 1e9; for (let i = 0; i < mb.nv; i++) { const o = i * VSTR; if (mb.v[o + 9] === 212 || mb.v[o + 9] === 213) low = Math.min(low, mb.v[o + 1]); }
  round.tireLowestPoint_mm = +(low * 1000).toFixed(3);
  const lineD = (p, a, b) => segDist(p, p, a, b);
  round.frontTyreToDownTube_mm = +((lineD(BG.FA, BG.BB, BG.HTB) - BG.tireOut - 0.020) * 1000).toFixed(1);
  round.rearTyreToSeatTube_mm = +((lineD(BG.RA, BG.BB, BG.ST) - BG.tireOut - 0.0175) * 1000).toFixed(1);
  return round;
};

// ---------- film ----------
window.DURATION = typeof TL !== 'undefined' ? TL.DURATION : 0;
window.renderAt = t => {
  meshUse = 0;
  const frame = filmFrame(clamp(t, 0, window.DURATION - 1 / 240));
  R.render(frame);
};
window.CUTS = typeof TL !== 'undefined' ? TL.cuts() : [];
window.TIMELINE = typeof TL !== 'undefined' ? TL : null;

// live preview when opened directly (silent: the page loads no media)
if (!/capture/.test(location.search) && typeof filmFrame === 'function') {
  let t0 = null, paused = false, tcur = 0;
  const loop = ts => { if (t0 === null) t0 = ts - tcur * 1000; if (!paused) tcur = ((ts - t0) / 1000) % window.DURATION; window.renderAt(Math.floor(tcur * 24) / 24); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; t0 = null; e.preventDefault(); } if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { tcur = (tcur + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 / 24 : 1.5) + window.DURATION) % window.DURATION; t0 = null; } });
  glCanvas.addEventListener('click', e => { const r = glCanvas.getBoundingClientRect(); tcur = (e.clientX - r.left) / r.width * window.DURATION; t0 = null; });
}
window.READY = true;

}catch(e){window.FAILED=String(e&&e.stack||e);console.error(window.FAILED);}
