function fillD(ctx, d, color) { ctx.fillStyle = color; ctx.fill(new Path2D(d)); }

  glow(ctx, x, y + r * .25, r * 3.4, col, .34 * clamp(k * 2));
  if (g) glow(g, x, y + r * .2, r * 5, col, .75 * clamp(k * 2));
  ctx.strokeStyle = rgba(col, .9 * clamp(k * 3)); ctx.lineWidth = Math.max(1.4, r * .075);
  ctx.beginPath(); ctx.arc(x, y, r * 1.65 * pop, -.5 * Math.PI, -.5 * Math.PI + TAU * clamp(k * 1.5)); ctx.stroke();
  const ping = clamp(k * 1.3);
  if (ping < 1) { ctx.strokeStyle = rgba(col, (1 - ping) * .7); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * (1.7 + ping * 2.6), 0, TAU); ctx.stroke(); }
}
// splash ring and crown when a falling drop lands
function splash(ctx, g, x, y, u, s = 1) {
  if (u < 0 || u > .75) return;
  const k = E.outCubic(u / .75), a = 1 - u / .75;
  ctx.strokeStyle = rgba('#eaffff', a); ctx.lineWidth = 3.5 * s * a + .6;
  ctx.beginPath(); ctx.ellipse(x, y, (10 + 90 * k) * s, (4 + 28 * k) * s, 0, 0, TAU); ctx.stroke();
  for (let i = 0; i < 11; i++) {
    const an = -Math.PI + (i + .5) / 11 * Math.PI, sp = 70 + hash(i + 40) * 80;
    const px = x + Math.cos(an) * sp * k * s, py = y + (Math.sin(an) * sp * k + 130 * k * k) * s;
    drawDrop(ctx, px, py, (3.2 + hash(i) * 3) * s * a, 0, a, '#e8fbff');
  }
  if (g) glow(g, x, y, 90 * s, '#bff6ff', .7 * a);
}

// ===== src/50_bg.js =====
// ---------------------------------------------------------------------------
// painted backgrounds: cumulus skies (shader), nebulae (shader), city, rooftop
// ---------------------------------------------------------------------------
const FS_SKY = `
uniform vec3 uC0,uC1,uC2,uC3,uC4; uniform vec3 uPos;
uniform vec4 uPuff[220]; uniform float uNP;
uniform vec3 uDeep0,uShade0,uLit0,uHi0, uHaze;
uniform vec4 uSun; uniform vec3 uSunCol; uniform vec3 uL; uniform float uStars, uSeed, uWisp; uniform vec3 uWispCol;
vec3 grad(float y){
  if(y<uPos.x) return mix(uC0,uC1,smoothstep(0.,uPos.x,y));
  if(y<uPos.y) return mix(uC1,uC2,(y-uPos.x)/(uPos.y-uPos.x));
  if(y<uPos.z) return mix(uC2,uC3,(y-uPos.y)/(uPos.z-uPos.y));
  return mix(uC3,uC4,smoothstep(uPos.z,1.,y));
}
void main(){
  vec2 p = vec2(uv.x, 1.-uv.y) * uRes;         // pixel coords, y down
  vec2 q = p / uRes.y;
  float y = p.y/uRes.y;
  vec3 col = grad(y + (fbm3(q*vec2(1.5,5.)+uSeed)-.5)*.045);
  // brush grain in the open sky
  col *= 1. + (fbm(q*vec2(5.,22.)+uSeed*2.)-.5)*.07;
  // sun glow
  float sd = length((p - uSun.xy)/uRes.y);
  col += uSunCol * uSun.w * (exp(-sd*sd*18.)*.55 + exp(-sd*3.2)*.38);
  col = mix(col, uSunCol*1.15, smoothstep(uSun.z/uRes.y, uSun.z/uRes.y*.9, sd)*step(.5,uSun.z));
  // stars, thinning toward the horizon
  if(uStars>0.001){
    for(int k=0;k<2;k++){
      float cell = k==0 ? 26. : 64.;
      vec2 id = floor(p/cell); float r = h21(id+uSeed+float(k)*17.);
      if(r>.72){
        vec2 c = (id+.2+.6*vec2(h21(id+3.1),h21(id+7.7)))*cell;
        float d = length(p-c);
        float s = (k==0?1.1:1.9)*(.5+h21(id+9.));
        col += vec3(.85,.9,1.) * smoothstep(s,0.,d) * uStars * (1.-smoothstep(.25,.72,y)) * (.4+.6*h21(id+1.7));
      }
    }
  }
  // high wisps of cirrus
  if(uWisp>0.001){
    vec2 w = vec2(q.x*1.4 + q.y*1.1, q.y*7.5 - q.x*.7);
    float n = fbm(w + vec2(fbm(w*.7)*1.8, 0.) + uSeed);
    float a = smoothstep(.52,.82,n) * smoothstep(.0,.12,y) * (1.-smoothstep(.45,.8,y));
    col = mix(col, uWispCol, a*uWisp);
  }
  // three banks of cumulus, back to front
  vec2 wp = p + (vec2(fbm(p/110.+uSeed), fbm(p/110.+31.+uSeed))-.5)*54.
              + (vec2(fbm(p/34.+7.), fbm(p/34.+13.))-.5)*19.
              + (vec2(vn(p/11.), vn(p/11.+5.))-.5)*5.;
  for(int bank=0; bank<3; bank++){
    float alpha=0., hmax=0., wsum=0.; vec3 nsum=vec3(0.); float basey=0.; float topy=1e5;
    for(int i=0;i<220;i++){
      if(float(i)>=uNP) break;
      vec4 f = uPuff[i];
      int b = int(floor(f.w));
      if(b!=bank) continue;
      float base = fract(f.w)*2000.;
      vec2 d = (wp - f.xy);
      float L = length(d); float r = f.z;
      float a = smoothstep(r+2.5, r-2.5, L);
      // cumulus have flat bases
      a *= 1. - smoothstep(base-26., base+16., wp.y + (fbm3(p/70.)-.5)*44.);
      if(a<=0.) continue;
      alpha = max(alpha, a);
      float h = sqrt(max(r*r - L*L, 0.));
      float wgt = exp(h/13.);
      nsum += wgt * normalize(vec3(d/r, h/r+.05)); wsum += wgt;
      basey = base; topy = min(topy, f.y - r);
    }
    if(alpha<=0.) continue;
    vec3 n = normalize(nsum/max(wsum,1e-6));
    float lum = dot(vec3(n.x, n.y, n.z), normalize(uL));
    lum += (fbm(p/58.+float(bank)*9.)-.5)*.46 + (fbm(p/19.)-.5)*.16;
    float hb = clamp((basey - p.y)/max(basey-topy,1.), 0., 1.);
    lum += (hb-.5)*.38;
    vec3 c = mix(uDeep0, uShade0, smoothstep(-.20,-.10,lum));
    c = mix(c, mix(uShade0,uLit0,.45), smoothstep(.16,.21,lum));
    c = mix(c, uLit0, smoothstep(.36,.42,lum));
    c = mix(c, uHi0, smoothstep(.70,.78,lum));
    // warm bounce from the horizon on the flat base
    c = mix(c, uHaze, (1.-smoothstep(0.,.28,hb))*.42);
    float far = bank==0 ? .46 : bank==1 ? .20 : .0;
    c = mix(c, grad(y), far);
    col = mix(col, c, alpha*(bank==0?.93:1.));
  }
  // horizon haze
  col = mix(col, uHaze, smoothstep(.70,1.0,y)*.35);
  col += (h21(p+uSeed)-.5)/140.;
  O = vec4(col,1.);
}`;

// build a cumulonimbus out of puffs. bank 0 = far, 2 = near
function cloudTower(R, cx, base, wdt, hgt, bank, out) {
  const bw = bank + base / 2000;
  const nBig = 7;
  for (let i = 0; i < nBig; i++) {
    const s = i / (nBig - 1);
    const r = lerp(wdt * .27, wdt * .15, s) * R.range(.85, 1.15);
    const x = cx + R.range(-.22, .22) * wdt * (1 - s * .5) + Math.sin(s * 3.1) * wdt * .07;
    const y = base - r * .45 - s * (hgt - r);
    out.push([x, y, r, bw]);
    for (let k = 0; k < 3; k++) {
      const a = R.range(-Math.PI * .95, -Math.PI * .05), rr = r * R.range(.34, .56);
      const px = x + Math.cos(a) * r * .86, py = y + Math.sin(a) * r * .8;
      out.push([px, py, rr, bw]);
      for (let j = 0; j < 2; j++) {
        const a2 = a + R.range(-1.1, 1.1);
        out.push([px + Math.cos(a2) * rr * .88, py + Math.sin(a2) * rr * .86, rr * R.range(.3, .5), bw]);
      }
    }
  }
  // spreading skirt
  for (let i = 0; i < 9; i++) {
    const s = i / 8 * 2 - 1, r = wdt * R.range(.09, .2) * (1 - Math.abs(s) * .35);
    out.push([cx + s * wdt * .62, base - r * .3, r, bw]);
  }
}
const SKIES = {

// a painted sky, cached at w x h. cloud coords are authored for 1920x1080.
function paintedSky(name, w = 2240, h = 1260) {
  const S = SKIES[name];
  return Painter.still(`sky:${name}:${w}x${h}`, 'sky', FS_SKY, w, h, () => {
    const R = rng(S.seed * 77 + 5), puffs = [], k = h / 1080, ox = (w - 1920 * k) / 2;
    for (const [cx, base, wd, hg, bank] of S.towers) cloudTower(R, cx, base, wd, hg, bank, puffs);
    const arr = new Float32Array(220 * 4), n = Math.min(220, puffs.length);
    for (let i = 0; i < n; i++) {
      const p = puffs[i], bank = Math.floor(p[3]), base = (p[3] - bank) * 2000;
      arr.set([p[0] * k + ox, p[1] * k, p[2] * k, bank + (base * k) / 2000], i * 4);
    }
    const [c0, c1, c2, c3, c4] = S.cols.map(vec3);
    return {
      uC0: c0, uC1: c1, uC2: c2, uC3: c3, uC4: c4, uPos: S.pos, 'uPuff[0]': { v4: arr }, uNP: n,
      uDeep0: vec3(S.deep), uShade0: vec3(S.shade), uLit0: vec3(S.lit), uHi0: vec3(S.hi), uHaze: vec3(S.haze),
      uSun: [S.sun[0] * k + ox, S.sun[1] * k, S.sun[2] * k, S.sun[3]], uSunCol: vec3(S.sunCol), uL: S.L, uStars: S.stars, uSeed: S.seed, uWisp: S.wisp, uWispCol: vec3(S.wispCol),
    };
  });
}
// draw a cached sky with parallax pan and zoom. (px,py) in screen pixels.
function drawSky(ctx, name, px = 0, py = 0, z = 1) {
  const c = paintedSky(name);
  ctx.drawImage(c, W / 2 - c.width * z / 2 + px, H / 2 - c.height * z / 2 + py, c.width * z, c.height * z);
}

const FS_NEBULA = `
uniform vec3 uBg,uA,uB,uC; uniform float uSeed, uScale, uStars, uAmt;
void main(){
  vec2 p = vec2(uv.x,1.-uv.y)*uRes; vec2 q = p/900.*uScale + uSeed;
  vec2 w1 = vec2(fbm(q), fbm(q+vec2(5.2,1.3)));
  vec2 w2 = vec2(fbm(q+2.4*w1+vec2(1.7,9.2)), fbm(q+2.4*w1+vec2(8.3,2.8)));
  float n = fbm(q + 2.2*w2);
  vec3 col = uBg;
  col = mix(col, uA, smoothstep(.34,.72,n)*uAmt);
  col = mix(col, uB, smoothstep(.55,.92,w2.x)*.85*uAmt);
  col = mix(col, uC, smoothstep(.62,.95,w1.y*n*1.55)*.75*uAmt);
  col *= .86 + .3*smoothstep(.3,.7,fbm(q*3.1));
  for(int k=0;k<3;k++){
    float cell = k==0?13.:(k==1?31.:97.);
    vec2 id = floor(p/cell); float r = h21(id+uSeed*3.+float(k)*11.);
    if(r > (k==2?.70:.80)){
      vec2 c = (id+.2+.6*vec2(h21(id+2.3),h21(id+6.1)))*cell;
      float s = (k==0?.9:(k==1?1.5:2.6))*(.55+h21(id+4.4));
      float d = length(p-c);
      vec3 tint = mix(vec3(.75,.86,1.), vec3(1.,.9,.74), h21(id+8.8));
      col += tint * (smoothstep(s,0.,d) + (k==2? exp(-d*.28)*.4 : 0.)) * uStars * (.35+.65*h21(id+5.5));
    }
  }
  O = vec4(col,1.);
}`;
const NEBULAE = {
  deep: { bg: '#050824', a: '#17255e', b: '#3a1f6e', c: '#1f6f8f', seed: 2.1, scale: 1.15, stars: 1, amt: 1 },

// ---- city ------------------------------------------------------------------
const CITY_STYLE = {
  blueHour: { layers: ['#6a5596', '#41377a', '#241f55'], win: ['#ffd58a', '#ffb26e', '#bfeaff'], haze: '#c9789a', lit: 1 },
  dusk: { layers: ['#3b316f', '#262257', '#141238'], win: ['#ffcf86', '#ff9e78', '#a8dcff'], haze: '#7a4c84', lit: 1.1 },
  night: { layers: ['#1a2260', '#111749', '#090c30'], win: ['#ffd790', '#8fd6ff', '#ff9ab8'], haze: '#2b377c', lit: 1.15 },
  dawn: { layers: ['#b79cc4', '#8776ad', '#585089'], win: ['#fff1c2', '#ffd9a0', '#ffffff'], haze: '#ffd4b0', lit: .3 },
};
function cityLayer(style, depth, w = 2240, h = 620) {
  return layer(`city:${style}:${depth}`, w, h, x => {
    const S = CITY_STYLE[style], R = rng(500 + depth * 91);
    const col = S.layers[depth], baseTop = [250, 330, 430][depth], varh = [150, 190, 170][depth];
    let px = -20;
    while (px < w + 20) {
      const bw = R.range(36, 120) * (1 + depth * .28), top = baseTop - R.range(-40, varh) * (R() < .13 ? 1.55 : .75);
      rect(x, px, top, bw + 1.5, h - top, col);
      // side face one tone darker, a lit edge facing the low sun
      rect(x, px, top, bw * R.range(.16, .34), h - top, rgba('#0b0a2c', .22));
      rect(x, px + bw - 2.5, top, 2.5, h - top, rgba(S.haze, .5));
      // roof furniture
      if (R() < .5) rect(x, px + bw * R.range(.1, .5), top - R.range(6, 20), bw * R.range(.2, .45), 22, col);
      if (R() < .22) { rect(x, px + bw * .5, top - R.range(24, 80), 2.2, 80, col); dot(x, px + bw * .5 + 1, top - 48, 2.2, '#ff6b78'); }
      const cw = [4, 6, 8][depth], ch = [5, 8, 11][depth], gx = [8, 12, 17][depth], gy = [10, 15, 21][depth];
      const style2 = R.int(0, 2), wc = R.pick(S.win);
      for (let yy = top + 8; yy < h - 6; yy += gy) {
        const rowLit = R() < .72;
        for (let xx = px + 6; xx < px + bw - cw - 4; xx += gx) {
          const p = style2 === 2 ? .5 : .2;
          if (rowLit && R() < p * S.lit) rect(x, xx, yy, style2 === 2 ? gx - 1.5 : cw, style2 === 2 ? ch * .45 : ch, rgba(R() < .8 ? wc : R.pick(S.win), R.range(.4, .95)));
          else if (R() < .25) rect(x, xx, yy, cw, ch, rgba(S.haze, .13));
        }
      }
      px += bw + R.range(-4, 9);
    }
    // haze pooling at the foot of each layer
    x.globalCompositeOperation = 'source-atop';
    rect(x, 0, 0, w, h, linGrad(x, 0, 240, 0, h, [[0, rgba(S.haze, 0)], [1, rgba(S.haze, [.7, .45, .16][depth])]]));
    x.globalCompositeOperation = 'source-over';
  });
}
// street-level glow plus three skyline layers; (px) pans with parallax
function drawCity(ctx, g, style, o = {}) {
  const base = o.base ?? 1080, px = o.px ?? 0, py = o.py ?? 0, z = o.z ?? 1;
  for (let d = 0; d < 3; d++) {
    const c = cityLayer(style, d), par = [.35, .62, 1][d];
    const w = c.width * z, h = c.height * z;
    ctx.drawImage(c, W / 2 - w / 2 + px * par, base - h + [-30, 20, 70][d] * z + py * par, w, h);
  }
  const S = CITY_STYLE[style];
  const R = rng(77);
  for (let i = 0; i < 26; i++) {
    const x = R.range(0, W) + px * .8, y = base - R.range(20, 150) + py * .8, c = R.pick(S.win);
    glow(ctx, x, y, R.range(14, 46), c, .28 * S.lit);
    if (g && i % 2 === 0) glow(g, x, y, R.range(10, 26), c, .4 * S.lit);
  }
}

// ---- soft-focus city bokeh for close shots -------------------------------------
function bokehPlate(name, sky, tint) {
  return layer('bokehplate:' + name, 2240, 1260, x => {
    const tmp = CV(2240, 1260);
    const tx = C2D(tmp);
    tx.drawImage(paintedSky(sky), 0, 0);
    tx.drawImage(cityLayer(sky === 'dawn' ? 'dawn' : sky === 'night' ? 'night' : sky === 'dusk' ? 'dusk' : 'blueHour', 1), 0, 740);
    x.filter = 'blur(16px)';
    x.drawImage(tmp, -20, -20, 2280, 1300);
    x.filter = 'none';
    const R = rng(name.length * 131 + 9);
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 150; i++) {
      const bx = R.range(0, 2240), by = R.range(760, 1240), r = R.range(9, 46), c = R.pick(tint);
      x.globalAlpha = R.range(.05, .24);
      dot(x, bx, by, r, c);
      x.strokeStyle = c; x.lineWidth = 2; x.beginPath(); x.arc(bx, by, r, 0, TAU); x.stroke();
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  });
}
function drawBokeh(ctx, name, sky, tint, px = 0, py = 0, z = 1) {
  const c = bokehPlate(name, sky, tint);
  ctx.drawImage(c, W / 2 - c.width * z / 2 + px, H / 2 - c.height * z / 2 + py, c.width * z, c.height * z);
}

// the ledge top is at y = 872 in a 2240-wide layer centred on the frame
function rooftopLayer(mood) {
  const M = mood === 'dawn'
    ? { conc: '#6d6299', top: '#b7a0c0', edge: '#ffe2bc', dark: '#463e77', metal: '#574d86', rim: '#ffd9a6', puddle: '#ffd3b8' }

  return layer('rooftop:' + mood, 2240, 1180, x => {
    const R = rng(808);
    // water tank on stilts, left

    g.save(); g.setTransform(gb); g.globalAlpha = .62 * alpha * (o.aura ?? 1) * (1 - (o.dim ?? 0) * .7); g.drawImage(au, 0, 0); g.restore();
  }
  // interior: a window onto deep space, drifting against the silhouette
  const neb = nebula('ma');
  const inner = o.inner ?? [0, 0];
  bx.drawImage(neb, -160 + o.x * .08 + inner[0] - Math.sin(t * .11) * 40, -90 + o.y * .08 + inner[1] - Math.cos(t * .09) * 24);
  if (o.interiorTint) { bx.globalCompositeOperation = 'source-atop'; rect(bx, 0, 0, W, H, o.interiorTint); }
  bx.globalCompositeOperation = 'destination-in'; bx.drawImage(mask, 0, 0);
  bx.globalCompositeOperation = 'source-atop';
  bx.save(); setT(bx); maNetwork(bx, t, o); bx.restore();
  // directional rim light: mask minus a shifted copy
  const rimPass = (dx, dy, color, al) => {
    rx.globalCompositeOperation = 'source-over'; rx.clearRect(0, 0, W, H); rx.drawImage(mask, 0, 0);
    rx.globalCompositeOperation = 'destination-out'; rx.drawImage(mask, dx, dy);
    rx.globalCompositeOperation = 'source-in'; rect(rx, 0, 0, W, H, color);
    bx.globalAlpha = al; bx.drawImage(rim, 0, 0); bx.globalAlpha = 1;
  };
  const rw = 13 * clamp(s, .45, 1.6);
  rimPass(rw * .9, rw * .75, '#8fd9ff', .66 * (1 - (o.dim ?? 0) * .6));
  rimPass(-rw * .8, -rw * .5, o.warm ?? '#ff9fc6', .5);
  if (o.dim) { bx.globalCompositeOperation = 'source-atop'; rect(bx, 0, 0, W, H, `rgba(3,5,18,${o.dim * .55})`); }
  ctx.save(); ctx.globalAlpha *= alpha; ctx.drawImage(body, 0, 0);
  setT(ctx); maEyes(ctx, g, gb.multiply(MT), opt); ctx.restore();
  ring(true);
}

function profileEye(ctx, C, e) {
  const k = clamp(e.k ?? 0), happy = e.mode === 'happy';
  const OPEN = [[100, -14], [118, -33], [146, -43], [170, -41], [185, -29]];
  const SHUT = happy ? [[104, 6], [124, -12], [146, -17], [166, -12], [182, 4]] : [[103, -4], [122, 10], [146, 16], [166, 13], [183, 1]];
  const top = spline(OPEN.map((p, i) => mix2(p, SHUT[i], k)), 8);
  const bot = spline([[104, -16], [123, 9], [147, 22], [168, 15], [181, -24]], 8);
  if (k < .8 && !happy) {
    ctx.save(); polyPath(ctx, top.concat(bot.slice().reverse())); ctx.clip();
    rect(ctx, 90, -60, 110, 100, C.sclera);
    const gx = e.gx ?? 0, gy = e.gy ?? 0;
    ell(ctx, 164 + gx, -8 + gy, 15, 28, '#0d2140');

    ell(ctx, 166 + gx, -8 + gy, 4.6, 9, '#060b18');
    ell(ctx, 157 + gx, -19 + gy, 6.5, 8, '#ffffff', -.4);
    dot(ctx, 171 + gx, 8 + gy, 3, 'rgba(255,255,255,0.9)');
    fillPoly(ctx, top.concat(offsetY(top, () => 13).reverse()), 'rgba(40,20,70,0.38)');
    ctx.restore();
    taper(ctx, spline([[122, 12], [146, 23], [165, 19]], 8), 3.6, { color: C.line, t0: .5, t1: .5 });
  }
  taper(ctx, top, 13 - k * 3, { color: C.line, t0: .28, t1: .16, min: .25 });
  const back = top[0];
  taper(ctx, spline([[back[0] + 14, back[1] - 5], [back[0], back[1]], [back[0] - 14, back[1] + 4 - k * 2]], 6), 8, { color: C.line, t0: 0, t1: .8 });
  const dir = lerp(-1, 1, clamp(k * 1.2 - .2)) * (happy ? -1 : 1);
  [[.14, 14], [.3, 17], [.82, 9]].forEach(([s, L]) => {
    const p = ptAt(top, s);
    taper(ctx, [p, [p[0] - L * .45, p[1] + dir * L * .35], [p[0] - L, p[1] + dir * L * .62]], 5.4, { color: C.line, t0: 0, t1: .9 });
  });
}

// a sleeve or limb: filled capsule with its own shade and outline
function limbCel(ctx, pts, w0, w1, base, shade, line, lw = 5.5) {
  const P = spline(pts, 14);
  const draw = (c, grow, off = 0) => {
    ctx.fillStyle = c;
    const Q = off ? P.map(p => [p[0] - off * .5, p[1] + off]) : P;
    taper(ctx, Q, w0 + grow, { t0: 0, t1: 0, wf: s => lerp(1, (w1 + grow) / (w0 + grow), s) });
    for (const [p, r] of [[Q[0], (w0 + grow) / 2], [Q[Q.length - 1], (w1 + grow) / 2]]) { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill(); }
  };
  draw(line, lw * 2);
  draw(base, 0);
  // shade: the lower half of the limb
  const [lc, lx] = scratch('limb');
  lx.setTransform(ctx.getTransform());
  lx.fillStyle = shade;
  taper(lx, P, w0, { t0: 0, t1: 0, wf: s => lerp(1, w1 / w0, s) });
  lx.globalCompositeOperation = 'destination-out'; lx.fillStyle = '#000';

}

/**

// ---------------------------------------------------------------------------
// act one (0 - 28 s): the hook, the freeze, the roof, the waiting, the guessing
// While the world is frozen, Nagi is drawn from a frozen clock (NF). Only MA
// keeps moving.
// ---------------------------------------------------------------------------
const NF = FREEZE_T;                       // Nagi's clock while time is stopped
const BOKEH_WARM = ['#ffcf8a', '#ff9d86', '#bfe6ff'];

// the blink that starts the film, on twos: it freezes half way down
function hookLid(t) {
  const d = on2(Math.min(t, FREEZE_T));
  const K = [[0, 0], [1.50, 0], [1.583, .07], [1.667, .17], [1.75, .30], [1.833, .41], [1.917, .47], [2.0, .5]];
  for (let i = K.length - 1; i >= 0; i--) if (d >= K[i][0] - 1e-3) return K[i][1];
  return 0;
}
// the one matched framing of her eye: first frame, freeze, and the 45 s reveal
const MATCH = { x: 960, y: 590, s: 1.16 };

// how many years MA has lived inside this one blink
function yearsAt(t) {
  const K = [[2, 0], [5, 190], [11, 912], [15, 1740], [21, 3050], [27, 4420], [28, 4700], [40, 7900], [46, 9000]];
  for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) return lerp(K[i][1], K[i + 1][1], inv(K[i][0], K[i + 1][0], t));
  return 9000;
}
const commas = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
function yearHud(ctx, t, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const x = 74, y = 64;
  rect(ctx, x - 20, y - 4, 4, 70, 'rgba(160,235,255,0.85)');
  type(ctx, 'YEAR ' + commas(yearsAt(t)), x, y, { size: 30, bold: true, weight: 5.4, track: 5, align: 'left', color: '#eaf9ff', shadow: { color: 'rgba(5,6,28,0.6)', y: 3, grow: 3 } });
  type(ctx, 'of this blink', x, y + 44, { size: 21, weight: 2.3, track: 4.5, align: 'left', color: '#c6d6ff', shadow: { color: 'rgba(5,6,28,0.55)', y: 2, grow: 3 } });
  ctx.restore();
}
function coolFreezeGrade(P, k) { P.sat = lerp(P.sat, .9, k); P.lift = [0, .004 * k, .03 * k]; P.gain = [lerp(1, .95, k), 1, lerp(1, 1.05, k)]; }

// ------------------------------------------------------------ 0.0 - 2.0  hook
shot('hook', 0, 2, S => {
  const { ctx, g, t, u, P } = S;
  const push = 1 + .055 * E.inOutSine(inv(0, 2, t));
  drawECU(ctx, t, { x: MATCH.x, y: MATCH.y, s: MATCH.s * push, lid: hookLid(t), ma: .9, gaze: [t > .62 ? 7 : 0, t > .62 ? 2 : 0], pupil: 1 + .05 * Math.sin(t * 2.2), drops: true });
  rainField(ctx, g, t, { seed: 77, n: 420, focus: 1.5, near: .65, far: 5, alpha: .8, xs: 6, ys: 5, fall: 8, size: .8 });
  P.bloom = .42; P.thresh = .8; P.vig = .5;
  slam(ctx, 'YOU BLINK.', 960, 884, t, .16, { size: 134, stagger: .026 });
});

// ------------------------------------------------------------ 2.0 - 5.0  freeze
impact(2.0, 2, 1, '#0a0622', '#eef4ff');
shot('freeze', 2, 5, S => {
  const { ctx, g, t, u, P } = S;
  const settle = 1 + .13 * Math.exp(-u * 9) + .028 * (u / 3);
  const [sx, sy] = shake(t, 2.0, 30, 6.5);
  P.shake = [sx, sy];
  drawECU(ctx, t, { x: MATCH.x, y: MATCH.y, s: MATCH.s * 1.045 * settle, lid: .5, ma: .9, still: true, gaze: [7, 2] });
  const drift = E.outCubic(inv(2, 5, t));
  rainField(ctx, g, t, { seed: 77, n: 520, focus: 1.9, near: .65, far: 5, alpha: .95, xs: 6, ys: 5, size: .9, camz: drift * .22, camx: drift * .1 });
  if (u < .22) { ctx.save(); ctx.globalAlpha = 1 - u / .22; focusLines(ctx, 960, 590, { n: 150, r0: 640, color: '#f4f6ff', seed: drawNo(t), w: 12 }); ctx.restore(); }
  P.bloom = .45; P.thresh = .8; P.vig = .55; P.ca = 1.1 + 7 * Math.exp(-u * 7);
  coolFreezeGrade(P, inv(2.05, 2.6, t));

// ---- silhouettes with a one-sided rim light --------------------------------
function silhouette(ctx, draw, o = {}) {
  const [mask, mx] = scratch('silMask');
  mx.setTransform(ctx.getTransform()); mx.fillStyle = '#fff'; mx.strokeStyle = '#fff';
  draw(mx);
  const [body, bx] = scratch('silBody');
  bx.drawImage(mask, 0, 0); bx.globalCompositeOperation = 'source-in';
  rect(bx, 0, 0, W, H, o.fill ?? '#0d0b2c');
  const [rim, rx] = scratch('silRim');
  const rimPass = (dx, dy, color, a) => {
    rx.globalCompositeOperation = 'source-over'; rx.clearRect(0, 0, W, H); rx.drawImage(mask, 0, 0);
    rx.globalCompositeOperation = 'destination-out'; rx.drawImage(mask, dx, dy);
    rx.globalCompositeOperation = 'source-in'; rect(rx, 0, 0, W, H, color);
    bx.globalCompositeOperation = 'source-atop'; bx.globalAlpha = a; bx.drawImage(rim, 0, 0); bx.globalAlpha = 1;
  };
  const [dx, dy] = o.dir ?? [-8, 6];
  rimPass(dx, dy, o.rim ?? '#ffd9a0', 1);
  if (o.rim2) rimPass(-dx * .55, -dy * .55, o.rim2, .8);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(body, 0, 0); ctx.restore();
}
// her bob haircut, as a silhouette (r = head radius)
function bobPath(c, x, y, r, flow = 0) {
  c.save(); c.translate(x, y); c.scale(r / 100, r / 100);
  c.fill(new Path2D(`M 0 -128 C 86 -130 136 -64 130 24 C 128 66 138 90 ${156 + flow} 116 C 128 104 112 110 ${108 + flow * .6} 132 C 94 108 78 108 64 118 L 40 40 L -46 40 L -66 120 C -80 108 -96 108 ${-112 + flow * .6} 134 C -114 110 -132 106 ${-158 + flow} 116 C -140 90 -128 66 -130 24 C -136 -64 -86 -130 0 -128 Z`));
  c.restore();
}
// a posable figure. p: {head:[x,y,r], neck, hip, arms:[[a,b,c]..], legs:[..], coat, w}
function person(c, p) {
  const [hx, hy, hr] = p.head, w = p.w ?? 1;
  c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
  if (p.bob !== false) bobPath(c, hx, hy, hr, p.flow ?? 0);
  capsule(c, [[hx, hy + hr * .6], p.neck], hr * .62 * w, hr * .66 * w);

  if (p.coat) { c.beginPath(); const [a, b, d, e] = p.coat; c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.quadraticCurveTo((b[0] + d[0]) / 2, (b[1] + d[1]) / 2 + 24, d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath(); c.fill(); }
}

// [path, width, kind]  kind: 'v' upright, 'h' bar, 'hz' bar turning down,
// 'hg' bar turning down with a hook
// ---------------------------------------------------------------------------
const MA_KANJI = [
  // 門 left door
  { d: 'M 14.5 9 L 14.2 93', w: 6.2, k: 'v' },
  { d: 'M 16 12.6 L 40.6 12 L 40.4 47', w: 5.6, k: 'turn' },
  { d: 'M 16 27.6 L 38.6 27.2', w: 3.5, k: 'h' },
  { d: 'M 16 42.8 L 38.8 42.4', w: 3.5, k: 'h' },
  // 門 right door
  { d: 'M 59.6 10 L 59.4 47', w: 5.6, k: 'v' },
  { d: 'M 61 12.6 L 86 12 L 85.8 87 C 85.8 92.5 83 93.6 76.5 90.4', w: 5.8, k: 'hook' },
  { d: 'M 61 27.6 L 83.6 27.2', w: 3.5, k: 'h' },
  { d: 'M 61 42.8 L 83.8 42.4', w: 3.5, k: 'h' },
  // 日
  { d: 'M 35.8 53.4 L 35.6 91.6', w: 5.2, k: 'v' },
  { d: 'M 37.4 56 L 64.4 55.4 L 64.2 91', w: 5.2, k: 'turn' },
  { d: 'M 37.4 70.8 L 62.4 70.4', w: 3.4, k: 'h' },
  { d: 'M 37.4 85.8 L 62.4 85.4', w: 3.4, k: 'h' },
];
function brushStroke(ctx, st, p, color) {
  if (p <= 0) return;
  const pts = polyOf(st.d);
  // corners get a pressed shoulder, bars end on a small triangular rest
  const dense = [];
  for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 1.4)); for (let k = 0; k < n; k++) dense.push(mix2(a, b, k / n)); }
  dense.push(pts[pts.length - 1]);
  const wf = s => {
    if (st.k === 'v') return s < .08 ? 1.12 : s > .92 ? 1 - (s - .92) * 2.6 : 1 - .06 * Math.sin(s * Math.PI);
    if (st.k === 'h') return s < .1 ? 1.1 : s > .9 ? 1.18 : .9 + .08 * s;
    if (st.k === 'hook') return s > .93 ? Math.max(.14, 1 - (s - .93) * 12) : .96;
    return 1;
  };
  ctx.fillStyle = color;
  taper(ctx, dense, st.w, { t0: 0, t1: 0, wf, reveal: p });

  const q = dense[0], w0 = st.w;
  if (st.k === 'v') fillPoly(ctx, [[q[0] - w0 * .62, q[1] + w0 * .06], [q[0] + w0 * .3, q[1] - w0 * .5], [q[0] + w0 * .62, q[1] + w0 * .2], [q[0] + w0 * .5, q[1] + w0 * .8], [q[0] - w0 * .54, q[1] + w0 * .8]], color);
  else { ctx.beginPath(); ctx.ellipse(q[0] + w0 * .1, q[1], w0 * .5, w0 * .46, -.5, 0, TAU); ctx.fill(); }
  // shoulders at the turns
  const corners = parsePath(st.d)[0].filter(s => s[0] === 'L').slice(0, -1);
  if (st.k === 'turn' || st.k === 'hook') {
    const first = parsePath(st.d)[0][1];
    if (first && p > .42) { const [cx, cy] = [first[1], first[2]]; fillPoly(ctx, [[cx - st.w * .7, cy - st.w * .62], [cx + st.w * .28, cy - st.w * .86], [cx + st.w * .74, cy + st.w * .36], [cx - st.w * .2, cy + st.w * .62]], color); }
  }
  if (st.k === 'h' && p > .96) {
    const e = dense[dense.length - 1], w = st.w;
    fillPoly(ctx, [[e[0] - w * 1.25, e[1] - w * .46], [e[0] - w * .1, e[1] - w * 1.28], [e[0] + w * .85, e[1] + w * .12], [e[0] + w * .2, e[1] + w * .56], [e[0] - w * 1.2, e[1] + w * .46]], color);
  }
}
// draw(0..1): written stroke by stroke. size = box height in px, (x,y) = centre
function drawMaKanji(ctx, g, x, y, size, progress, o = {}) {
  const k = size / 100;
  const each = st => clamp(progress * (MA_KANJI.length + .6) - st);
  ctx.save(); ctx.translate(x - 50 * k, y - 51 * k); ctx.scale(k, k);
  // the sun in the gate
  const sun = o.sun ?? 0;
  if (sun > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(ctx, 50, 72, 48, '#ff8a3a', .5 * sun);
    ctx.restore();
    // two panes of low sun, deep enough that the white strokes stay crisp
    for (const [ry, rh] of [[58.4, 10.4], [73.2, 10.6]]) rect(ctx, 38, ry, 24.4, rh, linGrad(ctx, 0, 58, 0, 84, [[0, rgba('#ffb64e', sun)], [1, rgba('#f2603c', sun)]]));
    if (g) { g.save(); g.translate(x - 50 * k, y - 51 * k); g.scale(k, k); glow(g, 50, 72, 40, '#ff8a3a', .42 * sun); g.restore(); }
  }
  ctx.save(); ctx.translate(.7, 1.1);
  for (let i = 0; i < MA_KANJI.length; i++) brushStroke(ctx, MA_KANJI[i], E.inOutSine(each(i)), o.shadow ?? 'rgba(12,10,48,0.55)');
  ctx.restore();
  for (let i = 0; i < MA_KANJI.length; i++) brushStroke(ctx, MA_KANJI[i], E.inOutSine(each(i)), o.color ?? '#fffaf0');
  ctx.restore();
}

});

// ------------------------------------------------------------ 76.875 - 78.75  your nose
const LAND = 77.5;
shot('payoff', 76.875, 78.75, S => {
  const { ctx, g, t, u, P } = S;
  const k = inv(76.875, 78.8, t), d = on2(t), after = t - LAND;
  drawBokeh(ctx, 'morning', 'dawn', ['#fff0c0', '#ffd0b8', '#cfeaff'], 0, 0, 1.12 + .04 * k);
  rect(ctx, 0, 0, W, H, 'rgba(110,70,120,0.16)');

  rainField(ctx, g, t, { seed: 74, n: 330, focus: 3.2, near: 2.6, far: 11, alpha: .6, tint: '#fff4de' });
  const s = 1.2 + .06 * E.outCubic(k);
  const laughing = d >= 77.8, startled = d >= LAND && d < 77.8;
  const bounce = laughing ? Math.abs(Math.sin((d - 77.8) * 13)) : 0;
  const hx = 940, hy = 500 + (startled ? 14 : 0) - bounce * 15;
  const rot = laughing ? -.045 + .02 * Math.sin(d * 9) : startled ? .03 : 0;
  const open = laughing ? .55 + .45 * bounce : startled ? .35 : 0;
  const sq = d >= LAND && d < LAND + .08 ? [1.08, .9] : d >= LAND + .08 && d < LAND + .163 ? [1.035, .955] : d >= 77.8 && d < 77.88 ? [.94, 1.075] : [1, 1];
  const chin = [hx, hy + 298 * s];
  ctx.save(); ctx.translate(chin[0], chin[1]); ctx.scale(sq[0], sq[1]); ctx.translate(-chin[0], -chin[1]);
  nagiFront(ctx, {
    x: hx, y: hy, s, rot, t, pal: 'dawn', blush: laughing ? 1.7 : 1.1,
    brow: startled ? .7 : laughing ? -.15 : 0,
    eye: laughing ? { mode: 'happy' } : { k: startled ? 1 : 0, gaze: [0, d < 77.2 ? -42 : d < LAND ? -12 : 0], wet: .7 },
    mouth: { mode: laughing ? 'laugh' : startled ? 'o' : 'smile', open },
  });
  ctx.restore();
  // the drop with its name, arriving exactly where it was always going
  const nose0 = [hx + 8 * s * Math.cos(rot) - 112 * s * Math.sin(rot), hy + 8 * s * Math.sin(rot) + 112 * s * Math.cos(rot)];
  const nose = [chin[0] + (nose0[0] - chin[0]) * sq[0], chin[1] + (nose0[1] - chin[1]) * sq[1]];
  if (t < LAND) {
    const q = inv(76.875, LAND, t), e = .35 * q + .65 * q * q;
    const x = lerp(nose[0] + 110, nose[0], e), y = lerp(-20, nose[1] - 14, e);
    taper(ctx, [[lerp(nose[0] + 110, nose[0], e - .2), lerp(-20, nose[1] - 14, e - .2)], [x, y]], 15, { color: rgba(NOSE_DROP_COLOR, .8), t0: .95, t1: .05 });
    glow(ctx, x, y, 110, NOSE_DROP_COLOR, .7);
    litDrop(ctx, g, x, y, 22, inv(76.7, 77.2, t) + .3, { color: NOSE_DROP_COLOR });
    const tk = env(t, 76.9, LAND + .02, .15, .05);
    if (tk > 0) {
      for (const [i, line] of ['the one heading', 'for your nose'].entries()) type(ctx, line, 1330, 226 + i * 68, { size: 46, weight: 4.8, track: 8, align: 'left', color: i ? '#e0fff4' : '#ffffff', alpha: tk, shadow: { color: 'rgba(60,26,80,0.8)', y: 3, grow: 11 } });
      taper(ctx, [[1308, 300], [x + 44, y + 10]], 3, { color: rgba(NOSE_DROP_COLOR, tk * .9), t0: 0, t1: .2 });
    }
  } else {
    splash(ctx, g, nose[0], nose[1] - 8, after, 1.9);
    if (after < .3) sparkle(ctx, nose[0], nose[1] - 10, 90 * (1 - after / .3), '#eafff8', 1, after * 4);
    const bead = 1 - ramp(t, 78.3, 78.75);
    if (bead > 0) drawDrop(ctx, nose[0] + 2, nose[1] - 3, 9 * bead, 0, 1, '#e8fff8');
  }
  namedRain(ctx, g, t, { n: 110, seed: 2002, hole: { x: 940, y: 540, r: 520 } });
  rainField(ctx, g, t, { seed: 75, n: 30, focus: 3.2, near: .8, far: 2.1, alpha: .6, tint: '#fff4de', hole: { x: 960, y: 520, r: 520 } });
  P.bloom = .26; P.thresh = .91; P.vig = .3; P.sat = 1.06;

});

// ------------------------------------------------------------ 78.75 - 80  together

// ------------------------------------------------------------ 84.5 - 87.5  take your time
const END_BLINK = 86.3;
shot('end', 84.5, 87.5, S => {
  const { ctx, g, t, u, P } = S;
  rect(ctx, 0, 0, W, H, '#010209');
  const R = rng(1001);
  for (let i = 0; i < 120; i++) dot(ctx, R.range(0, W), R.range(0, H), R.range(.5, 1.8), rgba('#cfe0ff', R.range(.1, .5) * ramp(t, 84.6, 85.6)));

  const a = ramp(t, 85.35, 85.9);
  if (a > 0) {
    const d = on2(t);
    const lid = d < END_BLINK ? 0 : d < END_BLINK + .08 ? .45 : d < END_BLINK + .52 ? 1 : d < END_BLINK + .62 ? .6 : d < END_BLINK + .7 ? .2 : 0;
    ctx.save(); ctx.globalAlpha = a;
    for (const sgn of [-1, 1]) {
      const x = 960 + sgn * 78, y = 662;
      glow(ctx, x, y, 90, '#ffe9a8', .32); glow(g, x, y, 62, '#ffdc8a', .7 * a);
      if (lid > .8) ink(ctx, `M ${x - 30} ${y + 4} C ${x - 12} ${y + 28} ${x + 12} ${y + 28} ${x + 30} ${y + 4}`, 11, { color: '#f6ecc8', t0: .3, t1: .3, min: .3 });
      else { ell(ctx, x, y + lid * 10, 20, 32 * (1 - lid * .9), '#fff6d6'); ell(ctx, x - 5, y - 11 + lid * 20, 8, 8 * (1 - lid), '#ffffff'); }
    }
    // the ring, keeping her time: one tick a second
    const n = Math.floor(t - 85.0), f = (t - 85.0) - n, th = (n + E.outBack(clamp(f / .16), 2.4)) * TAU / 24;
    ctx.strokeStyle = 'rgba(205,244,255,0.34)'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.ellipse(960, 650, 250, 62, -.12, 0, TAU); ctx.stroke();
    for (let i = 0; i < 24; i++) {
      const an = th + i * TAU / 24, c = Math.cos(-.12), s = Math.sin(-.12);
      const pt = r => { const x = Math.cos(an) * 250 * r, y = Math.sin(an) * 62 * r; return [960 + x * c - y * s, 650 + x * s + y * c]; };
      const big = i % 6 === 0, p = pt(big ? 1.09 : 1.045), q = pt(big ? .93 : .97);
      ctx.strokeStyle = rgba(big ? '#fff4cf' : '#d6f6ff', big ? .85 : .5); ctx.lineWidth = big ? 5 : 2.4; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
    ctx.restore();
  }
  P.bloom = .55; P.vig = .5; P.grain = 1.2;
  P.fade = E.inOutSine(inv(87.12, 87.46, t));
});

// every intended hard cut, exported for the luma audit
const CUTS = [2, 5, 11, 15, 19.5, 21, 27, 28, 30, 32, 34, 36, 38, 38.5, 39, 39.5, 40, 46, 49.5, 52, 57.375, 59, 61.75, 63.5, 65.625, 67, 69, 73, 74.625, 76.875, 78.75, 80, 84.5];
const RAMPS = [
  [46, 46.25, 'fade up on her face'], [59, 59.3, 'fade up on the waiting'], [68.62, 69, 'the eyelids of the frame close'],
  [73, 73.625, 'eyes open out of black'], [80, 80.5, 'morning veil into the title'], [84.12, 84.5, 'title fades out'], [87.12, 87.5, 'final fade'],
];

// ===== src/90_director.js =====
// ---------------------------------------------------------------------------
// director: the shot list, per-frame post settings and window.renderAt(t)
// ---------------------------------------------------------------------------
const defaultPost = () => ({
  bloom: .55, thresh: .74, glowK: 1.0, ca: 1.1, vig: .42, sat: 1.04, con: 1.025, flash: 0, fade: 0, impact: 0,
  zoom: 1, grain: 1.4, frame: 0, radial: 0, lift: [0, 0, 0], gain: [1, 1, 1], flashCol: [1, 1, 1],
  inkCol: [.03, .02, .1], paperCol: [.96, .95, 1], shake: [0, 0], center: [.5, .5],
});

let SCENE, SCTX, GLOWC, GCTX, ready = false;
function initFilm(canvas) {
  SCENE = CV(W, H); SCTX = SCENE.getContext('2d', { alpha: false });
  GLOWC = CV(W / 2, H / 2); GCTX = GLOWC.getContext('2d');
  Post.init(canvas);
  ready = true;
}
// the thumbnail: the opening eye with the title and the premise
function renderThumb() {
  const ctx = SCTX, g = GCTX;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W / 2, H / 2); g.setTransform(.5, 0, 0, .5, 0, 0);
  drawECU(ctx, .75, { x: 960, y: 486, s: 1.1, lid: 0, ma: 1, still: true, gaze: [7, 2], webA: 1.15 });
  rect(ctx, 0, 640, W, 440, linGrad(ctx, 0, 640, 0, 1080, [[0, 'rgba(10,6,34,0)'], [.5, 'rgba(10,6,34,0.8)'], [1, 'rgba(10,6,34,0.96)']]));
  type(ctx, 'BETWEEN BLINKS', 960, 818, { size: 138, bold: true, weight: 26, track: 24, color: '#ffffff', shadow: { color: 'rgba(8,4,30,0.8)', y: 9, grow: 7 } });
  type(ctx, 'you blink.  it lives nine thousand years.', 960, 1002, { size: 42, weight: 4.4, track: 8, color: '#ffeec4', shadow: { color: 'rgba(8,4,30,0.85)', y: 3, grow: 9 } });
  drawMaKanji(ctx, g, 168, 160, 196, 1, { sun: 1 });
  const P = defaultPost(); P.bloom = .42; P.thresh = .82; P.vig = .42; P.grain = 0;
  Post.render(SCENE, GLOWC, P);
}
function renderAt(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  const frame = Math.round(t * FPS);
  const ctx = SCTX, g = GCTX;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  rect(ctx, 0, 0, W, H, '#000');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W / 2, H / 2); g.setTransform(.5, 0, 0, .5, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const P = defaultPost(); P.frame = frame;
  for (const s of SHOTS) {
    if (t >= s.t0 - 1e-6 && t < s.t1 - 1e-6) {
      ctx.save(); g.save();
      s.draw({ ctx, g, t, u: t - s.t0, d: s.t1 - s.t0, P, t0: s.t0, t1: s.t1 });
      ctx.restore(); g.restore();
    }
  }
  for (const f of FLASHES) {
    const u = t - f.t;
    if (u > -f.up && u < f.down) {
      const a = (u < 0 ? 1 + u / f.up : 1 - u / f.down) * f.peak;
      if (a > P.flash) { P.flash = a; P.flashCol = vec3(f.color); }
    }
  }
  for (const m of IMPACTS) {
    const f0 = Math.round(m.t * FPS);
    if (frame >= f0 && frame < f0 + m.n) { P.impact = m.mode; P.inkCol = vec3(m.ink); P.paperCol = vec3(m.paper); P.grain = 0; }
  }
  Post.render(SCENE, GLOWC, P);
}

// ===== src/99_main.js =====
// ---------------------------------------------------------------------------
// boot, public API and a small preview player
// ---------------------------------------------------------------------------
window.ERRS = [];
window.addEventListener('error', e => window.ERRS.push(String(e.message)));
(function boot() {
  try {
    const view = document.getElementById('view');
    initFilm(view);
    window.DURATION = DURATION;
    window.FPS = FPS;
    window.renderAt = renderAt;
    window.renderThumb = renderThumb;
    window.readFrame = () => Post.read();
    window.gpuName = () => Post.info();
    // metadata used by the audit tools
    window.TIMELINE = () => ({
      duration: DURATION, fps: FPS,
      shots: SHOTS.map(s => ({ id: s.id, t0: s.t0, t1: s.t1 })),
      cuts: typeof CUTS !== 'undefined' ? CUTS : [],
      ramps: typeof RAMPS !== 'undefined' ? RAMPS : [],
      impacts: IMPACTS.map(m => ({ t: m.t, n: m.n })),
      flashes: FLASHES.map(f => ({ t: f.t, up: f.up, down: f.down, peak: f.peak })),
    });
    const q = new URLSearchParams(location.search);
    if (q.has('capture')) {
      document.body.classList.add('capture');
      window.READY = true;
      return;
    }
    // preview: soundtrack.wav is optional, the picture works without it
    const audio = new Audio('soundtrack.wav');
    const seek = document.getElementById('seek'), btn = document.getElementById('play');
    let playing = false, base = 0, start = 0, cur = 0;
    const now = () => performance.now() / 1000;
    const setPlaying = p => {
      playing = p; btn.classList.toggle('on', p);
      if (p) { if (cur >= DURATION - .05) cur = 0; base = cur; start = now(); audio.currentTime = cur; audio.play().catch(() => {}); }
      else audio.pause();
    };
    btn.onclick = () => setPlaying(!playing);
    view.onclick = () => setPlaying(!playing);
    seek.oninput = () => { cur = seek.value / 1000 * DURATION; base = cur; start = now(); audio.currentTime = cur; renderAt(Math.floor(cur * FPS) / FPS); };
    window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });
    let lastF = -1;
    (function loop() {
      if (playing) {
        cur = !audio.paused && audio.currentTime > 0 ? audio.currentTime : base + now() - start;
        if (cur >= DURATION) { cur = DURATION; setPlaying(false); }
        const f = Math.floor(cur * FPS);
        if (f !== lastF) { renderAt(f / FPS); lastF = f; seek.value = String(cur / DURATION * 1000); }
      }
      requestAnimationFrame(loop);
    })();
    renderAt(t0FromHash());
    function t0FromHash() { const m = location.hash.match(/t=([\d.]+)/); return m ? +m[1] : 0; }
    window.READY = true;
  } catch (e) {
    window.FAILED = String(e && e.stack || e);
    console.log(window.FAILED);
  }
})();
