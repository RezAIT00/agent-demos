}

function buildYarn(mit) {
  const NS = 26, RING = 7, TAU = Math.PI * 2;
  const noise = makeNoise2(88);
  const P = [], N = [], T = [], D = [], idx = [], roots = [];
  const y00 = mittenY(0, 0);
  const rowMin = Math.ceil(MIT.patchZ0 / MIT.rowH), rowMax = Math.floor((MIT.patchZ1 + MIT.loopH) / MIT.rowH);
  for (let row = rowMin; row <= rowMax; row++) {
    const zr = row * MIT.rowH;
    const th0 = Math.floor(-MIT.patchX / MIT.stitchW) * TAU, th1 = Math.ceil(MIT.patchX / MIT.stitchW) * TAU;
    const n = Math.round((th1 - th0) / TAU * NS) + 1;
    const C = [], S = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const th = th0 + (i / (n - 1)) * (th1 - th0);
      let x = MIT.stitchW * (th / TAU + MIT.swing * Math.sin(2 * th));
      let z = zr - MIT.loopH * (1 - Math.cos(th)) / 2 + 0.9;
      let y = MIT.depth * (1 - Math.cos(2 * th)) / 2 - MIT.depth - 0.62;
      x += 0.34 * (noise.n(th * 0.23 + row * 7.3, row * 1.7) - 0.5);
      z += 0.38 * (noise.n(th * 0.19 + row * 3.1, 9 + row) - 0.5);
      y += 0.34 * (noise.n(th * 0.31, row * 5.9) - 0.5);
      const edge = sstep(0.80, 1.02, patchRadius(x, z));
      y += mittenY(x, z) - y00 - 2.3 * edge;
      C.push(new THREE.Vector3(x, y, z));
      if (i) S[i] = S[i - 1] + C[i].distanceTo(C[i - 1]);
    }
    for (let ply = 0; ply < 3; ply++) {
      const centres = [], outs = [];
      const phase = ply * TAU / 3 + row * 1.3;
      for (let i = 0; i < n; i++) {
        const tang = C[Math.min(n - 1, i + 1)].clone().sub(C[Math.max(0, i - 1)]).normalize();
        const side = new THREE.Vector3(0, 1, 0).cross(tang).normalize();
        const bin = tang.clone().cross(side).normalize();
        const phi = phase + S[i] / MIT.twist * TAU;
        const swell = 1 + 0.22 * (noise.n(S[i] * 0.8 + ply * 13, row * 2.3) - 0.5);
        const out = side.multiplyScalar(Math.cos(phi)).addScaledVector(bin, Math.sin(phi));
        outs.push(out);
        centres.push(C[i].clone().addScaledVector(out, MIT.plyOff * swell));
      }
      const start = P.length / 3;
      for (let i = 0; i < n; i++) {
        const tp = centres[Math.min(n - 1, i + 1)].clone().sub(centres[Math.max(0, i - 1)]).normalize();
        const e1 = outs[i].clone().addScaledVector(tp, -outs[i].dot(tp)).normalize();
        const e2 = tp.clone().cross(e1);
        const rad = MIT.plyR * (1 + 0.16 * (noise.n(S[i] * 2.3, row * 11 + ply) - 0.5));
        const heather = noise.n(S[i] * 0.45 + ply * 5.1, row * 3.7 + ply);
        for (let k = 0; k < RING; k++) {
          const a = k / RING * TAU;
          const nx = e1.x * Math.cos(a) + e2.x * Math.sin(a), ny = e1.y * Math.cos(a) + e2.y * Math.sin(a), nz = e1.z * Math.cos(a) + e2.z * Math.sin(a);
          const vx = centres[i].x + nx * rad, vy = centres[i].y + ny * rad, vz = centres[i].z + nz * rad;
          const rel = vy - (mittenY(centres[i].x, centres[i].z) - y00);
          const ao = clamp(0.12 + 0.88 * sstep(-2.2, -0.2, rel), 0, 1) * (0.16 + 0.84 * Math.pow(0.5 + 0.5 * Math.cos(a), 1.15));
          P.push(vx, vy, vz); N.push(nx, ny, nz); T.push(tp.x, tp.y, tp.z); D.push(ao, heather);
          if (ny > -0.15 && i > 0 && i < n - 1) roots.push([vx, vy, vz, nx, ny, nz, tp.x, tp.y, tp.z, heather]);
        }
      }
      for (let i = 0; i < n - 1; i++) for (let k = 0; k < RING; k++) {
        const a = start + i * RING + k, b = start + i * RING + (k + 1) % RING, c = a + RING, d = b + RING;
        idx.push(a, b, c, b, d, c);
      }

  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  g.setAttribute('aTan', new THREE.Float32BufferAttribute(T, 3));
  g.setAttribute('aData', new THREE.Float32BufferAttribute(D, 2));
  g.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, side: THREE.DoubleSide, uniforms: woolUniforms(mit), alphaToCoverage: true,
    vertexShader: `in vec3 aTan; in vec2 aData; out vec3 vW; out vec3 vN; out vec3 vT; out vec2 vD;
      void main(){ vW = position; vN = normal; vT = aTan; vD = aData; gl_Position = projectionMatrix*viewMatrix*vec4(position,1.0); }`,
    fragmentShader: `precision highp float; in vec3 vW; in vec3 vN; in vec3 vT; in vec2 vD; out vec4 o; ${GLSL_NOISE} ${WOOL_LIGHT}
      void main(){
        vec3 n = normalize(vN), T = normalize(vT), V = normalize(cameraPosition - vW);
        float fw = length(fwidth(vW));
        float fine = 1.0 - smoothstep(0.03, 0.13, fw);
        // filaments combed along the ply
        vec3 q = vW - T*dot(vW, T)*0.93;

        albedo = mix(albedo, vec3(0.085,0.062,0.052), smoothstep(0.72, 0.86, s2)*smoothstep(0.55, 0.75, vnoise(vW*2.4))*fine);

        float k = max((dot(n, uKeyW) + 0.28)/1.28, 0.0), r = max((dot(n, uRimW) + 0.30)/1.30, 0.0);

        col += graze*ao*(uRimWCol*0.030*max(0.45 + dot(-V, uRimW), 0.0) + uKeyWCol*0.006 + uAmb*0.03);
        o = vec4(max(col, vec3(0.0)), uDetail);
      }`,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  return { mesh, roots, positions: P };
}

// Highest wool at (x,z): used to rest flakes on the fibres instead of floating.
function makeHeightMap(positions) {
  const cell = 0.3, ext = 34, n = Math.ceil(ext * 2 / cell);
  const map = new Float32Array(n * n).fill(-9);
  for (let i = 0; i < positions.length; i += 3) {
    const gx = Math.floor((positions[i] + ext) / cell), gz = Math.floor((positions[i + 2] + ext) / cell);
    if (gx < 0 || gz < 0 || gx >= n || gz >= n) continue;
    const k = gz * n + gx;
    if (positions[i + 1] > map[k]) map[k] = positions[i + 1];
  }
  return (x, z) => {
    const gx = Math.floor((x + ext) / cell), gz = Math.floor((z + ext) / cell);
    let best = -9;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const i = gx + a, j = gz + b;
      if (i >= 0 && j >= 0 && i < n && j < n) best = Math.max(best, map[j * n + i]);
    }
    return best < -8 ? mittenY(x, z) + 1.3 : best;
  };
}

function fibreGeometry(segments) {
  const base = [];
  for (let s = 0; s < segments; s++) {
    const a = s / segments, b = (s + 1) / segments;
    base.push(a, -1, 0, a, 1, 0, b, 1, 0, a, -1, 0, b, 1, 0, b, -1, 0);
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(base, 3));
  return g;
}

function buildFibres(mit, roots, clearances) {
  const rnd = makeRng(4242);
  const R = [], M = [], E = [], I = [];
  const v = new THREE.Vector3();
  const addFibre = (px, py, pz, nx, ny, nz, tx, ty, tz, len, width, heather, kind) => {
    const sgn = rnd() < 0.5 ? -1 : 1;
    v.set(nx * 0.85 + tx * sgn * 0.65 + (rnd() - 0.5) * 1.5, ny * 0.85 + ty * sgn * 0.65 + (rnd() - 0.5) * 1.1 + 0.12, nz * 0.85 + tz * sgn * 0.65 + (rnd() - 0.5) * 1.5).normalize();
    const mx = px + v.x * len * 0.55, my = py + v.y * len * 0.55, mz = pz + v.z * len * 0.55;
    let ex = mx + (v.x + (rnd() - 0.5) * 1.7) * len * 0.45, ey = my + (v.y + (rnd() - 0.65) * 1.3) * len * 0.45, ez = mz + (v.z + (rnd() - 0.5) * 1.7) * len * 0.45;
    let myy = my;
    // keep the fuzz under the crystals that rest on it (a few strays cross over)
    if (kind === 0 && rnd() > 0.012) {
      for (const c of clearances) {
        const dx = ex - c.x, dz = ez - c.z;
        if (dx * dx + dz * dz < c.r * c.r) { ey = Math.min(ey, c.y - 0.07); myy = Math.min(myy, c.y - 0.05); }
      }
    }
    R.push(px, py, pz); M.push(mx, myy, mz); E.push(ex, ey, ez);
    I.push(width, rnd(), heather, kind);
  };
  const want = 330000;
  let guard = 0;
  while (R.length / 3 < want && guard++ < want * 12) {
    const q = roots[Math.floor(rnd() * roots.length)];
    const d = Math.hypot(q[0], q[2] + 3);
    const keep = d < 9 ? 1 : d < 17 ? 0.55 : d < 26 ? 0.27 : 0.13;
    if (rnd() > keep) continue;
    const stray = rnd() < 0.025;
    const len = stray ? 1.2 + 1.5 * rnd() : 0.13 + 0.85 * Math.pow(rnd(), 2.4);
    addFibre(q[0], q[1], q[2], q[3], q[4], q[5], q[6], q[7], q[8], len, (stray ? 0.007 : 0.0085) + 0.013 * rnd() * rnd(), q[9], 0);
  }
  // halo of fuzz round the outline, which is what makes the shape read as wool
  let made = 0; guard = 0;
  while (made < 36000 && guard++ < 4e6) {
    const x = -94 + rnd() * 152, z = -100 + rnd() * 230;
    const s = mittenSD(x, z);
    if (s > 0 || s < -5.5) continue;
    const gx = mittenSD(x + 0.2, z) - mittenSD(x - 0.2, z), gz = mittenSD(x, z + 0.2) - mittenSD(x, z - 0.2);
    const gl = Math.hypot(gx, gz) || 1;
    addFibre(x, mittenY(x, z), z, gx / gl * 0.9, 0.5, gz / gl * 0.9, -gz / gl, 0, gx / gl, 1.2 + 3.4 * rnd() * rnd(), 0.06 + 0.07 * rnd(), rnd(), 1);
    made++;
  }
  const g = fibreGeometry(5);
  g.setAttribute('aRoot', new THREE.InstancedBufferAttribute(new Float32Array(R), 3));
  g.setAttribute('aMid', new THREE.InstancedBufferAttribute(new Float32Array(M), 3));
  g.setAttribute('aEnd', new THREE.InstancedBufferAttribute(new Float32Array(E), 3));
  g.setAttribute('aInfo', new THREE.InstancedBufferAttribute(new Float32Array(I), 4));
  g.instanceCount = R.length / 3;
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, side: THREE.DoubleSide, alphaToCoverage: true,
    uniforms: Object.assign({ uPxAngle: { value: 0.0002 } }, woolUniforms(mit)),
    vertexShader: `
      in vec3 aRoot; in vec3 aMid; in vec3 aEnd; in vec4 aInfo; uniform float uPxAngle;
      out vec3 vW; out vec3 vT; out float vAlpha; out float vS; out vec4 vInfo; out float vAcross;
      void main(){
        float t = position.x, u = 1.0 - t;
        vec3 p = aRoot*u*u + aMid*2.0*u*t + aEnd*t*t;
        vec3 d = (aMid - aRoot)*2.0*u + (aEnd - aMid)*2.0*t;
        d = normalize(d + 1e-5);
        vec3 toCam = cameraPosition - p; float dist = length(toCam);
        vec3 side = normalize(cross(d, toCam) + 1e-5);
        float w = aInfo.x*(1.0 - 0.72*t);
        float wd = max(w, dist*uPxAngle*1.35);
        p += side*position.y*wd*0.5;
        vW = p; vT = d; vS = t; vInfo = aInfo; vAlpha = clamp(w/wd, 0.0, 1.0); vAcross = position.y;
        gl_Position = projectionMatrix*viewMatrix*vec4(p, 1.0);
      }`,
    fragmentShader: `precision highp float; in vec3 vW; in vec3 vT; in float vAlpha; in float vS; in vec4 vInfo; in float vAcross; out vec4 o; ${GLSL_NOISE} ${WOOL_LIGHT}
      void main(){
        vec3 T = normalize(vT), V = normalize(cameraPosition - vW);
        float hue = fract(vInfo.y*7.31);
        vec3 albedo = mix(vec3(0.026,0.031,0.048), vec3(0.088,0.096,0.122), smoothstep(0.45, 0.82, vInfo.z));
        if (hue > 0.93) albedo = vec3(0.24,0.25,0.29); else if (hue > 0.885) albedo = vec3(0.16,0.075,0.050);
        float sh = flakeShadow(vW);

        if (vInfo.w < 0.5) ao *= smoothstep(-2.6, -0.5, vW.y)*0.75 + 0.25;
        float round_ = 0.72 + 0.28*(1.0 - across*across);
        vec3 col = albedo*(uAmb*0.9 + uKeyWCol*sinTL*0.62*sh + uRimWCol*sinTR*0.30)*ao*round_;
        vec3 H = normalize(uKeyW + V); float th = dot(T, H);
        col += uKeyWCol*pow(max(1.0 - th*th, 0.0), 45.0)*0.018*ao*sh;
        // warm light threading forward through the fibres
        float fwd = pow(max(dot(-V, uRimW)*0.5 + 0.5, 0.0), 3.0);
        col += uRimWCol*sinTR*fwd*(0.045 + 0.05*along)*ao*(0.35 + 0.65*step(0.55, fract(vInfo.y*3.7)));
        o = vec4(max(col, vec3(0.0)), clamp(vAlpha, 0.0, 1.0)*(0.55 + 0.45*(1.0 - along*along))*(vInfo.w < 0.5 ? uDetail : 1.0));
      }`,
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  return mesh;
}

// crumbs of broken snow caught in the fuzz
function buildGrains(mit, heightAt, clearances) {
  const rnd = makeRng(99);
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: woolUniforms(mit),
    vertexShader: `out vec3 vW; void main(){ vec4 w = modelMatrix*instanceMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `precision highp float; in vec3 vW; out vec4 o; ${GLSL_NOISE} ${WOOL_LIGHT}
      void main(){
        vec3 n = normalize(cross(dFdx(vW), dFdy(vW))); vec3 V = normalize(cameraPosition - vW); if (dot(n,V) < 0.0) n = -n;
        vec3 col = uAmb*0.42 + uKeyWCol*0.045*max(dot(n,uKeyW)+0.3, 0.0) + uRimWCol*0.07*max(dot(n,uRimW)+0.5, 0.0);
        col += uKeyWCol*pow(max(dot(reflect(-V,n), uKeyW),0.0), 40.0)*1.3;
        o = vec4(max(col, vec3(0.0)), 1.0);
      }`,
  });
  const count = 360;
  const im = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  let n = 0, guard = 0;
  while (n < count && guard++ < 20000) {
    const a = rnd() * Math.PI * 2, r = 2.4 + 26 * Math.pow(rnd(), 1.25);
    const x = Math.cos(a) * r, z = Math.sin(a) * r - 4;
    const s = 0.012 + 0.048 * Math.pow(rnd(), 3.0);
    if (clearances.some((c) => (x - c.x) ** 2 + (z - c.z) ** 2 < (c.r * 0.9) ** 2)) continue;
    e.set(rnd() * 6, rnd() * 6, rnd() * 6); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x, heightAt(x, z) + s * 0.5 + rnd() * 0.12, z), q, new THREE.Vector3(s * (0.8 + rnd()), s * 0.8, s));
    im.setMatrixAt(n++, m);
  }
  im.count = n;
  im.frustumCulled = false;
  return im;
}

function buildSleeve(mit) {
  const rings = 150, seg = 96;
  const pos = [], idx = [], info = [];
  const p0 = new THREE.Vector3(1, -27, 112), p1 = new THREE.Vector3(14, -62, 190), p2 = new THREE.Vector3(185, -185, 205);
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= rings; i++) {
    const u = i / rings;
    const c = p0.clone().multiplyScalar((1 - u) * (1 - u)).addScaledVector(p1, 2 * u * (1 - u)).addScaledVector(p2, u * u);
    const tg = p1.clone().sub(p0).multiplyScalar(2 * (1 - u)).addScaledVector(p2.clone().sub(p1), 2 * u).normalize();
    const side = up.clone().cross(tg).normalize(), top = tg.clone().cross(side).normalize();
    // ribbed storm cuff, then puffed quilt channels
    const cuff = 1 - sstep(0.085, 0.105, u);
    const channel = Math.pow(Math.abs(Math.sin((u - 0.1) * Math.PI * 7.0)), 0.38);
    const puff = lerp(36.5 + 4.6 * channel + 6 * u, 38.5, cuff);
    for (let k = 0; k <= seg; k++) {
      const a = (k / seg) * Math.PI * 2;
      const wr = 1 + (1 - cuff) * 0.022 * Math.sin(a * 6 + u * 29) * Math.sin(u * 37 + a * 3);
      const q = c.clone().addScaledVector(side, Math.cos(a) * puff * wr).addScaledVector(top, Math.sin(a) * puff * 0.66 * wr);
      pos.push(q.x, q.y, q.z);
      info.push(cuff, channel, a);
    }
  }
  for (let i = 0; i < rings; i++) for (let k = 0; k < seg; k++) {
    const a = i * (seg + 1) + k, b = a + 1, c = a + seg + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aInfo', new THREE.Float32BufferAttribute(info, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, side: THREE.DoubleSide, uniforms: woolUniforms(mit),
    vertexShader: `in vec3 aInfo; out vec3 vW; out vec3 vN; out vec3 vI; void main(){ vW = position; vN = normal; vI = aInfo; gl_Position = projectionMatrix*viewMatrix*vec4(position,1.0); }`,
    fragmentShader: `precision highp float; in vec3 vW; in vec3 vN; in vec3 vI; out vec4 o; ${GLSL_NOISE} ${WOOL_LIGHT}
      void main(){
        vec3 n = normalize(vN); vec3 V = normalize(cameraPosition - vW); if (dot(n, V) < 0.0) n = -n;
        vec3 fine = vec3(vnoise(vW*0.8), vnoise(vW*0.8+3.0), vnoise(vW*0.8+5.0)) - 0.5;
        n = normalize(n + fine*0.18);
        vec3 shell = vec3(0.050,0.0115,0.0135)*(0.9 + 0.2*vnoise(vW*0.3));
        vec3 ribbed = vec3(0.008,0.012,0.018)*(0.55 + 0.75*abs(sin(vI.z*70.0)));
        vec3 albedo = mix(shell, ribbed, vI.x);
        float seam = mix(0.35 + 0.65*smoothstep(0.05, 0.75, vI.y), 1.0, vI.x);
        float k = max((dot(n,uKeyW) + 0.35)/1.35, 0.0), r = max((dot(n,uRimW) + 0.3)/1.3, 0.0);
        vec3 col = albedo*(uAmb*1.2 + uKeyWCol*k + uRimWCol*r*1.1)*seam;
        vec3 H = normalize(uRimW + V);
        col += (uRimWCol*0.045*pow(max(dot(n, H), 0.0), 18.0) + uKeyWCol*0.020*pow(max(dot(n, normalize(uKeyW + V)), 0.0), 14.0))*(1.0 - vI.x);
        float dust = smoothstep(0.66, 0.84, vnoise(vW*0.42)*0.6 + vnoise(vW*1.6)*0.4)*smoothstep(0.3, 0.9, n.y);
        col = mix(col, uAmb*0.60 + uKeyWCol*0.10*k + uRimWCol*0.05*r, dust*0.75);
        col += pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.0)*(uRimWCol*0.040 + uAmb*0.055);
        o = vec4(max(col, vec3(0.0)), 1.0);
      }`,
  });
  return new THREE.Mesh(g, mat);
}

// powder lying over the whole mitten: what reads as snow while it is still far
function buildDusting(mit) {
  const rnd = makeRng(321);
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: woolUniforms(mit),
    vertexShader: `in float aInner; uniform float uDetail; out vec3 vW; void main(){ vec3 p = position*(1.0 - aInner*smoothstep(0.25, 0.95, uDetail)); vec4 w = modelMatrix*instanceMatrix*vec4(p,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `precision highp float; in vec3 vW; out vec4 o; ${GLSL_NOISE} ${WOOL_LIGHT}
      void main(){
        vec3 n = normalize(cross(dFdx(vW), dFdy(vW))); vec3 V = normalize(cameraPosition - vW); if (dot(n,V) < 0.0) n = -n;
        o = vec4(uAmb*0.42 + uKeyWCol*0.045*max(dot(n,uKeyW)+0.3, 0.0) + uRimWCol*0.055*max(dot(n,uRimW)+0.5, 0.0), 1.0);
      }`,
  });
  const count = 2300;
  const inner = new Float32Array(count);
  const im = new THREE.InstancedMesh(geo, mat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  let n = 0, guard = 0;
  while (n < count && guard++ < 60000) {
    const x = -90 + rnd() * 145, z = -96 + rnd() * 160;
    if (mittenSD(x, z) > -1.5) continue;
    if (Math.hypot(x, z) < 7) continue;
    const onYarn = patchRadius(x, z) < 0.96;
    inner[n] = onYarn ? 1 : 0;
    const s = 0.16 + 0.52 * Math.pow(rnd(), 3.0);
    e.set(rnd() * 6, rnd() * 6, rnd() * 6); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x, mittenY(x, z) + (onYarn ? 1.6 : 0.8) + s * 0.2, z), q, new THREE.Vector3(s, s * 0.45, s));
    im.setMatrixAt(n++, m);
  }
  geo.setAttribute('aInner', new THREE.InstancedBufferAttribute(inner, 1));
  im.count = n;
  im.frustumCulled = false;
  return im;
}

// ---------------------------------------------------------------- neighbours
// Dozens of other crystals, each with its own weather history, resting on the
// wool. A few are columns and needles: crystals that spent their lives near
// -5 °C or below -22 °C, where the Nakaya diagram gives prisms instead.
function layoutNeighbours() {
  // [x, z, radius mm] composed around the final frame, then a seeded scatter
  const placed = [
    [-4.55, -3.05, 1.55], [4.70, 1.65, 1.20], [3.55, -4.70, 1.75], [-4.05, 3.15, 1.05],
    [-0.65, -6.15, 1.45], [-7.05, 0.20, 1.35], [6.65, -1.95, 1.10], [2.15, 4.65, 0.85],
    [-2.60, 5.75, 1.20], [6.10, 4.55, 1.30], [-7.35, -5.85, 1.65], [8.45, -5.75, 1.25],
  ];
  const rnd = makeRng(1717);
  const hero = 2.65;
  const columns = [
    { x: -3.55, z: -0.75, kind: 'needle', a: 1.2 }, { x: 4.0, z: -1.55, kind: 'capped', a: 1.05 },
    { x: 0.55, z: 3.75, kind: 'column', a: -0.4 }, { x: -6.1, z: 4.3, kind: 'capped', a: 2.05 },
    { x: 5.9, z: -8.9, kind: 'needle', a: -0.8 }, { x: -9.8, z: -2.6, kind: 'needle', a: 0.3 },
    { x: -1.4, z: -10.6, kind: 'capped', a: 1.9 },
  ];
  columns[0].x = -3.42; columns[0].z = 0.9;
  let guard = 0;
  while (placed.length < 58 && guard++ < 20000) {
    const k = placed.length;
    const a = rnd() * Math.PI * 2;
    const dist = k < 30 ? 6.0 + 8.5 * rnd() : 12.5 + 15 * rnd();
    const r = 0.55 + 1.45 * Math.pow(rnd(), 1.25);
    const x = Math.cos(a) * dist, z = Math.sin(a) * dist - 2.5;
    if (Math.hypot(x, z) < hero + r + 0.35) continue;
    if (placed.some((p) => Math.hypot(p[0] - x, p[1] - z) < (p[2] + r) * 0.86)) continue;
    if (columns.some((c) => Math.hypot(c.x - x, c.z - z) < r + 0.9)) continue;
    if (Math.abs(x) > 26 || z < -29 || z > 24) continue;
    placed.push([x, z, r]);
  }
  return { placed, columns };
}

function neighbourJobs(placed) {
  return placed.map((p, i) => {
    const R = p[2] > 1.3 && i < 24 ? 180 : 140;
    // the seed picks the family (seed % 6) and every random detail
    return { layers: SIM.neighbourHistory(101 + i * 7 + (i % 5)), R, maxSteps: 70000, margin: 50 };
  });
}

function restingFrame(heightAt, x, z, r, sink) {
  // fit a gently tilted plane to the highest wool under the footprint
  const pts = [];
  for (let k = 0; k < 40; k++) {
    const rr = r * 0.92 * Math.sqrt((k + 0.5) / 40), a = k * 2.39996;
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr, heightAt(x + Math.cos(a) * rr, z + Math.sin(a) * rr)]);
  }
  let sxx = 0, szz = 0, sxy = 0, szy = 0, my = 0;
  for (const p of pts) my += p[2];
  my /= pts.length;
  for (const p of pts) { sxx += p[0] * p[0]; szz += p[1] * p[1]; sxy += p[0] * (p[2] - my); szy += p[1] * (p[2] - my); }
  const gx = clamp(sxy / (sxx || 1), -0.45, 0.45), gz = clamp(szy / (szz || 1), -0.45, 0.45);
  const res = pts.map((p) => p[2] - (my + gx * p[0] + gz * p[1])).sort((a, b) => a - b);
  const y = my + res[Math.floor(res.length * 0.88)] - (sink || 0);
  return { y, normal: new THREE.Vector3(-gx, 1, -gz).normalize() };
}

function flakeQuaternion(normal, spin) {
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  const flat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
  const sp = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), spin);
  return q.multiply(flat).multiply(sp);
}

function buildColumnCrystal(shared, spec, heightAt, caps) {
  const group = new THREE.Group();
  const add = (halfLen, rad, offset, angle) => {
    const m = makePrismMesh(shared);
    const u = m.material.uniforms;
    u.uRadius.value = rad; u.uHalfH.value = halfLen; u.uMorph.value = 1; u.uSphereR.value = rad; u.uSeed.value = 3;
    u.uFrost.value = 0.34; u.uFront.value = 2.0; u.uBright.value = 0.58;
    const axis = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis);
    m.position.copy(offset);
    group.add(m);
    return axis;
  };
  if (spec.kind === 'needle') {
    add(0.86, 0.062, new THREE.Vector3(0, 0, 0), spec.a);
    add(0.63, 0.050, new THREE.Vector3(0.11, 0.06, 0.09), spec.a + 0.21);
    add(0.43, 0.044, new THREE.Vector3(-0.15, 0.02, -0.08), spec.a - 0.17);
    const rf = restingFrame(heightAt, spec.x, spec.z, 0.9, 0);
    group.position.set(spec.x, rf.y + 0.10, spec.z);
  } else if (spec.kind === 'column') {
    add(0.40, 0.165, new THREE.Vector3(0, 0, 0), spec.a);
    const rf = restingFrame(heightAt, spec.x, spec.z, 0.55, 0);
    group.position.set(spec.x, rf.y + 0.22, spec.z);
  } else {
    // tsuzumi: a column grown cold, then a plate on each end near -15 °C
    const axis = add(0.44, 0.125, new THREE.Vector3(0, 0, 0), spec.a);
    caps.forEach((cap, k) => {
      const mesh = cap.mesh;
      mesh.position.copy(axis).multiplyScalar(k ? 0.46 : -0.46);
      mesh.scale.setScalar(k ? 0.56 : 0.47);
      mesh.material.uniforms.uBright.value = 0.66;
      mesh.material.uniforms.uRimCol = { value: new THREE.Vector3(0.50, 0.44, 0.40) };
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.4));
      group.add(mesh);
    });
    const rf = restingFrame(heightAt, spec.x, spec.z, 0.7, 0);
    group.position.set(spec.x, rf.y + 0.56, spec.z);
  }
  return group;
}

// A static top-down map of where the resting crystals shade the wool.
function renderFlakeShadows(renderer, flakes) {
  const rt = makeRT(1024, 1024, { minFilter: THREE.LinearMipmapLinearFilter, generateMipmaps: true });
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-40, 40, 40, -40, 0.1, 200);
  const quad = new THREE.PlaneGeometry(2, 2);
  for (const f of flakes) {
    const mat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { uH: { value: f.height }, uK: { value: new THREE.Vector2() } },
      vertexShader: `uniform vec2 uK; out vec2 vUv;
        void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.0);
          vec2 p = w.xz + uK*(0.2 - w.y);
          gl_Position = vec4(p.x/40.0, p.y/40.0, 0.0, 1.0); }`,
      fragmentShader: `precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uH;
        void main(){ vec4 t = textureLod(uH, vUv, 2.2); o = vec4(smoothstep(0.1, 0.9, t.g)*0.85, 0.0, 0.0, 1.0); }`,
    });
    mat.uniforms.uK.value.set(MIT.keyW.x / MIT.keyW.y, MIT.keyW.z / MIT.keyW.y);
    const m = new THREE.Mesh(quad, mat);
    m.position.copy(f.mesh.position); m.quaternion.copy(f.mesh.quaternion); m.scale.copy(f.mesh.scale);
    m.frustumCulled = false;
    scene.add(m);
  }
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear();
  renderer.render(scene, cam);
  return rt.texture;
}

// ---------------------------------------------------------------- post
const COC_GLSL = `
uniform float uNear, uFar, uFocus, uAperture, uMaxCoc, uBgCoc, uTilt, uTanHalf, uRadius;
uniform vec3 uPlaneP, uPlaneN;
uniform vec2 uCentre;
float cocAt(vec2 uv, float d){
  if (d > 0.999999) return uBgCoc;
  float z = uNear*uFar/(uFar - d*(uFar - uNear));
  float focus = uFocus;
  if (uTilt > 0.001) {
    // a tilted plane of focus lying along our flake, fading back to a normal lens
    vec3 ray = vec3((uv*2.0 - 1.0)*uTanHalf, -1.0);
    float den = dot(ray, uPlaneN);
    if (abs(den) > 1e-4) {
      float zp = clamp(dot(uPlaneP, uPlaneN)/den, uFocus*0.80, uFocus*1.25);
      float w = uTilt*(1.0 - smoothstep(uRadius*1.0, uRadius*1.65, length(uv - uCentre)));
      focus = mix(focus, zp + 0.10, w);
    }
  }
  return clamp(uAperture*(1.0 - focus/z), -uMaxCoc, uMaxCoc);
}
`;

const DOF_PRE = `
uniform sampler2D uColor, uDepth;
uniform vec2 uTexel;
${COC_GLSL}
float cocOf(vec2 uv){ return cocAt(uv, textureLod(uDepth, uv, 0.0).r); }
void main(){
  vec3 c = vec3(0.0); float coc = 0.0, wsum = 0.0;
  for (int i = 0; i < 4; i++) {
    vec2 o = (vec2(float(i & 1), float(i >> 1)) - 0.5)*uTexel;
    vec3 s = max(textureLod(uColor, vUv + o, 0.0).rgb, vec3(0.0));
    float w = 1.0/(1.0 + max(s.r, max(s.g, s.b))*0.10);
    c += s*w; wsum += w;
    float k = cocOf(vUv + o);
    coc = i == 0 || k < coc ? k : coc;
  }
  outColor = vec4(c/wsum, coc);
}`;

const DOF_GATHER = `
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uMaxCoc, uStep;
void main(){
  vec4 c = textureLod(uTex, vUv, 0.0);
  float centre = abs(c.a), tot = 1.0, reach = centre;
  vec3 col = c.rgb;
  float radius = uStep, ang = 0.0;
  for (int i = 0; i < 900; i++) {
    if (radius >= uMaxCoc) break;
    vec2 tc = vUv + vec2(cos(ang), sin(ang))*radius*uTexel;
    vec4 s = textureLod(uTex, tc, 0.0);
    float size = abs(s.a);
    if (s.a > c.a) size = min(size, centre*2.0);
    float m = smoothstep(radius - 0.5, radius + 0.5, size);
    col += mix(col/tot, s.rgb, m);
    reach += mix(reach/tot, size, m);
    tot += 1.0;
    radius += uStep/radius;
    ang += 2.39996323;
  }
  outColor = vec4(col/tot, reach/tot);
}`;

const DOF_MIX = `
uniform sampler2D uSharp, uBlur, uDepth;
${COC_GLSL}
void main(){
  float coc = cocAt(vUv, textureLod(uDepth, vUv, 0.0).r);
  vec3 s = max(textureLod(uSharp, vUv, 0.0).rgb, vec3(0.0));
  vec4 b = textureLod(uBlur, vUv, 0.0);
  float f = smoothstep(0.55, 1.9, max(abs(coc), b.a));
  outColor = vec4(mix(s, b.rgb, f), 1.0);
}`;

const BLOOM_DOWN = `
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uPrefilter;
vec3 s(vec2 o){ return textureLod(uTex, vUv + o*uTexel, 0.0).rgb; }
void main(){
  vec3 a = s(vec2(-2,2)), b = s(vec2(0,2)), c = s(vec2(2,2)), d = s(vec2(-2,0)), e = s(vec2(0,0)), f = s(vec2(2,0));
  vec3 g = s(vec2(-2,-2)), h = s(vec2(0,-2)), i = s(vec2(2,-2)), j = s(vec2(-1,1)), k = s(vec2(1,1)), l = s(vec2(-1,-1)), m = s(vec2(1,-1));
  vec3 col = e*0.125 + (a+c+g+i)*0.03125 + (b+d+f+h)*0.0625 + (j+k+l+m)*0.125;
  if (uPrefilter > 0.5) {
    float lum = max(col.r, max(col.g, col.b));
    col *= max(lum - 0.85, 0.0)/max(lum, 1e-4);
    col = min(col, vec3(14.0));
  }
  outColor = vec4(col, 1.0);
}`;

const BLOOM_UP = `
uniform sampler2D uTex, uBase; uniform vec2 uTexel; uniform float uBlend;
void main(){
  vec3 c = vec3(0.0);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++)
    c += textureLod(uTex, vUv + vec2(x,y)*uTexel, 0.0).rgb*float((2 - abs(x))*(2 - abs(y)))/16.0;
  outColor = vec4(textureLod(uBase, vUv, 0.0).rgb + c*uBlend, 1.0);
}`;

// six faint diffraction spikes on the brightest glints (a hexagonal aperture)
const STAR = `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec3 acc = vec3(0.0);
  for (int d = 0; d < 6; d++) {
    float a = 0.2618 + float(d)*1.0471976;
    vec2 dir = vec2(cos(a), sin(a));
    for (int i = 1; i <= 22; i++) {
      float fi = float(i);
      vec3 s = textureLod(uTex, vUv + dir*uTexel*fi*1.5, 0.0).rgb;
      acc += max(s - 0.55, 0.0)*exp(-fi*0.15)*vec3(0.9 + 0.1*sin(fi*0.5), 0.96, 1.0 + 0.06*cos(fi*0.4));
    }
  }
  outColor = vec4(acc/22.0, 1.0);
}`;

const FINAL = `
uniform sampler2D uTex, uBloom, uStar;
uniform float uExposure, uBloomAmt, uStarAmt, uVignette, uFrame, uFade;
uniform vec3 uShadowTint, uHighTint;
vec3 fit(vec3 v){ vec3 a = v*(v + 0.0245786) - 0.000090537; vec3 b = v*(0.983729*v + 0.4329510) + 0.238081; return a/b; }
vec3 aces(vec3 c){
  const mat3 I = mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);
  const mat3 O = mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);
  return clamp(O*fit(I*c), 0.0, 1.0);
}
vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
void main(){
  vec2 q = vUv - 0.5;
  float r2 = dot(q, q);
  vec2 ca = q*r2*0.0045;
  vec3 col;
  col.r = textureLod(uTex, vUv - ca, 0.0).r;
  col.g = textureLod(uTex, vUv, 0.0).g;
  col.b = textureLod(uTex, vUv + ca, 0.0).b;
  col += textureLod(uBloom, vUv, 0.0).rgb*uBloomAmt + textureLod(uStar, vUv, 0.0).rgb*uStarAmt;
  col *= uExposure*(1.0 - uVignette*smoothstep(0.08, 0.55, r2));
  col = aces(col*1.28);
  float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col *= mix(uShadowTint, vec3(1.0), smoothstep(0.0, 0.35, l));
  col *= mix(vec3(1.0), uHighTint, smoothstep(0.45, 0.95, l));
  col = srgb(clamp(col*uFade, 0.0, 1.0));
  // fixed-per-frame triangular dither keeps the dusk gradients free of banding
  float n1 = fract(sin(dot(gl_FragCoord.xy + uFrame*1.37, vec2(12.9898, 78.233)))*43758.5453);
  float n2 = fract(sin(dot(gl_FragCoord.xy - uFrame*0.91, vec2(39.346, 11.135)))*24634.6345);
  outColor = vec4(col + (n1 + n2 - 1.0)/255.0, 1.0);
}`;

class Post {
  constructor(renderer, N, quality) {
    this.renderer = renderer; this.N = N;
    const half = N >> 1;
    this.dofIn = makeRT(half, half);
    this.dofBlur = makeRT(half, half);
    this.out = makeRT(N, N);
    this.down = []; this.up = [];
    let s = half;
    for (let i = 0; i < 6; i++) { this.down.push(makeRT(s, s)); this.up.push(makeRT(s, s)); s = Math.max(4, s >> 1); }
    this.star = makeRT(half >> 1, half >> 1);
    const dofU = () => ({ uNear: { value: 0.1 }, uFar: { value: 100 }, uFocus: { value: 10 }, uAperture: { value: 0 }, uMaxCoc: { value: 1 }, uBgCoc: { value: 0 },
      uTilt: { value: 0 }, uTanHalf: { value: Math.tan(10 * D2R) }, uRadius: { value: 0.3 }, uPlaneP: { value: new THREE.Vector3() }, uPlaneN: { value: new THREE.Vector3(0, 0, 1) }, uCentre: { value: new THREE.Vector2(0.5, 0.5) } });
    this.pre = fsPass(DOF_PRE, Object.assign({ uColor: { value: null }, uDepth: { value: null }, uTexel: { value: new THREE.Vector2(1 / N, 1 / N) } }, dofU()));
    this.gather = fsPass(DOF_GATHER, { uTex: { value: null }, uTexel: { value: new THREE.Vector2(1 / half, 1 / half) }, uMaxCoc: { value: 1 }, uStep: { value: quality > 0.7 ? 0.5 : 1.6 } });
    this.mixPass = fsPass(DOF_MIX, Object.assign({ uSharp: { value: null }, uBlur: { value: null }, uDepth: { value: null } }, dofU()));
    this.pDown = fsPass(BLOOM_DOWN, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() }, uPrefilter: { value: 0 } });
    this.pUp = fsPass(BLOOM_UP, { uTex: { value: null }, uBase: { value: null }, uTexel: { value: new THREE.Vector2() }, uBlend: { value: 1 } });
    this.pStar = fsPass(STAR, { uTex: { value: null }, uTexel: { value: new THREE.Vector2(2 / half, 2 / half) } });
    this.pFinal = fsPass(FINAL, {
      uTex: { value: null }, uBloom: { value: null }, uStar: { value: null }, uExposure: { value: 1 }, uBloomAmt: { value: 0.5 }, uStarAmt: { value: 0.3 },
      uVignette: { value: 0.35 }, uFrame: { value: 0 }, uFade: { value: 1 }, uShadowTint: { value: new THREE.Vector3(0.93, 0.99, 1.08) }, uHighTint: { value: new THREE.Vector3(1.03, 1.0, 0.97) },
    });
  }
  // dof(scene) -> this.out ; lens = {near, far, focus, aperture, maxCoc, bgCoc} in pixels at 1080
  dof(sceneRT, lens) {
    const half = this.N >> 1, k = half / 1080;
    for (const p of [this.pre, this.mixPass]) {
      const u = p.u;
      u.uNear.value = lens.near; u.uFar.value = lens.far; u.uFocus.value = lens.focus;
      u.uAperture.value = lens.aperture * k; u.uMaxCoc.value = lens.maxCoc * k; u.uBgCoc.value = lens.bgCoc * k;
      u.uDepth.value = sceneRT.depthTexture;
      u.uTilt.value = lens.tilt || 0;
      if (lens.tilt > 0) { u.uPlaneP.value.copy(lens.planeP); u.uPlaneN.value.copy(lens.planeN); u.uCentre.value.set(lens.centre[0], lens.centre[1]); u.uRadius.value = lens.radius; }
    }
    this.pre.u.uColor.value = sceneRT.texture;
    this.pre.render(this.renderer, this.dofIn);
    this.gather.u.uTex.value = this.dofIn.texture;
    this.gather.u.uMaxCoc.value = Math.max(1, lens.maxCoc * k);
    this.gather.render(this.renderer, this.dofBlur);
    this.mixPass.u.uSharp.value = sceneRT.texture; this.mixPass.u.uBlur.value = this.dofBlur.texture;
    this.mixPass.render(this.renderer, this.out);
    return this.out;
  }
  finish(src, opts) {
    const r = this.renderer;
    let prev = src;
    for (let i = 0; i < 6; i++) {
      this.pDown.u.uTex.value = prev.texture;
      this.pDown.u.uTexel.value.set(1 / prev.width, 1 / prev.height);
      this.pDown.u.uPrefilter.value = i === 0 ? 1 : 0;
      this.pDown.render(r, this.down[i]);
      prev = this.down[i];
    }
    let acc = this.down[5];
    for (let i = 4; i >= 0; i--) {
      this.pUp.u.uTex.value = acc.texture; this.pUp.u.uBase.value = this.down[i].texture;
      this.pUp.u.uTexel.value.set(1 / acc.width, 1 / acc.height); this.pUp.u.uBlend.value = 0.78;
      this.pUp.render(r, this.up[i]);
      acc = this.up[i];
    }
    this.pStar.u.uTex.value = this.down[0].texture;
    this.pStar.render(r, this.star);
    const u = this.pFinal.u;
    u.uTex.value = src.texture; u.uBloom.value = this.up[0].texture; u.uStar.value = this.star.texture;
    u.uExposure.value = opts.exposure; u.uBloomAmt.value = opts.bloom; u.uStarAmt.value = opts.star;
    u.uVignette.value = opts.vignette; u.uFrame.value = opts.frame; u.uFade.value = opts.fade;
    this.pFinal.render(r, null);
  }
}

// ---------------------------------------------------------------- director
// Everything below is a pure function of film time t (seconds).
const FILM = 20.0;
const HERO_RADIUS_MM = 2.65;

// film time -> simulation step, keyed on the ends of the weather layers
const GROWTH_KEYS = [[2.52, 0], [3.0, 1100], [3.55, 3900], [4.65, 12315], [5.3, 18530], [7.05, 42956], [8.5, 44595],
  [9.5, 51595], [11.1, 54108], [13.75, 67760], [14.9, 73760]];

function makeGrowthClock(res) {
  const steps = res.steps;
  const bin = 40, nb = Math.ceil(steps / bin) + 2;
  const area = new Float64Array(nb);
  for (let k = 0; k < res.N; k++) if (res.attachStep[k] >= 0) area[Math.min(nb - 1, Math.ceil(res.attachStep[k] / bin))]++;
  for (let i = 1; i < nb; i++) area[i] += area[i - 1];
  const reach = [[0, 0]];
  for (let i = 0; i < res.radiusLog.length; i++) if (res.radiusLog[i] > reach[reach.length - 1][1]) reach.push([(i + 1) * 20, res.radiusLog[i]]);
  if (reach[reach.length - 1][0] < steps) reach.push([steps, res.radius]);
  const reachAt = (s) => {
    let lo = 0, hi = reach.length - 1;
    if (s >= reach[hi][0]) return reach[hi][1];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (reach[m][0] <= s) lo = m; else hi = m; }
    return lerp(reach[lo][1], reach[hi][1], clamp((s - reach[lo][0]) / (reach[hi][0] - reach[lo][0]), 0, 1));
  };
  const radiusAt = (s) => {
    let sum = 0, w = 0;
    for (let k = -4; k <= 4; k++) { const a = 5 - Math.abs(k); sum += a * reachAt(Math.max(0, s + k * 110)); w += a; }
    return sum / w;
  };
  const areaAt = (s) => { const x = clamp(s / bin, 0, nb - 1.001), i = Math.floor(x); return lerp(area[i], area[i + 1], x - i); };
  const total = areaAt(steps), Rf = res.radius;
  // visual progress: part reach, part size of the ice
  const progress = (s) => 0.55 * radiusAt(s) / Rf + 0.45 * Math.sqrt(areaAt(s) / total);
  const raw = (t) => {
    if (t <= GROWTH_KEYS[0][0]) return 0;
    const last = GROWTH_KEYS[GROWTH_KEYS.length - 1];
    if (t >= last[0]) return steps;
    let k = 0; while (t > GROWTH_KEYS[k + 1][0]) k++;
    const [ta, sa] = GROWTH_KEYS[k], [tb, sb0] = GROWTH_KEYS[k + 1];
    const sb = Math.min(sb0, steps);
    const u = (t - ta) / (tb - ta);
    const pa = progress(sa), pb = progress(sb);
    if (pb - pa < 1e-5) return lerp(sa, sb, u);
    const want = lerp(pa, pb, u);
    let lo = sa, hi = sb;
    for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (progress(m) < want) lo = m; else hi = m; }
    return lerp((lo + hi) / 2, lerp(sa, sb, u), 0.12);
  };
  const step = (t) => { let s = 0, w = 0; for (let k = -4; k <= 4; k++) { const a = 5 - Math.abs(k); s += a * raw(t + k * 0.036); w += a; } return s / w; };
  const final = (t) => (t >= 15.0 ? steps + 400 : step(t));
  return { step: final, radiusAt, radius: (t) => radiusAt(Math.min(steps, step(t))), steps };
}

function makeDirector(clock, cellMM, restPos) {
  const preV = track([[0, Math.log(19)], [0.9, Math.log(23)], [1.9, Math.log(31)], [2.9, Math.log(31)], [3.6, Math.log(52)]]);
  const fill = track([[2.7, 0.33], [3.5, 0.42], [4.65, 0.45], [5.3, 0.45], [7.05, 0.58], [8.5, 0.66], [9.5, 0.68], [11.1, 0.74], [13.75, 0.79], [15.0, 0.79], [15.9, 0.64], [17.3, 0.58]]);
  const smoothRadius = (t) => { let s = 0, w = 0; for (let i = -5; i <= 5; i++) { const k = 1 - Math.abs(i) / 6; s += k * clock.radius(t + i * 0.09); w += k; } return Math.max(8, s / w); };
  const halfWidthCells = (t) => {
    const a = preV(t);
    if (t < 2.7) return Math.exp(a);
    const b = Math.log(smoothRadius(t) / fill(t));
    return Math.exp(lerp(a, b, sstep(2.7, 3.7, t)));
  };
  const W17 = halfWidthCells(17.05) * cellMM;
  const wideMM = track([[17.05, W17], [17.55, 5.8], [17.95, 6.65], [18.5, 7.4], [18.86, 7.3], [19.14, 5.95], [19.4, 4.5], [19.65, 4.04], [20.0, 3.9]]);
  const halfWidthMM = (t) => {
    if (t <= 17.05) return halfWidthCells(t) * cellMM;
    return wideMM(t);
  };

  const pitch = track([[0, -0.02], [4.5, -0.07], [9.5, -0.01], [14.0, -0.07], [15.2, -0.11], [16.2, -0.17], [17.05, -0.26], [17.52, -0.52], [17.94, -0.74], [18.5, -0.90], [20.0, -0.935]]);
  const yaw = track([[0, 0.11], [3, 0.03], [8, -0.07], [13, 0.06], [17, 0.01], [19.2, 0.0], [20, 0.035]]);
  const tilt = track([[0, 0.55], [2.4, 0.62], [3.2, 0.70], [4.1, 0.56], [4.9, 0.30], [5.9, 0.60], [6.8, 0.30], [7.7, 0.62], [8.35, 0.98], [9.1, 0.40], [10.2, 0.24], [11.0, 0.55], [11.9, 0.30], [12.65, 0.92], [13.5, 0.30], [14.5, 0.22], [15.4, 0.46], [16.2, 0.30], [17.0, 0.55], [17.8, 0.38], [20, 0.30]]);
  const SPIN_REST = 0.20;
  const approachS = track([[17.05, Math.log(0.0082)], [17.47, Math.log(0.031)], [17.89, Math.log(0.098)], [18.28, Math.log(0.285)], [18.60, Math.log(0.71)], [18.80, Math.log(0.965)], [18.9, 0]]);
  const below = track([[17.05, -0.285], [17.47, -0.135], [17.89, -0.055], [18.4, -0.014], [18.78, 0]]);

  // layer by layer colour of the air: top, bottom, mist, sun glow, density, warm
  const L = (t, top, bot, mist, sun, dens, warm) => [t, top, bot, mist, sun, [dens, warm]];
  const layers = [
    L(0.0, [0.0030, 0.0062, 0.021], [0.0085, 0.017, 0.044], [0.034, 0.064, 0.135], [0.085, 0.150, 0.300], 0.55, 0.62),
    L(2.9, [0.0035, 0.0075, 0.025], [0.0095, 0.021, 0.052], [0.040, 0.078, 0.160], [0.095, 0.170, 0.320], 0.56, 0.58),
    L(4.5, [0.0050, 0.0170, 0.044], [0.0130, 0.034, 0.072], [0.060, 0.120, 0.225], [0.130, 0.230, 0.390], 0.62, 0.45),
    L(6.2, [0.0070, 0.0230, 0.054], [0.0180, 0.046, 0.090], [0.075, 0.158, 0.272], [0.160, 0.270, 0.430], 0.72, 0.40),
    L(7.8, [0.0160, 0.0480, 0.084], [0.0360, 0.088, 0.132], [0.165, 0.285, 0.385], [0.250, 0.370, 0.490], 0.96, 0.35),
    L(9.1, [0.0075, 0.0070, 0.026], [0.0250, 0.0180, 0.046], [0.080, 0.064, 0.142], [0.180, 0.165, 0.340], 0.40, 0.95),
    L(10.6, [0.0070, 0.0320, 0.054], [0.0180, 0.064, 0.092], [0.090, 0.240, 0.300], [0.140, 0.320, 0.400], 0.90, 0.42),
    L(12.6, [0.0032, 0.0160, 0.030], [0.0100, 0.034, 0.052], [0.040, 0.115, 0.160], [0.095, 0.220, 0.290], 0.56, 0.62),
    L(14.4, [0.0140, 0.0160, 0.038], [0.0520, 0.034, 0.056], [0.135, 0.110, 0.178], [0.190, 0.180, 0.300], 0.76, 1.25),
    L(16.6, [0.0150, 0.0180, 0.042], [0.0500, 0.036, 0.060], [0.120, 0.105, 0.175], [0.170, 0.170, 0.290], 0.70, 1.25),
  ];
  const col = (i) => track(layers.map((l) => [l[0], l[i]]));
  const cTop = col(1), cBot = col(2), cMist = col(3), cSun = col(4), cDW = col(5);
  const bandTimes = [4.95, 7.0, 8.55, 9.55, 11.15, 13.85];

  const fall = integralTable(track([[0, 0.34], [2.4, 0.42], [3.6, 0.85], [8, 1.05], [14, 1.15], [17, 1.0], [18.35, 0.6], [19.05, 0.12], [20, 0.1]]), 21, 2100);
  const snowTravel = integralTable((t) => lerp(0.115, -0.082, sstep(18.3, 19.05, t)), 21, 2100);

  const vapourAmt = track([[0, 0.85], [1.0, 1.15], [2.0, 1.0], [2.9, 0.55], [4.0, 0.24], [6.5, 0.20], [7.8, 0.42], [9.2, 0.08], [10.6, 0.34], [12.2, 0.14], [14.5, 0.08], [15.3, 0]]);
  const exposure = track([[0, 1.18], [2.0, 1.12], [2.6, 1.0], [3.2, 1.02], [14, 1.0], [16, 1.0], [18, 1.06], [20, 1.16]]);
  const vAlt = track([[14.6, 322], [16.0, 255], [17.0, 214], [18.4, 178], [20, 170]]);
  const vPitch = track([[14.6, -0.060], [16.0, -0.105], [17.05, -0.175], [17.55, -0.36], [18.0, -0.54], [18.65, -0.70], [20, -0.72]]);

  const qA = new THREE.Quaternion(), qB = new THREE.Quaternion(), qC = new THREE.Quaternion(), eul = new THREE.Euler(0, 0, 0, 'YXZ');
  const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);

  return {
    fall, snowTravel, halfWidthMM, W17,
    state(t) {
      const s = {};
      s.t = t;
      // growth
      s.S = clock.step(t);
      s.soft = Math.max(24, Math.abs(clock.step(t + 0.034) - clock.step(t - 0.034)) * 0.55);
      s.radiusCells = clock.radius(t);

      // camera
      const W = halfWidthMM(t);
      s.halfWidth = W;
      s.camDist = W / Math.tan(10 * D2R);
      eul.set(pitch(t), yaw(t), 0.018 * Math.sin(t * 0.47 + 1.0) * (1 - sstep(18, 19, t)));
      s.camQuat = new THREE.Quaternion().setFromEuler(eul);
      s.fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(s.camQuat);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(s.camQuat), right = new THREE.Vector3(1, 0, 0).applyQuaternion(s.camQuat);

      // where the flake is: it falls onto the mitten along the line of sight
      s.mittenOn = t >= 17.05;
      s.flakePos = new THREE.Vector3();
      let dist = 0;
      if (s.mittenOn) {
        const k = Math.exp(approachS(Math.min(t, 18.9)));
        dist = s.camDist * (1 / k - 1);
        s.flakePos.copy(restPos).addScaledVector(s.fwd, -dist).addScaledVector(up, -below(Math.min(t, 18.78)) * (dist + s.camDist));
      }
      s.dist = dist;
      // gentle drift keeps the macro operator's framing alive
      const live = 1 - sstep(18.15, 19.0, t);
      const driftX = (0.045 * Math.sin(t * 0.93 + 0.4) + 0.022 * Math.sin(t * 2.17)) * W * live;
      const driftY = (0.036 * Math.sin(t * 0.77 + 2.0) + 0.018 * Math.sin(t * 1.83 + 1.0)) * W * live;
      const target = s.flakePos.clone().addScaledVector(right, -driftX).addScaledVector(up, -driftY);
      // once landed, ease the frame a touch so the arms sit centred
      target.addScaledVector(up, 0.10 * sstep(18.95, 19.6, t));
      s.camPos = target.clone().addScaledVector(s.fwd, -s.camDist);

      // pose: tumbling relative to the camera, then lying flat on the wool
      const th = tilt(t);
      const phi = 1.1 + 0.52 * t + 0.6 * Math.sin(0.61 * t);
      const spin = SPIN_REST + 0.205 * (t - 17.75) + 0.13 * Math.sin(0.83 * t) * (1 - sstep(17.0, 18.15, t));
      const falling = s.camQuat.clone()
        .multiply(qA.setFromAxisAngle(new THREE.Vector3(Math.cos(phi), Math.sin(phi), 0), th))
        .multiply(qB.setFromAxisAngle(Z, spin));
      const rest = qC.setFromAxisAngle(X, -Math.PI / 2 + 0.075).clone().multiply(qB.setFromAxisAngle(Z, SPIN_REST + 0.03));
      const land = sstep(17.6, 18.86, t);
      s.quat = falling.slerp(rest, land);
      if (t > 18.82) {
        const u = t - 18.82;
        s.quat.premultiply(qA.setFromAxisAngle(new THREE.Vector3(0.85, 0, 0.52), 0.085 * Math.exp(-u * 8.5) * Math.sin(u * 23.0)));
      }

      // nucleation
      const grow = sstep(0.62, 2.0, t);
      s.dropR = lerp(2.8, 11.6, Math.pow(grow, 0.8));
      s.dropOpacity = sstep(0.62, 1.0, t) * (1 - sstep(3.55, 3.98, t));
      s.frost = t < 1.96 ? 0 : 1 - sstep(2.52, 2.98, t);
      s.front = lerp(-1.25, 1.25, sstep(1.98, 2.5, t));
      s.morph = sstep(2.40, 2.93, t);
      s.prismR = Math.max(lerp(11.6, 12.8, sstep(2.4, 3.0, t)), t > 2.9 ? s.radiusCells * 1.02 : 0);
      s.prismAspect = lerp(0.62, 0.17, sstep(2.95, 3.75, t));
      s.crystalOpacity = sstep(3.32, 3.78, t);
      s.grainGlint = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * 5.3 + 0.7), 6) + 1.2 * Math.exp(-((t - 0.55) ** 2) * 60);
      s.flash = Math.exp(-((t - 2.9) ** 2) * 70);

      // air
      s.top = cTop(t); s.bot = cBot(t); s.mist = cMist(t); s.sun = cSun(t);
      const dw = cDW(t); s.density = dw[0]; s.warm = dw[1];
      s.band = -3; s.bandAmt = 0;
      for (const bt of bandTimes) {
        const u = (t - bt) / 0.5;                      // layers are >= 1 s apart: windows never overlap
        if (Math.abs(u) < 1) { s.band = -u * 1.75; s.bandAmt = 0.72 * (1 - u * u) * (1 - u * u); }
      }
      s.fall = fall(t);
      s.snowTravel = snowTravel(t);
      s.reveal = sstep(14.72, 16.55, t);
      s.valleyOn = t > 14.7;
      s.vAlt = vAlt(t);
      s.vPitch = vPitch(t);
      s.vYaw = 0.055 * (1 - sstep(14.7, 18, t));

      // light
      const dusk = sstep(14.9, 16.3, t), onWool = sstep(17.5, 18.65, t);
      const mix3 = (a, b, c) => [0, 1, 2].map((i) => lerp(lerp(a[i], b[i], dusk), c[i], onWool));
      s.envTop = mix3([0.048, 0.092, 0.170], [0.052, 0.092, 0.205], [0.080, 0.125, 0.240]);
      s.envMid = mix3([0.015, 0.031, 0.060], [0.150, 0.098, 0.128], [0.070, 0.070, 0.112]);
      s.envLow = mix3([0.0035, 0.0065, 0.013], [0.020, 0.025, 0.046], [0.007, 0.008, 0.013]);
      s.keyCol = mix3([0.64, 0.82, 1.0], [0.62, 0.76, 1.0], [0.68, 0.84, 1.0]);
      s.rimCol = mix3([1.08, 0.50, 0.19], [1.18, 0.50, 0.20], [1.22, 0.55, 0.23]);
      // the layers also tint the studio the ice reflects
      const air = (1 - dusk);
      s.envMid = s.envMid.map((v, i) => v + s.mist[i] * 0.10 * air);
      s.milk = lerp(1 + 0.45 * sstep(6.6, 9.2, t) * (1 - sstep(14.6, 16.0, t)), 1.5, onWool);
      s.sweep = sstep(18.92, 19.14, t) * (1 - 0.45 * sstep(19.72, 20.0, t));
      s.sweepAngle = lerp(2.9, -1.75, sstep(18.94, 19.9, t));
      s.sweepOffset = 1;
      s.armAmt = sstep(18.98, 19.14, t);
      s.armAngle = -2.35 + Math.PI * 2 * 1.08 * sstep(19.02, 19.82, t);
      s.armRest = sstep(19.66, 19.93, t);
      // as each new layer of air arrives, a soft light slides across the faces
      for (const [at, ang, amp] of [[5.75, 2.5, 0.22], [7.65, -0.6, 0.30], [9.55, 0.7, 0.46], [10.85, 3.5, 0.44], [12.15, -1.9, 0.40], [13.45, 2.1, 0.46], [14.75, 0.2, 0.40], [16.25, 2.8, 0.34]]) {
        const u = (t - at) / 0.64;                     // spaced >= 1.3 s: windows never overlap
        if (Math.abs(u) < 1) { s.sweep = amp * (1 - u * u) * (1 - u * u); s.sweepAngle = ang; s.sweepOffset = u * 0.95; }
      }

      // lens
      const near = Math.max(s.camDist * 0.18, 0.05);
      s.near = near;
      s.far = s.mittenOn ? dist + s.camDist + 900 : s.camDist * 8;
      s.lens = {
        // focus a hair behind the flake so the nap under it stays crisp too
        near, far: s.far, focus: s.camDist + 0.28 * onWool,
        aperture: lerp(62, 82, onWool),
        maxCoc: t < 17.05 ? 15 : track([[17.05, 3.2], [17.75, 7.5], [18.35, 13], [18.85, 19], [20, 21]])(t),
        bgCoc: 0,
      };
      s.vapour = vapourAmt(t);
      s.exposure = exposure(t) * (1 + 0.30 * s.flash);
      s.bloom = 0.42 + 0.25 * s.flash;
      s.star = 0.34;
      return s;
    },
  };
}

// ---------------------------------------------------------------- main
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
const canvas = document.getElementById('view');
const status = document.getElementById('status');
if (RENDER) status.style.display = 'none';

function chooseSize() {
  if (RENDER) return +(params.get('res') || 2160);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  return Math.max(480, Math.min(+(params.get('res') || 1440), Math.floor(Math.min(innerWidth, innerHeight) * dpr)));
}

async function main() {
  const t0 = performance.now();
  const N = chooseSize();
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: RENDER, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(N, N, false);
  renderer.autoClear = false;
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  const quality = N >= 1000 ? 1 : 0.5;

  // ---- grow every crystal in the film ----
  const { placed, columns } = layoutNeighbours();
  const capJobs = [3, 5, 9, 11, 15, 17].map((s) => ({ layers: SIM.neighbourHistory(s * 13 + 1), R: 110, maxSteps: 60000, margin: 45 }));
  const jobs = [{ hero: true, R: 440, maxSteps: 200000, margin: 70 }, ...neighbourJobs(placed), ...capJobs];
  let heroSteps = 0, doneJobs = 0;
  const results = await runJobs(jobs, (done, total, heroStep) => {
    if (heroStep !== undefined) heroSteps = heroStep; else doneJobs = done;
    status.textContent = `growing ${jobs.length} snow crystals on the lattice · ${doneJobs}/${jobs.length} done · hero crystal step ${heroSteps.toLocaleString()} of ${SIM.HERO_STEPS.toLocaleString()}`;
  });
  const hero = results[0];
  const growMs = performance.now() - t0;
  status.textContent = 'knitting the mitten…';
  await new Promise((r) => setTimeout(r, 30));

  // ---- hero crystal ----
  const heroWedge = SIM.makeWedge(hero.R);
  const heroField = { lattice: latticeTexture(hero), E: hero.radius * 1.04, ageSpan: hero.steps, R: hero.R };
  const cellMM = HERO_RADIUS_MM / hero.radius;
  const heroUnitMM = heroField.E * cellMM;        // millimetres per crystal-local unit
  const FIELD = N >= 1400 ? 2048 : 1536;
  const heroBuilder = new FieldBuilder(renderer, FIELD);
  const heroHeight = makeHeightRT(FIELD, renderer);
  const hollows = findSealedHollows(hero, heroWedge);
  const pockets = findAirPockets(hero, heroWedge).concat(hollows);
  const bubbles = bubbleTexture(renderer, pockets, heroField.E, 1536, hero.steps);

  const lights = {
    uEnvTop: { value: new THREE.Vector3() }, uEnvMid: { value: new THREE.Vector3() }, uEnvLow: { value: new THREE.Vector3() },
    uKeyCol: { value: new THREE.Vector3(0.65, 0.82, 1) }, uRimCol: { value: new THREE.Vector3(1, 0.54, 0.25) },
    uSweep: { value: 0 }, uSweepDir: { value: new THREE.Vector3(0, 0, 1) },
    uBg: { value: null }, uRes: { value: new THREE.Vector2(N, N) }, uRefract: { value: 0.15 },
  };
  const milk = { value: 1 };

  const iceScene = new THREE.Scene();
  const opaqueScene = new THREE.Scene();

  const heroGroup = new THREE.Group();
  const heroMesh = makeIceMesh(lights, heroHeight.texture, FIELD, { bubbles, seed: 1 });
  heroMesh.material.uniforms.uMilk = milk;
  heroMesh.scale.setScalar(heroUnitMM);
  heroGroup.add(heroMesh);
  const seedMesh = makePrismMesh(lights);
  seedMesh.scale.setScalar(heroUnitMM);
  heroGroup.add(seedMesh);
  iceScene.add(heroGroup);

  const grainGroup = new THREE.Group();
  const grain = makeGrain(lights);
  grain.scale.multiplyScalar(heroUnitMM);
  grainGroup.add(grain);
  opaqueScene.add(grainGroup);

  const vapour = makeVapour(lights, 2100);
  const vapourScene = new THREE.Scene();
  const vapourGroup = new THREE.Group();
  vapourGroup.add(vapour);
  vapourScene.add(vapourGroup);

  // ---- the mitten and everything resting on it ----
  const mit = {
    uniforms: {
      uKeyW: { value: MIT.keyW }, uRimW: { value: MIT.rimW },
      uKeyWCol: { value: new THREE.Vector3(2.05, 2.55, 3.5) }, uRimWCol: { value: new THREE.Vector3(4.3, 2.05, 0.8) },
      uAmb: { value: new THREE.Vector3(0.25, 0.33, 0.53) },
      uShadowTex: { value: null }, uHeroH: { value: heroHeight.texture }, uHeroInv: { value: new THREE.Matrix4() },
      uHeroP: { value: new THREE.Vector3() }, uHeroN: { value: new THREE.Vector3(0, 1, 0) }, uHeroOn: { value: 0 }, uDetail: { value: 1 },
    },
  };
  const mitten = new THREE.Group();
  mitten.add(buildBody(mit));
  const yarn = buildYarn(mit);
  mitten.add(yarn.mesh);
  mitten.add(buildSleeve(mit));
  mitten.add(buildDusting(mit));
  const heightAt = makeHeightMap(yarn.positions);
  const heroRest = restingFrame(heightAt, 0, 0, HERO_RADIUS_MM * 0.9, 0);
  const restPos = new THREE.Vector3(0, heroRest.y + 0.20, 0);

  const flakeBuilder = new FieldBuilder(renderer, 512);
  const flakes = [];
  const buildFlakeField = (res, seed) => {
    const field = { lattice: latticeTexture(res), E: res.radius * 1.04, ageSpan: res.steps, R: res.R };
    const rt = makeHeightRT(512, renderer);
    flakeBuilder.build(field, res.steps + 1000, 40, rt);
    field.lattice.dispose();
    const mesh = makeIceMesh(lights, rt.texture, 512, { seed });
    mesh.material.uniforms.uGlintAmt.value = 0.35;
    mesh.material.uniforms.uMilk = milk;
    return { mesh, height: rt.texture, E: field.E, radiusCells: res.radius };
  };
  const rndF = makeRng(606);
  const clearances = [{ x: 0, z: 0, r: HERO_RADIUS_MM * 1.02, y: restPos.y }];
  placed.forEach((p, i) => {
    const f = buildFlakeField(results[1 + i], 2 + (i % 17));
    const rf = restingFrame(heightAt, p[0], p[1], p[2], 0);
    const normal = rf.normal.clone().add(new THREE.Vector3((rndF() - 0.5) * 0.16, 0, (rndF() - 0.5) * 0.16)).normalize();
    const y = rf.y + 0.09 + rndF() * 0.09;
    f.mesh.position.set(p[0], y, p[1]);
    f.mesh.quaternion.copy(flakeQuaternion(normal, rndF() * Math.PI * 2));
    f.mesh.scale.setScalar(p[2] * f.E / f.radiusCells);
    f.mesh.material.uniforms.uBright.value = 0.96 + 0.1 * rndF();
    mitten.add(f.mesh);
    flakes.push(f);
    clearances.push({ x: p[0], z: p[1], r: p[2], y });
  });
  const iceGroupOnWool = new THREE.Group();
  flakes.forEach((f) => iceGroupOnWool.add(f.mesh));
  const caps = capJobs.map((_, i) => buildFlakeField(results[1 + placed.length + i], 21 + i));
  let capAt = 0;
  for (const spec of columns) {
    const pair = spec.kind === 'capped' ? [caps[capAt++], caps[capAt++]] : null;
    iceGroupOnWool.add(buildColumnCrystal(lights, spec, heightAt, pair));
    clearances.push({ x: spec.x, z: spec.z, r: 0.8, y: heightAt(spec.x, spec.z) + 0.3 });
  }
  iceScene.add(iceGroupOnWool);
  const fibres = buildFibres(mit, yarn.roots, clearances);
  mitten.add(fibres);
  const grains = buildGrains(mit, heightAt, clearances);
  mitten.add(grains);
  opaqueScene.add(mitten);
  iceGroupOnWool.updateMatrixWorld(true);
  mit.uniforms.uShadowTex.value = renderFlakeShadows(renderer, flakes);

  // ---- backdrops and post ----
  const half = N >> 1;
  const clock = makeGrowthClock(hero);
  const director = makeDirector(clock, cellMM, restPos);
  const valley = makeValley();
  // 2x supersampled and box filtered, rather than multisampled: thousands of
  // overlapping sub-pixel pines did not resolve bit-identically with MSAA
  const valleyRT = makeRT(half * 2, half * 2, { depthBuffer: true, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  const boxDown = fsPass('uniform sampler2D uTex; void main(){ ivec2 p = ivec2(gl_FragCoord.xy)*2; outColor = 0.25*(texelFetch(uTex, p, 0) + texelFetch(uTex, p + ivec2(1,0), 0) + texelFetch(uTex, p + ivec2(0,1), 0) + texelFetch(uTex, p + ivec2(1,1), 0)); }', { uTex: { value: null } });
  const valleySmall = makeRT(half, half);
  const valleyA = makeRT(half, half), valleyB = makeRT(half, half);
  const blurPass = fsPass(FIELD_BLUR, { uTex: { value: null }, uStep: { value: new THREE.Vector2() }, uSigma: { value: 1 } });
  const bgRT = makeRT(half, half);
  const cloud = makeCloudPass();
  const motes = makeBokeh(520, 11, { sizeMin: 0.0035, sizeMax: 0.075, soft: 0.40, speed: 0.17, clear: 0.5 });
  const bigBokeh = makeBokeh(70, 23, { sizeMin: 0.03, sizeMax: 0.17, soft: 0.62, speed: 0.12, clear: 0.6 });
  const snowBack = makeBokeh(640, 37, { sizeMin: 0.0030, sizeMax: 0.030, soft: 0.50, speed: 1.0 });
  const snowFront = makeBokeh(30, 53, { sizeMin: 0.010, sizeMax: 0.085, soft: 0.66, speed: 1.25, clear: 0.9 });
  const frontMotes = makeBokeh(16, 71, { sizeMin: 0.05, sizeMax: 0.24, soft: 0.85, speed: 0.42, clear: 1.0 });
  const sparkles = makeBokeh(170, 83, { sizeMin: 0.0015, sizeMax: 0.0065, soft: 0.75, speed: 0.34, clear: 0.2 });

  const opaqueRT = makeRT(N, N, { samples: 4, depthBuffer: true });
  opaqueRT.depthTexture = new THREE.DepthTexture(N, N, THREE.UnsignedIntType);
  const refrRT = makeRT(N, N, { minFilter: THREE.LinearMipmapLinearFilter, generateMipmaps: true });
  const sceneRT = makeRT(N, N, { depthBuffer: true });
  sceneRT.depthTexture = new THREE.DepthTexture(N, N, THREE.UnsignedIntType);
  const copy = fsPass('uniform sampler2D uTex; void main(){ outColor = textureLod(uTex, vUv, 0.0); }', { uTex: { value: null } });
  // the backdrop is the first thing drawn in the opaque pass, so the
  // multisampled target is filled and resolved exactly once per frame
  const backdrop = new THREE.Mesh(fsqGeo, new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: { uTex: { value: bgRT.texture } }, depthTest: false, depthWrite: false,
    vertexShader: 'out vec2 vUv; void main(){ vUv = position.xy*0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D uTex; void main(){ o = vec4(textureLod(uTex, vUv, 0.0).rgb, 1.0); }',
  }));
  backdrop.frustumCulled = false; backdrop.renderOrder = -1000;
  opaqueScene.add(backdrop);
  const copyDepth = fsPass('uniform sampler2D uTex, uDepth; void main(){ outColor = textureLod(uTex, vUv, 0.0); gl_FragDepth = textureLod(uDepth, vUv, 0.0).r; }',
    { uTex: { value: null }, uDepth: { value: null } }, { depthTest: true, depthWrite: true, depthFunc: THREE.AlwaysDepth });
  const post = new Post(renderer, N, quality);
  lights.uBg.value = refrRT.texture;

  const camera = new THREE.PerspectiveCamera(20, 1, 0.1, 5000);
  const basis = new THREE.Matrix4(), q = new THREE.Quaternion(), eul = new THREE.Euler(0, 0, 0, 'YXZ');
  const heroN = new THREE.Vector3(), tmpV = new THREE.Vector3();
  let builtKey = null;

  function frame(t) {
    t = clamp(t, 0, FILM);
    const s = director.state(t);
    renderer.setClearColor(0x000000, 0);

    // the crystal at this instant of its life
    const key = s.S.toFixed(2) + '|' + s.soft.toFixed(2);
    if (key !== builtKey) { heroBuilder.build(heroField, s.S, s.soft, heroHeight); builtKey = key; }

    lights.uEnvTop.value.fromArray(s.envTop); lights.uEnvMid.value.fromArray(s.envMid); lights.uEnvLow.value.fromArray(s.envLow);
    lights.uKeyCol.value.fromArray(s.keyCol); lights.uRimCol.value.fromArray(s.rimCol);
    milk.value = s.milk;

    camera.fov = 20; camera.near = s.near; camera.far = s.far;
    camera.position.copy(s.camPos); camera.quaternion.copy(s.camQuat);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);

    heroGroup.position.copy(s.flakePos); heroGroup.quaternion.copy(s.quat);
    heroGroup.updateMatrixWorld(true);
    grainGroup.position.copy(s.flakePos); grainGroup.quaternion.copy(s.quat);
    grain.rotation.set(0.5 + t * 0.9 * (1 - sstep(1.2, 2.4, t)) + 1.1 * sstep(1.2, 2.4, t), t * 1.3 * (1 - sstep(1.2, 2.4, t)) + 2.0 * sstep(1.2, 2.4, t), 0.3);
    grain.material.uniforms.uGlint.value = s.grainGlint;

    const hm = heroMesh.material.uniforms;
    hm.uOpacity.value = s.crystalOpacity;
    hm.uArmAmt.value = s.armAmt; hm.uArmAngle.value = s.armAngle; hm.uArmRest.value = s.armRest;
    hm.uStepFrac.value = Math.min(1.05, s.S / hero.steps);
    heroMesh.visible = s.crystalOpacity > 0.001;

    const su = seedMesh.material.uniforms;
    seedMesh.visible = s.dropOpacity > 0.001;
    su.uOpacity.value = s.dropOpacity;
    su.uSphereR.value = s.dropR * CELL;
    su.uRadius.value = s.prismR * CELL;
    su.uHalfH.value = s.prismR * CELL * s.prismAspect;
    su.uMorph.value = s.morph; su.uFrost.value = s.frost; su.uFront.value = s.front;
    su.uBright.value = 1 + 0.5 * s.flash;

    // finale: a warm lamp swings round the six arms
    heroN.set(0, 0, 1).applyQuaternion(s.quat);
    const nv = heroN.clone().applyQuaternion(q.copy(s.camQuat).invert());
    const V = new THREE.Vector3(0, 0, 1);
    const R = nv.clone().multiplyScalar(2 * nv.dot(V)).sub(V).normalize();
    const a = s.sweepAngle;
    R.add(tmpV.set(Math.cos(a) * 0.55, Math.sin(a) * 0.42, 0.10 * Math.sin(a * 2)).multiplyScalar(s.sweepOffset)).normalize();
    lights.uSweepDir.value.copy(R);
    lights.uSweep.value = s.sweep;

    mitten.visible = s.mittenOn;
    iceGroupOnWool.visible = s.mittenOn;
    mit.uniforms.uHeroOn.value = s.mittenOn ? 1 : 0;
    const detail = 1 - sstep(170, 520, s.dist);
    mit.uniforms.uDetail.value = detail;
    yarn.mesh.visible = detail > 0.01;
    grains.visible = detail > 0.6;
    mit.uniforms.uHeroP.value.copy(s.flakePos);
    mit.uniforms.uHeroN.value.copy(heroN.y < 0 ? heroN.clone().negate() : heroN);
    heroMesh.updateMatrixWorld(true);
    mit.uniforms.uHeroInv.value.copy(heroMesh.matrixWorld).invert();
    fibres.material.uniforms.uPxAngle.value = 2 * Math.tan(10 * D2R) / N;

    // ---- backdrop ----
    if (s.valleyOn) {
      const vc = valley.camera;
      vc.position.set(8 * Math.sin(t * 0.3), s.vAlt, -(t - 15) * 7);
      vc.quaternion.setFromEuler(eul.set(s.vPitch, s.vYaw, 0));
      vc.updateMatrixWorld(true);
      valley.update(t);
      renderer.setRenderTarget(valleyRT); renderer.clear(); renderer.render(valley.scene, vc);
      boxDown.u.uTex.value = valleyRT.texture; boxDown.render(renderer, valleySmall);
      // macro depth of field: the valley stays readable but soft
      const sigma = lerp(2.1, 4.6, sstep(17.2, 18.45, t)) * half / 1080;
      const bu = blurPass.u;
      bu.uSigma.value = sigma;
      bu.uTex.value = valleySmall.texture; bu.uStep.value.set(1 / half, 0); blurPass.render(renderer, valleyA);
      bu.uTex.value = valleyA.texture; bu.uStep.value.set(0, 1 / half); blurPass.render(renderer, valleyB);
    }
    const cu = cloud.u;
    basis.makeRotationFromQuaternion(s.camQuat); cu.uBasis.value.setFromMatrix4(basis);
    cu.uTime.value = t; cu.uFall.value = s.fall; cu.uDensity.value = s.density; cu.uBand.value = s.band; cu.uBandAmt.value = s.bandAmt;
    cu.uTop.value.fromArray(s.top); cu.uBot.value.fromArray(s.bot); cu.uMist.value.fromArray(s.mist); cu.uSunCol.value.fromArray(s.sun);
    cu.uWarm.value.set(0.46, 0.185, 0.070); cu.uWarmAmt.value = s.warm; cu.uReveal.value = s.reveal;
    cu.uValleyOn.value = s.valleyOn ? 1 : 0; cu.uValley.value = valleyB.texture;
    cloud.render(renderer, bgRT);

    const zoom = 1 + 0.10 * Math.sin(t * 0.21);
    const mistA = [s.mist[0] * 1.25 + 0.045, s.mist[1] * 1.25 + 0.075, s.mist[2] * 1.2 + 0.115];
    const cloudAmt = 1 - s.reveal;
    if (cloudAmt > 0.002) {
      for (const [b, gain] of [[bigBokeh, 0.34], [motes, 0.70]]) {
        b.u.uTime.value = t; b.u.uTravel.value = s.fall * 0.92; b.u.uZoom.value = zoom;
        b.u.uColA.value.fromArray(mistA); b.u.uColB.value.set(0.62, 0.30, 0.12);
        b.u.uAmount.value = cloudAmt * gain * (0.45 + 0.75 * s.density);
        b.render(renderer, bgRT);
      }
    }
    if (s.reveal > 0.002) {
      const u = snowBack.u;
      u.uTime.value = t; u.uTravel.value = s.snowTravel; u.uZoom.value = 1;
      u.uColA.value.set(0.30, 0.38, 0.56); u.uColB.value.set(0.70, 0.46, 0.34);
      u.uAmount.value = s.reveal * 0.55;
      snowBack.render(renderer, bgRT);
    }

    // ---- opaque things ----
    renderer.setRenderTarget(opaqueRT);
    renderer.setClearColor(0x000000, 1);
    renderer.clear();
    renderer.render(opaqueScene, camera);

    copy.u.uTex.value = opaqueRT.texture;
    copy.render(renderer, refrRT);

    // ---- ice ----
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    copyDepth.u.uTex.value = opaqueRT.texture; copyDepth.u.uDepth.value = opaqueRT.depthTexture;
    copyDepth.render(renderer, sceneRT);
    renderer.setRenderTarget(sceneRT);
    renderer.render(iceScene, camera);

    // ---- lens ----
    const lens = s.lens;
    lens.tilt = s.mittenOn ? sstep(18.3, 18.95, t) : 0;
    if (lens.tilt > 0) {
      const pv = s.flakePos.clone().applyMatrix4(camera.matrixWorldInverse);
      const nvw = heroN.clone().transformDirection(camera.matrixWorldInverse);
      const ndc = s.flakePos.clone().project(camera);
      lens.planeP = pv; lens.planeN = nvw;
      lens.centre = [ndc.x * 0.5 + 0.5, ndc.y * 0.5 + 0.5];
      lens.radius = 0.5 * HERO_RADIUS_MM / s.halfWidth;
    }
    const out = post.dof(sceneRT, lens);

    if (s.vapour > 0.001) {
      const vu = vapour.material.uniforms;
      vapourGroup.position.copy(s.flakePos); vapourGroup.quaternion.copy(s.camQuat);
      vapour.scale.setScalar(heroUnitMM);
      vu.uTime.value = t; vu.uView.value = s.halfWidth / heroUnitMM;
      vu.uUnitMM.value = heroUnitMM;
      vu.uSurface.value = Math.max(t < 3.3 ? s.dropR : 0, s.radiusCells * 0.92, 3.5) * CELL;
      vu.uAmount.value = s.vapour * (0.15 + 0.17 * (1 - sstep(2.6, 4.2, t)));
      vu.uCol.value.setRGB(0.36 + s.mist[0], 0.55 + s.mist[1] * 0.8, 0.78 + s.mist[2] * 0.5);
      renderer.setRenderTarget(out);
      renderer.render(vapourScene, camera);
    }
    if (cloudAmt > 0.002) {
      let u = sparkles.u;
      u.uTime.value = t * 1.6; u.uTravel.value = s.fall; u.uZoom.value = zoom;
      u.uColA.value.set(0.60, 0.82, 1.05); u.uColB.value.set(1.2, 0.75, 0.40);
      u.uAmount.value = cloudAmt * 0.50 * (0.5 + 0.6 * s.density);
      sparkles.render(renderer, out);
      u = frontMotes.u;
      u.uTime.value = t; u.uTravel.value = s.fall; u.uZoom.value = zoom;
      u.uColA.value.fromArray(mistA); u.uColB.value.set(0.50, 0.24, 0.10);
      u.uAmount.value = cloudAmt * 0.17;
      frontMotes.render(renderer, out);
    }
    if (s.reveal > 0.002) {
      const u = snowFront.u;
      u.uTime.value = t; u.uTravel.value = s.snowTravel; u.uZoom.value = 1;
      u.uColA.value.set(0.36, 0.45, 0.65); u.uColB.value.set(0.80, 0.52, 0.36);
      u.uAmount.value = s.reveal * 0.30;
      snowFront.render(renderer, out);
    }

    post.finish(out, { exposure: s.exposure, bloom: s.bloom, star: s.star, vignette: 0.40, frame: Math.round(t * 30), fade: 1 });
    return s;
  }

  const info = () => {
    const gl = renderer.getContext();
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return {
      gpu: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown', size: N, growMs: Math.round(growMs), setupMs: Math.round(performance.now() - t0),
      heroSteps: hero.steps, heroRadius: hero.radius, crystals: jobs.length, pockets: pockets.length, sealedHollows: hollows.length, trees: valley.treeCount,
    };
  };

  // warm up every program so the first captured frame is complete
  for (const t of [1.0, 3.0, 8.0, 15.6, 18.4, 19.8]) frame(t);
  renderer.getContext().finish();
  status.style.display = 'none';

  if (RENDER) {
    window.renderAt = (t) => { frame(t); };
    window.filmInfo = info();
    window.__dbg = { THREE, renderer, opaqueScene, mitten, fibres, yarn: yarn.mesh, iceScene, valley, grains, iceGroupOnWool, post, opaqueRT, sceneRT, bgRT, heroHeight };
    window.grabFrame = () => {
      const gl = renderer.getContext();
      renderer.setRenderTarget(null);
      const px = new Uint8Array(N * N * 4);
      gl.readPixels(0, 0, N, N, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return px;
    };
    window.__ready = true;
    renderAt(0);
  } else {
    console.log('film ready', info());
    // the film clock advances by capped frame steps, so a stall (shader warm-up,
    // a background tab) pauses the story instead of skipping part of it
    const at = parseFloat(params.get('t'));
    let clockT = Number.isFinite(at) ? at : 0, last = null, paused = false;
    const loop = () => {
      const now = performance.now();
      if (last !== null && !paused) clockT += Math.min((now - last) / 1000, 0.1);
      last = now;
      if (clockT > FILM + 1.5) clockT = 0;       // hold the final macro, then replay
      window.__filmTime = clockT;
      frame(Math.min(clockT, FILM));
      requestAnimationFrame(loop);
    };
    addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); paused = !paused; } });
    canvas.addEventListener('click', () => { clockT = 0; paused = false; });
    requestAnimationFrame(loop);
  }
}

main().catch((e) => {
  console.error(e);
  status.style.display = 'block';
  status.textContent = 'could not start: ' + e.message;
  window.__error = String(e.stack || e);
});

</script>
</body>
