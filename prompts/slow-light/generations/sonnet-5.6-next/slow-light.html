<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Light (c = 5 m/s)</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,100vh);height:min(100vw,100vh);display:block}
  body.render{display:block}
  body.render canvas{width:1080px;height:1080px}
  #loading{position:fixed;color:#56627a;font:14px system-ui,sans-serif;letter-spacing:.08em}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">building the street…</div>
<canvas id="c" width="1080" height="1080"></canvas>
<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ───────────────────────────── core: constants, physics timeline, camera ─────────────────────────────
const QS = new URLSearchParams(location.search);
const RENDER_MODE = QS.get('render') === '1';
const C_LIGHT = 5.0;                      // metres per second. The whole film.
const DURATION = 20.0;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = mulberry32(1888);
const rand = (a = 0, b = 1) => a + (b - a) * RNG();
const pick = arr => arr[Math.floor(RNG() * arr.length)];

// Camera path. At t = 2.000 s the camera is exactly 10.000 m from the bulb, so the bulb appears at t = 2 s.
function cameraAt(t) {
  const drift = t < 2 ? (2 - t) : 0;                           // slow dolly in the dark
  const late = Math.max(t - 2, 0);
  const crane = smoother((t - 8.6) / 12.4);
  const pos = V3(0.6 + 0.03 * drift - 0.006 * late,
                 2.3 + 1.75 * crane,
                 0.0 + 0.06 * drift - 0.013 * late + 0.25 * crane);
  const tgt = V3(-0.12 - 0.003 * late + 0.004 * drift, 3.50 + 0.42 * crane, -10.0);
  return { pos, tgt };
}
const FOV = 62;

// ── lamps ──  on/off are EMISSION times (when the source itself changes). What you see is later by path/c.
const LAMPS = [
  { name: 'bulb',    pos: V3(-3.0, 7.1, -8.0),     on: 0.0,  off: 12.05, color: [1.0, 0.495, 0.175], flare: [1.0, 0.87, 0.70], I: 122, radius: 0.05, shadow: 2048 },
  { name: 'lantern', pos: V3(-1.34, 3.60, -14.2),  on: 6.40, off: 12.42, color: [0.60, 0.95, 0.74], flare: [0.80, 1.0, 0.88], I: 17,  radius: 0.09, shadow: 1024 },
  { name: 'neon',    pos: V3(2.19, 3.36, -11.88),  on: 8.50, off: 12.30, color: [1.0, 0.10, 0.34],  flare: [1.0, 0.42, 0.55], I: 13,  radius: 0.20, shadow: 1024 },
];
const MOON_DIR = V3(0.62, 0.70, -0.30).normalize();

// ── actors see light-travel delay too: what the camera shows at time t is the object's state at t - dist/c
const poseTime = (t, p, camPos) => t - p.distanceTo(camPos) / C_LIGHT;

// ───────────────────────────── shaders ─────────────────────────────
const GLSL_NOISE = /* glsl */`
float hash13(vec3 p3){ p3 = fract(p3*.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 hash33(vec3 p3){ p3 = fract(p3*vec3(.1031,.1030,.0973)); p3 += dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5;} return s; }
float fbm2(vec3 p){ return .65*vnoise(p)+.35*vnoise(p*2.17+7.3); }
`;

// The ONE physical law of the film: a lamp's intensity as a function of emission time tau = t - pathLength / c.
const GLSL_PHYSICS = /* glsl */`
#define C_LIGHT 5.0
#define RISE 0.016
#define FALL 0.022
#define FLARE_TF 0.042
#define FLARE_A 6.2
uniform vec3 uLampPos[3];
uniform vec3 uLampCol[3];
uniform vec3 uFlareCol[3];
uniform vec3 uLampTiming[3];   // x = on, y = off, z = radius
uniform float uTime;
float s01(float x){ x=clamp(x,0.,1.); return x*x*(3.-2.*x); }
float neonStutter(float a){
  float e=0.006;
  float g1 = s01((a-0.080)/e)*(1.-s01((a-0.175)/e));
  float g2 = s01((a-0.245)/e)*(1.-s01((a-0.385)/e));
  float g3 = s01((a-0.455)/e)*(1.-s01((a-0.495)/e));
  return 1.0 - 0.95*(g1+g2+g3);
}
vec2 lampProfile(int i, float tau){
  float a = tau - uLampTiming[i].x;
  if(a <= 0.0) return vec2(0.0);
  float on = s01(a/RISE);
  float off = 1.0 - s01((tau - uLampTiming[i].y)/FALL);
  float fl = on*exp(-a/FLARE_TF)*FLARE_A;
  float st = (i==2) ? neonStutter(a) : 1.0;
  return vec2(on*off*st, fl*off*st);
}
vec3 lampEmit(int i, float tau){ vec2 p = lampProfile(i,tau); return uLampCol[i]*p.x + uFlareCol[i]*p.y; }
`;

const GBUF_VERT = /* glsl */`
in vec3 aColor;
in vec4 aMat;
out vec3 vWP;
out vec3 vN;
out vec3 vCol;
flat out vec4 vMat;
out vec3 vLocal;
void main(){
  vec3 p = position; vec3 n = normal; vec3 col = aColor;
  #ifdef USE_INSTANCING
    vec3 s2 = vec3(dot(instanceMatrix[0].xyz,instanceMatrix[0].xyz), dot(instanceMatrix[1].xyz,instanceMatrix[1].xyz), dot(instanceMatrix[2].xyz,instanceMatrix[2].xyz));
    n = mat3(instanceMatrix) * (n / s2);
    p = (instanceMatrix * vec4(p,1.0)).xyz;
    #ifdef USE_INSTANCING_COLOR
      col *= instanceColor;
    #endif
  #endif
  vec4 wp = modelMatrix * vec4(p,1.0);
  vWP = wp.xyz; vN = normalize(mat3(modelMatrix)*n); vCol = col; vMat = aMat; vLocal = position;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const GBUF_FRAG = /* glsl */`
precision highp float;
in vec3 vWP; in vec3 vN; in vec3 vCol; flat in vec4 vMat; in vec3 vLocal;
uniform vec3 uViewPos;
uniform vec4 uClipPlane;
uniform float uTime;
uniform vec4 uDrips[24];     // xz position, phase, period
layout(location=0) out vec4 gPos;
layout(location=1) out vec4 gNor;
layout(location=2) out vec4 gAlb;
layout(location=3) out vec4 gEmi;
${GLSL_NOISE}

// bricks in wall coordinates
vec4 brickPat(vec2 q, vec2 sz){
  float row = floor(q.y/sz.y);
  float off = mod(row,2.0)*0.5 + hash12(vec2(row,3.1))*0.12;
  vec2 c = vec2(q.x/sz.x + off, q.y/sz.y);
  vec2 id = floor(c); vec2 f = (fract(c)-0.5)*sz;
  vec2 d = sz*0.5 - abs(f);
  float edge = min(d.x,d.y) + (vnoise(vec3(q*38.0,1.0))-0.5)*0.006;
  float m = smoothstep(0.004,0.009,edge);
  return vec4(m, hash12(id+0.5), hash12(id+19.7), smoothstep(0.004,0.022,edge));
}

void main(){
  if(dot(vec4(vWP,1.0), uClipPlane) < 0.0) discard;
  float mid = floor(vMat.x + 0.5);
  float interior = 0.0;
  if(mid >= 100.0){ mid -= 100.0; interior = 1.0; }
  int m = int(mid);
  vec3 Ng = normalize(vN);
  vec3 V = normalize(uViewPos - vWP);
  if(m==10 || m==11 || m==12){ if(dot(Ng,V) < 0.0) Ng = -Ng; }
  vec3 p = vWP;
  // wall coordinates
  vec3 tang = abs(Ng.y) > 0.75 ? vec3(1,0,0) : normalize(cross(vec3(0,1,0), Ng));
  vec2 q = abs(Ng.y) > 0.75 ? p.xz : vec2(dot(p,tang), p.y);

  vec3 alb = vCol; float rough = vMat.y; float metal = 0.0; float h = 0.0; float wet = 0.0; float transl = 0.0;
  vec3 emi = vec3(0.0); float flag = 0.0;
  vec3 Nout = Ng; bool bump = true;

  if(m==0){ // plaster, weathered, with patches of bare brick
    float big = fbm(p*0.55 + vCol*13.0);
    float mot = fbm(p*2.6);
    float fine = vnoise(p*34.0);
    alb *= 0.74 + 0.52*big;
    alb *= 0.86 + 0.28*mot;
    alb *= 0.93 + 0.14*fine;
    float streak = vnoise(vec3(q.x*5.2, q.y*0.42, 2.0))*vnoise(vec3(q.x*17.0, q.y*0.9, 5.0));
    alb *= 1.0 - 0.52*smoothstep(0.22,0.62,streak);
    float damp = 1.0 - smoothstep(0.35, 1.35, p.y + (fbm(p*1.7)-0.5)*1.1);
    alb = mix(alb, alb*vec3(0.38,0.43,0.40), damp);
    float pm = fbm(p*0.85 + 17.3) + (vnoise(p*9.0)-0.5)*0.07 + max(0.0, 1.6-p.y)*0.07;
    float patchM = smoothstep(0.636,0.652,pm) * (1.0-interior);
    float lip = smoothstep(0.622,0.640,pm) * (1.0-patchM) * (1.0-interior);
    h = (fbm(p*11.0)-0.5)*0.006 + (fine-0.5)*0.0022 + (fbm(p*2.2)-0.5)*0.012;
    float crk = abs(fbm(p*1.35+4.0) - 0.5);
    float crack = (1.0-smoothstep(0.0015,0.006,crk)) * smoothstep(0.45,0.7,vnoise(p*0.8+9.0));
    alb *= 1.0 - 0.55*crack; h -= crack*0.003;
    if(patchM > 0.001){
      vec4 b = brickPat(q, vec2(0.235,0.078));
      vec3 bc = mix(vec3(0.30,0.105,0.060), vec3(0.40,0.20,0.10), b.y) * (0.7+0.6*b.z) * (0.8+0.4*fine);
      vec3 mc = vec3(0.23,0.20,0.17)*(0.8+0.4*fine);
      alb = mix(alb, mix(mc,bc,b.x), patchM);
      h = mix(h, -0.016 + b.w*0.009 + (fine-0.5)*0.003, patchM);
    }
    h += lip*0.004; alb *= 1.0 + lip*0.14;
    float wetk = smoothstep(0.46,0.72, fbm(vec3(q.x*1.9, q.y*0.28, 6.0))) ;
    wetk = max(wetk, damp*0.8) * (1.0-interior);
    alb *= 1.0 - 0.22*wetk;
    rough = mix(0.86, 0.34, wetk);
  } else if(m==1){ // brick
    float fine = vnoise(p*40.0);
    vec4 b = brickPat(q, vec2(0.232,0.076));
    vec3 bc = vCol * (0.62+0.75*b.y) * mix(vec3(1.0), vec3(0.75,0.7,0.78), step(0.82,b.z));
    bc *= 0.75 + 0.5*fbm(p*7.0);
    alb = mix(vec3(0.22,0.195,0.165)*(0.75+0.5*fine), bc, b.x);
    alb *= 0.8+0.4*fbm(p*0.7);
    h = b.w*0.011 + (fine-0.5)*0.0035 + (vnoise(p*12.0)-0.5)*0.004;
    float wetk = smoothstep(0.45,0.75,fbm(vec3(q.x*1.6,q.y*0.3,2.0)));
    alb *= 1.0-0.25*wetk; rough = mix(0.82,0.3,wetk);
  } else if(m==2){ // dressed stone
    float fine = vnoise(p*55.0);
    vec4 b = brickPat(q, vec2(0.58,0.29));
    alb = vCol*(0.78+0.4*fbm(p*3.1))*(0.9+0.2*fine)*(0.88+0.24*b.y);
    alb *= 0.65 + 0.35*b.x;
    alb *= 1.0 - 0.35*smoothstep(0.4,0.8,fbm(vec3(q.x*4.0,q.y*0.6,8.0)));
    h = b.w*0.006 + (fbm(p*14.0)-0.5)*0.006 + (fine-0.5)*0.0015;
    rough = 0.42 + 0.3*fbm(p*2.0);
  } else if(m==3){ // painted timber
    float g = vnoise(vec3(q.x*70.0, q.y*3.0, 1.0));
    alb = vCol*(0.78+0.3*g)*(0.8+0.4*fbm(p*4.0));
    float chip = smoothstep(0.66,0.70,fbm(vec3(q.x*11.0,q.y*4.0,3.0)));
    alb = mix(alb, vec3(0.16,0.11,0.07), chip*0.8);
    h = (g-0.5)*0.0012 - chip*0.001;
    rough = mix(0.46,0.75,chip);
  } else if(m==4){ // wrought iron
    alb = vCol*(0.7+0.6*vnoise(p*23.0));
    float rust = smoothstep(0.6,0.78,fbm(p*9.0));
    alb = mix(alb, vec3(0.10,0.045,0.02), rust);
    metal = 0.55*(1.0-rust); rough = mix(0.34,0.7,rust);
  } else if(m==5){ // old window glass with a faint curtain behind
    vec2 cq = vec2(dot(p,tang), p.y);
    float fold = 0.5+0.5*sin(cq.x*52.0 + 2.5*vnoise(vec3(cq*3.0,0.0)));
    float curt = step(0.55, hash12(floor(cq*vec2(0.9,0.62))+3.0));
    alb = mix(vec3(0.006,0.008,0.011), vec3(0.07,0.065,0.058)*(0.4+0.6*fold), curt*smoothstep(0.3,0.6,fbm2(vec3(cq*1.7,2.0))));
    rough = 0.035; bump = false;
    vec3 w = vec3(vnoise(p*5.0), vnoise(p*5.0+11.0), vnoise(p*5.0+23.0)) - 0.5;
    Nout = normalize(Ng + w*0.022);
    flag = 3.0;
  } else if(m==6){ // wet cobble sett
    float fine = vnoise(p*85.0);
    float mid2 = fbm(p*17.0);
    alb *= (0.62+0.76*mid2)*(0.86+0.28*fine);
    alb = mix(alb, alb*vec3(1.35,1.2,1.0), smoothstep(0.55,0.75,fbm(p*5.3+3.0)));
    alb *= 0.62;
    h = (mid2-0.5)*0.0070 + (fine-0.5)*0.0012 + (vnoise(p*31.0)-0.5)*0.0022;
    float film = smoothstep(0.34,0.66,fbm(p*1.9+vec3(3.0,0.0,1.0)));
    rough = mix(0.36, 0.13, film);
    wet = mix(0.35, 1.0, film);
    float tide = 1.0 - smoothstep(0.0012, 0.0085, p.y + (fine-0.5)*0.003);
    alb *= 1.0 - 0.45*tide; rough = mix(rough, 0.07, tide); wet = mix(wet, 1.0, tide); h *= 1.0 - 0.8*tide;
    flag = 1.0;
  } else if(m==7){ // wet grit between the setts
    float fine = vnoise(p*70.0);
    alb = vCol*(0.5+fine)*(0.7+0.6*fbm(p*8.0));
    h = (fine-0.5)*0.004;
    rough = 0.42; wet = 0.35; flag = 1.0;
  } else if(m==8){ // puddle water at y = 0
    float shallow = 1.0 - smoothstep(0.04, 0.55, vCol.r);
    alb = vec3(0.004,0.0055,0.0065) + vec3(0.075,0.062,0.046)*shallow*shallow*(0.35+0.9*fbm(p*14.0));
    rough = 0.02; wet = 1.0; flag = 2.0; bump = false;
    vec2 grad = vec2(0.0);
    for(int i=0;i<24;i++){
      vec4 d = uDrips[i];
      if(d.w <= 0.0) continue;
      vec2 rv = p.xz - d.xy; float r = length(rv);
      if(r > 0.9) continue;
      // light-travel delay applies to the ripples too
      float tv = uTime - length(vec3(p.x,0.0,p.z) - uViewPos)/5.0;
      float age = mod(tv - d.z, d.w);
      float front = age*0.34;
      float x = r - front;
      float env = exp(-x*x/0.0016) * exp(-age*2.1) * smoothstep(0.0,0.05,age);
      float x2 = r - front*0.62;
      float env2 = exp(-x2*x2/0.0009) * exp(-age*2.6) * smoothstep(0.1,0.2,age);
      float sl = cos(x*150.0)*env*0.11 + cos(x2*170.0)*env2*0.07;
      grad += (rv/max(r,1e-3))*sl;
    }
    vec2 mic = vec2(vnoise(vec3(p.xz*7.0,1.0)), vnoise(vec3(p.xz*7.0,9.0))) - 0.5;
    grad += mic*0.006;
    Nout = normalize(vec3(-grad.x, 1.0, -grad.y));
  } else if(m==9){ // silvered mirror, foxed with age
    float edgeFox = smoothstep(0.62,0.80, fbm(p*4.3+31.0));
    alb = vec3(0.86,0.84,0.78)*(1.0-0.5*edgeFox*smoothstep(0.5,0.8,vnoise(p*23.0)));
    rough = 0.03; metal = 1.0; flag = 4.0; bump = false;
  } else if(m==10){ // cloth
    float weave = vnoise(p*140.0);
    alb = vCol*(0.9+0.2*weave)*(0.85+0.3*fbm(p*3.3));
    rough = 0.85; transl = 0.55; h = (weave-0.5)*0.0008;
  } else if(m==11){ // leaves
    alb = vCol*(0.65+0.7*vnoise(p*19.0));
    rough = 0.36; transl = 0.45; bump = false;
  } else if(m==12){ // petals
    alb = vCol*(0.75+0.5*vnoise(p*40.0));
    rough = 0.6; transl = 0.4; bump = false;
  } else if(m==13){ // generic matte
    alb = vCol*(0.8+0.4*vnoise(p*60.0))*(0.85+0.3*fbm(p*9.0));
    h = (vnoise(p*160.0)-0.5)*0.0012;
  } else if(m==14){ // roof tile
    alb = vCol*(0.6+0.8*fbm(p*5.0));
    alb = mix(alb, vec3(0.03,0.05,0.02), smoothstep(0.58,0.74,fbm(p*2.2+8.0)));
    rough = 0.33+0.3*vnoise(p*4.0); h = (vnoise(p*45.0)-0.5)*0.003;
  } else if(m==15){ // bottle glass
    alb = vCol*0.22; rough = 0.055; transl = 1.0; bump = false; flag = 5.0;
  } else if(m==16){ // brass
    alb = vCol*(0.8+0.4*vnoise(p*18.0)); metal = 0.9; rough = 0.3; bump = false;
  } else if(m==17){ // emitter: colour carries the source tint, aMat.z the lamp
    alb = vec3(0.025); rough = 0.12; bump = false;
    emi = vec3(vMat.z, vMat.w, 0.0);
    flag = 6.0;
  } else if(m==18){ // interior plaster / wallpaper
    alb = vCol*(0.85+0.3*fbm(p*1.8))*(0.94+0.12*vnoise(p*45.0));
    alb *= 0.93 + 0.07*step(0.5, fract(q.x*7.0));
    rough = 0.82; h = (vnoise(p*45.0)-0.5)*0.001;
  } else if(m==19){ // wooden boards (interior floor, counter)
    float board = floor(q.x/0.14);
    float g = vnoise(vec3(q.x*55.0, q.y*4.0, board));
    alb = vCol*(0.7+0.5*g)*(0.8+0.4*hash12(vec2(board,2.0)));
    alb *= 0.55+0.45*smoothstep(0.004,0.01, min(fract(q.x/0.14), 1.0-fract(q.x/0.14))*0.14);
    rough = 0.34; h = (g-0.5)*0.0008;
  } else if(m==20){ // fur
    float f1 = vnoise(vec3(p.x*190.0, p.y*70.0, p.z*190.0));
    float tab = smoothstep(0.35,0.65, 0.5+0.5*sin(p.y*70.0 + p.z*55.0 + 6.0*fbm(p*11.0)));
    alb = vCol*(0.55+0.9*f1)*mix(1.0,0.45,tab);
    rough = 0.72; h = (f1-0.5)*0.0022; transl = 0.0;
  }

  if(bump){
    vec3 dpx = dFdx(vWP), dpy = dFdy(vWP);
    float dhx = dFdx(h), dhy = dFdy(h);
    vec3 r1 = cross(dpy, Ng), r2 = cross(Ng, dpx);
    float det = dot(dpx, r1);
    vec3 gr = sign(det)*(dhx*r1 + dhy*r2);
    vec3 nb = abs(det)*Ng - gr;
    if(dot(nb,nb) > 1e-24) Nout = normalize(nb);
  }
  gPos = vec4(vWP, float(m)+1.0 + interior*100.0);
  gNor = vec4(Nout, rough);
  gAlb = vec4(alb, metal);
  gEmi = m==17 ? vec4(vCol, vMat.z*1000.0 + vMat.w) : vec4(transl, wet, flag, 0.0);
}`;

const DIST_VERT = /* glsl */`
out vec3 vWP;
void main(){
  vec3 p = position;

float lampShadow(int i, vec3 P, vec3 N, vec4 bn){

vec3 indirectAt(vec3 P, vec3 N, vec3 camP, int stride, int phase){

float mistDensity(vec3 x){
  vec3 q = x*vec3(0.085,0.15,0.085) + vec3(uTime*0.0035, -uTime*0.001, uTime*0.002);

#define SIGMA 0.0125

// In-scatter along a view ray. Because |L - X(s)| + s grows monotonically with s, the lit part of any ray is

float frontS(float R, vec3 m, vec3 dir){
  float D2 = dot(m,m); if(R*R <= D2) return -1.0;

vec3 mistRay(vec3 ro, vec3 dir, float s0, float s1, vec4 bn, int NS){

    float sOn = frontS(C_LIGHT*(tOn - 0.5*RISE), m, dir);

  float paneT = 1.0;

  o = vec4(min(col, vec3(60.0)), 1.0);
}`;

const DOWN_FRAG = /* glsl */`

const UP_FRAG = /* glsl */`

const FINAL_FRAG = /* glsl */`

// ───────────────────────────── geometry toolkit ─────────────────────────────
const M = { PLASTER: 0, BRICK: 1, STONE: 2, WOOD: 3, IRON: 4, GLASS: 5, COBBLE: 6, GRIT: 7, WATER: 8, MIRROR: 9, CLOTH: 10, LEAF: 11, PETAL: 12, MATTE: 13, ROOF: 14, BOTTLE: 15, BRASS: 16, EMIT: 17, INNER: 18, BOARD: 19, FUR: 20 };

class Builder {
  constructor() { this.pos = []; this.nor = []; this.col = []; this.mat = []; }
  add(geo, matrix, o = {}) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);

    const c = o.color || [0.5, 0.5, 0.5];
    const mid = (o.mat ?? M.MATTE) + (o.interior ? 100 : 0);
    const flip = matrix && matrix.determinant() < 0;
    for (let i = 0; i < p.length; i += 3) {
      this.pos.push(p[i], p[i + 1], p[i + 2]); this.nor.push(n[i], n[i + 1], n[i + 2]);
      this.col.push(c[0], c[1], c[2]); this.mat.push(mid, o.rough ?? 0.7, o.lamp ?? 0, o.glow ?? 0);
    }
    g.dispose();
    return this;
  }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('aMat', new THREE.Float32BufferAttribute(this.mat, 4));
    return g;
  }
}

const mtx = (x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) =>
  new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), V3(sx, sy, sz));

// A frame lets us build in local coordinates (u along a wall, v up, d out of the wall)
class Frame {
  constructor(origin, U) {
    this.o = origin.clone(); this.U = U.clone().normalize(); this.Y = V3(0, 1, 0);
    this.N = new THREE.Vector3().crossVectors(this.U, this.Y).normalize();
    this.m = new THREE.Matrix4().makeBasis(this.U, this.Y, this.N).setPosition(this.o);
  }
  static wall(ax, az, bx, bz) { const U = V3(bx - ax, 0, bz - az); const f = new Frame(V3(ax, 0, az), U); f.len = U.length(); return f; }
  p(u, v, d = 0) { return this.o.clone().addScaledVector(this.U, u).addScaledVector(this.Y, v).addScaledVector(this.N, d); }
  at(u, v, d, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) { return this.m.clone().multiply(mtx(u, v, d, rx, ry, rz, sx, sy, sz)); }
}

const BOXC = new Map();
function boxGeo(w, h, d) { const k = w + ',' + h + ',' + d; if (!BOXC.has(k)) BOXC.set(k, new THREE.BoxGeometry(w, h, d)); return BOXC.get(k); }
function box(B, F, u0, u1, v0, v1, d0, d1, o) { // axis box in a wall frame
  B.add(boxGeo(u1 - u0, v1 - v0, d1 - d0), F.at((u0 + u1) / 2, (v0 + v1) / 2, (d0 + d1) / 2), o);
}
function wbox(B, x, y, z, w, h, d, o, ry = 0, rx = 0, rz = 0) { B.add(boxGeo(w, h, d), mtx(x, y, z, rx, ry, rz), o); }

// cylinder between two points
function rod(B, a, b, r, o, seg = 7, r2 = null) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length(); if (len < 1e-4) return;
  const g = new THREE.CylinderGeometry(r2 ?? r, r, len, seg, 1, false);
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.normalize());
  B.add(g, new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), q, V3(1, 1, 1)), o); g.dispose();
}
function tube(B, pts, r, o, segs = 24, rad = 6, closed = false) {
  const c = new THREE.CatmullRomCurve3(pts, closed, 'catmullrom', 0.5);
  const g = new THREE.TubeGeometry(c, segs, r, rad, closed); B.add(g, null, o); g.dispose();

function sphere(B, p, r, o, sx = 1, sy = 1, sz = 1, seg = 14) { const g = new THREE.SphereGeometry(r, seg, Math.max(6, seg * 0.75 | 0)); B.add(g, mtx(p.x, p.y, p.z, 0, 0, 0, sx, sy, sz), o); g.dispose(); }
function lathe(B, pts, matrix, o, seg = 14) { const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg); B.add(g, matrix, o); g.dispose(); }

// slab of masonry with real openings: front face at d = 0, thickness going inwards, reveals for free
function wallSlab(B, F, len, h, holes, thick, o, v0 = 0) {
  const s = new THREE.Shape(); s.moveTo(0, v0); s.lineTo(len, v0); s.lineTo(len, h); s.lineTo(0, h); s.closePath();
  for (const H of holes) {
    const p = new THREE.Path();
    if (H.arch) {
      const r = (H.u1 - H.u0) / 2, spring = H.v1 - r;
      p.moveTo(H.u0, H.v0); p.lineTo(H.u0, spring); p.absarc(H.u0 + r, spring, r, Math.PI, 0, true); p.lineTo(H.u1, H.v0); p.closePath();
    } else { p.moveTo(H.u0, H.v0); p.lineTo(H.u0, H.v1); p.lineTo(H.u1, H.v1); p.lineTo(H.u1, H.v0); p.closePath(); }
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 18 });
  B.add(g, F.m.clone().multiply(mtx(0, 0, -thick)), o); g.dispose();
}

// naive surface nets: organic meshes (cat, figure) from signed distance functions

    if (k < nz - 1 && v !== (val[I(i, j, k + 1)] < 0)) quad(vid[I(i - 1, j - 1, k)], vid[I(i, j - 1, k)], vid[I(i - 1, j, k)], vid[I(i, j, k)], !v);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(norms, 3));

}
const smin = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1); return lerp(b, a, h) - k * h * (1 - h); };

  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z; const apx = p.x - a.x, apy = p.y - a.y, apz = p.z - a.z;

      const d = V3(Math.cos(a) * r, y, Math.sin(a) * r);
      let best = 1e9, hit = null;
      for (const R of rects) {
        const den = d.dot(R.n); if (Math.abs(den) < 1e-5) continue;
        const t = R.o.clone().sub(L.pos).dot(R.n) / den; if (t < 0.2 || t >= best) continue;
        const q = L.pos.clone().addScaledVector(d, t).sub(R.o);
        const u = q.dot(R.a) / R.a.lengthSq(), v = q.dot(R.b) / R.b.lengthSq();

      const n = hit.R.n.clone(); if (hit.den > 0) n.negate();
      const p = L.pos.clone().addScaledVector(d, best).addScaledVector(n, 0.06);
      const flux = L.I * 4 * Math.PI / count * 0.72;
      out.push({ p, path: best, n, f: hit.R.albedo.map(v => v * flux), li });
    }
  };
  trace(0, 156); trace(1, 34); trace(2, 14);
  const NV = Math.min(out.length, 112);
  const data = new Float32Array(112 * 3 * 4);
  // interleave so that any stride is still a fair sample
  const order = out.map((_, i) => i).sort((a, b) => ((a * 61) % 197) - ((b * 61) % 197)).slice(0, NV);
  order.forEach((k, j) => { const v = out[k]; data.set([v.p.x, v.p.y, v.p.z, v.path], j * 4); data.set([v.n.x, v.n.y, v.n.z, 0], (112 + j) * 4); data.set([v.f[0], v.f[1], v.f[2], v.li], (224 + j) * 4); });
  const t = new THREE.DataTexture(data, 112, 3, THREE.RGBAFormat, THREE.FloatType); t.needsUpdate = true;
  return { tex: t, count: NV, total: out.length };
}

// ── targets ──
function rt(w, h, o = {}) { return new THREE.WebGLRenderTarget(w, h, Object.assign({ type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false }, o)); }
function gbuffer(w, h) {
  const g = new THREE.WebGLRenderTarget(w, h, { count: 4, type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  g.textures[0].type = THREE.FloatType; g.textures[3].type = THREE.FloatType;
  return g;
}
const gMain = gbuffer(RES, RES), gRG = gbuffer(REFL, REFL), gRM = gbuffer(RES, RES);
const halfRT = new THREE.WebGLRenderTarget(HALF, HALF, { count: 2, type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false });
const litRT = rt(RES, RES, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const reflRTg = rt(REFL, REFL, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
const reflRTm = rt(RES, RES);
const accRT = rt(RES, RES, { type: THREE.FloatType });
const bloomDown = [], bloomUp = [];
for (let i = 0, s = RES >> 1; i < 7; i++, s >>= 1) { bloomDown.push(rt(s, s)); bloomUp.push(rt(s, s)); }

// ── scene ──
const blueTex = makeBlueTexture();
const noise3 = makeNoise3D();
const gbufUniforms = { uViewPos: { value: V3() }, uClipPlane: { value: new THREE.Vector4(0, 0, 0, 1) }, uTime: { value: 0 }, uDrips: { value: dripUniforms() } };
const gMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: GBUF_VERT, fragmentShader: GBUF_FRAG, uniforms: gbufUniforms, side: THREE.DoubleSide });
const distUniforms = { uOrigin: { value: V3() }, uAxis: { value: MOON_DIR.clone() }, uMode: { value: 0 } };
const distMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: DIST_VERT, fragmentShader: DIST_FRAG, uniforms: distUniforms, side: THREE.DoubleSide });

const scene = new THREE.Scene(); scene.matrixWorldAutoUpdate = true;
const staticB = buildStreet();
const staticMesh = new THREE.Mesh(staticB.geometry(), gMat); staticMesh.frustumCulled = false;
const ground = new THREE.Group();
ground.add(buildCobbles(gMat));
{ const grit = new THREE.Mesh(gridPlane(-4.9, 5.1, -25.5, 3.4, 0.07, (x, z) => groundBase(x, z) + 0.0045, M.GRIT, [0.085, 0.072, 0.055]), gMat); grit.frustumCulled = false; ground.add(grit); }
{ const water = new THREE.Mesh(gridPlane(-4.9, 5.1, -25.5, 3.4, 0.06, () => 0.0, M.WATER, [0, 0, 0], (x, z) => clamp(-(groundBase(x, z) + 0.004) * 34, 0, 1)), gMat); water.frustumCulled = false; ground.add(water); }
const figure = buildFigure(gMat), cat = buildCat(gMat), laundry = buildLaundry(gMat), moths = buildMoths(gMat), drips = buildDrips(gMat);
const lampMeshes = buildLampMeshes(gMat);
scene.add(staticMesh, ground, figure.group, cat.group, laundry.group, moths.group, drips.group, ...lampMeshes);
const vpl = buildVPLs();

// ── shadow maps ──
const cubes = LAMPS.map(L => {
  const target = new THREE.WebGLCubeRenderTarget(L.shadow, { type: THREE.FloatType, format: THREE.RedFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false });
  const cam = new THREE.CubeCamera(0.04, 90, target); cam.position.copy(L.pos); return { target, cam };
});
const MOON_RES = 4096;
const moonRT = rt(MOON_RES, MOON_RES, { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
const moonCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 140);
{
  const ctr = V3(0, 8, -15); moonCam.position.copy(ctr).addScaledVector(MOON_DIR, 60); moonCam.lookAt(ctr); moonCam.updateMatrixWorld(true);
  const inv = moonCam.matrixWorld.clone().invert(); const bb = new THREE.Box3();
  for (const x of [-7, 7]) for (const y of [0, 20]) for (const z of [-28, 4]) bb.expandByPoint(V3(x, y, z).applyMatrix4(inv));
  moonCam.left = bb.min.x; moonCam.right = bb.max.x; moonCam.bottom = bb.min.y; moonCam.top = bb.max.y; moonCam.updateProjectionMatrix();
}
const moonMatrix = new THREE.Matrix4().multiplyMatrices(moonCam.projectionMatrix, moonCam.matrixWorldInverse.copy(moonCam.matrixWorld).invert());

function renderShadows() {
  renderer.setClearColor(new THREE.Color(1, 1, 1), 1);
  scene.overrideMaterial = distMat;
  const vis = [ground.visible, moths.group.visible, drips.group.visible, ...lampMeshes.map(m => m.visible)];
  ground.visible = false; moths.group.visible = false; drips.group.visible = false; lampMeshes.forEach(m => m.visible = false);
  distUniforms.uMode.value = 0;
  LAMPS.forEach((L, i) => { distUniforms.uOrigin.value.copy(L.pos); cubes[i].cam.update(renderer, scene); });
  distUniforms.uMode.value = 1; distUniforms.uOrigin.value.copy(moonCam.position);
  renderer.setRenderTarget(moonRT); renderer.clear(); renderer.render(scene, moonCam);
  scene.overrideMaterial = null;
  [ground.visible, moths.group.visible, drips.group.visible] = vis; lampMeshes.forEach((m, i) => m.visible = vis[3 + i]);
  renderer.setClearColor(new THREE.Color(0, 0, 0), 0);
}

// ── full-screen passes ──
const fsScene = new THREE.Scene(); const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsTri = new THREE.BufferGeometry(); fsTri.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
const fsMesh = new THREE.Mesh(fsTri, null); fsMesh.frustumCulled = false; fsScene.add(fsMesh);
function pass(mat, target) { fsMesh.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }
const fsMat = (frag, uniforms, extra = {}) => new THREE.ShaderMaterial(Object.assign({ glslVersion: THREE.GLSL3, vertexShader: FS_VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false }, extra));

const shared = {
  uShadowDummy: { value: null },
  tShadow0: { value: cubes[0].target.texture }, tShadow1: { value: cubes[1].target.texture }, tShadow2: { value: cubes[2].target.texture },
  tMoonShadow: { value: moonRT.texture }, uMoonMatrix: { value: moonMatrix }, uMoonDir: { value: MOON_DIR }, uMoonOrigin: { value: moonCam.position },
  tNoise3: { value: noise3 }, tBlue: { value: blueTex }, tVpl: { value: vpl.tex }, uVplCount: { value: vpl.count },
  uLampPos: { value: LAMPS.map(l => l.pos) }, uLampCol: { value: LAMPS.map(l => V3(...l.color)) }, uFlareCol: { value: LAMPS.map(l => V3(...l.flare)) },
  uLampTiming: { value: LAMPS.map(l => V3(l.on, l.off, l.radius)) }, uLampI: { value: LAMPS.map(l => l.I) },
};
delete shared.uShadowDummy;
const viewUniforms = () => ({ uViewPos: { value: V3() }, uInvViewProj: { value: new THREE.Matrix4() }, uViewProj: { value: new THREE.Matrix4() }, uPlane: { value: new THREE.Vector4(0, 0, 0, 1) }, uIsRefl: { value: 0 }, uSample: { value: 0 }, uTime: { value: 0 }, uAudit: { value: 0 }, uRes: { value: new THREE.Vector2(RES, RES) } });
const gTex = g => ({ tPos: { value: g.textures[0] }, tNor: { value: g.textures[1] }, tAlb: { value: g.textures[2] }, tEmi: { value: g.textures[3] } });

const halfMat = fsMat(HALF_FRAG, Object.assign({}, shared, viewUniforms(), gTex(gMain)));
const glassU = (() => {
  const a = { c: CAFE.p((CAFE_WIN.u0 + CAFE_WIN.u1) / 2, (CAFE_WIN.v0 + CAFE_WIN.v1) / 2, -0.085), hw: (CAFE_WIN.u1 - CAFE_WIN.u0) / 2, hh: (CAFE_WIN.v1 - CAFE_WIN.v0) / 2, U: CAFE.U, N: CAFE.N };
  const b = { c: ENDW.p((SHOP.u0 + SHOP.u1) / 2, (SHOP.v0 + SHOP.v1) / 2, -0.03), hw: (SHOP.u1 - SHOP.u0) / 2, hh: (SHOP.v1 - SHOP.v0) / 2, U: ENDW.U, N: ENDW.N };
  const z = { c: V3(), hw: -1, hh: 0, U: V3(1, 0, 0), N: V3(0, 0, 1) };
  const arr = [a, b, z, z];
  return { uGlass: { value: arr.map(g => new THREE.Vector4(g.c.x, g.c.y, g.c.z, g.hw)) }, uGlassU: { value: arr.map(g => g.U.clone()) }, uGlassN: { value: arr.map(g => new THREE.Vector4(g.N.x, g.N.y, g.N.z, g.hh)) } };
})();
const blankTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); blankTex.needsUpdate = true;
const lightExtra = () => ({ tHalfMist: { value: blankTex }, tHalfInd: { value: blankTex }, tReflG: { value: blankTex }, tReflM: { value: blankTex }, uMirrorN: { value: MIRROR.n } });
const mainLight = fsMat(LIGHT_FRAG, Object.assign({}, shared, viewUniforms(), gTex(gMain), lightExtra(), glassU));
mainLight.uniforms.tHalfMist.value = halfRT.textures[0]; mainLight.uniforms.tHalfInd.value = halfRT.textures[1];
mainLight.uniforms.tReflG.value = reflRTg.texture; mainLight.uniforms.tReflM.value = reflRTm.texture;
const reflLightG = fsMat(LIGHT_FRAG, Object.assign({}, shared, viewUniforms(), gTex(gRG), lightExtra(), glassU));
const reflLightM = fsMat(LIGHT_FRAG, Object.assign({}, shared, viewUniforms(), gTex(gRM), lightExtra(), glassU));

const accMat = fsMat(ACC_FRAG, { tSrc: { value: litRT.texture }, uW: { value: 1 } }, { blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendEquation: THREE.AddEquation, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor, transparent: true });
const downMat = fsMat(DOWN_FRAG, { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() }, uFirst: { value: 0 } });
const upMat = fsMat(UP_FRAG, { tSrc: { value: null }, tBase: { value: null }, uTexel: { value: new THREE.Vector2() }, uMix: { value: 0.65 } });
const finalMat = fsMat(FINAL_FRAG, { tHDR: { value: accRT.texture }, tBloom: { value: null }, tBlue: { value: blueTex }, uOut: { value: new THREE.Vector2(OUT, OUT) }, uFrame: { value: 0 }, uSS: { value: SS }, uExposure: { value: Number(QS.get('exp') || 1.0) } });

// ── cameras ──
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.08, 400);
const reflCam = new THREE.PerspectiveCamera(FOV, 1, 0.08, 400);
reflCam.matrixAutoUpdate = false; reflCam.matrixWorldAutoUpdate = false;
const proj0 = new THREE.Matrix4();
function reflectionMatrix(n, d) { return new THREE.Matrix4().set(1 - 2 * n.x * n.x, -2 * n.x * n.y, -2 * n.x * n.z, -2 * d * n.x, -2 * n.y * n.x, 1 - 2 * n.y * n.y, -2 * n.y * n.z, -2 * d * n.y, -2 * n.z * n.x, -2 * n.z * n.y, 1 - 2 * n.z * n.z, -2 * d * n.z, 0, 0, 0, 1); }
const RM_GROUND = reflectionMatrix(V3(0, 1, 0), 0);
const MIR_D = -MIRROR.n.dot(MIRROR.c);
const RM_MIRROR = reflectionMatrix(MIRROR.n, MIR_D);

function setView(mat, cam, viewPos) {
  const u = mat.uniforms;
  u.uViewPos.value.copy(viewPos);
  u.uViewProj.value.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
  u.uInvViewProj.value.copy(u.uViewProj.value).invert();
}
function drawG(target, cam, viewPos, clip) {
  gbufUniforms.uViewPos.value.copy(viewPos); gbufUniforms.uClipPlane.value.copy(clip);
  renderer.setRenderTarget(target); renderer.clear(); renderer.render(scene, cam);
}
function renderReflection(RM, n, d, gTarget, lightMat, outRT, camPos, clipOffset, hideGround, scissor) {
  reflCam.matrixWorldInverse.multiplyMatrices(camera.matrixWorldInverse, RM);
  reflCam.matrixWorld.copy(reflCam.matrixWorldInverse).invert();
  reflCam.projectionMatrix.copy(camera.projectionMatrix); reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  const mpos = camPos.clone().applyMatrix4(RM);
  ground.visible = !hideGround;
  if (scissor) { for (const t of [gTarget, outRT]) { t.scissorTest = true; t.scissor.copy(scissor); } }
  drawG(gTarget, reflCam, mpos, new THREE.Vector4(n.x, n.y, n.z, d - clipOffset));
  ground.visible = true;
  setView(lightMat, reflCam, mpos);
  lightMat.uniforms.uPlane.value.set(n.x, n.y, n.z, d); lightMat.uniforms.uIsRefl.value = 1;
  pass(lightMat, outRT);
}
function mirrorScissor() { // only the part of the frame the cafe mirror covers needs a reflection
  let x0 = 1, y0 = 1, x1 = -1, y1 = -1;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const p = MIRROR.c.clone().addScaledVector(MIRROR.right, sx * MIRROR.hw).addScaledVector(MIRROR.up, sy * MIRROR.hh).project(camera);
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  const px = v => clamp(Math.floor((v * 0.5 + 0.5) * RES), 0, RES);
  const a = Math.max(0, px(x0) - 6), b = Math.max(0, px(y0) - 6), c = Math.min(RES, px(x1) + 6), d = Math.min(RES, px(y1) + 6);
  return new THREE.Vector4(a, b, Math.max(1, c - a), Math.max(1, d - b));
}

const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const debugState = { lastCam: null };

function poseAll(t, camPos) {
  figure.update(t, camPos); cat.update(t, camPos); laundry.update(t, camPos); moths.update(t, camPos); drips.update(t, camPos);
  scene.updateMatrixWorld(true);
}

function renderFrame(t, samples) {
  const c = cameraAt(t);
  camera.position.copy(c.pos); camera.lookAt(c.tgt); camera.updateMatrixWorld(true); camera.updateProjectionMatrix();
  proj0.copy(camera.projectionMatrix);
  debugState.lastCam = c;
  poseAll(t, c.pos);
  renderShadows();
  renderer.setRenderTarget(accRT); renderer.clear();
  const frameNo = Math.round(t * 30);
  for (let k = 0; k < samples; k++) {
    // jitter in pixel, in shutter time (motion blur of the fronts) and in every stochastic filter
    const jx = samples > 1 ? halton(k + 1, 2) - 0.5 : 0, jy = samples > 1 ? halton(k + 1, 3) - 0.5 : 0;
    const tk = samples > 1 ? t + ((((k * 7) % samples) + 0.5) / samples - 0.5) * SHUTTER : t;
    camera.projectionMatrix.copy(proj0);
    camera.projectionMatrix.elements[8] += jx * 2 / RES; camera.projectionMatrix.elements[9] += jy * 2 / RES;
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    gbufUniforms.uTime.value = tk;
    const sid = k;
    for (const m of [halfMat, mainLight, reflLightG, reflLightM]) { m.uniforms.uTime.value = tk; m.uniforms.uSample.value = sid; }
    // 1. reflections, each from its mirrored camera: path length |L-P| + |P-C'| is the full bounce path
    renderReflection(RM_GROUND, V3(0, 1, 0), 0, gRG, reflLightG, reflRTg, c.pos, 0.001, true, null);
    renderReflection(RM_MIRROR, MIRROR.n, MIR_D, gRM, reflLightM, reflRTm, c.pos, 0.075, false, mirrorScissor());
    // 2. the street itself
    drawG(gMain, camera, c.pos, new THREE.Vector4(0, 0, 0, 1));
    setView(halfMat, camera, c.pos); pass(halfMat, halfRT);
    setView(mainLight, camera, c.pos); pass(mainLight, litRT);
    accMat.uniforms.uW.value = 1 / samples;
    renderer.autoClear = false; pass(accMat, accRT); renderer.autoClear = true;
  }
  camera.projectionMatrix.copy(proj0);
  // bloom
  let src = accRT;
  for (let i = 0; i < bloomDown.length; i++) { downMat.uniforms.tSrc.value = src.texture; downMat.uniforms.uTexel.value.set(1 / src.width, 1 / src.height); downMat.uniforms.uFirst.value = i === 0 ? 1 : 0; pass(downMat, bloomDown[i]); src = bloomDown[i]; }
  let prev = bloomDown[bloomDown.length - 1];
  for (let i = bloomDown.length - 2; i >= 0; i--) { upMat.uniforms.tSrc.value = prev.texture; upMat.uniforms.tBase.value = bloomDown[i].texture; upMat.uniforms.uTexel.value.set(1 / prev.width, 1 / prev.height); pass(upMat, bloomUp[i]); prev = bloomUp[i]; }
  finalMat.uniforms.tBloom.value = prev.texture; finalMat.uniforms.uFrame.value = frameNo;
  pass(finalMat, null);
}

// ── tools for auditing the physics: world position under a pixel, and the clock ──
function probe(px, py, t) { // px, py in output pixels, origin top-left; returns the surface under that pixel
  renderFrame(t, 1);
  const buf = new Float32Array(4);
  renderer.readRenderTargetPixels(gMain, Math.floor(px * SS), Math.floor(RES - 1 - py * SS), 1, 1, buf, undefined, 0);
  return Array.from(buf);
}
function projectPoint(x, y, z, t) {
  const c = cameraAt(t); const cm = new THREE.PerspectiveCamera(FOV, 1, 0.08, 400); cm.position.copy(c.pos); cm.lookAt(c.tgt); cm.updateMatrixWorld(true);
  const p = V3(x, y, z).project(cm); return [(p.x * 0.5 + 0.5) * OUT, (0.5 - p.y * 0.5) * OUT];
}

// linear radiance (this lamp only) in a small patch of the shaded frame, plus what the G-buffers hold there
function audit(px, py, t, lamp) {
  for (const m of [mainLight, reflLightG, reflLightM]) m.uniforms.uAudit.value = lamp + 1;
  renderFrame(t, 1);
  for (const m of [mainLight, reflLightG, reflLightM]) m.uniforms.uAudit.value = 0;
  const X = Math.floor(px * SS), Y = Math.floor(RES - 1 - py * SS);
  const h = new Uint16Array(5 * 5 * 4); renderer.readRenderTargetPixels(litRT, X - 2, Y - 2, 5, 5, h);
  const v = []; for (let i = 0; i < 25; i++) v.push(0.2126 * THREE.DataUtils.fromHalfFloat(h[i * 4]) + 0.7152 * THREE.DataUtils.fromHalfFloat(h[i * 4 + 1]) + 0.0722 * THREE.DataUtils.fromHalfFloat(h[i * 4 + 2]));
  v.sort((a, b) => a - b);
  const g = (target, size) => { const b = new Float32Array(4); renderer.readRenderTargetPixels(target, Math.floor((X + 0.5) / RES * size), Math.floor((Y + 0.5) / RES * size), 1, 1, b, undefined, 0); return Array.from(b); };
  return { value: v[12], center: v, main: g(gMain, RES), reflGround: g(gRG, REFL), reflMirror: g(gRM, RES) };
}

// ── run ──
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.gpuInfo = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
window.sceneInfo = { staticTriangles: staticB.pos.length / 9, vpls: vpl.count, vplTotal: vpl.total, res: RES, samples: SAMPLES };

if (RENDER_MODE) {
  document.body.classList.add('render');
  window.renderAt = (t) => { renderFrame(t, SAMPLES); gl.finish(); return true; };
  const viewMat = fsMat(`precision highp float; in vec2 vUv; uniform sampler2D tSrc; uniform float uGain; layout(location=0) out vec4 o; void main(){ vec3 c = textureLod(tSrc, vUv, 0.0).rgb*uGain; o = vec4(pow(c/(1.0+c), vec3(1.0/2.2)),1.0); }`, { tSrc: { value: null }, uGain: { value: 1 } });
  window.dumpRefl = (t, which, gain) => { renderFrame(t, 1); viewMat.uniforms.tSrc.value = (which === 'g' ? reflRTg : reflRTm).texture; viewMat.uniforms.uGain.value = gain || 1; renderer.setRenderTarget(null); pass(viewMat, null); return canvas.toDataURL('image/png'); };
  // debug: the same instant in a world where no lamp is ever switched on
  window.setLampsNeverLit = (v) => { shared.uLampTiming.value.forEach((q, i) => { q.x = v ? 1000 : LAMPS[i].on; }); };
  window.slow = { cameraAt, LAMPS, MIRROR, MIRROR_AIM, audit, probe, projectPoint, frameData: () => canvas.toDataURL('image/png') };
  window.ready = true;
} else {
  let start = null;
  const restart = () => { start = null; };
  addEventListener('click', restart);
  addEventListener('keydown', e => { if (e.code === 'Space') restart(); });
  const loop = (now) => {
    if (start === null) start = now;
    const t = ((now - start) / 1000) % (DURATION + 1.0);
    renderFrame(Math.min(t, DURATION), 1);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
const loading = document.getElementById('loading'); if (loading) loading.remove();
