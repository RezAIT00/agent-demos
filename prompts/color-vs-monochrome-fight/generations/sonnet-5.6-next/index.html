  }

  // ---------- per-frame assembly ----------
  frame(f, cam, C, renderer, subjects = []) {
    const o = this.out;
    o.puffs.reset(); o.drops.reset(); o.ribbons.reset(); o.rings.length = 0; o.stars.length = 0; o.waves.length = 0; o.blobs = { n: 0, batches: [] };
    const wt = WARP(f);
    const camPos = cam.pos;
    const sub = subjects.map(q => { const d = V.sub(q.c, camPos), L = V.len(d) || 1; return { dir: V.mul(d, 1 / L), L, r: q.r }; });
    for (const p of this.puffs) {
      if (f < p.f) continue;
      const age = wt - p.wt + 0.035;
      const life = p.life * 0.80;
      if (age > life) continue;
      const e = (1 - Math.exp(-p.k * age)) / p.k;
      const pos = [p.p0[0] + p.v0[0] * e, p.p0[1] + p.v0[1] * e + p.rise * age, p.p0[2] + p.v0[2] * e];
      const u = age / life;
      let rad = (p.r0 + (p.r1 - p.r0) * (1 - Math.exp(-age * 3.6))) * (p.big ? 1 : 0.76);
      const vec = V.sub(pos, camPos), dc = V.len(vec);
      if (dc < rad * 2.4 + 0.9) continue;                      // never let a puff swallow the lens
      rad = Math.min(rad, dc * 0.13);
      let op = p.op * (1 - 0.55 * smooth(0.28, 1.0, u));
      let erode = smooth(0.30, 1.0, u);
      if (!p.big && (p.tint === 9 || (p.tint >= 3 && p.tint <= 6))) { rad *= 0.62; op *= 0.74; erode = Math.min(1, 0.16 + erode * 1.1); }
      for (const q of sub) {
        const t = V.dot(vec, q.dir);
        if (t <= 0 || t > q.L + 0.2) continue;
        const perp = Math.sqrt(Math.max(0, dc * dc - t * t));
        const need = rad * 0.95 + q.r * (t / q.L);
        if (perp < need) {
          const k = smooth(0, 0.45 * need, need - perp);
          op *= 1 - 0.92 * k; erode = Math.min(1, erode + 0.45 * k);
        }
      }
      // the big blast clears for the quiet that follows it
      if (f >= 826 && f < 1000 && p.f < 826) op *= 1 - smooth(826, 850, f) * 0.92;
      if (op < 0.04) continue;
      o.puffs.add(pos, rad, p.seed, p.tint, op, erode);
    }
    for (const d of this.drops) {
      if (f < d.f) continue;
      const age = wt - d.wt + 0.012;
      if (age > d.life) continue;
      const at = t => [d.p[0] + d.v[0] * t, d.p[1] + d.v[1] * t - 0.5 * d.g * t * t, d.p[2] + d.v[2] * t];
      const head = at(age);
      if (d.g > 0 && head[1] < groundHeight(head[0], head[2], f) - 0.02) continue;
      if (sub.length) {
        const vx = head[0] - camPos[0], vy = head[1] - camPos[1], vz = head[2] - camPos[2];
        let hidden = false;
        for (const q of sub) {
          const t = vx * q.dir[0] + vy * q.dir[1] + vz * q.dir[2];
          if (t <= 0 || t > q.L + 0.45) continue;
          if (vx * vx + vy * vy + vz * vz - t * t < Math.pow(q.r * 0.86 * t / q.L, 2)) { hidden = true; break; }
        }
        if (hidden) continue;
      }
      const tailT = Math.max(0, age - (d.kind === 1 ? 0.05 : (d.f < 40 ? 0.007 : 0.017)));
      const fade = 1 - smooth(0.72, 1, age / d.life);
      const wd = d.w * (0.4 + 0.6 * fade);
      let tail = at(tailT);
      if (d.kind === 0) { const L = V.dist(head, tail), cap = wd * 4.2; if (L > cap) tail = V.lerp(head, tail, cap / L); }
      o.drops.add(head, tail, wd, d.kind, [d.col[0], d.col[1], d.col[2], d.kind === 1 ? fade : 1]);
    }
    for (const r of this.rings) {
      const age = f - r.f;
      if (age < 0 || age >= r.dur) continue;
      const u = (age + 0.7) / (r.dur + 0.7);
      const rad = r.R * Ease.out3(u);
      const alpha = r.alpha * (1 - Math.pow(u, 2.2));
      o.rings.push({ c: r.c, n: r.n, r: rad, w: r.w * (1 - u * 0.65), seed: r.seed, disc: r.disc, alpha, kind: r.kind, noDepth: r.noDepth });
      if (r.distort > 0 && C) {
        const s = renderer.project(C, r.c);
        if (s[2] > 0.2) {
          const sr = rad / (s[2] * C.tanY * 2);
          if (sr < 1.6) o.waves.push({ c: [s[0], s[1]], r: sr, w: 0.035 + sr * 0.10, s: r.distort * (1 - u) * clamp(6 / (s[2] + 2), 0.35, 1.4) });
        }
      }
    }
    for (const s of this.stars) {
      const age = f - s.f;
      if (age < 0 || age >= s.dur) continue;
      let sp = s.p, behind = s.behind;
      if (age >= 1 && !s.keepFront && !behind) { sp = V.mad(s.p, V.norm(V.sub(s.p, camPos)), 0.55); behind = true; }
      o.stars.push({ behind, p: sp, size: s.size * (age === 0 ? 0.82 : 1 + age * 0.05), kind: s.kind, seed: s.seed + (age > 1 ? 1 : 0), spikes: s.spikes, rot: s.rot, stretch: s.stretch, age: age * (6 / s.dur) });
    }
    this.smears(f, cam);
    this.signature(f, cam, wt);
    this.burstStroke(f);
    this.wallCracks(f);
    this.ambient(f, cam, wt);
    o.waves.sort((a, b) => b.s - a.s);
    if (o.waves.length > 6) o.waves.length = 6;
    if (C) for (const [af, rmax, str] of AIRWAVE) {
      const age = f - af;
      if (age < 0 || age > 14) continue;
      const key = this.points[Object.keys(HIT).find(k => HIT[k].f === af && this.points[k])] || (af === 802 ? [24.5, 0, 0] : (af === 1092 ? this.points.H13 : null));
      let c = [0.5, 0.5];
      if (key) { const s = renderer.project(C, key); if (s[2] > 0) c = [clamp(s[0], -0.2, 1.2), clamp(s[1], -0.2, 1.2)]; }
      const u = (age + 1) / 15;
      o.waves.push({ c, r: rmax * Ease.out(u), w: 0.05 + 0.1 * u, s: str * (1 - u) });
    }
    return o;
  }

  // motion arcs on fast limbs and streaks behind bodies in flight
  smears(f, cam) {
    const A = this.anim, rib = this.out.ribbons;
    for (const kind of ['iro', 'sumi']) {
      if (!onScreen(kind, f) || (f >= 600 && f < 618)) continue;
      const fd = drawingFrame(f);
      const times = [fd - 3, fd - 2.25, fd - 1.5, fd - 0.75, fd];
      if (times[0] < 0) continue;
      const ks = A.keys[kind];
      if (ks.some(k => k.cut && k.f > times[0] && k.f <= fd)) continue;
      const rigs = times.map(t => { const s = A.sample(kind, t, t); return solveRig(kind, s.pose, s.root); });
      const view = V.norm(V.sub(cam.pos, rigs[4].J.chest));
      const rootMove = V.dist(rigs[4].J.pelvis, rigs[1].J.pelvis);
      for (const [j, wd] of [['anR', 0.105], ['anL', 0.10], ['wrR', kind === 'sumi' ? 0.17 : 0.07], ['wrL', kind === 'sumi' ? 0.15 : 0.065]]) {
        const pts = rigs.map(r => r.J[j]);
        let travel = 0; for (let i = 1; i < 5; i++) travel += V.dist(pts[i], pts[i - 1]);
        const rel = travel - V.dist(rigs[4].J.pelvis, rigs[0].J.pelvis) * 0.9;
        if (rel < 0.75 || travel > 9) continue;
        const fine = [];
        for (let i = 0; i < 4; i++) for (let k = 0; k < 3; k++) {
          const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(4, i + 2)], t = k / 3;
          fine.push([0, 1, 2].map(a => 0.5 * ((2 * p1[a]) + (-p0[a] + p2[a]) * t + (2 * p0[a] - 5 * p1[a] + 4 * p2[a] - p3[a]) * t * t + (-p0[a] + 3 * p1[a] - 3 * p2[a] + p3[a]) * t * t * t)));
        }
        fine.push(pts[4]);
        const k = clamp((rel - 0.75) / 0.8);
        const ws = fine.map((_, i) => wd * (0.15 + 0.85 * Math.pow(i / (fine.length - 1), 0.7)) * (0.55 + 0.75 * k));
        if (kind === 'iro') rib.add(fine, ws, 0, j.length + (j.endsWith('R') ? 0.3 : 1.7), j.startsWith('an') ? [1.0, 0.72, 0.10, 1] : [1.0, 0.2, 0.5, 1], view);
        else rib.add(fine, ws, 1, j.endsWith('R') ? 0.4 : 2.2, [0, 0, 0, 1], view);
      }
      if (rootMove > 2.0 && rootMove < 60 && !(f >= 794 && f < 806)) {
        const trail = [];
        for (let i = 12; i >= 0; i--) {
          const t = f - i * 0.45;
          const s = A.sample(kind, Math.max(0, t), Math.max(0, t));
          if (ks.some(k => k.cut && k.f > t && k.f <= f)) continue;
          trail.push(V.add(s.root.pos, [0, kind === 'iro' ? 0.95 : 1.2, -0.25]));
        }
        if (trail.length > 3) {
          const v2 = V.norm(V.sub(cam.pos, trail[trail.length - 1]));
          const far = clamp(V.dist(cam.pos, trail[trail.length - 1]) / 11, 1, 4.2);
          if (kind === 'iro') {
            for (const [dy, wdt, sd] of [[0.34, 0.20, 0.1], [-0.05, 0.34, 1.3], [-0.42, 0.16, 2.6]]) rib.add(trail.map(p => V.add(p, [0, dy, 0])), trail.map((_, i) => wdt * far * Math.pow(i / (trail.length - 1), 0.6)), 2, sd, [1, 1, 1, 1], v2);
          } else {
            const thin = f >= 770 && f < 794 ? 0.34 : 1;
            for (const [dy, wdt0, sd] of [[0.30, 0.42, 0.7], [-0.40, 0.30, 3.1]]) { const wdt = wdt0 * thin; rib.add(trail.map(p => V.add(p, [0, dy, -0.1])), trail.map((_, i) => wdt * far * Math.pow(i / (trail.length - 1), 0.55)), 1, sd, [0, 0, 0, 1], v2); }
          }
          for (let s = 0; s < 5; s++) {
            const off = [0, (vnoise1(s * 7.3 + Math.floor(f / 2), 3) - 0.5) * 2.4, (vnoise1(s * 3.1 + Math.floor(f / 2), 5) - 0.5) * 1.4];
            rib.add(trail.map(p => V.add(p, off)), 0.018, 3, s, [1, 1, 1, 0.9], v2);
          }
        }
      }
    }
  }

  // helper: teardrop mesh
  dropMesh(c, rx, ry, tip, kind) {
    const data = [], N = 14, M = 18;
    const P = (i, j) => {
      const ph = -Math.PI / 2 + i / N * Math.PI, th = j / M * TAU;
      const s = Math.sin(ph), k = Math.cos(ph);
      const stretch = s > 0 ? 1 + tip * Math.pow(s, 3) : 1;
      const pinch = s > 0 ? 1 - 0.55 * tip / (tip + 1) * Math.pow(s, 2) : 1;
      return { p: [c[0] + Math.cos(th) * k * rx * pinch, c[1] + s * ry * stretch, c[2] + Math.sin(th) * k * rx * pinch], n: V.norm([Math.cos(th) * k / rx, s / ry, Math.sin(th) * k / rx]) };
    };
    for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
      const q = [P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)];
      for (const k of [0, 1, 2, 0, 2, 3]) data.push(...q[k].p, ...q[k].n);
    }
    this.out.blobs.batches.push({ kind, data: new Float32Array(data) });
    this.out.blobs.n++;
  }
  crown(c, R, h, n, thick, kind, seed) {
    const data = [], M = 150, K = 5;
    const peak = a => {
      const u = a / TAU * n, i = Math.floor(u), f_ = u - i;
      const tall = 0.45 + hash1(((i % n) + n) % n * 13 + seed);
      return Math.pow(Math.max(0, 1 - Math.abs(f_ - 0.5) * 2), 2.4) * tall;
    };
    const at = (j, k) => {
      const a = j / M * TAU, v = k / K;
      const hh = h * (0.30 + 0.95 * peak(a));
      const rad = R * (0.62 + 0.42 * Math.pow(v, 0.6) + 0.10 * v * v);
      return [c[0] + Math.cos(a) * rad, c[1] + hh * Math.pow(v, 0.85), c[2] + Math.sin(a) * rad];
    };
    for (let j = 0; j < M; j++) for (let k = 0; k < K; k++) {
      const q = [at(j, k), at(j, k + 1), at(j + 1, k + 1), at(j + 1, k)];
      const nm = V.norm(V.cross(V.sub(q[1], q[0]), V.sub(q[3], q[0])));
      for (const i of [0, 1, 2, 0, 2, 3]) data.push(...q[i], ...nm);
    }
    this.out.blobs.batches.push({ kind, data: new Float32Array(data) });
    this.out.blobs.n++;
    for (let i = 0; i < n; i++) {
      const a = (i + 0.5) / n * TAU;
      const hh = h * (0.30 + 0.95 * peak(a));
      const rad = R * 1.17;
      this.dropMesh([c[0] + Math.cos(a) * rad, c[1] + hh + thick * 1.6, c[2] + Math.sin(a) * rad], thick * 0.72, thick * 0.78, 0.7, kind);
    }
  }
  signature(f, cam, wt) {
    const rib = this.out.ribbons, A = this.anim;
    const viewAt = p => V.norm(V.sub(cam.pos, p));
    // ---- the hook drop and its crown
    if (f < 18) {
      const u = f / 18;
      const y = 0.84 * (1 - Math.pow(u, 1.75)) + 0.052;
      const wob = Math.sin(f * 1.9) * 0.05;
      this.dropMesh([0, y, 2.5], 0.052 * (1 - wob), 0.056 * (1 + wob), 0.35 + u * 0.9, 0);
      for (let i = 0; i < 3; i++) this.dropMesh([Math.sin(i * 2.1) * 0.012, y + 0.15 + i * 0.07, 2.5], 0.012 - i * 0.003, 0.014 - i * 0.003, 0.5, 0);
      rib.add([[0, y + 0.62, 2.5], [0, y + 0.3, 2.5], [0, y + 0.07, 2.5]], 0.006, 3, 1, [1, 1, 1, 0.8], viewAt([0, y, 2.5]));
    } else if (f < 36) {
      const age = WARP(f) - WARP(18) + 0.02;
      const u = clamp(age / 0.2);
      if (u < 1) {
        this.crown([0, 0.0, 2.5], 0.07 + Ease.out(u) * 0.21, 0.19 * Math.sin(Math.PI * Math.min(1, u * 0.95 + 0.05)), 17, 0.016 * (1 - u * 0.6), 0, 5);
        const rebound = Math.sin(Math.PI * clamp((u - 0.3) / 0.7));
        if (rebound > 0.02) this.dropMesh([0, 0.02 + 0.20 * rebound, 2.5], 0.022 * rebound + 0.006, 0.030 * rebound + 0.006, 0.6, 0);
      }
    }
    // ---- the single drop in the lull
    if (f >= 930 && f < 947) {
      const a = this.dripAt, g = this.dripGround;
      if (f < 939) {
        const s = smooth(929, 938, f);
        this.dropMesh([a[0], a[1] - 0.02 * s, a[2]], 0.012 + 0.012 * s, 0.012 + 0.018 * s, 1.0 - 0.3 * s, 0);
      } else {
        const u = (f - 939) / 7;
        const y = lerp(a[1] - 0.02, g[1] + 0.03, u * u);
        this.dropMesh([a[0], y, a[2]], 0.022, 0.028 + 0.012 * u, 0.8, 0);
      }
    }
    if (f >= 946 && f < 960) {
      const u = (f - 945) / 11;
      if (u < 1) this.crown(this.dripGround, 0.025 + 0.085 * Ease.out(u), 0.075 * Math.sin(Math.PI * Math.min(1, u)), 11, 0.006 * (1 - u * 0.5), 0, 9);
    }
    // ---- her flare out of the rubble
    if (f >= 382 && f < 396) {
      const c = A.position('iro', f);
      const k = smooth(382, 386, f) * (1 - smooth(391, 396, f));
      for (let i = 0; i < 22; i++) {
        const pts = [];
        const a0 = hash1(i * 19) * TAU, r0 = 0.45 + hash1(i * 7) * 0.9, hgt = (1.3 + hash1(i * 11) * 2.6) * k;
        const rise = ((f - 382) * (0.09 + hash1(i) * 0.05) + hash1(i * 3)) % 1;
        for (let j = 0; j <= 9; j++) {
          const u = j / 9, y = (rise * 0.8 + u * 0.75) * hgt;
          const rad = r0 * (1 + 0.35 * y / 3) + Math.sin(u * 5 + i + f * 0.7) * 0.10;
          pts.push([c[0] + Math.cos(a0 + u * 0.35) * rad, c[1] + 0.05 + y, c[2] + Math.sin(a0 + u * 0.35) * rad * 0.7 - 0.25]);
        }
        rib.add(pts, pts.map((_, j) => 0.12 * k * Math.sin(Math.PI * Math.min(1, j / 9 * 0.9 + 0.08))), 0, i * 0.7, [...PAL[i % 5], 1], viewAt(c));
      }
    }
    // ---- ink gathering on his palm before H5, and on both fists before H7
    for (const [f0, f1, kind, joints] of [[194, 204, 'sumi', ['wrR']], [194, 204, 'iro', ['anR']], [318, 334, 'sumi', ['wrR']], [460, 474, 'sumi', ['wrR', 'wrL']], [526, 544, 'iro', ['anL']], [746, 764, 'iro', ['anR']]]) {
      if (f < f0 || f >= f1) continue;
      const s = A.evaluate(kind, f), rg = solveRig(kind, s.pose, s.root);
      const k = smooth(f0, f0 + 6, f);
      for (const j of joints) {
        const h = rg.J[j];
        for (let i = 0; i < 14; i++) {
          const ph = hash1(i * 17 + 3);
          const t = ((f - f0) * (0.07 + ph * 0.05) + ph) % 1;
          const dir = V.norm([hash1(i * 5) - 0.5, hash1(i * 11) - 0.5, hash1(i * 23) - 0.5]);
          const tang = V.norm(V.cross(dir, [0.3, 1, 0.2]));
          const pt = q => V.add(h, V.add(V.mul(dir, (1 - q) * 1.5 + 0.1), V.mul(tang, Math.sin(q * 3.4) * 0.35 * (1 - q))));
          const pts = [pt(Math.max(0, t - 0.28)), pt(Math.max(0, t - 0.14)), pt(t)];
          if (kind === 'sumi') rib.add(pts, [0.006, 0.028 * k, 0.045 * k], 1, i, [0, 0, 0, 1], viewAt(h));
          else rib.add(pts, [0.003, 0.024 * k, 0.038 * k], 0, i, [...PAL[i % 5], 1], viewAt(h));
        }
        this.out.stars.push({ p: h, size: (kind === 'sumi' ? 0.22 : 0.26) * k * (1 + 0.14 * ((f % 4) < 2 ? 1 : -1)), kind: kind === 'sumi' ? 1 : 0, seed: Math.floor(f / 2) * 1.7, spikes: 14, rot: f * 0.21, stretch: 1, age: 2.6 });
      }
    }
    if (f >= 794 && f < 802) {
      const gy = groundHeight(24.5, 0, f);
      const k = f === 794 ? 0.82 : 1.0 + (f - 795) * 0.025;
      this.out.rings.push({ c: [24.45, gy + 0.035, -0.05], n: [0, 1, 0], r: 2.55 * k, w: 1, seed: 11, disc: true, alpha: 1, kind: 4, noDepth: false });
    }
    // ---- the shadow that spreads where he is about to land
    if (f >= 784 && f < 794) {

}

function animeEye(ctx, e) {
  // e: {cx, cy, w, h, open, flip, irisR, look}
  const { cx, cy, w, h, open, flip } = e;
  const X = u => cx + u * w / 2 * flip, Y = v => cy + v * h;
  const lidTop = bez([X(-1.02), Y(0.06)], [X(-0.62), Y(-0.62 * open - 0.02)], [X(0.34), Y(-0.80 * open - 0.02)], [X(1.03), Y(-0.30 * open - 0.06)], 30);
  const lidBot = bez([X(-1.02), Y(0.06)], [X(-0.50), Y(0.44 * open + 0.06)], [X(0.46), Y(0.46 * open + 0.04)], [X(1.03), Y(-0.30 * open - 0.06)], 30);
  if (open > 0.08) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(lidTop[0][0], lidTop[0][1]);
    for (const p of lidTop) ctx.lineTo(p[0], p[1]);
    for (let i = lidBot.length - 1; i >= 0; i--) ctx.lineTo(lidBot[i][0], lidBot[i][1]);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = '#fff8f0'; ctx.fillRect(cx - w, cy - h * 1.5, w * 2, h * 3);
    ctx.fillStyle = '#c9a8bf'; // lid shadow across the white
    ctx.beginPath(); ctx.moveTo(lidTop[0][0], lidTop[0][1] + h * 0.1);
    for (const p of lidTop) ctx.lineTo(p[0], p[1] + h * 0.17);
    ctx.lineTo(X(1.2), Y(-1.4)); ctx.lineTo(X(-1.2), Y(-1.4)); ctx.closePath(); ctx.fill();
    const ix = X(e.look || 0.08), iy = cy - h * 0.05, R = e.irisR;
    const g = ctx.createLinearGradient(ix, iy - R * 1.15, ix, iy + R * 1.15);
    g.addColorStop(0, '#062a55'); g.addColorStop(0.45, '#0a79b8'); g.addColorStop(0.72, '#10e0f0'); g.addColorStop(1, '#c8ffe8');
    ctx.beginPath(); ctx.ellipse(ix, iy, R * 0.94, R * 1.12, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = R * 0.13; ctx.strokeStyle = '#05203f'; ctx.stroke();
    // radial fibres, with every colour caught in them
    ctx.save(); ctx.beginPath(); ctx.ellipse(ix, iy, R * 0.9, R * 1.08, 0, 0, TAU); ctx.clip();
    const cols = ['#ff2e82', '#ffc21f', '#7b3bff', '#e8fff8', '#12d8cc'];
    const r = mulberry32(5);
    for (let i = 0; i < 46; i++) {
      const a = i / 46 * TAU + rr(r, -0.05, 0.05);
      const c = i % 3 === 0 && Math.sin(a) > -0.1 ? cols[i % 5] : 'rgba(190,255,250,0.45)';
      inkLine(ctx, [[ix + Math.cos(a) * R * 0.50, iy + Math.sin(a) * R * 0.60], [ix + Math.cos(a) * R * rr(r, 0.72, 0.9), iy + Math.sin(a) * R * rr(r, 0.86, 1.06)]], R * 0.045, c, 0.2, 0.1);
    }
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(ix, iy - R * 0.02, R * (e.pupil || 0.34), R * (e.pupil || 0.34) * 1.35, 0, 0, TAU); ctx.fillStyle = '#041634'; ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(ix - R * 0.40, iy - R * 0.46, R * 0.27, R * 0.22, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ix + R * 0.38, iy + R * 0.52, R * 0.11, R * 0.10, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ix + R * 0.52, iy + R * 0.28, R * 0.05, R * 0.05, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  inkLine(ctx, lidTop, h * 0.25, '#2b0a22', 0.35, 0.5);
  inkLine(ctx, [[X(0.86), Y(-0.36 * open - 0.1)], [X(1.18), Y(-0.55 * open - 0.1)], [X(1.30), Y(-0.74 * open - 0.1)]], h * 0.15, '#2b0a22', 0.9, 0.05);
  inkLine(ctx, [[X(0.66), Y(-0.55 * open - 0.1)], [X(0.90), Y(-0.80 * open - 0.12)]], h * 0.09, '#2b0a22', 0.9, 0.05);
  if (open > 0.08) {
    inkLine(ctx, lidBot.slice(12, 28), h * 0.065, '#2b0a22', 0.05, 0.3);
    inkLine(ctx, bez([X(-0.78), Y(-0.52 * open - 0.20)], [X(-0.3), Y(-0.88 * open - 0.24)], [X(0.4), Y(-0.98 * open - 0.22)], [X(0.86), Y(-0.66 * open - 0.22)]), h * 0.04, '#9a4658', 0.05, 0.05);
  }
}

function drawCloseupIro(ctx, lf, f) {
  const W = 1920, H = 1080, t = f / 24;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6e6e6e'); g.addColorStop(1, '#b9b9b9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  washStrokes(ctx, 11, 26, ['#8a8a8a', '#a4a4a4', '#c6c6c6', '#5c5c5c'], 0, 1080, -0.12, [500, 1200], [40, 150], lf * 17);
  // her colour starts to lift off the paper as her eyes open
  const k = smooth(5, 12, lf);
  if (k > 0) {
    ctx.globalAlpha = k;
    washStrokes(ctx, 29, 15, ['#ff2e82', '#ff5424', '#ffc41c', '#12d8cc', '#7b3bff'], 40, 1060, -0.16, [500, 1300], [30, 90], lf * 52);
    ctx.globalAlpha = 1;
  }
  const open = lf < 6 ? 0.04 : (lf < 9 ? Ease.back(invlerp(6, 9, lf)) : lerp(1.0, 0.82, smooth(13, 18, lf)));
  const zoom = 1.04 + lf * 0.0042 + (lf >= 6 ? 0.045 * Math.exp(-(lf - 6) / 3) : 0);
  const shx = lf >= 6 && lf < 12 ? Math.cos((lf - 6) * 2.1) * 12 * Math.exp(-(lf - 6) / 2) : 0;
  ctx.setTransform(zoom, 0, 0, zoom, 930 - 930 * zoom + shx - lf * 1.1, 520 - 520 * zoom);
  ctx.translate(-90, 6);
  drawIroFace(ctx, Math.floor(f / 2) / 12, { open, grin: smooth(13, 17, lf), brow: smooth(7, 11, lf), pupil: lf < 10 ? 0.40 : 0.30 });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (lf >= 8) {
    const p = invlerp(8, 17, lf);
    drawText(ctx, 'IRO', 1620, 730, 190, { align: 'center', color: '#2b0a22', weight: 0.17, outline: '#fff4dc', outlineWidth: 28, progress: p, slant: 0.2 });
    const grd = ctx.createLinearGradient(1420, 0, 1820, 0);
    grd.addColorStop(0, '#ff2e82'); grd.addColorStop(0.5, '#ff5424'); grd.addColorStop(1, '#ffb000');
    drawText(ctx, 'IRO', 1620, 730, 190, { align: 'center', color: grd, weight: 0.095, progress: p, slant: 0.2 });
  }
}

function inkLock(ctx, a, c1, tip, c2, b, fill) {
  const segs = [a, [c1[0], c1[1], c1[2], c1[3], tip[0], tip[1]], [c2[0], c2[1], c2[2], c2[3], b[0], b[1]]];

  for (const [t, w, s0, s1] of [[0.28, 6, 5, 22], [0.40, 3, 9, 25], [0.55, 2, 4, 14]]) {
    const m = p.map((v, i) => [lerp(v[0], q[i][0], t), lerp(v[1], q[i][1], t)]).slice(s0, s1);
    inkLine(ctx, m, w, '#d8d8d8', 0.05, 0.05);
  }
  ctx.restore();
  pathOf(ctx, segs); ctx.closePath(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 5; ctx.stroke();

function drawCloseupSumi(ctx, lf, f) {
  const W = 1920, H = 1080;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1c1c1c'); g.addColorStop(1, '#4a4a4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  washStrokes(ctx, 41, 22, ['#0a0a0a', '#262626', '#5c5c5c', '#101010'], 0, 1080, 0.10, [600, 1400], [60, 200], -lf * 9);
  washStrokes(ctx, 57, 5, ['#bdbdbd', '#e6e6e6'], 80, 1000, 0.13, [500, 1100], [18, 50], -lf * 21);
  const open = lf < 9 ? 0.03 : (lf < 12 ? Ease.back(invlerp(9, 12, lf)) : 1.0);
  const glow = lf >= 9 ? Math.exp(-(lf - 9) / 4.5) : 0;
  const zoom = 1.05 + lf * 0.004 + (lf >= 9 ? 0.05 * Math.exp(-(lf - 9) / 3) : 0);
  const shx = lf >= 9 && lf < 15 ? Math.cos((lf - 9) * 2.1) * -15 * Math.exp(-(lf - 9) / 2) : 0;
  ctx.setTransform(zoom, 0, 0, zoom, 970 - 970 * zoom + shx + lf * 1.1, 520 - 520 * zoom);
  drawSumiFace(ctx, Math.floor(f / 2) / 12, { open, glow: glow * 0.8, drip: lf / 24 });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (lf >= 8) drawText(ctx, 'SUMI', 360, 760, 160, { align: 'center', color: '#050505', weight: 0.15, outline: '#f2f2f2', outlineWidth: 24, progress: invlerp(8, 19, lf), slant: 0.2 });
}
// one eye, filling the frame, snapping open
function drawEyeSnap(ctx, lf, f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#101010'; ctx.fillRect(0, 0, 1920, 1080);
  const open = lf < 1 ? 0.03 : (lf < 2 ? 0.7 : 1.08);
  const k = 3.5 + lf * 0.12;
  ctx.setTransform(k, 0, 0, k, 960 - 1100 * k + (lf === 2 ? 26 : 0), 540 - 490 * k);
  drawSumiFace(ctx, Math.floor(f / 2) / 12, { open, glow: lf >= 1 ? 0.45 * Math.exp(-(lf - 1) / 2.5) : 0, drip: 0.4 });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
// the two pairs of eyes, stacked
function drawEyeStrips(ctx, lf, f) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 1920, 1080);
  const clip = pts => { ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.clip(); };
  const slide = (1 - Ease.snap(invlerp(0, 4, lf))) * 520;
  // his, above, entering from the right
  clip([[0, 70], [1920, 30], [1920, 500], [0, 560]]);
  ctx.fillStyle = '#242424'; ctx.fillRect(0, 0, 1920, 600);
  let k = 2.15 + lf * 0.02;
  ctx.setTransform(k, 0, 0, k, 1060 - 960 * k + slide, 290 - 500 * k);
  drawSumiFace(ctx, f / 24, { open: 1.0, glow: 0.12, drip: 0.5 });
  ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // hers, below, entering from the left
  clip([[0, 592], [1920, 532], [1920, 1010], [0, 1050]]);
  ctx.fillStyle = '#8f8f8f'; ctx.fillRect(0, 500, 1920, 600);
  washStrokes(ctx, 91, 10, ['#ff2e82', '#ff5424', '#ffc41c', '#12d8cc'], 540, 1050, -0.1, [500, 1200], [24, 70], lf * 60);
  k = 2.0 + lf * 0.02;
  ctx.setTransform(k, 0, 0, k, 880 - 975 * k - slide, 790 - 500 * k);
  drawIroFace(ctx, f / 24, { open: 1.0, grin: 0, brow: 1, pupil: 0.26 });
  ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  inkLine(ctx, [[-20, 576], [1940, 516]], 15, '#f6f6f6', 0.9, 0.9);
}

// the closing title, written stroke by stroke
function drawTitle(ctx, f) {
  const p = invlerp(1170, 1192, f);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  if (p <= 0) return false;
  const size = 70, y = 976, gap = 46;
  const w1 = textWidth('IRO', size), wx = textWidth('×', size), w2 = textWidth('SUMI', size);
  const total = w1 + wx + w2 + gap * 2, x0 = 960 - total / 2;
  const grd = ctx.createLinearGradient(x0, 0, x0 + w1, 0);
  grd.addColorStop(0, '#ff2e82'); grd.addColorStop(0.5, '#ff5a24'); grd.addColorStop(1, '#ffc01c');
  const o = { weight: 0.15, outlineWidth: 15, slant: 0.16 };
  drawText(ctx, 'IRO', x0, y, size, Object.assign({ color: grd, outline: '#fff8ea', progress: clamp(p * 2.2) }, o));
  drawText(ctx, '×', x0 + w1 + gap, y, size, Object.assign({ color: '#0a0a0a', outline: '#f6f6f6', progress: clamp(p * 2.6 - 0.9) }, o));
  drawText(ctx, 'SUMI', x0 + w1 + wx + gap * 2, y, size, Object.assign({ color: '#0a0a0a', outline: '#f6f6f6', progress: clamp(p * 1.9 - 0.9) }, o));
  return true;
}

class Animator {
  constructor() {
    this.keys = { iro: IRO_KEYS, sumi: SUMI_KEYS };
    this.delta = new Map();
    this.solveTouches();
  }
  yOf(y, x, z, f) { return typeof y === 'number' ? y : groundHeight(x, z, f) + y.g; }
  sample(kind, fPose, fMove) {
    const ks = this.keys[kind];
    let i = ks.length - 1;
    for (let k = 0; k < ks.length - 1; k++) if (fPose < ks[k + 1].f) { i = k; break; }
    const a = ks[i], b = ks[Math.min(i + 1, ks.length - 1)];
    const span = Math.max(1, b.f - a.f);
    let u = clamp((fPose - a.f) / span);
    if (b.cut || a === b) u = 0;
    const e = Ease[b.ease](u);
    const pa = this.poseOf(a), pb = this.poseOf(b);
    const pose = lerpPose(pa, pb, e);
    // slide: the cel keeps moving on ones while the drawing is held
    let um = u, em = e;
    if (b.slide && !b.cut && a !== b) { um = clamp((fMove - a.f) / span); em = Ease[b.ease](um); }
    const dA = this.delta.get(a) || [0, 0, 0], dB = this.delta.get(b) || [0, 0, 0];
    const ax = a.pos[0] + dA[0], az = a.pos[2] + dA[2], bx = b.pos[0] + dB[0], bz = b.pos[2] + dB[2];
    const x = lerp(ax, bx, em), z = lerp(az, bz, em);
    const ya = this.yOf(a.pos[1], ax, az, fPose) + dA[1], yb = this.yOf(b.pos[1], bx, bz, fPose) + dB[1];
    const rot = k => {
      let av = a[k], bv = b[k];
      if (b.cutRot) av = av - Math.round((av - bv) / 360) * 360;
      return lerp(av, bv, e);
    };
    let stretch = lerp(a.stretch || 1, b.stretch || 1, e);
    return {
      pose, root: { pos: [x, lerp(ya, yb, em), z], yaw: rot('yaw'), pitch: rot('pitch'), roll: rot('roll'), spin: rot('spin') },
      stretch, keyA: a, keyB: b,
    };
  }
  poseOf(k) {
    if (!k._pose) {
      const ov = {};
      for (const q of ['eyes', 'mouth', 'head']) if (k[q] !== undefined) ov[q] = k[q];
      k._pose = makePose(k.p, ov);
    }
    return k._pose;
  }
  // IRO spins on SUMI's grip
  swingOverride(kind, f, s) {
    if (f < 601 || f >= 618) return s;
    const u = (f - 600) / 18;
    const turn = Ease.in(u) * 2.35;                      // revolutions
    const yawS = -90 + turn * 360 + 6 * u;
    const centre = [49.05, 0.15, 0.3];
    if (kind === 'sumi') {
      const w = smooth(0, 0.22, u);
      const pose = lerpPose(this.poseOf({ p: SUMI.grab }), makePose(SUMI.swing, {}), w);
      return { pose, root: { pos: centre, yaw: yawS, pitch: -10 * w, roll: 0, spin: 0 }, stretch: 1 };
    }
    const a = yawS * D2R, rad = lerp(1.7, 2.35, u);
    const pos = [centre[0] + Math.sin(a) * rad, centre[1] + 1.0 + Math.sin(turn * TAU * 0.5) * 0.55 + u * u * 2.0, centre[2] + Math.cos(a) * rad * 0.72];
    return { pose: makePose(IRO.flung, { eyes: 'strain' }), root: { pos, yaw: yawS + 90, pitch: -52, roll: 0, spin: 0 }, stretch: 1 + 0.3 * u };
  }
  raw(kind, f) {
    const fp = drawingFrame(f);
    let s = this.sample(kind, fp, f);
    s = this.swingOverride(kind, fp, s);
    return s;
  }
  // rig for a frame with all layered motion applied
  evaluate(kind, f) {
    const s = this.raw(kind, f);
    const pose = s.pose;
    const fp = drawingFrame(f);
    // breathing in the quiet passages
    const quiet = (fp >= 72 && fp < 188) || (fp >= 874 && fp < 1004) || (fp >= 1132);
    if (quiet) {
      const tired = fp >= 874 && fp < 1004 ? 1 : 0.35;
      const br = Math.sin(fp / 24 * TAU * (tired > 0.5 ? 0.72 : 0.45) + (kind === 'iro' ? 0 : 2.1)) * tired;
      pose.hip = V.add(pose.hip, [0, br * 0.014, 0]);
      pose.spine = V.add(pose.spine, [br * 3.2, 0, 0]);
      pose.hL = V.add(pose.hL, [0, br * 0.010, 0]); pose.hR = V.add(pose.hR, [0, br * 0.010, 0]);
    }
    const root = Object.assign({}, s.root);
    root.pos = root.pos.slice();
    for (const [hf, hold, who, axis, amt] of SHUDDER) {
      if (f > hf && f < hf + hold && who.includes(kind)) {
        const sg = (f - hf) % 2 ? 1 : -1;
        const k = amt * (1 - (f - hf) / (hold + 1));
        root.pos = V.mad(root.pos, V.norm(axis), sg * k);
      }
    }
    return { pose, root, stretch: s.stretch };
  }
  position(kind, f) { return this.sample(kind, f, f).root.pos; }
  // smoothed position for cameras
  anchor(kind, f, h = 1.0) {
    const s = this.swingOverride(kind, f, this.sample(kind, f, f));
    return V.add(s.root.pos, [0, h, 0]);
  }
  velocity(kind, f) {
    const fp = drawingFrame(f);
    const a = this.raw(kind, Math.max(0, fp - 3)).root.pos, b = this.raw(kind, fp).root.pos;
    const v = V.mul(V.sub(b, a), 24 / 3);
    if (V.len(v) > 130) return [0, 0, 0];
    return v;
  }
  // line up the striking limb with its target on contact frames
  solveTouches() {
    for (const kind of ['sumi', 'iro']) {
      const other = kind === 'iro' ? 'sumi' : 'iro';
      const ks = this.keys[kind];
      for (let i = 0; i < ks.length; i++) {
        const k = ks[i];
        if (!k.touch) continue;
        const mine = this.raw(kind, k.f), theirs = this.raw(other, k.f);
        const rm = solveRig(kind, mine.pose, mine.root), rt = solveRig(other, theirs.pose, theirs.root);
        const want = V.add(rt.J[k.touch.theirs], k.touch.off);
        const d = V.sub(want, rm.J[k.touch.mine]);
        if (V.len(d) > 2.2) console.warn('large contact correction', kind, k.f, d.map(x => x.toFixed(2)).join(','));
        // apply to the contact drawing, its hold, and ease into it from the drawing before
        this.delta.set(k, d);
        for (let j = i + 1; j < ks.length && ks[j].ease === 'hold'; j++) this.delta.set(ks[j], d);
        if (i > 0 && k.f - ks[i - 1].f <= 3) this.delta.set(ks[i - 1], V.add(this.delta.get(ks[i - 1]) || [0, 0, 0], V.mul(d, 0.6)));
      }
    }
  }
}

const MID = (off) => (d, f) => V.add(V.mul(V.add(d.anim.anchor('iro', f, 1.2), d.anim.anchor('sumi', f, 1.4)), 0.5), off);

const pairGap = (d, f) => V.dist(d.anim.anchor('iro', f, 1.05), d.anim.anchor('sumi', f, 1.45));

class Director {
  constructor(anim) { this.anim = anim; }
  shotIndex(f) { let i = 0; while (i + 1 < SHOTS.length && f >= SHOTS[i + 1][0]) i++; return i; }
  base(f, shotIdx) {
    const [, keys] = SHOTS[shotIdx];
    let i = 0; while (i + 2 < keys.length && f >= keys[i + 1].f) i++;
    const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
    const u = a === b ? 0 : clamp((f - a.f) / Math.max(1e-6, b.f - a.f));
    const e = Ease[b.ease](u);
    const val = (v) => (typeof v === 'function' ? v(this, f) : v);
    const pa = val(a.pos), pb = val(b.pos), ta = val(a.tgt), tb = val(b.tgt);
    return { pos: V.lerp(pa, pb, e), tgt: V.lerp(ta, tb, e), fov: lerp(a.fov, b.fov, e), roll: lerp(a.roll, b.roll, e) };
  }
  camera(f) {
    const idx = this.shotIndex(f);
    const c = this.base(f, idx);
    c.shot = idx; c.shotStart = SHOTS[idx][0]; c.opts = SHOTS[idx][2] || {};
    let sx = 0, sy = 0, roll = 0;
    for (const [sf, dx, dy, amp, dec, rl] of SHAKES) {
      const age = f - sf;
      if (age < 0 || age > dec * 6) continue;
      const env = Math.exp(-age / dec);
      const osc = Math.cos(age * 1.9);                        // damped oscillation along the line of force
      const l = Math.hypot(dx, dy) || 1;
      sx += dx / l * amp * env * osc; sy += dy / l * amp * env * osc;
      roll += rl * env * Math.cos(age * 1.55);
    }
    let fov = c.fov;
    for (const [pf, k, dec] of PUNCH) { const age = f - pf; if (age >= 0 && age < dec * 6) fov *= 1 - k * Math.exp(-age / dec); }
    // never let the camera sink into the broken ground
    const gh = groundHeight(c.pos[0], c.pos[2], f);
    if (c.pos[1] < gh + 0.18) c.pos = [c.pos[0], gh + 0.18, c.pos[2]];
    c.sx = sx; c.sy = sy; c.roll += roll; c.fov = fov;
    return c;
  }
}

const keyf = (f, table) => {
  if (f <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) if (f <= table[i][0]) { const [a, va] = table[i - 1], [b, vb] = table[i]; return lerp(va, vb, smooth(a, b, f)); }
  return table[table.length - 1][1];
};

  post(f, cam, C, fxOut) {
    const P = { waves: fxOut.waves.slice(), bloom: 0.20, vig: 0.28, grain: 0.032, halo: 1 };
    let ca = 0;
    for (const [hf, k] of CA_HITS) { const age = f - hf; if (age >= 0 && age < 16) ca += k * Math.exp(-age / 3.2); }

      let p = spec;

      else if (typeof spec[0] === 'string') { const s = this.anim.evaluate(spec[0], f); p = solveRig(spec[0], s.pose, s.root).J[spec[1]]; }
      const s = this.R.project(C, p);

    };

    const camGap = V.dist(cam.pos, this.anim.anchor('sumi', f, 1.4));
    P.quiet = smooth(3.0, 7.5, camGap) * (f >= 980 && f < 1092 ? 0.45 : 1) * (f >= 1146 ? 0 : 1);

  // what must stay visible this frame
  subjects(f) {

  }
  renderFrame(f) {
    const R = this.R;

      if (f < a || f >= b) continue;
      this.cuCtx.reset();                       // no canvas state may leak between frames
      draw(this.cuCtx, f - a, f);

    const C = R.camera(cam);

    for (const kind of ['sumi', 'iro']) if (onScreen(kind, f)) chars.push(this.character(kind, f));
    if (f >= 976 && f < 1092) for (const ch of chars) if (ch.kind === 'sumi') ch.rimDir = V.norm([0.2, 0.6, -0.7]);

    const fxOut = this.fx.frame(f, cam, C, R, subjects);
    const ground = this.world.groundState(f);
    if (f >= 1146) ground.enso = [23.5, 0, 31.0, Ease.io(invlerp(1147, 1174, f))];
    const aerial = smooth(20, 60, cam.pos[1]);
    const fogGrey = lerp(0.76, 0.34, sky.dark);
    const so = cam.opts || {};

      camera: cam, chars, frame: f, time: f / 24, world: this.world,
      ground, paint: this.paint(f), sky,
      glass: GLASS.filter(g => f >= g[0]).map(g => ({ p: g[1], r: g[2] * Ease.out(invlerp(g[0] - 1, g[0] + g[3], f)) })).slice(-6),
      shadow: (so.sky || f >= 1093 && f < 1105) ? null : { center: [cam.tgt[0], Math.min(cam.tgt[1], 3), cam.tgt[2]], radius: shadowR },
      env: { fogCol: [fogGrey, fogGrey, fogGrey], fogDen: lerp(0.0085, 0.0018, aerial) * (f >= 1140 ? 1 - 0.7 * smooth(1150, 1175, f) : 1), dim: keyf(f, [[0, 1], [1068, 1], [1076, 0.74], [1083, 0.62], [1085, 1], [1199, 1]]) },
      macro: f < 34,

    };

      S.clouds = { y: 90, hole: [30, 0, hr, 1] };

    S.post = this.post(f, cam, C, fxOut);

// renderer.js — the multi-pass cel pipeline
const SUN_DIR = V.norm([-0.55, 0.78, 0.46]);
const OUT_W = 1920, OUT_H = 1080;

class Renderer {

    this.pChar = makeProgram(VS_CHAR, FS_CHAR, 'char');
    this.pShChar = makeProgram(VS_SHADOW_CHAR, FS_EMPTY, 'shChar');
    this.pShChunk = makeProgram(VS_SHADOW_CHUNK, FS_EMPTY, 'shChunk');
    this.pPuff = makeProgram(VS_PUFF, FS_PUFF, 'puff');
    this.pInk = makeProgram(FS_TRI_VS, FS_INK, 'ink');
    this.pDown = makeProgram(FS_TRI_VS, FS_DOWN, 'down');
    this.pFxDown = makeProgram(FS_TRI_VS, FS_FXDOWN, 'fxdown');

        useProgram(this.pGround, Object.assign({ uVP: C.vp, uView: C.view, uMacro: S.macro ? 1 : 0, uEnso: (S.ground && S.ground.enso) || [0, 0, 0, 0] }, envU, GU, PU));
        drawVAO(this.groundVAO);
        gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-2, -4);
        useProgram(this.pCrack, Object.assign({ uVP: C.vp, uView: C.view, uTime: S.world.wt, uScour: [WARP(HIT.H13.f + 8) - 0.02, 33] }, envU, GU, PU));
        drawVAO(this.crackVAO);
        gl.disable(gl.POLYGON_OFFSET_FILL);
      }
      const gA = new Float32Array(24);
      (S.glass || []).slice(0, 6).forEach((g, i) => gA.set([g.p[0], g.p[1], g.p[2], g.r], i * 4));
      useProgram(this.pChunk, Object.assign({ uVP: C.vp, uView: C.view, uChunkTex: this.tChunk, uGlass: gA }, envU, PU));
      drawVAO(this.chunkVAO);
    }
    if (S.clouds) {
      useProgram(this.pClouds, Object.assign({ uVP: C.vp, uView: C.view, uCloudY: S.clouds.y, uTime: S.time, uHole: S.clouds.hole || [0, 0, 0, 0] }, envU));
      drawVAO(this.cloudVAO);
    }
    for (const ch of chars) this.drawChar(C, ch.slot, ch, S, ch.cls);

    // ---- smoke impostors
    const puffs = S.puffs;
    const smokeOn = puffs && puffs.n > 0;
    bindFBO(this.fSmoke);
    gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
    gl.clearBufferfv(gl.COLOR, 1, [1e9, 0, 0, 0]);
    gl.clearBufferfv(gl.DEPTH, 0, [1]);
    if (smokeOn) {
      useProgram(this.pPuff, { uView: C.view, uProj: C.proj, uSceneND: this.tND, uRes: [W, H] });
      gl.bindVertexArray(this.puffVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.puffVBO);
      gl.bufferData(gl.ARRAY_BUFFER, puffs.a.subarray(0, puffs.n * 8), gl.DYNAMIC_DRAW);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, puffs.n);
      gl.bindVertexArray(null);
    }
    // ---- ink + smoke composite
    gl.disable(gl.DEPTH_TEST);
    bindFBO(this.fInk);
    const sunView = V.norm(M3.v([C.view[0], C.view[4], C.view[8], C.view[1], C.view[5], C.view[9], C.view[2], C.view[6], C.view[10]], V.norm([-0.45, 0.75, 0.55])));
    useProgram(this.pInk, {
      uColor: this.tColor, uND: this.tND, uId: this.tId, uSmokeA: this.tSmA, uSmokeD: this.tSmD,
      uPx: [1 / W, 1 / H], uSS: this.ss, uSmokeOn: smokeOn ? 1 : 0, uInvView: C.invView,
      uTan: [C.tanY * 16 / 9, C.tanY], uSunView: sunView, uSceneDim: envU.uSceneDim,
    });
    drawFullscreen();
    // ---- FX layer
    this.renderFx(S, C);
    // ---- downsample
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
    bindFBO(this.fDown);
    useProgram(this.pDown, { uSrc: this.tInk, uId: this.tId, uSmokeA: this.tSmA, uSmokeD: this.tSmD, uND: this.tND, uPx: [1 / W, 1 / H], uSS: this.ss, uSmokeOn: smokeOn ? 1 : 0 });
    drawFullscreen();
    bindFBO(this.fFxD);
    useProgram(this.pFxDown, { uSrc: this.tFx, uPx: [1 / W, 1 / H], uSS: this.ss });
    drawFullscreen();
    this.renderPost(S, C, false);
  }

  renderFx(S, C) {
    const fx = S.fx || {};
    bindFBO(this.fFx);
    gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.disable(gl.CULL_FACE);
    if (fx.blobs && fx.blobs.n) {
      for (const batch of fx.blobs.batches) {
        updateVAO(this.blobVAO, batch.data, batch.data.length);
        useProgram(this.pBlob, { uVP: C.vp, uCamPos: C.pos, uSunDir: SUN_DIR, uKind: batch.kind, uTime: S.time });
        drawVAO(this.blobVAO);
      }
    }
    gl.depthMask(false);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    if (fx.rings) for (const r of fx.rings) {
      if (r.noDepth) gl.disable(gl.DEPTH_TEST); else gl.enable(gl.DEPTH_TEST);
      const n = V.norm(r.n);
      let u = V.cross(n, Math.abs(n[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0]); u = V.norm(u);
      const v = V.cross(n, u);
      useProgram(this.pRing, { uVP: C.vp, uCenter: r.c, uAxisU: u, uAxisV: v, uR: r.r, uW: r.w, uSeed: r.seed || 0, uDisc: r.disc ? 1 : 0, uAlpha: r.alpha, uKind: r.kind });
      if (!this.emptyVAO) this.emptyVAO = gl.createVertexArray();
      gl.bindVertexArray(this.emptyVAO);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 322);
      gl.bindVertexArray(null);
    }
    gl.enable(gl.DEPTH_TEST);
    if (fx.ribbons && fx.ribbons.n) {
      updateVAO(this.ribbonVAO, fx.ribbons.a, fx.ribbons.n);
      useProgram(this.pRibbon, { uVP: C.vp, uTime: S.time });
      drawVAO(this.ribbonVAO);
    }
    if (fx.drops && fx.drops.n) {
      gl.bindVertexArray(this.dropVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.dropVBO);
      gl.bufferData(gl.ARRAY_BUFFER, fx.drops.a.subarray(0, fx.drops.n * 12), gl.DYNAMIC_DRAW);
      useProgram(this.pDrop, { uVP: C.vp, uView: C.view, uCamPos: C.pos });
      gl.bindVertexArray(this.dropVAO);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, fx.drops.n);
      gl.bindVertexArray(null);
    }
    if (fx.stars) {
      for (const s of fx.stars) {
        if (s.behind) gl.enable(gl.DEPTH_TEST); else gl.disable(gl.DEPTH_TEST);
        useProgram(this.pStar, { uView: C.view, uProj: C.proj, uCenter: s.p, uSize: s.size, uRot: s.rot || 0, uAge: s.age, uSeed: s.seed, uKind: s.kind, uSpikes: s.spikes || 13, uStretch: s.stretch || 1, uPull: s.behind ? 0 : 1 });
        if (!this.emptyVAO) this.emptyVAO = gl.createVertexArray();
        gl.bindVertexArray(this.emptyVAO);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindVertexArray(null);
      }
    }
    gl.disable(gl.BLEND); gl.depthMask(true);
  }

  uploadCanvas(tex, canvas) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  }

  renderPost(S, C, isCloseup) {
    const post = S.post || {};
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
    let base = this.tBase, mask = this.tMask, fxt = this.tFxD;
    if (isCloseup) {
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.bindTexture(gl.TEXTURE_2D, this.tCloseup);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, S.closeup);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      base = this.tCloseup; mask = this.tBlackMask; fxt = this.tClearFx;
    }
    // bloom
    const bloomAmt = post.bloom !== undefined ? post.bloom : 0.22;
    bindFBO(this.fB1);
    useProgram(this.pBright, { uSrc: base, uFx: fxt, uThr: 0.86 });
    drawFullscreen();
    for (let it = 0; it < 2; it++) {
      bindFBO(this.fB2); useProgram(this.pBlur, { uSrc: this.tB1, uDir: [(1 + it * 1.4) / 480, 0] }); drawFullscreen();
      bindFBO(this.fB1); useProgram(this.pBlur, { uSrc: this.tB2, uDir: [0, (1 + it * 1.4) / 270] }); drawFullscreen();
    }
    if (S.overlay) this.uploadCanvas(this.tOverlay, S.overlay);
    const waves = (post.waves || []).slice(0, 8);
    const wa = new Float32Array(32), ws = new Float32Array(8);
    waves.forEach((w, i) => { wa.set([w.c[0], w.c[1], w.r, w.w], i * 4); ws[i] = w.s; });
    bindFBO(null, OUT_W, OUT_H);
    useProgram(this.pPost, {
      uBase: base, uMask: mask, uFx: fxt, uBloom: this.tB1, uOverlay: this.tOverlay,
      uWaveA: wa, uWaveS: ws, uWaveN: waves.length, uCA: post.ca || 0, uFrame: S.frame || 0,
      uVig: post.vig !== undefined ? post.vig : 0.30, uGrain: post.grain !== undefined ? post.grain : 0.034,
      uBloomAmt: bloomAmt, uHaze: post.haze || 0,
      uBlurDir: post.blur || [0, 0], uRadialC: post.radialC || [0.5, 0.5], uRadial: post.radial || 0,
      uSpeed: post.speed || 0, uSpeedDark: post.speedDark ? 1 : 0, uSpeedInner: post.speedInner !== undefined ? post.speedInner : 0.30, uSpeedC: post.speedC || [0.5, 0.5],
      uImpact: post.impact || 0, uImpactC: post.impactC || [0.5, 0.5], uImpactSeed: post.impactSeed || 1, uImpactThr: post.impactThr !== undefined ? post.impactThr : 0.46,
      uCrack: post.crack || 0, uCrackC: post.crackC || [0.5, 0.5], uFlash: post.flash || [1, 1, 1, 0],
      uMonoAll: post.monoAll || 0, uHalo: isCloseup ? 0 : (post.halo !== undefined ? post.halo : 1.0), uOverlayOn: S.overlay ? 1 : 0,
      uExposure: post.exposure !== undefined ? post.exposure : 1, uQuiet: post.quiet !== undefined ? post.quiet : 1, uAudit: this.auditMode ? 1 : 0,
    });
    drawFullscreen();
  }

  readPixels(buf) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, OUT_W, OUT_H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return buf;
  }

}

// ===================== main.js =====================
// main.js — boot, public hooks (window.DURATION / window.renderAt), live preview and sheets
const FPS = 24, NFRAMES = 1200;
let R = null, FILM = null;
window.DURATION = NFRAMES / FPS;

function boot() {
  const canvas = document.getElementById('c');
  const params = new URLSearchParams(location.search);
  const capturing = params.has('cap');
  const ss = parseFloat(params.get('ss') || (capturing ? '2' : '1'));
  R = new Renderer(canvas, ss);
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  window.GPU_NAME = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
  if (typeof Film !== 'undefined') FILM = new Film(R);
  window.renderAt = t => {
    const f = clamp(Math.floor(t * FPS + 1e-3), 0, NFRAMES - 1);
    FILM.renderFrame(f);
  };
  if (!capturing && FILM) livePreview(canvas);
}

function livePreview(canvas) {
  let t0 = performance.now(), paused = false, t = 0, last = -1;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { t = parseFloat(q.get('t')); paused = true; }
  const tick = now => {
    if (!paused) t = ((now - t0) / 1000) % window.DURATION;
    const f = Math.floor(t * FPS);
    if (f !== last) { window.renderAt(t); last = f; }
    requestAnimationFrame(tick);
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; t0 = performance.now() - t * 1000; e.preventDefault(); }
    if (e.code === 'ArrowRight') { paused = true; t = Math.min(window.DURATION - 0.001, t + 1 / FPS); }
    if (e.code === 'ArrowLeft') { paused = true; t = Math.max(0, t - 1 / FPS); }
  });
  canvas.addEventListener('click', e => { paused = true; t = e.offsetX / canvas.clientWidth * window.DURATION; });
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ character sheet
function sheetChar(kind, pose, yaw, opts = {}) {
  const root = Object.assign({ pos: [0, 0, 0], yaw }, opts.root || {});
  const rig = solveRig(kind, pose, root);
  const back = M3.v(M3.ry(yaw * D2R), [0, 0, -1]);
  const wind = opts.wind || [0.18, 0.02, 0];
  return {
    kind, rig,
    env: { time: 0.37, floor: opts.floor !== undefined ? opts.floor : 0, drag: { hair: V.add(V.mul(back, 0.18), wind), cloth: V.add(V.mul(back, 0.22), V.mul(wind, 1.5)) } },
    sun: V.norm([-0.5, 0.72, 0.62]),
  };
}

window.renderSheet = async function (name) {
  const CW = 960, CH = 1080;
  const cv = document.createElement('canvas'); cv.width = CW * 4; cv.height = CH * 4 + 360;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#d9d6d0'; ctx.fillRect(0, 0, cv.width, cv.height);
  const rows = [
    { kind: 'iro', title: 'IRO  -  COLOUR.  FAST, WILD, AIRBORNE', turn: true },
    { kind: 'iro', title: 'IRO  KEY POSES', poses: [['READY STANCE', IRO.ready, 72, {}], ['HEEL FLIGHT', IRO.flyKick, 78, { root: { pos: [-0.15, 0.1, 0] } }], ['RISING HEEL', IRO.rise, 76, {}], ['SIGNATURE: PRISM COMET', IRO.comet, 70, { root: { pos: [-0.12, 0.25, 0], pitch: 8 }, fx: 'comet' }]] },
    { kind: 'sumi', title: 'SUMI  -  INK.  HEAVY, PRECISE, STILL', turn: true },
    { kind: 'sumi', title: 'SUMI  KEY POSES', poses: [['STANCE', SUMI.stance, 62, {}], ['INK PALM', SUMI.palm, 26, { root: { pos: [-0.05, 0, 0] } }], ['TWO-FIST HAMMER', SUMI.hammerUp, 62, { root: { pos: [0, 0.18, 0] } }], ['SIGNATURE: ONE STROKE', SUMI.strokeUp, 44, { fx: 'stroke' }]] },
  ];
  let y = 0;
  for (const row of rows) {
    ctx.fillStyle = '#141216'; ctx.fillRect(0, y, cv.width, 90);
    drawText(ctx, row.title, 60, y + 24, 42, { color: row.kind === 'iro' ? '#ffcf3a' : '#f2f2f2', weight: 0.13 });
    y += 90;
    for (let i = 0; i < 4; i++) {
      let ch, label, opts = {};
      if (row.turn) {
        const yaw = [0, 45, 90, 180][i];
        ch = sheetChar(row.kind, row.kind === 'iro' ? IRO.stand : SUMI.stand, yaw);
        label = ['FRONT', 'THREE-QUARTER', 'SIDE', 'BACK'][i];
      } else {
        const p = row.poses[i];
        opts = p[3];
        ch = sheetChar(row.kind, p[1], p[2], opts);
        label = p[0];
      }
      const big = row.kind === 'sumi';
      const dist = 8;
      const fov = (big ? (row.turn ? 23.8 : 25.0) : (row.turn ? 17.8 : 20.5));
      const ty = big ? (row.turn ? 1.17 : 1.33) : (row.turn ? 0.93 : 1.00);
      const S = {
        camera: { pos: [0, ty + 0.45, dist], tgt: [0, ty, 0], fov, roll: 0 },
        chars: [ch], world: null, time: 0.37, frame: 0, shadow: false,
        clear: [0.80, 0.785, 0.76],
        post: { bloom: 0.12, grain: 0.018, vig: 0.12, halo: 1 },
        fx: opts.fx ? sheetFx(opts.fx, ch) : {},
      };
      R.render(S);
      ctx.drawImage(R.canvas, 480, 0, 960, 1080, i * CW, y, CW, CH);
      drawText(ctx, label, i * CW + CW / 2, y + CH - 54, 34, { align: 'center', color: '#141216', weight: 0.14, outline: '#e9e6e0' });
      ctx.fillStyle = 'rgba(20,18,22,0.18)'; ctx.fillRect(i * CW, y, 2, CH);
    }
    y += CH;
  }
  return cv;
};

function sheetFx(kind, ch) {
  const rib = new RibbonBatch();
  const J = ch.rig.J;
  if (kind === 'comet') {
    const foot = J.anR, dir = V.norm(V.sub(J.anR, J.pelvis));
    for (let k = 0; k < 7; k++) {
      const pts = [], ws = [];
      for (let i = 0; i <= 24; i++) {
        const u = i / 24, a = u * 5.2 + k * 0.9;
        const back = V.mad(foot, dir, -(1 - u) * 1.9);
        const rad = (1 - u) * 0.55 + 0.03;
        pts.push(V.add(back, [Math.cos(a) * rad * 0.3, Math.sin(a) * rad, Math.cos(a) * rad]));
        ws.push(0.02 + 0.055 * u);
      }
      rib.add(pts, ws, 2, k * 0.37, [1, 1, 1, 1], [0, 0, 1]);
    }
  } else if (kind === 'stroke') {
    const h = J.wrR;
    const pts = [], ws = [];
    for (let i = 0; i <= 40; i++) {
      const u = i / 40, a = -0.35 + u * 3.55;
      pts.push([h[0] + Math.cos(a) * 0.98 - 0.05, h[1] - 1.05 + Math.sin(a) * 1.12, h[2] - 0.55]);
      ws.push(0.05 + 0.17 * Math.sin(Math.min(1, u * 1.1) * Math.PI) );
    }
    rib.add(pts, ws, 5, 0.2, [0, 0, 0, 1], [0, 0, 1]);
  }
  return { ribbons: rib };
}

window.addEventListener('DOMContentLoaded', () => {
  window.READY = new Promise((res, rej) => { try { boot(); res(); } catch (e) { rej(e); } });
  window.READY.catch(e => console.error(e && e.stack || String(e)));
});
