<script>
// ==== src/00_timeline.js ====
// THE TIME RULE — single source of truth for the rate schedule.
// Used by the film (index.html), the soundtrack synth and (read-only) the audit.
//
// Counter convention: astronomical year numbering, as a continuous number.
//   1 CE = 1, 1 BCE = 0, 2 BCE = -1, N BCE = 1 - N.
// This removes the missing "year 0" from the arithmetic: the counter is linear.
(function (root) {
  'use strict';

  const START_BCE = 300000;                 // t = 0  ->  300,000 BCE
  const START = 1 - START_BCE;              // astronomical: -299999
  const END = 2100;                         // t = 80 ->  2100 CE
  const DURATION = 80;
  const FPS = 24;
  const NOW_YEAR = 2026;
  const NOW_T = 65;                         // counter reaches 2026 exactly here

  // [seconds, years per second] — one entry per run of equal rates.
  const GEARS = [
    [6, 25000], [5, 12000], [7, 7000], [5, 3500], [3, 3000], [1, 2500],
    [4, 1500], [2, 1000], [5, 600], [4, 400], [2, 250], [1, 230], [7, 60],
    [3, 34], [1, 33], [4, 16], [1, 16], [4, 15],
    // ---- 2026: everything after this line is projection ----
    [2, 12], [2, 10], [1, 8], [1, 6], [1, 5], [1, 4], [7, 1],
  ];

  const RATES = [];
  for (const [n, r] of GEARS) for (let i = 0; i < n; i++) RATES.push(r);

  const BOUNDS = [START];                   // counter value at t = 0,1,...,80
  for (let i = 0; i < RATES.length; i++) BOUNDS.push(BOUNDS[i] + RATES[i]);

  if (RATES.length !== DURATION) throw new Error('need 80 slots, got ' + RATES.length);
  if (BOUNDS[DURATION] !== END) throw new Error('rates end at ' + BOUNDS[DURATION]);
  if (BOUNDS[NOW_T] !== NOW_YEAR) throw new Error('2026 is not at t=' + NOW_T);

  const slotAt = (t) => Math.min(DURATION - 1, Math.max(0, Math.floor(t + 1e-9)));

  // Exact counter value at time t (seconds). Linear inside each slot.
  function yearAt(t) {
    const tt = Math.min(DURATION, Math.max(0, t));
    const n = slotAt(tt);
    return BOUNDS[n] + RATES[n] * (tt - n);
  }
  function rateAt(t) { return RATES[slotAt(t)]; }

  // Inverse: the time at which the counter reaches an astronomical year.
  function timeOf(year) {
    if (year <= START) return 0;
    for (let n = 0; n < DURATION; n++) {
      if (year <= BOUNDS[n + 1]) return n + (year - BOUNDS[n]) / RATES[n];
    }
    return DURATION;
  }
  const bce = (n) => 1 - n;                 // N BCE -> astronomical

  const group = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  // DISPLAY ROUNDING (documented in TREATMENT.md):
  //  1. y = floor(counter + 0.5)  (nearest whole year, halves up)
  //  2. y <= 0 is shown as BCE, N = 1 - y, always prefixed "c."
  //  3. N >= 10,000 is further rounded to the nearest 100 and comma-grouped;
  //     four-digit and shorter years are written without a comma
  //  4. y >= 1 is shown as the exact integer + "CE"
  function formatYear(counter) {
    const y = Math.floor(counter + 0.5 + 1e-7);
    if (y >= 1) return y + ' CE';
    let n = 1 - y;
    if (n >= 10000) return 'c. ' + group(Math.floor(n / 100 + 0.5) * 100) + ' BCE';
    return 'c. ' + n + ' BCE';
  }
  function formatRate(r) {
    return '1 second = ' + group(r) + (r === 1 ? ' year' : ' years');
  }

  const TL = {
    START_BCE, START, END, DURATION, FPS, NOW_YEAR, NOW_T,
    GEARS, RATES, BOUNDS, slotAt, yearAt, rateAt, timeOf, bce, formatYear, formatRate, group,
  };
  root.TL = TL;
  if (typeof module !== 'undefined' && module.exports) module.exports = TL;
})(typeof window !== 'undefined' ? window : globalThis);

// ==== src/01_util.js ====
// Math, deterministic noise / random, easing, colour. No Math.random anywhere:
// every frame must be a pure function of t.
const W = 1920, H = 1080;
const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a));
const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const smoother = (t) => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
const ramp = (a, b, x) => smooth((x - a) / (b - a));
// 0 -> 1 -> 0 window with soft edges
const pulse = (a, b, x, f = 0.3) => ramp(a, a + f, x) * (1 - ramp(b - f, b, x));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = (t) => Math.pow(clamp(t), 3);
const easeInOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const mod = (a, n) => ((a % n) + n) % n;
const hypot = Math.hypot;

// integer hash -> [0,1)
function hash(n) {
  let x = (n | 0) ^ 0x5bf03635;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
const hash2 = (a, b) => hash((a | 0) * 374761393 + (b | 0) * 668265263);
function rng(seed) {
  let s = (seed * 2654435761) >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// smooth value noise 1D / 2D, range [0,1]
function noise1(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  return lerp(hash2(i, seed), hash2(i + 1, seed), f * f * (3 - 2 * f));
}
function noise2(x, y, seed = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash2(a + seed * 131, b);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), u), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), u), v);
}
function fbm1(x, seed = 0, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * noise1(x * f, seed + i * 17); a *= 0.5; f *= 2.03; }
  return s / (1 - Math.pow(0.5, oct));
}

// colours as [r,g,b] 0..255
// accepts '#rrggbb' and the 'rgba(r,g,b,a)' strings that M()/rgb() produce
function hex(h) {
  if (h[0] !== '#') return h.slice(h.indexOf('(') + 1).split(',').slice(0, 3).map(Number);
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const C = (h, a = 1) => rgb(hex(h), a);
const M = (h1, h2, t, a = 1) => rgb(mixc(hex(h1), hex(h2), clamp(t)), a);
const v3 = (h, k = 1) => { const c = hex(h); return [c[0] / 255 * k, c[1] / 255 * k, c[2] / 255 * k]; };

// keyframes: [[t, value], ...] with smooth interpolation (numbers or arrays)
function keys(list, t) {
  if (t <= list[0][0]) return list[0][1];
  for (let i = 1; i < list.length; i++) {
    if (t <= list[i][0]) {
      const [t0, a] = list[i - 1], [t1, b] = list[i];
      const k = smooth((t - t0) / (t1 - t0));
      return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
    }
  }
  return list[list.length - 1][1];
}

  const cache = new Map();
  function parse(d) {
    const tk = d.trim().split(/\s+/).filter(Boolean);
    const p = new Path2D();
    let i = 0, cmd = '';
    const num = () => parseFloat(tk[i++]);
    while (i < tk.length) {
      if (/^[A-Za-z]$/.test(tk[i])) cmd = tk[i++];
      if (cmd === 'M') { p.moveTo(num(), num()); cmd = 'L'; }
      else if (cmd === 'L') p.lineTo(num(), num());
      else if (cmd === 'C') p.bezierCurveTo(num(), num(), num(), num(), num(), num());
      else if (cmd === 'E') {
        const cx = num(), cy = num(), rx = num(), ry = num(), a0 = num(), a1 = num();
        const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 4));
        for (let k = 0; k <= n; k++) {
          const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180;
          const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
          if (k === 0) p.moveTo(x, y); else p.lineTo(x, y);

    }
    return p;
  }
  function glyph(ch) {
    let g = cache.get(ch);
    if (!g) {
      const def = GLYPHS[ch];
      if (!def) throw new Error('no glyph for "' + ch + '" (U+' + ch.charCodeAt(0).toString(16) + ')');
      g = { w: def[0], path: parse(def[1]) };
      cache.set(ch, g);
    }
    return g;
  }
  const TRACK = 7;   // default letter spacing in glyph units
  function measure(str, size, track = TRACK) {
    let w = 0;
    for (const ch of str) w += glyph(ch).w + track;
    return Math.max(0, w - track) * size / 70;
  }
  // size = cap height in px; (x, y) = baseline anchor
  function draw(ctx, str, x, y, size, o = {}) {
    const {
      color = '#fff', weight = Math.max(2.2, size * 0.105), align = 'left', track = TRACK,
      alpha = 1, halo = 0.55, haloColor = '4,5,12', reveal = 1,
    } = o;
    if (alpha <= 0.002 || reveal <= 0) return measure(str, size, track);
    const s = size / 70;
    const total = measure(str, size, track);
    let cx = x - (align === 'center' ? total / 2 : align === 'right' ? total : 0);
    const chars = [...str];
    const passes = halo > 0 ? ['halo', 'ink'] : ['ink'];
    for (const pass of passes) {
      let gx = cx;
      for (let i = 0; i < chars.length; i++) {
        const g = glyph(chars[i]);
        // left-to-right reveal: each glyph ramps in
        const a = reveal >= 1 ? 1 : clamp(reveal * (chars.length + 5) - i, 0, 5) / 5;
        if (a > 0 && chars[i] !== ' ') {
          ctx.save();
          ctx.translate(gx, y);
          ctx.scale(s, -s);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (pass === 'halo') {
            ctx.globalAlpha = alpha * a * halo;
            ctx.strokeStyle = `rgb(${haloColor})`;
            ctx.lineWidth = (weight + size * 0.16) / s;
            ctx.shadowColor = `rgba(${haloColor},1)`;
            ctx.shadowBlur = size * 0.28;
          } else {
            ctx.globalAlpha = alpha * a;
            ctx.strokeStyle = color;
            ctx.lineWidth = weight / s;
          }
          ctx.stroke(g.path);
          ctx.restore();
        }
        gx += (g.w + track) * s;
      }
    }
    return total;
  }
  return { draw, measure, glyph, has: (c) => c in GLYPHS };
})();

// ==== src/03_gfx.js ====
// WebGL2 compositor. Canvas2D draws the layers; GL adds sky / planet / rock,
// rim light thrown by the flame, procedural fire, transitions, bloom and grade.
const GFX = (() => {
  const out = document.getElementById('film');
  out.width = W; out.height = H;
  const gl = out.getContext('webgl2', {
    preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false,
    powerPreference: 'high-performance',
  });
  if (!gl) throw new Error('WebGL2 is required');
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('float render targets are required');

  // The drawing layers use the CPU rasteriser. The GPU path renderer anti-aliases
  // the same path slightly differently depending on what it has cached, and every
  // frame here has to be a pure function of t.
  const layers = {};
  for (const name of ['back', 'far', 'near', 'glow', 'hud']) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    layers[name] = c.getContext('2d', { willReadFrequently: true });
  }

  const VS = `#version 300 es
  void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

  const HEAD = `#version 300 es
  precision highp float; precision highp int;
  const vec2 RES = vec2(1920.0,1080.0);
  float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(17.1,9.2); a*=0.5; } return s/0.96875; }
  `;

  const SCENE_FS = HEAD + `
  out vec4 o;
  uniform sampler2D uBack,uFar,uNear,uGlow,uBgTex,uLand;
  uniform int uMode; uniform float uT;
  uniform vec3 uTop,uMid,uLow,uGround,uCloudCol,uSunCol,uMoonCol,uSkyRim,uHazeCol;
  uniform float uMidAt,uHorizon,uMilky,uAurora,uCloud,uRim,uSkyRimAmt,uHaze,uGlowGain,uBands;
  uniform vec4 uSun,uMoon;
  uniform vec4 uLPos[4]; uniform vec3 uLCol[4];
  uniform float uProj,uSweep,uGhost; uniform vec4 uSolid;
  uniform vec4 uGlobe; uniform mat3 uRot; uniform float uCity,uDawn;
  uniform vec4 uTorch; uniform vec3 uTorchCol; uniform vec4 uRock,uPanel;

  vec3 sky(vec2 p){
    float hz = uHorizon;
    float t = clamp(p.y/max(hz,1.0),0.0,1.0);
    vec3 c = t < uMidAt ? mix(uTop,uMid,smoothstep(0.0,uMidAt,t)) : mix(uMid,uLow,smoothstep(uMidAt,1.0,t));

  vec3 globe(vec2 p, vec3 bg){

    bg += vec3(0.13,0.34,0.72)*halo*(0.35+0.65*clamp(dot(normalize(vec3(d.x,-d.y,0.0)),sunDir)+0.55,0.0,1.0))*0.85;
    float edge = 1.0 - smoothstep(1.0-1.6/uGlobe.z, 1.0+0.4/uGlobe.z, r);
    if(edge <= 0.0) return bg;
    float z = sqrt(max(0.0,1.0-min(r2,1.0)));
    vec3 n = vec3(d.x,-d.y,z);

    vec4 tx = texture(uLand, uv + warp*vec2(0.0065,0.013));
    float land = smoothstep(0.35,0.65,tx.r);
    float relief = fbm(vec2(lon,lat)*13.0 + warp*3.0);
    float dry = tx.g;
    vec3 green = mix(vec3(0.045,0.105,0.075),vec3(0.115,0.165,0.095),relief);
    vec3 sand = mix(vec3(0.19,0.135,0.075),vec3(0.30,0.225,0.125),relief);
    vec3 lc = mix(green,sand,smoothstep(0.2,0.8,dry));

    lc = mix(lc, vec3(0.50,0.58,0.68), ice);
    vec3 ocean = mix(vec3(0.010,0.030,0.072),vec3(0.022,0.062,0.125),fbm(vec2(lon,lat)*5.0));
    vec3 col = mix(ocean,lc,land);

    col *= 0.42 + diff*1.05;

    vec3 hv = normalize(sunDir+vec3(0.0,0.0,1.0));

    col = mix(col, vec3(0.16,0.40,0.82)*(0.35+diff*0.9), rim*0.80);

  float rockH(vec2 p){

    float cr = 1.0-abs(fbm(p*vec2(0.0048,0.0075)+vec2(5.0,a))*2.0-1.0);

  vec3 rockWall(vec2 p, vec4 paint){
    vec2 q = (p - 960.0*vec2(1.0,0.56))*uRock.z + uRock.xy;
    float h = wallH(q);
    float e = 2.0;
    vec3 n = normalize(vec3(-(wallH(q+vec2(e,0))-h)/e, -(wallH(q+vec2(0,e))-h)/e, 1.0));
    float t1 = fbm(q*0.0045+vec2(9.0,2.0)), t2 = fbm(q*0.016+vec2(2.0,19.0));
    vec3 alb = mix(vec3(0.33,0.215,0.135), vec3(0.62,0.46,0.29), smoothstep(0.3,0.72,t1));
    alb = mix(alb, vec3(0.43,0.22,0.12), smoothstep(0.55,0.75,t2)*0.5);

    vec3 calc = mix(vec3(0.66,0.54,0.38), vec3(0.80,0.70,0.52), fbm(q*0.012+vec2(40.0,3.0)));
    calc *= 0.90 + 0.18*vn(q*0.22) - 0.10*smoothstep(0.55,0.75,fbm(q*vec2(0.02,0.006)));

      float wear = 0.80 + 0.30*fbm(q*0.055);
      alb = mix(alb, pc, clamp(paint.a*wear,0.0,1.0));

    vec3 pos = vec3(p, (h-90.0)*0.7);

    vec3 col = alb*uTorchCol*(diff*0.92+0.11)*att*sh*1.55;
    col += alb*vec3(0.010,0.014,0.026);
    return col;
  }

  vec4 tx(sampler2D s, vec2 p){ return texture(s, p/RES); }

  vec3 lightOn(vec2 p, vec3 base, float resp){
    vec3 add = vec3(0.0);

  vec3 rimOn(vec2 p, float a){

    gl.uniformMatrix3fv(p.u('uRot'), false, g ? g.mat : [1, 0, 0, 0, 1, 0, 0, 0, 1]);

    gl.uniform4f(p.u('uTorch'), rk ? rk.torch.x : 0, rk ? rk.torch.y : 0, rk ? rk.torch.z : 1, rk ? rk.torch.i : 0);
    f3(p, 'uTorchCol', rk ? v3(rk.torch.color || '#ffb066') : [0, 0, 0]);
    gl.uniform4f(p.u('uRock'), rk ? rk.ox : 0, rk ? rk.oy : 0, rk ? rk.scale : 1, 0);

})();

// ==== src/04_draw.js ====
// Canvas2D helpers shared by all scenes.

// sub-path for a capsule whose two ends have different radii
function capsulePath(c, x1, y1, r1, x2, y2, r2) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy);
  if (d <= Math.abs(r1 - r2) + 0.01) {
    const [x, y, r] = r1 > r2 ? [x1, y1, r1] : [x2, y2, r2];
    c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); return;
  }
  const a = Math.atan2(dy, dx), th = Math.acos(clamp((r1 - r2) / d, -1, 1));
  c.moveTo(x1 + Math.cos(a + th) * r1, y1 + Math.sin(a + th) * r1);
  c.arc(x1, y1, r1, a + th, a - th + TAU);
  c.arc(x2, y2, r2, a - th, a + th);
  c.closePath();
}
function capsule(c, x1, y1, r1, x2, y2, r2) { c.beginPath(); capsulePath(c, x1, y1, r1, x2, y2, r2); c.fill(); }
// chain of [x, y, r] joints, filled as one union
function chain(c, pts) {
  c.beginPath();
  for (let i = 0; i + 1 < pts.length; i++) capsulePath(c, ...pts[i], ...pts[i + 1]);
  c.fill();
}

// closed Catmull-Rom spline through the points
function blobPath(c, pts, tension = 0.5) {
  const n = pts.length;

const PATHS = new Map();

// additive soft light on the glow layer
function glow(c, x, y, r, color, a = 1) {
  if (a <= 0.003 || r <= 0) return;
  const col = hex(color);

  g.addColorStop(0, rgb(col, clamp(a)));
  g.addColorStop(0.35, rgb(col, clamp(a * 0.38)));

// falling snow / drifting motes, wrapping around the frame
function snowfall(c, t, o = {}) {
  const { n = 420, alpha = 1, wind = 60, fall = 90, seed = 11, color = '#dbe9ff', y0 = -20, y1 = H + 20, size = 2.6 } = o;

    const d = hash2(i, seed);                       // depth
    const spd = fall * (0.4 + d);

      const w = 0.35 + wind;
      const pt = (k) => [n0[0] - 0.02 - k * 0.19 * w, n0[1] - k * (0.17 - 0.10 * clamp(wind)) + Math.sin(t * 4.3 - k * 4.2) * 0.022 * k * (0.5 + wind)];
      chain(c, [[...pt(0), 0.020], [...pt(0.35), 0.021], [...pt(0.7), 0.018], [...pt(1.0), 0.011]]);
      chain(c, [[n0[0] + 0.012, n0[1] - 0.012, 0.015], [n0[0] + 0.03, n0[1] - 0.10, 0.011]]);
    }
    c.restore();

    const toS = (q) => [x + q[0] * face * h, y - q[1] * h];
    return {
      handA: toS([handA[0], handA[1]]), handB: toS([handB[0], handB[1]]),
      head: toS(head), hip: toS(hip), shoulder: toS(shoulder), chest: toS(along(0.2, 0.06)),
    };
  }

  // a swaddled infant, cradled: a wrapped bundle, folds, and a small face
  function baby(c, x, y, s, color, headColor, rot = -0.25) {
    c.save(); c.translate(x, y); c.rotate(rot);
    c.fillStyle = color;
    blob(c, [[-s * 1.20, -s * 0.02], [-s * 0.88, -s * 0.30], [-s * 0.25, -s * 0.40], [s * 0.34, -s * 0.46], [s * 0.66, -s * 0.18], [s * 0.60, s * 0.26], [s * 0.10, s * 0.46], [-s * 0.62, s * 0.36], [-s * 1.08, s * 0.20]], 0.75);
    // folds in the cloth
    c.strokeStyle = 'rgba(40,6,2,0.50)'; c.lineWidth = Math.max(1.4, s * 0.045); c.lineCap = 'round';
    c.beginPath(); c.moveTo(s * 0.50, -s * 0.34); c.quadraticCurveTo(s * 0.06, s * 0.02, -s * 0.42, s * 0.34); c.stroke();
    c.beginPath(); c.moveTo(s * 0.04, -s * 0.40); c.quadraticCurveTo(-s * 0.40, -s * 0.06, -s * 0.92, s * 0.20); c.stroke();
    c.beginPath(); c.moveTo(s * 0.56, s * 0.04); c.quadraticCurveTo(s * 0.34, s * 0.26, s * 0.02, s * 0.40); c.stroke();
    c.strokeStyle = 'rgba(255,170,120,0.28)'; c.lineWidth = Math.max(1, s * 0.03);
    c.beginPath(); c.moveTo(s * 0.44, -s * 0.38); c.quadraticCurveTo(s * 0.0, -s * 0.02, -s * 0.50, s * 0.31); c.stroke();
    // head, resting back, with brow, nose and a wisp of hair
    const hc = headColor || color;
    c.fillStyle = hc;
    disc(c, s * 0.80, -s * 0.36, s * 0.31);
    blob(c, [[s * 0.78, -s * 0.66], [s * 1.04, -s * 0.54], [s * 1.10, -s * 0.38], [s * 1.18, -s * 0.30], [s * 1.07, -s * 0.24], [s * 1.04, -s * 0.12], [s * 0.88, -s * 0.07], [s * 0.74, -s * 0.30]], 0.7);
    c.fillStyle = 'rgba(14,6,4,0.75)';
    blob(c, [[s * 0.52, -s * 0.42], [s * 0.62, -s * 0.68], [s * 0.86, -s * 0.69], [s * 0.98, -s * 0.60], [s * 0.76, -s * 0.58], [s * 0.62, -s * 0.40]], 0.8);
    c.strokeStyle = 'rgba(14,6,4,0.8)'; c.lineWidth = Math.max(1, s * 0.028);
    c.beginPath(); c.arc(s * 0.97, -s * 0.36, s * 0.055, 0.25, PI - 0.35); c.stroke();
    // the fold of blanket under the chin
    c.fillStyle = color;
    blob(c, [[s * 0.46, -s * 0.44], [s * 0.66, -s * 0.30], [s * 0.88, -s * 0.06], [s * 0.74, s * 0.06], [s * 0.50, -s * 0.12]], 0.8);
    c.restore();
  }

  // ---- animals -----------------------------------------------------------
  function mammoth(c, x, y, s, phase = 0, face = 1, color = '#0b1424') {
    c.save(); c.translate(x, y); c.scale(face * s, -s); c.fillStyle = color;
    const legs = [[-0.34, 0.0, 0], [0.30, 0.5, 0], [-0.20, 0.5, 1], [0.42, 0.0, 1]];
    for (const [lx, off, front] of legs) {
      const q = mod(phase + off, 1);
      const sw = q < 0.7 ? lerp(0.09, -0.09, q / 0.7) : lerp(-0.09, 0.09, smooth((q - 0.7) / 0.3));
      const up = q < 0.7 ? 0 : 0.05 * Math.sin((q - 0.7) / 0.3 * PI);
      chain(c, [[lx, 0.50, 0.12], [lx + sw * 0.45, 0.27, 0.078], [lx + sw, 0.055 + up, 0.068]]);
    }
    blob(c, [[-0.52, 0.50], [-0.56, 0.74], [-0.34, 0.86], [-0.05, 0.84], [0.16, 0.98], [0.37, 1.02], [0.50, 0.86], [0.46, 0.55], [0.20, 0.38], [-0.28, 0.36]], 0.85);
    blob(c, [[0.34, 1.00], [0.52, 1.10], [0.68, 1.00], [0.74, 0.78], [0.62, 0.62], [0.42, 0.62]], 0.9);
    const tr = Math.sin(phase * TAU) * 0.03;
    chain(c, [[0.66, 0.80, 0.100], [0.77, 0.58, 0.062], [0.79 + tr, 0.35, 0.045], [0.76 + tr * 2, 0.17, 0.032], [0.84 + tr * 2, 0.10, 0.022]]);
    for (let i = 0; i < 24; i++) {                      // shaggy fringe
      const u = i / 23;
      const hx = lerp(-0.50, 0.46, u), hy = 0.40 + Math.sin(u * PI) * -0.03 + u * 0.06;
      fillPoly(c, [[hx - 0.035, hy + 0.08], [hx + 0.035, hy + 0.08], [hx - 0.008, hy - 0.05 - hash(i + 3) * 0.06]]);
    }
    chain(c, [[-0.54, 0.74, 0.03], [-0.62, 0.52, 0.016], [-0.62, 0.40, 0.028]]);
    c.strokeStyle = '#b9c7dc'; c.lineCap = 'round';
    for (const [w, dx] of [[0.030, 0], [0.022, 0.06]]) {
      c.lineWidth = w; c.beginPath(); c.moveTo(0.66 + dx, 0.66);
      c.bezierCurveTo(0.78 + dx, 0.30, 1.04 + dx, 0.28, 1.04 + dx, 0.54); c.stroke();
    }
    c.restore();
  }

  function dog(c, x, y, s, t, color, face = 1, lit = null) {
    c.save(); c.translate(x, y); c.scale(face * s, -s); c.fillStyle = color;
    const br = Math.sin(t * 2.4) * 0.012;
    blob(c, [[-0.58, 0.04], [-0.56, 0.28 + br], [-0.22, 0.40 + br], [0.14, 0.33], [0.34, 0.36], [0.40, 0.14], [0.16, 0.02], [-0.3, 0.0]], 0.85);
    chain(c, [[0.26, 0.26, 0.12], [0.45, 0.44, 0.085]]);
    disc(c, 0.49, 0.47, 0.105);
    chain(c, [[0.52, 0.46, 0.07], [0.71, 0.405, 0.032]]);
    fillPoly(c, [[0.40, 0.53], [0.43, 0.70], [0.50, 0.55]]);
    fillPoly(c, [[0.48, 0.54], [0.55, 0.68], [0.57, 0.52]]);
    chain(c, [[0.22, 0.05, 0.05], [0.62, 0.035, 0.038]]);
    chain(c, [[0.14, 0.04, 0.048], [0.50, 0.025, 0.034]]);
    chain(c, [[-0.52, 0.12, 0.07], [-0.70, 0.06, 0.055], [-0.62, 0.015, 0.035]]);
    c.restore();
  }

  function camel(c, x, y, s, phase, color, face = 1) {
    c.save(); c.translate(x, y); c.scale(face * s, -s); c.fillStyle = color;
    for (const [lx, off] of [[-0.30, 0.0], [0.26, 0.25], [-0.24, 0.5], [0.32, 0.75]]) {
      const q = mod(phase + off, 1);
      const sw = q < 0.68 ? lerp(0.13, -0.13, q / 0.68) : lerp(-0.13, 0.13, smooth((q - 0.68) / 0.32));
      const up = q < 0.68 ? 0 : 0.07 * Math.sin((q - 0.68) / 0.32 * PI);
      chain(c, [[lx, 0.62, 0.065], [lx + sw * 0.5 + 0.03, 0.33 + up * 0.5, 0.028], [lx + sw, 0.025 + up, 0.022]]);
    }
    blob(c, [[-0.42, 0.62], [-0.38, 0.78], [-0.18, 0.80], [-0.02, 0.99], [0.16, 0.82], [0.40, 0.76], [0.38, 0.55], [0.0, 0.50], [-0.3, 0.52]], 0.85);
    const nb = Math.sin(phase * TAU * 2) * 0.015;
    chain(c, [[0.34, 0.66, 0.10], [0.55, 0.64 + nb, 0.056], [0.66, 0.88 + nb, 0.042], [0.70, 1.04 + nb, 0.038]]);
    chain(c, [[0.69, 1.07 + nb, 0.052], [0.86, 1.02 + nb, 0.028]]);
    chain(c, [[0.68, 1.11 + nb, 0.016], [0.66, 1.16 + nb, 0.007]]);
    chain(c, [[-0.40, 0.70, 0.02], [-0.48, 0.48, 0.012]]);
    c.restore();
  }

  function bird(c, x, y, s, flap, color, w = 2) {
    c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round';
    const f = Math.sin(flap) * s * 0.45;
    c.beginPath();
    c.moveTo(x - s, y - f); c.quadraticCurveTo(x - s * 0.45, y - s * 0.30 - f * 0.3, x, y);
    c.quadraticCurveTo(x + s * 0.45, y - s * 0.30 - f * 0.3, x + s, y - f);
    c.stroke();
  }

  return { person, baby, stand, walk, sit, seat, kneel, crouch, mix, pose, ik, cycleLength, mammoth, dog, camel, bird };
})();

<script>
// ==== src/07_props.js ====
// Landscape props, all procedural.
const PROPS = {};

PROPS.acacia = (c, x, y, h, color, seed = 1) => {
  const r = rng(seed);
  c.fillStyle = color;
  const lean = (r() - 0.5) * h * 0.18;
  const forkY = y - h * (0.36 + r() * 0.1), forkX = x + lean * 0.5;
  chain(c, [[x, y + 6, h * 0.050], [x + lean * 0.12, y - h * 0.18, h * 0.030], [forkX, forkY, h * 0.024]]);
  const crowns = [];
  const n = 4 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1) - 0.5;
    const ex = forkX + lean * 0.5 + u * h * 1.05 + (r() - 0.5) * h * 0.14;
    const ey = y - h * (0.84 + r() * 0.12) + Math.abs(u) * h * 0.10;
    const mx = lerp(forkX, ex, 0.45) + (r() - 0.5) * h * 0.12, my = lerp(forkY, ey, 0.62);
    chain(c, [[forkX, forkY, h * 0.022], [mx, my, h * 0.012], [ex, ey, h * 0.006]]);
    chain(c, [[mx, my, h * 0.008], [mx + (r() - 0.5) * h * 0.3, ey + h * 0.02, h * 0.003]]);
    crowns.push([ex, ey]);
  }
  for (const [ex, ey] of crowns) {
    for (let k = 0; k < 24; k++) {
      const u = r() - 0.5;
      oval(c, ex + u * h * 0.50, ey - h * 0.015 + (r() - 0.72) * h * 0.085 * (1 - u * u * 2), h * (0.045 + r() * 0.055), h * (0.012 + r() * 0.017), (r() - 0.5) * 0.25);
    }
  }
};

PROPS.baobab = (c, x, y, h, color, seed = 4) => {
  const r = rng(seed);
  c.fillStyle = color;
  blob(c, [[x - h * 0.20, y + 6], [x - h * 0.13, y - h * 0.22], [x - h * 0.15, y - h * 0.50], [x - h * 0.07, y - h * 0.66], [x + h * 0.07, y - h * 0.66], [x + h * 0.15, y - h * 0.48], [x + h * 0.12, y - h * 0.2], [x + h * 0.21, y + 6]], 0.8);
  const branch = (bx, by, ang, len, w, depth) => {
    const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
    chain(c, [[bx, by, w], [ex, ey, w * 0.52]]);
    if (depth > 0) {
      branch(ex, ey, ang - 0.35 - r() * 0.5, len * 0.70, w * 0.5, depth - 1);
      branch(ex, ey, ang + 0.30 + r() * 0.5, len * 0.66, w * 0.5, depth - 1);
    } else for (let i = 0; i < 4; i++) oval(c, ex + (r() - 0.5) * h * 0.08, ey + (r() - 0.5) * h * 0.04, h * 0.022, h * 0.012, r());
  };
  for (let i = 0; i < 5; i++) branch(x + (i - 2) * h * 0.055, y - h * 0.62, -PI / 2 + (i - 2) * 0.42, h * (0.17 + r() * 0.06), h * 0.035, 2);
};

// swaying tufts of grass along a baseline
PROPS.grass = (c, t, o) => {
  const { y, n = 120, h = 40, color, seed = 8, x0 = -60, x1 = W + 60, scroll = 0, sway = 1, ground = null, spreadY = 18 } = o;
  c.fillStyle = color;
  const span = x1 - x0;
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const bx = x0 + mod(hash2(i, seed) * span - scroll, span);
    const gy = (ground ? ground(bx) : y) + hash2(i, seed + 1) * spreadY;
    const blades = 4 + (hash2(i, seed + 2) * 5 | 0);
    const hh = h * (0.45 + hash2(i, seed + 3) * 0.8);
    for (let k = 0; k < blades; k++) {
      const u = k / (blades - 1) - 0.5;
      const tipX = bx + u * hh * 1.1 + Math.sin(t * 1.7 + bx * 0.013 + k) * hh * 0.09 * sway;
      const tipY = gy - hh * (1 - Math.abs(u) * 0.55) * (0.75 + hash2(i * 7 + k, seed) * 0.4);
      c.moveTo(bx + u * 8 - 2.2, gy + 4);
      c.quadraticCurveTo(bx + u * hh * 0.3, gy - hh * 0.5, tipX, tipY);
      c.quadraticCurveTo(bx + u * hh * 0.3 + 2.5, gy - hh * 0.45, bx + u * 8 + 2.2, gy + 4);
    }
  }
  c.fill();
};

PROPS.logs = (c, x, y, s, color = '#100805') => {
  c.fillStyle = color;
  chain(c, [[x - s * 1.0, y + s * 0.10, s * 0.13], [x + s * 0.42, y - s * 0.20, s * 0.09]]);
  chain(c, [[x + s * 1.02, y + s * 0.12, s * 0.13], [x - s * 0.38, y - s * 0.22, s * 0.09]]);
  chain(c, [[x - s * 0.55, y + s * 0.22, s * 0.11], [x + s * 0.66, y + s * 0.18, s * 0.10]]);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU;
    oval(c, x + Math.cos(a) * s * 1.22, y + s * 0.16 + Math.sin(a) * s * 0.26, s * 0.19, s * 0.12, hash(i) - 0.5);
  }
};
PROPS.coals = (g, x, y, s, t, a = 1) => {
  for (let i = 0; i < 16; i++) {
    const cx = x + (hash(i + 61) - 0.5) * s * 1.2, cy = y + (hash(i + 62) - 0.3) * s * 0.24;
    glow(g, cx, cy, s * (0.10 + hash(i + 63) * 0.09), '#ff6a14', a * (0.45 + 0.4 * noise1(t * 4 + i, i)));
  }
};

// a hand-held burning branch; returns the flame position
PROPS.torch = (c, hx, hy, ang, len, color = '#100805') => {
  const tx = hx + Math.cos(ang) * len, ty = hy + Math.sin(ang) * len;
  c.fillStyle = color;
  chain(c, [[hx - Math.cos(ang) * len * 0.28, hy - Math.sin(ang) * len * 0.28, len * 0.040], [tx, ty, len * 0.062]]);
  return [tx, ty];
};

PROPS.rock = (c, x, y, w, h, color, seed = 1) => {
  const r = rng(seed);
  c.fillStyle = color;
  const pts = [[x - w / 2, y + 4]];
  for (let i = 1; i < 7; i++) {
    const u = i / 7;
    pts.push([x - w / 2 + u * w + (r() - 0.5) * w * 0.12, y - h * Math.sin(u * PI) * (0.65 + r() * 0.5)]);
  }
  pts.push([x + w / 2, y + 4]);
  blob(c, pts, 0.35);
};

// ==== src/10_hands.js ====
// Close-up hands: jointed rounded-cone skeletons ray-marched and lit by the ember.
// Units are roughly centimetres. x right, y up, z toward the camera.
const HANDS = (() => {
  const PER = 23, NH = 4;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const norm = (a) => mul(a, 1 / (hypot(a[0], a[1], a[2]) || 1));
  const rotX = (p, a) => [p[0], p[1] * Math.cos(a) - p[2] * Math.sin(a), p[1] * Math.sin(a) + p[2] * Math.cos(a)];
  const rotY = (p, a) => [p[0] * Math.cos(a) + p[2] * Math.sin(a), p[1], -p[0] * Math.sin(a) + p[2] * Math.cos(a)];
  const rotZ = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a), p[2]];

  // One right hand in its own frame: wrist at origin, fingers +x, palm up +y, thumb +z.
  function skeleton(o) {
    const { curl = 1, age = 0, child = 0 } = o;
    const prim = [];
    const seg = (a, b, ra, rb) => prim.push([a, b, ra, rb]);
    const fat = 1 + child * 0.16;
    // forearm
    seg([-52, -6.6, 0.6], [-11, -1.5, 0.2], 5.4 * fat, 3.15 * fat);
    seg([-11, -1.5, 0.2], [0.8, -0.35, 0], 3.15 * fat, 2.35 * fat);
    const fingers = [
      { z: 2.35, kx: 9.1, len: [3.9, 2.45, 2.15], r: [1.12, 0.96, 0.85, 0.72], c: 0.98, lat: 0.16 },
      { z: 0.62, kx: 9.55, len: [4.35, 2.75, 2.25], r: [1.16, 0.99, 0.87, 0.73], c: 1.02, lat: 0.04 },
      { z: -1.06, kx: 9.05, len: [4.05, 2.6, 2.2], r: [1.10, 0.95, 0.84, 0.71], c: 1.10, lat: -0.06 },
      { z: -2.60, kx: 8.15, len: [3.15, 2.0, 1.95], r: [0.98, 0.84, 0.75, 0.65], c: 1.18, lat: -0.17 },
    ];
    // palm: four metacarpals
    for (const f of fingers) {
      seg([1.3, -0.45, f.z * 0.52], [f.kx, 0.28 + Math.abs(f.z) * 0.09, f.z], 1.78 * fat, (f.r[0] + 0.14) * fat);
    }
    seg([1.4, 0.05, 2.1], [4.9, 0.62, 3.35], 1.95 * fat, 1.32 * fat);   // thenar pad
    seg([1.4, -0.1, -2.2], [6.2, 0.22, -2.85], 1.62 * fat, 1.08 * fat); // hypothenar pad
    const bend = [0.30, 0.50, 0.42];
    fingers.forEach((f, i) => {
      let p = [f.kx, 0.28 + Math.abs(f.z) * 0.09, f.z];
      let ang = 0;
      for (let j = 0; j < 3; j++) {
        ang += bend[j] * curl * f.c + (i === 0 ? -0.03 : 0);
        const dir = norm([Math.cos(ang), Math.sin(ang), f.lat * (j === 0 ? 0.16 : 0.05) - f.z * 0.012]);
        const q = add(p, mul(dir, f.len[j] * (1 - child * 0.08)));
        const knob = age * (j > 0 ? 0.075 : 0.05);
        seg(p, q, f.r[j] * fat * (1 + knob), f.r[j + 1] * fat * (1 - age * 0.05));
        p = q;
      }
    });
    // thumb
    let p = [2.1, 0.35, 2.9];
    const tdirs = [norm([0.72, 0.30, 0.62]), norm([0.86, 0.42 + 0.12 * (curl - 1), 0.28]), norm([0.80, 0.58, -0.06])];
    const tlen = [4.5, 3.0, 2.45], tr = [1.9, 1.42, 1.12, 0.84];
    for (let j = 0; j < 3; j++) {
      const q = add(p, mul(tdirs[j], tlen[j] * (1 - child * 0.1)));
      seg(p, q, tr[j] * fat * (1 + age * (j === 2 ? 0.06 : 0)), tr[j + 1] * fat);
      p = q;
    }
    return prim;
  }

  // A bowl = two hands side by side, little-finger edges touching.
  // o: {pos, yaw, pitch, roll, scale, curl, age, child, tone}
  function bowl(o) {
    const hands = [];
    for (const side of [1, -1]) {
      const prim = skeleton(o).map(([a, b, ra, rb]) => {
        const f = (v) => {
          let q = [v[0], v[1], v[2] * side];                   // mirror for the left hand
          q = rotX(q, -side * (o.roll ?? 0.26));               // tilt palms toward each other
          q = add(q, [0, 0, side * 3.45]);
          q = rotZ(sub(q, [7, 0, 0]), o.pitch || 0);           // tip about the middle of the palm
          q = rotY(q, o.yaw || 0);
          return add(mul(q, o.scale || 1), o.pos);
        };
        return [f(a), f(b), ra * (o.scale || 1), rb * (o.scale || 1)];
      });
      let up = rotX([0, 1, 0], -side * (o.roll ?? 0.26));
      up = rotY(rotZ(up, o.pitch || 0), o.yaw || 0);
      let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
      for (const [a, b, ra, rb] of prim) {
        for (const [v, r] of [[a, ra], [b, rb]]) {
          for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], v[k] - r); hi[k] = Math.max(hi[k], v[k] + r); }
        }
      }
      const mid = mul(add(lo, hi), 0.5);
      let rad = 0;
      for (const [a, b, ra, rb] of prim) {
        rad = Math.max(rad, hypot(...sub(a, mid)) + ra, hypot(...sub(b, mid)) + rb);
      }
      hands.push({ prim, up, bound: [mid[0], mid[1], mid[2], rad], tone: o.tone, age: o.age || 0, scale: o.scale || 1 });
    }
    return hands;
  }

  // a point given in a bowl's local frame (x along fingers, y up, z sideways)
  function bowlPoint(o, local) {
    let q = rotZ(sub(local, [7, 0, 0]), o.pitch || 0);
    q = rotY(q, o.yaw || 0);
    return add(mul(q, o.scale || 1), o.pos);
  }

  const FS = GFX.HEAD + `
  out vec4 o;
  uniform vec4 uA[${PER * NH}]; uniform vec4 uB[${PER * NH}];
  uniform vec4 uBound[${NH}]; uniform vec3 uUp[${NH}]; uniform vec4 uTone[${NH}];
  uniform int uN;
  uniform vec4 uEmber; uniform float uEmberI, uT, uProj, uSolidR, uAmb;
  uniform vec3 uEye, uAt; uniform float uZoom;
  uniform vec3 uSkyA, uSkyB, uRimCol;
  uniform sampler2D uStars;

  float cone(vec3 p, vec4 A, vec4 B){
    vec3 a=A.xyz, ba=B.xyz-a; float r1=A.w, r2=B.w;
    float l2=dot(ba,ba), rr=r1-r2, a2=l2-rr*rr, il2=1.0/l2;
    vec3 pa=p-a; float y=dot(pa,ba), z=y-l2;
    vec3 xv=pa*l2-ba*y; float x2=dot(xv,xv), y2=y*y*l2, z2=z*z*l2;
    float k=sign(rr)*rr*rr*x2;
    if(sign(z)*a2*z2>k) return sqrt(x2+z2)*il2-r2;
    if(sign(y)*a2*y2<k) return sqrt(x2+y2)*il2-r1;
    return (sqrt(x2*a2*il2)+y*rr)*il2-r1;
  }
  float smin(float a, float b, float k){ float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }
  float prim(vec3 p, int i){ return cone(p,uA[i],uB[i]); }

  float hand(vec3 p, int h, float sc){
    int b = h*${PER};
    float arm = smin(prim(p,b), prim(p,b+1), 1.4*sc);
    float palm = prim(p,b+2);
    for(int i=3;i<8;i++) palm = smin(palm, prim(p,b+i), 1.25*sc);
    float d = smin(arm, palm, 1.7*sc);
    float fg = 1e5;
    for(int f=0;f<4;f++){
      int s = b+8+f*3;
      float one = smin(smin(prim(p,s), prim(p,s+1), 0.30*sc), prim(p,s+2), 0.24*sc);
      fg = smin(fg, one, 0.20*sc);
    }
    d = smin(d, fg, 0.72*sc);
    float th = smin(smin(prim(p,b+20), prim(p,b+21), 0.55*sc), prim(p,b+22), 0.35*sc);
    return smin(d, th, 1.05*sc);
  }
  vec2 map(vec3 p){
    float best = 1e5, id = -1.0;
    for(int h=0; h<${NH}; h++){
      if(h >= uN) break;
      float bd = length(p-uBound[h].xyz) - uBound[h].w;
      if(bd > 1.2){ if(bd < best){ best = bd; id = float(h); } continue; }
      float d = hand(p, h, uTone[h].w);
      if(d < best){ best = d; id = float(h); }
    }
    return vec2(best,id);
  }
  float noise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    float n = i.x + i.y*57.0 + i.z*113.0;
    #define HH(k) fract(sin(k)*43758.5453)
    return mix(mix(mix(HH(n),HH(n+1.0),f.x), mix(HH(n+57.0),HH(n+58.0),f.x), f.y),
               mix(mix(HH(n+113.0),HH(n+114.0),f.x), mix(HH(n+170.0),HH(n+171.0),f.x), f.y), f.z); }
  float emberD(vec3 p){
    vec3 q = (p-uEmber.xyz)*vec3(1.0,1.28,1.08);
    return length(q) - uEmber.w*(0.86 + 0.30*noise3(q*1.9+3.0));
  }
  vec3 normalAt(vec3 p){
    vec2 e = vec2(1.0,-1.0)*0.035;
    return normalize(e.xyy*map(p+e.xyy).x + e.yyx*map(p+e.yyx).x + e.yxy*map(p+e.yxy).x + e.xxx*map(p+e.xxx).x);
  }
  float shadow(vec3 p, vec3 L, float dmax, float jit){
    float res = 1.0, t = 0.16 + 0.10*jit;
    for(int i=0;i<56;i++){
      if(t > dmax) break;
      float h = map(p+L*t).x;
      res = min(res, 5.5*h/t);
      if(res < 0.004) break;
      t += clamp(h*0.62, 0.07, 0.72);
    }
    res = clamp(res,0.0,1.0);
    return res*res*(3.0-2.0*res);
  }
  float aoAt(vec3 p, vec3 n){
    float s = 0.0, w = 1.0;
    for(int i=1;i<=5;i++){ float h = 0.28*float(i); s += (h - map(p+n*h).x)*w; w *= 0.68; }
    return clamp(1.0 - s*0.58, 0.0, 1.0);
  }

  void main(){
    vec2 sp = vec2(gl_FragCoord.x, RES.y-gl_FragCoord.y);
    vec2 uv = (gl_FragCoord.xy - RES*0.5)/RES.y;
    vec3 fw = normalize(uAt-uEye), rt = normalize(cross(fw,vec3(0,1,0))), up = cross(rt,fw);
    vec3 rd = normalize(fw*uZoom + rt*uv.x + up*uv.y);
    float pxAng = 1.0/(uZoom*RES.y);

    vec3 col = mix(uSkyB, uSkyA, smoothstep(-0.55,0.55,uv.y));
    col += texture(uStars, sp/RES).rgb;
    // warm air around the ember
    float along = max(dot(uEmber.xyz-uEye, rd), 0.0);
    float miss = length(uEye + rd*along - uEmber.xyz);
    col += vec3(1.0,0.40,0.10)*uEmberI*(0.115*exp(-miss*miss/60.0) + 0.028*exp(-miss/13.0));

    float t = 20.0, hit = -1.0, hid = -1.0, graze = 1e5, tg = 0.0;
    for(int i=0;i<150;i++){
      vec3 p = uEye + rd*t;
      vec2 m = map(p);
      float rel = m.x/(t*pxAng);
      if(rel < graze){ graze = rel; tg = t; }
      if(m.x < 0.006){ hit = t; hid = m.y; break; }
      t += m.x*0.80;
      if(t > 140.0) break;
    }
    float te = 20.0, ehit = -1.0;
    for(int i=0;i<70;i++){
      vec3 p = uEye+rd*te;
      float d = emberD(p);
      if(d < 0.015){ ehit = te; break; }
      te += d*0.7;
      if(te > 140.0) break;
    }

    float dotsG = smoothstep(0.50,0.28,length(fract(sp/5.5)-0.5));
    vec3 ink = vec3(0.66,0.90,1.0);

    if(hit > 0.0){
      vec3 p = uEye+rd*hit;
      vec3 n = normalAt(p);
      int h = int(hid+0.5);
      float age = uTone[h].y, sc = uTone[h].w;
      // skin grain, and deeper creasing for the old hands
      vec3 q = p/sc;
      vec3 bump = vec3(noise3(q*3.1), noise3(q*3.1+19.0), noise3(q*3.1+41.0)) - 0.5;
      vec3 fine = vec3(noise3(q*7.5+5.0), noise3(q*7.5+23.0), noise3(q*7.5+47.0)) - 0.5;
      vec3 crease = vec3(noise3(q*vec3(4.6,1.5,1.6)+2.0), noise3(q*vec3(4.6,1.5,1.6)+9.0), noise3(q*vec3(4.6,1.5,1.6)+13.0)) - 0.5;
      n = normalize(n + bump*0.10 + fine*0.075 + crease*age*0.42);
      float palm = smoothstep(0.05,0.85,dot(n,uUp[h]));
      float tn = uTone[h].x;
      vec3 skin = mix(vec3(0.355,0.200,0.130), vec3(0.560,0.350,0.245), tn);
      skin = mix(skin, skin*vec3(1.30,1.20,1.18)+vec3(0.05,0.012,0.008), palm*0.62);
      skin *= 0.87 + 0.20*noise3(q*0.85) + 0.07*noise3(q*5.0);
      skin *= 1.0 - age*0.20*smoothstep(0.55,0.85,noise3(q*1.7+30.0));

      vec3 Lv = uEmber.xyz + vec3(0.0,0.55,0.35) - p;
      float dist = length(Lv); vec3 L = Lv/dist;
      float att = uEmberI/(1.0 + pow(dist/8.6, 2.15));
      float ndl = dot(n,L);
      float sh = shadow(p+n*0.07, L, max(dist-uEmber.w*1.3, 0.0), h21(sp));
      float occ = aoAt(p,n);
      float wrap = clamp((ndl+0.32)/1.32, 0.0, 1.0);
      vec3 warm = vec3(1.0,0.63,0.31);
      vec3 c = skin*warm*att*(wrap*(0.20+0.80*sh))*3.0*(0.40+0.60*occ);
      // light bleeding through thin flesh
      float thin = clamp(map(p - n*0.9 + L*1.35).x*1.35 + 0.30, 0.0, 1.0);
      c += vec3(0.95,0.17,0.055)*att*thin*(0.38+0.62*(1.0-clamp(ndl,0.0,1.0)))*0.52*occ;
      vec3 hv = normalize(L - rd);
      c += warm*att*sh*pow(max(dot(n,hv),0.0), 22.0)*0.20*(1.0-age*0.4);
      // bounce from the glowing palm and a cool edge from the night sky
      c += skin*vec3(1.0,0.45,0.20)*att*0.16*occ;
      float fres = pow(1.0 - clamp(dot(n,-rd),0.0,1.0), 3.2);
      c += uRimCol*fres*(0.30+0.70*clamp(dot(n,normalize(vec3(0.35,0.8,-0.5)))+0.35,0.0,1.0))*occ;
      c += skin*uAmb*(0.5+0.5*n.y)*occ;

      if(uProj > 0.001){
        float near = exp(-pow(length(p-uEmber.xyz)/max(uSolidR,0.1), 4.0));
        float k = uProj*(1.0-near);
        float lum = dot(c, vec3(0.3,0.55,0.15));
        vec3 drawn = c*0.44 + vec3(0.010,0.030,0.055) + ink*dotsG*(0.055+0.42*fres+0.10*lum);
        drawn += ink*smoothstep(0.16,0.04,abs(fract((sp.x+sp.y)/8.5)-0.5))*0.045;
        c = mix(c, drawn, k);
      }
      col = c;
    } else if(graze < 2.2){
      // anti-aliased silhouette, with the drawn-light outline in projection
      vec3 p = uEye + rd*tg;
      vec3 n = normalAt(p);
      float cover = 1.0 - smoothstep(0.0,1.5,graze);
      float dist = length(uEmber.xyz-p);
      float att = uEmberI/(1.0+pow(dist/8.6,2.15));
      float back = clamp(dot(n,normalize(uEmber.xyz-p))+0.5,0.0,1.0);
      vec3 edgeCol = vec3(0.75,0.35,0.16)*att*back*0.75 + uRimCol*0.28;
      col = mix(col, edgeCol, cover*0.85);
    }
    if(uProj > 0.001){
      float near = exp(-pow(length(uEye+rd*tg-uEmber.xyz)/max(uSolidR,0.1), 4.0));
      float line = (hit > 0.0) ? 0.0 : exp(-pow((graze-1.1)/1.35, 2.0));
      col += ink*line*uProj*(1.0-near*0.85)*(0.34+0.72*dotsG);
    }

    if(ehit > 0.0 && (hit < 0.0 || ehit < hit)){
      vec3 p = uEye+rd*ehit;
      vec3 q = (p-uEmber.xyz)/uEmber.w;
      float cr = noise3(q*3.4 + vec3(0.0,uT*0.55,0.0));
      float cr2 = noise3(q*7.6 - vec3(uT*0.40,0.0,uT*0.3));
      float hot = smoothstep(0.34,0.78, cr*0.72+cr2*0.42);
      vec3 ec = mix(vec3(0.10,0.022,0.012), vec3(1.25,0.28,0.025), smoothstep(0.05,0.55,hot));
      ec = mix(ec, vec3(1.65,1.00,0.38), smoothstep(0.55,0.95,hot));
      ec = mix(ec, vec3(1.85,1.55,0.95), smoothstep(0.88,1.02,hot));
      col = ec*(0.34+0.82*uEmberI);
    }
    // soft corona
    col += vec3(1.0,0.46,0.11)*uEmberI*0.20*exp(-max(miss-uEmber.w*0.7,0.0)/1.25)*(hit > 0.0 && hit < along-1.6 ? 0.30 : 1.0);
    o = vec4(col,1.0);
  }`;

  const prog = GFX.program(FS);
  const A = new Float32Array(PER * NH * 4), B = new Float32Array(PER * NH * 4);
  const bound = new Float32Array(NH * 4), ups = new Float32Array(NH * 3), tones = new Float32Array(NH * 4);

  // scene: { hands:[...from bowl()], ember:[x,y,z,r], emberI, proj, solidR, eye, at, zoom, skyA, skyB, rim, amb }
  function render(s, fb, t, starsTex) {
    const gl = GFX.gl;
    A.fill(0); B.fill(0); bound.fill(0); ups.fill(0); tones.fill(0);
    s.hands.slice(0, NH).forEach((h, k) => {
      h.prim.forEach(([a, b, ra, rb], i) => {
        const j = (k * PER + i) * 4;
        A.set([a[0], a[1], a[2], ra], j);
        B.set([b[0], b[1], b[2], rb], j);
      });
      bound.set(h.bound, k * 4);
      ups.set(h.up, k * 3);
      tones.set([h.tone ?? 0.35, h.age, 0, h.scale], k * 4);
    });
    gl.disable(gl.BLEND);
    GFX.use(fb);
    gl.useProgram(prog);
    GFX.bind(prog, 'uStars', 0, starsTex);
    gl.uniform4fv(prog.u('uA[0]'), A); gl.uniform4fv(prog.u('uB[0]'), B);
    gl.uniform4fv(prog.u('uBound[0]'), bound); gl.uniform3fv(prog.u('uUp[0]'), ups);
    gl.uniform4fv(prog.u('uTone[0]'), tones);
    gl.uniform1i(prog.u('uN'), Math.min(NH, s.hands.length));
    gl.uniform4f(prog.u('uEmber'), ...s.ember);
    gl.uniform1f(prog.u('uEmberI'), s.emberI);
    gl.uniform1f(prog.u('uT'), t);
    gl.uniform1f(prog.u('uProj'), s.proj || 0);
    gl.uniform1f(prog.u('uSolidR'), s.solidR || 8);
    gl.uniform1f(prog.u('uAmb'), s.amb ?? 0.012);
    gl.uniform3f(prog.u('uEye'), ...s.eye); gl.uniform3f(prog.u('uAt'), ...s.at);
    gl.uniform1f(prog.u('uZoom'), s.zoom);
    gl.uniform3f(prog.u('uSkyA'), ...v3(s.skyA || '#04060f'));
    gl.uniform3f(prog.u('uSkyB'), ...v3(s.skyB || '#0a0810'));
    gl.uniform3f(prog.u('uRimCol'), ...v3(s.rim || '#5470b8', 0.55));
    GFX.draw();
  }

  // screen position (px) of a 3D point for the same camera
  function project(s, p) {
    const fw = norm(sub(s.at, s.eye));
    const rt = norm([-fw[2], 0, fw[0]]);
    const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
    const d = sub(p, s.eye);
    const z = d[0] * fw[0] + d[1] * fw[1] + d[2] * fw[2];
    const x = (d[0] * rt[0] + d[1] * rt[1] + d[2] * rt[2]) / z * s.zoom;
    const y = (d[0] * up[0] + d[1] * up[1] + d[2] * up[2]) / z * s.zoom;
    return [W / 2 + x * H, H / 2 - y * H];
  }

  return { bowl, bowlPoint, render, project };
})();

<script>
// ==== src/12_director.js ====
// Scene list, transitions and the "sky gearbox" (star trails tied to the rate).
const SCENES = [];
function defineScene(name, at, trans, draw) { SCENES.push({ name, at, trans, draw }); }

// How fast the sky runs: 1 at 25,000 years/second, 0 at 1 year/second.
const SKY = (() => {
  const HZ = 240;
  const speed = new Float64Array(TL.DURATION * HZ + 2);
  for (let i = 0; i < speed.length; i++) {
    const t = i / HZ;
    let s = 0;
    for (let k = -6; k <= 6; k++) {       // ease each gear change over ~0.4 s
      const r = TL.rateAt(clamp(t + k * 0.033, 0, 79.999));
      s += Math.log10(r) / Math.log10(25000);
    }
    speed[i] = s / 13;
  }
  const phase = new Float64Array(speed.length);
  for (let i = 1; i < speed.length; i++) phase[i] = phase[i - 1] + 0.40 * Math.pow(speed[i - 1], 2.3) / HZ;
  const at = (arr, t) => {
    const x = clamp(t, 0, TL.DURATION) * HZ, i = Math.floor(x);
    return lerp(arr[i], arr[Math.min(arr.length - 1, i + 1)], x - i);
  };
  const speedAt = (t) => at(speed, t);
  const phaseAt = (t) => at(phase, t);

  const STARS = (() => {
    const r = rng(77), list = [];
    for (let i = 0; i < 2600; i++) {
      const m = Math.pow(r(), 3.2);       // few bright, many faint
      list.push({
        rad: 90 + Math.sqrt(r()) * 2350, ang: r() * TAU,
        size: 0.55 + m * 2.2, a: 0.20 + m * 0.80, hue: r(), tw: r() * TAU,
      });
    }
    return list;
  })();

  // Stars wheel around a pole; trail length shows the current rate.
  function stars(ctx, t, o = {}) {
    const { alpha = 1, pole = [1500, -260], horizon = 1080, dx = 0, dy = 0, trailK = 1, density = 1 } = o;
    if (alpha <= 0.003) return;
    const sp = speedAt(t), ph = phaseAt(t);
    const len = 0.30 * Math.pow(sp, 2.5) * trailK;
    const cols = ['#bcd0ff', '#e8eeff', '#fff4e0', '#ffd9b0'];
    const bins = new Map();
    const n = Math.floor(STARS.length * density);
    for (let i = 0; i < n; i++) {
      const s = STARS[i];
      const a = s.ang + ph;
      const x = pole[0] + dx + Math.cos(a) * s.rad, y = pole[1] + dy + Math.sin(a) * s.rad;
      const reach = s.rad * len + 8;
      if (x < -reach || x > W + reach || y < -reach || y > Math.min(H, horizon) + reach) continue;
      if (y > horizon + 4 && len < 0.002) continue;
      const fade = clamp((horizon - y) / 150, 0, 1);
      if (fade <= 0.02) continue;
      const tw = 0.86 + 0.14 * Math.sin(t * 2.2 + s.tw * 7);
      const al = s.a * fade * tw * (len > 0.02 ? 0.78 : 1);
      const key = `${Math.min(3, s.hue * 4 | 0)}|${Math.ceil(al * 6)}|${Math.round(s.size * 2.4)}`;
      let p = bins.get(key);
      if (!p) bins.set(key, p = new Path2D());
      p.moveTo(pole[0] + dx + Math.cos(a - len) * s.rad, pole[1] + dy + Math.sin(a - len) * s.rad);
      p.arc(pole[0] + dx, pole[1] + dy, s.rad, a - len, a + 0.0001 + 0.35 / s.rad);
    }
    ctx.save();
    ctx.lineCap = 'round';
    for (const [key, p] of bins) {
      const [h, ab, sz] = key.split('|').map(Number);
      ctx.globalAlpha = clamp(ab / 6 * alpha, 0, 1);
      ctx.strokeStyle = cols[h];
      ctx.lineWidth = sz / 2.4;
      ctx.stroke(p);
    }
    ctx.restore();
  }
  return { speedAt, phaseAt, stars };
})();

function newEnv() {
  return {
    bg: 'sky',
    sky: { top: '#02030a', mid: '#070b1c', low: '#141a38', horizon: 760, midAt: 0.58 },
    lights: [], flames: [], rim: 1.0, skyRim: '#7088c8', skyRimAmt: 0.22,
    haze: { color: '#141a38', amt: 0 }, glowGain: 1,
    proj: { amt: 0, sweep: 4000, ghost: 0, solid: null },
    globe: null, rock: null, hands: null,
    // post settings (blended across transitions)
    bloom: 0.55, thresh: 0.66, vig: 0.30, exposure: 1,
  };
}

const DIR = (() => {
  function renderScene(i, t, slot) {
    const sc = SCENES[i];
    GFX.clearLayers();
    const env = newEnv();
    const L = GFX.layers;
    for (const n of ['back', 'far', 'near', 'glow']) L[n].save();
    sc.draw({ t, u: t - sc.at, env, back: L.back, far: L.far, near: L.near, glow: L.glow });
    for (const n of ['back', 'far', 'near', 'glow']) L[n].restore();
    return { env, fb: GFX.composeScene(env, slot, t) };
  }

  function plan(t) {
    let i = 0;
    while (i + 1 < SCENES.length && t >= SCENES[i + 1].at) i++;
    for (const j of [i + 1, i]) {
      const s = SCENES[j];
      if (!s || j === 0 || !s.trans || s.trans.dur <= 0) continue;
      const a = s.at - s.trans.dur * (s.trans.lead ?? 0.5);
      const b = a + s.trans.dur;
      if (t >= a && t < b) return { from: j - 1, to: j, p: (t - a) / s.trans.dur, trans: s.trans };
    }
    return { from: i, to: -1 };
  }

  // renders the picture (without HUD) and returns the frame buffer + post settings
  function render(t) {
    const pl = plan(t);
    const A = renderScene(pl.from, t, 0);
    if (pl.to < 0) return { fb: A.fb, post: A.env };
    const B = renderScene(pl.to, t, 1);
    const fb = GFX.transition(pl.trans.kind, pl.p, pl.trans.center || [960, 640], pl.trans.center2);
    const k = smooth(pl.p);
    const post = {};
    for (const n of ['bloom', 'thresh', 'vig', 'exposure']) post[n] = lerp(A.env[n], B.env[n], k);
    return { fb, post };
  }
  return { render, plan };
})();

<script>
// ==== src/20_scene_hands.js ====
// The gesture that opens the film and closes it: an ember tipped from one pair
// of cupped hands into a child's. `o.late` is the 2100 version.
function handoff(S, p) {
  // p: { breath 0..1, rise 0..1, tip 0..1, lift 0..1, push 0..1, late, proj }
  const { t, env } = S;
  const late = !!p.late;
  const tip = p.tip, rise = easeOut(p.rise), lift = smooth(p.lift || 0);
  const tipK = smooth(clamp(tip * 1.55));
  const away = smooth(invLerp(0.72, 1.0, tip));
  // in 2100 the old hands let go completely, and leave the frame
  const gone = late ? easeInOut(clamp(invLerp(0.0, 0.78, p.lift || 0))) : 0;

  const giver = {
    pos: [lerp(-8.6, -6.9, tipK) - away * 4.6 - gone * 25, lerp(0.9, 3.9, tipK) + away * 1.4 + gone * 1.2, -gone * 5],
    yaw: 0, pitch: lerp(0.05, -0.50, tipK) + away * 0.22 + gone * 0.20,
    curl: late ? 0.92 : 0.98, scale: 1.0, age: late ? 1.0 : 0.16, tone: late ? 0.52 : 0.22,
  };
  const recv = {
    pos: [lerp(19, 7.7, rise) - lift * (late ? 7.4 : 5.2), lerp(-19, -4.7, rise) + lift * (late ? 4.4 : 4.6), lift * (late ? 6.0 : 3.0)],
    // the child turns toward us as they raise it
    yaw: PI + (late ? lift * 0.50 : 0), pitch: lerp(0.30, 0.04, rise) - lift * 0.06,
    curl: 1.04, scale: 0.72, child: 0.85, age: 0, tone: late ? 0.58 : 0.36,
  };

  // ember: rests in the old bowl, rolls off the fingertips, settles in the new one
  const a = HANDS.bowlPoint(giver, [7.4, 1.95, 0]);
  const lip = HANDS.bowlPoint(giver, [14.4, 3.4, 0]);
  const catchP = HANDS.bowlPoint(recv, [11.6, 3.9, 0]);
  const rest = HANDS.bowlPoint(recv, [7.2, 2.35, 0]);
  const roll = invLerp(0.20, 0.82, tip);
  const along = [a, lip, catchP, rest];
  let e;
  if (roll <= 0) e = a;
  else if (roll >= 1) e = rest;
  else {
    const k = roll * 3, i = Math.min(2, Math.floor(k)), f = smooth(k - i);
    const P = along[i], Q = along[i + 1];
    e = [lerp(P[0], Q[0], k - i), lerp(P[1], Q[1], f) + (i === 1 ? Math.sin((k - i) * PI) * 0.5 : 0), lerp(P[2], Q[2], f)];
  }
  const emberR = late ? 1.22 : 1.18;
  const I = p.intensity * flick(t, 5);

  const push = p.push || 0;
  const sc = {
    hands: [...HANDS.bowl(giver), ...(p.rise > 0.001 ? HANDS.bowl(recv) : [])],
    ember: [e[0], e[1], e[2], emberR], emberI: I,
    eye: [lerp(-1.2, 0.8, push), lerp(27.5, 25.5, push), lerp(50, 46, push)],
    at: [lerp(-1.6, 0.4, push), lerp(0.9, 0.9, push), 0],
    zoom: lerp(1.94, 2.10, push),
    skyA: late ? '#050a1a' : '#03040b', skyB: late ? '#0b0f1e' : '#0a0709',
    rim: late ? '#7096d8' : '#4a66ac',
    proj: p.proj || 0, solidR: p.solidR || 9,
    amb: late ? 0.02 : 0.008,
  };
  // at the very end the giver's hands may be gone from the frame
  env.bg = 'hands';
  env.hands = sc;
  const [ex, ey] = HANDS.project(sc, e);
  env.bloom = 0.66; env.thresh = 0.70; env.vig = 0.34;
  return { sc, ex, ey, I, e };
}

// 0.0 - 5.6 s : out of the dark
defineScene('ember', 0, null, (S) => {
  const { t, back, glow: g } = S;
  const breath = ramp(0.35, 1.55, t);
  const intensity = 0.27 + 0.07 * ramp(0.02, 0.3, t) * (1 - ramp(0.5, 0.8, t))
    + breath * (0.68 + 0.20 * Math.sin(PI * invLerp(0.45, 2.1, t)));
  SKY.stars(back, t, { alpha: 0.12 + 0.55 * ramp(1.2, 3.8, t), pole: [1560, -300], density: 0.65 });
  const H_ = handoff(S, {
    rise: invLerp(1.45, 3.05, t), tip: invLerp(2.95, 4.65, t), lift: invLerp(4.7, 6.2, t),
    push: ramp(0, 5.6, t), intensity,
  });
  const lit = ramp(0.1, 1.4, t);
  sparks(g, H_.ex, H_.ey - 20, t, { n: 26, spread: 50, height: 330, size: 2.2, alpha: 0.85 * lit, seed: 21 });
  sparks(g, H_.ex, H_.ey, t, { n: 12, spread: 130, height: 560, size: 1.5, alpha: 0.55 * lit, seed: 5, speed: 0.6 });
  // breath: a few motes carried toward the ember
  const b = pulse(0.42, 1.7, t, 0.35);
  if (b > 0) {
    for (let i = 0; i < 26; i++) {
      const f = mod(t * 0.9 + hash(i + 40), 1);
      const sx = H_.ex - 330 + f * 330 + (hash(i + 7) - 0.5) * 90 * (1 - f);
      const sy = H_.ey - 150 + f * 140 + (hash(i + 9) - 0.5) * 110 * (1 - f);
      glow(g, sx, sy, 7, '#ffc27a', b * 0.16 * Math.sin(f * PI));
    }
  }
});
</script>
<script>
// ==== src/21_scene_camp.js ====
// 5.6 - 11 s : Africa. The ember feeds a campfire; then one of them carries it on.
(() => {
  const FIRE = { x: 960, y: 872 };
  const WALK_FROM = 8.75;

  // distance the leader has walked (px), easing into a steady pace
  const walked = (t) => {
    const u = Math.max(0, t - WALK_FROM);
    return u < 0.8 ? 190 * u * u : 190 * 0.64 + (u - 0.8) * 304;
  };
  const camX = (t) => {
    const u = Math.max(0, t - (WALK_FROM + 0.35));
    return u < 1.0 ? 150 * u * u : 150 + (u - 1) * 300;
  };

  const ground = (wx) => 868 + (fbm1(wx * 0.0021, 41, 3) - 0.5) * 46;

  defineScene('camp', 5.55, { kind: 'pull', dur: 1.15, center: [960, 800] }, (S) => {
    const { t, env, back, far, near, glow: g } = S;
    const cx = camX(t);
    const zoom = lerp(1.44, 1.19, easeOut(invLerp(5.0, 7.9, t))) + 0.02 * ramp(7.9, 9.0, t);
    const cam = { x: 0, y: 0, z: zoom, ax: 960, ay: 830 };

    env.sky = { top: '#030614', mid: '#0a1230', low: '#33244a', ground: '#140d18', horizon: 735, midAt: 0.56, milky: 1.0 };
    env.haze = { color: '#2a2142', amt: 0.30 };
    env.skyRim = '#7f9ae0'; env.skyRimAmt = 0.20;
    SKY.stars(back, t, { alpha: 0.95, pole: [1530, -250], horizon: 716, dx: -cx * 0.02 });

    // distant hills and trees
    withCam([far], cam, 0.35, () => {
      ridge(far, { y: 712, amp: 52, freq: 0.0021, seed: 3, scroll: cx * 0.12 + 200, color: '#150f24' });
      ridge(far, { y: 760, amp: 30, freq: 0.0034, seed: 9, scroll: cx * 0.22, color: '#0f0a18' });
    });
    withCam([far], cam, 0.6, () => {
      const wrap = (wx, k, span) => mod(wx - cx * k + 500, span) - 500;
      PROPS.acacia(far, wrap(238, 0.42, 3100), 786, 232, '#0b0711', 12);
      PROPS.baobab(far, wrap(1745, 0.42, 3100), 782, 210, '#0b0711', 4);
      PROPS.acacia(far, wrap(2420, 0.42, 3100), 790, 190, '#0b0711', 31);
      PROPS.acacia(far, wrap(1420, 0.3, 2900), 756, 108, '#100b1a', 7);
      PROPS.acacia(far, wrap(2760, 0.3, 2900), 752, 120, '#100b1a', 19);
    });

    const fk = flick(t, 2);
    const fireIn = ramp(5.0, 6.2, t);
    const [fx, fy, fz] = camPoint(cam, 1, FIRE.x - cx, FIRE.y);
    
    withCam([near, g], cam, 1, () => {
      // ground
      near.fillStyle = vgrad(near, 840, H, [[0, '#150b0a'], [1, '#050306']]);
      near.beginPath(); near.moveTo(-200, H + 100);
      for (let x = -200; x <= W + 200; x += 12) near.lineTo(x, ground(x + cx));
      near.lineTo(W + 200, H + 100); near.closePath(); near.fill();
      PROPS.grass(near, t, { y: 872, n: 90, h: 30, color: '#0d0708', seed: 81, scroll: cx, x1: W + 400, ground: (bx) => ground(bx + cx) });

      const lit0 = { x: FIRE.x - cx, y: FIRE.y - 50, r: 470, color: '#8f4318', k: 0.46 };
      const who = (o) => FIG.person(near, { color: '#160b09', far: '#0d0707', lit: lit0, t, ...o });

      // those who sit behind the fire
      const br = (k) => Math.sin(t * 1.7 + k) * 0.006;
      const mother = who({ x: 790 - cx, y: 852, h: 268, p: FIG.seat({ hip: [-0.05, 0.16 + br(1)], lean: 0.16, footA: [0.16, 0.04], footB: [0.1, 0.05], handA: [0.17, 0.34], handB: [0.12, 0.30], tilt: 0.28 }), dress: 'hide', cloth: '#1d0f0a', hair: 'bun' });
      near.save(); FIG.baby(near, mother.handA[0] - 8, mother.handA[1] - 8, 34, '#24120b', '#1a0d08', -0.35); near.restore();
      const grind = Math.sin(t * 5.2) * 0.03;
      who({ x: 1128 - cx, y: 850, h: 262, face: -1, p: FIG.kneel({ lean: 0.38 + grind * 0.5, handA: [0.25 + grind, 0.145], handB: [0.20 + grind * 0.7, 0.16], tilt: 0.2 }), dress: 'wrap', cloth: '#1d0f0a', hair: 'curls' });
      near.fillStyle = '#0e0807'; oval(near, 1062 - cx, 848, 30, 9);
      near.fillStyle = '#7a2512'; oval(near, 1062 - cx, 842, 14, 5);      // red ochre

      // the fire
      PROPS.logs(near, FIRE.x - cx, FIRE.y, 76);
      PROPS.coals(g, FIRE.x - cx, FIRE.y, 76, t, fireIn);
      glow(g, FIRE.x - cx, FIRE.y + 18, 380, '#8a360c', 0.17 * fk * fireIn);

      // front of the circle
      const gesture = Math.sin(t * 1.35);
      who({ x: 668 - cx, y: 905, h: 322, p: FIG.sit({ handA: [0.24 + 0.04 * gesture, 0.33 + 0.07 * gesture], handB: [0.13, 0.21], tilt: -0.06 + 0.05 * gesture, lean: 0.10 + br(2) }), dress: 'hide', cloth: '#1f100a', hair: 'curls' });
      const strike = Math.pow(Math.max(0, Math.sin(t * 5.6)), 6);
      const knap = who({ x: 1262 - cx, y: 906, h: 318, face: -1, p: FIG.crouch({ hip: [-0.1, 0.19], lean: 0.42, footA: [0.10, 0.035], footB: [-0.03, 0.035], handA: [0.24, 0.30 - strike * 0.07], handB: [0.22, 0.20], tilt: 0.25 }), dress: 'wrap', hair: 'short' });
      near.fillStyle = '#0c0707'; disc(near, knap.handB[0] - 4, knap.handB[1] + 3, 10);
      if (strike > 0.7) sparks(g, knap.handB[0] - 6, knap.handB[1], t, { n: 10, spread: 8, height: 50, size: 1.6, alpha: strike, seed: 71, speed: 3 });
      who({ x: 1418 - cx, y: 918, h: 212, face: -1, child: 0.8, p: FIG.sit({ lean: 0.30 + br(3), handA: [0.24, 0.20 + 0.02 * Math.sin(t * 2.2)], handB: [0.18, 0.18], tilt: -0.1 }), dress: 'wrap', hair: 'curls' });

      // the one who will carry it: sits, rises, lifts a branch, walks
      const rise = ramp(7.2, 8.0, t);
      const reach = pulse(7.8, 8.62, t, 0.36);
      const lift = ramp(8.3, 8.85, t);
      const walkMix = ramp(WALK_FROM, WALK_FROM + 0.45, t);
      const lx = 742 + walked(t) - cx;
      const phase = walked(t) / (FIG.cycleLength(0.36) * 340);
      const sitting = FIG.sit({ lean: 0.18, handA: [0.17, 0.24] });
      let standing = FIG.stand({
        hip: [0, 0.50 - reach * 0.12], lean: 0.05 + reach * 0.48,
        handA: [lerp(lerp(0.08, 0.40, reach), 0.20, lift), lerp(lerp(0.47, 0.26, reach), 0.72, lift)],
        footA: [0.09, 0.035], footB: [-0.09, 0.035],
      });
      if (walkMix > 0) standing = FIG.mix(standing, FIG.walk(phase, { over: { handA: [0.21, 0.73] }, lean: 0.07 }), walkMix);
      const pose = FIG.mix(sitting, standing, rise);
      const lead = who({ x: lx, y: lerp(912, ground(lx + cx) + 40, walkMix), h: 340, p: pose, dress: 'hide', cloth: '#1f100a', hair: 'curls' });
      let torch = null;
      if (reach > 0.4 || lift > 0) {
        const ang = lerp(0.55, -1.32, lift);
        torch = PROPS.torch(near, lead.handA[0], lead.handA[1], ang, 92);
      }
      // two follow
      const follow = (delay, x0, h, ch, hairK, dressK, babyOn) => {
        const rr = ramp(8.4 + delay, 9.2 + delay, t);
        if (rr <= 0) return;
        const d = walked(t - delay - 0.25);
        const ph = d / (FIG.cycleLength(0.36) * h) + delay;
        const m = ramp(WALK_FROM + delay + 0.25, WALK_FROM + delay + 0.7, t);
        const p = FIG.mix(FIG.sit(), FIG.mix(FIG.stand(), FIG.walk(ph), m), rr);
        const fxw = x0 + d - cx;
        const f = who({ x: fxw, y: lerp(905, ground(fxw + cx) + 46, m), h, child: ch, p, dress: dressK, cloth: '#1d0f0a', hair: hairK });
        if (babyOn) FIG.baby(near, f.shoulder[0] - 34, f.shoulder[1] + 8, 32, '#24120b', '#180c08', -1.0);
      };
      follow(0.30, 470, 300, 0, 'bun', 'hide', true);
      follow(0.55, 330, 214, 0.8, 'curls', 'wrap', false);

      PROPS.grass(near, t, { y: 975, n: 70, h: 58, color: '#060305', seed: 5, scroll: cx * 1.35, x1: W + 500, spreadY: 120 });

      if (torch) {
        const [tx, ty] = camPoint(cam, 1, torch[0], torch[1]);
        const ta = ramp(8.1, 8.5, t);
        env.flames.push({ x: tx, y: ty + 6, w: 30 * fz, h: 100 * fz * ta, i: 0.95, seed: 6, lean: -0.22 * walkMix, halo: 0.8 });
        env.lights.push({ x: tx, y: ty - 36, r: 400, i: 0.85 * ta * flick(t, 8), color: '#ff9a3c' });
        sparks(g, torch[0], torch[1] - 40, t, { n: 24, spread: 20, height: 200, size: 1.9, alpha: ta, wind: -120 * walkMix, seed: 13 });
      }
      sparks(g, FIRE.x - cx, FIRE.y - 90, t, { n: 70, spread: 90, height: 520, size: 2.4, alpha: 0.9 * fireIn, seed: 4 });
      sparks(g, FIRE.x - cx, FIRE.y - 160, t, { n: 22, spread: 220, height: 700, size: 1.5, alpha: 0.6 * fireIn, seed: 44, speed: 0.55 });
    });

    env.flames.unshift({ x: fx, y: fy - 12 * fz, w: 66 * fz, h: 196 * fz * (0.5 + 0.5 * fireIn) * (0.96 + 0.04 * fk), i: 1.0, seed: 1.3 });
    env.lights.unshift({ x: fx, y: fy - 66 * fz, r: 620 * fz, i: 0.95 * fk * fireIn, color: '#ff8a30' });
    env.bloom = 0.55; env.thresh = 0.68;
  });
})();
</script>

<script>

      for (const y of [806, 862, 944]) { near.beginPath(); near.moveTo(-1000, y); near.quadraticCurveTo(0, y - 12, 1000, y + 6); near.lineTo(1000, y + 11 + (y - 800) / 14); near.quadraticCurveTo(0, y - 2 + (y - 800) / 14, -1000, y + 9 + (y - 800) / 14); near.fill(); }

  defineScene('farm', 27.0, { kind: 'dawn', dur: 1.5, center: [960, 700] }, (S) => {

<script>
// ==== src/26_scene_roads_sea.js ====

(() => {

  }
  function aqueduct(c, x0, x1, y, h, col) {
    c.fillStyle = col; c.fillRect(x0, y - h, x1 - x0, 20);
    for (let x = x0; x < x1; x += 74) {
      c.fillRect(x, y - h, 17, h + 4);

    }
  }
  function wallAndTowers(c, x, y, col) {
    const line = (u) => y - 70 - Math.sin(u * PI * 2.2) * 46 - u * 40;
    c.fillStyle = col;
    c.beginPath(); c.moveTo(x - 420, y + 40);
    for (let i = 0; i <= 60; i++) { const u = i / 60; c.lineTo(x - 420 + u * 840, line(u)); }
    c.lineTo(x + 420, y + 40); c.fill();
    c.strokeStyle = '#a8785c'; c.lineWidth = 17; c.beginPath();
    for (let i = 0; i <= 60; i++) { const u = i / 60; i ? c.lineTo(x - 420 + u * 840, line(u) - 7) : c.moveTo(x - 420, line(0) - 7); } c.stroke();
    c.fillStyle = '#a8785c'; for (let i = 0; i <= 60; i++) { const u = i / 60; c.fillRect(x - 423 + u * 840, line(u) - 24, 7, 10); }
    for (const u of [0.12, 0.40, 0.70, 0.93]) {
      const tx = x - 420 + u * 840, ty = line(u);
      c.fillStyle = '#9c6c52'; c.fillRect(tx - 24, ty - 64, 48, 72);

      c.fillStyle = '#7a4636'; fillPoly(c, [[tx - 42, ty - 62], [tx, ty - 96], [tx + 42, ty - 62], [tx + 28, ty - 66], [tx - 28, ty - 66]]);
    }
  }
  function mayaPyramid(c, x, y, s) {
    for (let i = 0; i < 7; i++) {
      const w = s * (2.0 - i * 0.22), h = s * 0.19;

    }
    c.fillStyle = '#d2bda2'; fillPoly(c, [[x - s * 0.22, y], [x - s * 0.12, y - s * 1.33], [x + s * 0.12, y - s * 1.33], [x + s * 0.22, y]]);
    c.strokeStyle = '#a48e78'; c.lineWidth = 2; for (let k = 10; k < s * 1.33; k += 12) { c.beginPath(); c.moveTo(x - s * 0.21 + k * 0.07, y - k); c.lineTo(x + s * 0.21 - k * 0.07, y - k); c.stroke(); }
    c.fillStyle = '#cbb69c'; c.fillRect(x - s * 0.34, y - s * 1.33 - s * 0.34, s * 0.68, s * 0.34);

    c.fillStyle = '#b6a088'; c.fillRect(x - s * 0.26, y - s * 1.33 - s * 0.58, s * 0.52, s * 0.24);
  }
  function canopy(c, x0, x1, y, col, seed, r0 = 34) {
    c.fillStyle = col;

  }
  function banyan(c, x, y, t) {
    c.fillStyle = '#3a2316';

    c.strokeStyle = '#3a2316'; c.lineWidth = 3.4;

    const r = rng(6);
    for (let i = 0; i < 190; i++) {

      oval(c, x - 20 + Math.cos(a) * d * 300 + Math.sin(t * 1.3 + i) * 2, y - 370 + Math.sin(a) * d * 128, 38 + r() * 30, 19 + r() * 15, (r() - 0.5) * 0.7);
    }
  }

  defineScene('roads', 38.3, { kind: 'pan', dur: 0.8 }, (S) => {
    const { t, env, back, far, near, glow: g } = S;
    const cx = camX(t);
    const d = ramp(38.4, 42.3, t);
    env.sky = {
      top: M('#2f6aa8', '#35558c', d), mid: M('#94b8cc', '#c49a98', d), low: M('#f6e2b8', '#ffc27e', d), ground: '#9a6648',

    };
    env.haze = { color: '#e6bd9c', amt: 0.16 };
    env.skyRim = '#ffdca8'; env.skyRimAmt = 0.3;
    const fx = (wx) => wx - cx * FAR;
    ridge(far, { y: 655, amp: 90, freq: 0.0017, seed: 101, scroll: cx * 0.1, color: '#a8869a' });
    ridge(far, { y: 725, amp: 44, freq: 0.0029, seed: 102, scroll: cx * 0.22, color: '#a8785c' });

    // Mediterranean stone
    aqueduct(far, fx(230), fx(760), 792, 150, '#c9a07c');
    temple(far, fx(975), 792, 132);
    // China: wall and watchtowers over the ridges
    wallAndTowers(far, fx(1560), 792, '#8a6450');
    // the Maya lowlands
    const mx = fx(2190);
    canopy(far, mx - 520, mx + 520, 756, '#46603e', 31, 38);
    mayaPyramid(far, mx + 10, 796, 168);
    canopy(far, mx - 560, mx + 560, 800, '#32482e', 32, 30);

    // the road
    const gy = (x) => 884 + (fbm1((x + cx) * 0.0021, 104, 3) - 0.5) * 30;
    near.fillStyle = vgrad(near, 860, H, [[0, '#6e3f28'], [0.35, '#472618'], [1, '#1a0c0a']]);
    near.beginPath(); near.moveTo(-60, H + 40); for (let x = -60; x <= W + 60; x += 14) near.lineTo(x, gy(x)); near.lineTo(W + 60, H + 40); near.fill();
    near.strokeStyle = 'rgba(214,150,96,0.35)'; near.lineWidth = 5; near.setLineDash([38, 26]); near.lineDashOffset = cx;
    near.beginPath(); near.moveTo(-40, 1000); near.lineTo(W + 40, 1000); near.stroke(); near.setLineDash([]);

    const nx = (wx) => wx - cx;
    // a caravan going the same way, lamp lit at its head
    const pace = (t - 38) * 272;
    const lead = nx(790) + pace;
    for (let i = 0; i < 4; i++) {
      const x = lead - 130 - i * 262, ph = t * 1.1 + i * 0.27;
      const y = gy(x) + 30;
      near.fillStyle = '#34180f';
      FIG.camel(near, x, y, 205 - (i % 2) * 14, ph, '#34180f');
      near.fillStyle = ['#a03a24', '#c08a3c', '#6c2c36', '#b06a2c'][i];
      blob(near, [[x - 62, y - 158], [x - 30, y - 196], [x + 14, y - 190], [x + 36, y - 152], [x + 8, y - 128], [x - 44, y - 130]], 0.7);
      if (i % 2) FIG.person(near, { x: x - 6, y: y - 118, h: 150, color: '#34180f', cloth: '#8a3422', dress: 'robe', hat: 'wrap', p: FIG.sit({ hip: [0, 0.4], footA: [0.14, 0.18], footB: [0.1, 0.2], handA: [0.2, 0.55], handB: [0.18, 0.55] }) });
    }
    const walker = FIG.person(near, { x: lead + 70, y: gy(lead + 70) + 34, h: 262, color: '#3c1c10', far: '#28120c', cloth: '#7a2c1e', dress: 'robe', hat: 'wrap', wind: 0.2, t, p: FIG.walk(pace / (FIG.cycleLength(0.3) * 262) + (t - 38) * 0.4, { stride: 0.3, over: { handA: [0.25, 0.58] } }) });
    // the lantern on its staff keeps the flame with us
    const lx = walker.handA[0] + 12, ly = walker.handA[1] + 34;
    near.strokeStyle = '#2a140c'; near.lineWidth = 6; near.beginPath(); near.moveTo(walker.handA[0] - 8, walker.handA[1] - 4); near.lineTo(lx, ly - 24); near.stroke();
    near.fillStyle = '#2a140c'; fillPoly(near, [[lx - 20, ly - 24], [lx + 20, ly - 24], [lx + 13, ly - 36], [lx - 13, ly - 36]]); near.fillRect(lx - 18, ly + 22, 36, 8);
    g.fillStyle = 'rgba(255,190,96,0.88)'; blob(g, [[lx - 14, ly - 22], [lx + 14, ly - 22], [lx + 20, ly], [lx + 14, ly + 22], [lx - 14, ly + 22], [lx - 20, ly]], 0.5);
    glow(g, lx, ly, 120, '#ffa23c', 0.42 * flick(t, 18));
    env.lights.push({ x: lx, y: ly, r: 270, i: 0.42, color: '#ffa244' });

    // a teacher under a banyan, children listening
    const bx = nx(2140);
    if (bx > -500 && bx < W + 500) {
      banyan(near, bx, 936, t);
      FIG.person(near, { x: bx - 96, y: 962, h: 320, color: '#3a1b10', far: '#26110b', cloth: '#9a6232', dress: 'robe', hair: 'short', t, p: FIG.sit({ hip: [-0.03, 0.15], lean: 0.05, handA: [0.24, 0.43 + Math.sin(t * 2.6) * 0.04], handB: [0.14, 0.26] }) });
      [[100, 205, 0], [196, 178, 1], [282, 196, 2]].forEach(([dx, h, i]) => FIG.person(near, { x: bx + dx, y: 968 + i * 9, h, face: -1, child: 0.8, color: '#3a1b10', cloth: ['#a8402a', '#c8a878', '#7a3a30'][i], dress: 'tunic', hair: i === 1 ? 'bun' : 'short', p: FIG.sit({ lean: 0.1 + 0.05 * Math.sin(t * 1.6 + i), handA: [0.18, 0.22], tilt: -0.2 }) }));

    env.lights.push({ x: 1620 - cx * 0.04, y: 330 + d * 150, r: 1500, i: 0.22, color: '#ffc078' });
    env.rim = 0.95; env.bloom = 0.22; env.thresh = 0.92; env.vig = 0.22;
  });

  // ---- the Pacific -------------------------------------------------------
  function seaLayers(far, near, g, t, sunX, scroll, d) {
    const HZ = 704;
    far.fillStyle = vgrad(far, HZ, H, [[0, M('#d08a6c', '#5a4a72', d)], [0.12, M('#7c5a6e', '#2c3358', d)], [0.55, '#14203c'], [1, '#060b18']]);

      const dep = Math.pow(hash(i + 3), 1.7);

      const spread = 24 + dep * 420;
      const x = sunX + (hash(i + 9) - 0.5) * spread * (0.5 + hash(i + 11)) + Math.sin(t * 2 + i) * 6;
      const w = (8 + dep * 54) * (0.4 + hash(i + 13));
      const on = Math.sin(t * (2 + hash(i) * 4) + i * 7);
      if (on < -0.2) continue;
      far.fillStyle = rgb(mixc([255, 196, 120], [186, 150, 200], d), (0.62 - dep * 0.32) * clamp(on + 0.4) * (1 - d * 0.55));
      oval(far, x, y, w / 2, 1.2 + dep * 2.6);
    }
  }
  function swell(c, t, y, amp, speed, color, phase, scroll) {
    c.fillStyle = color;
    c.beginPath(); c.moveTo(-60, H + 60);
    for (let x = -60; x <= W + 60; x += 16) {
      c.lineTo(x, y + Math.sin((x + scroll) * 0.0062 + t * speed + phase) * amp + Math.sin((x + scroll) * 0.017 - t * speed * 1.4 + phase) * amp * 0.34);
    }
    c.lineTo(W + 60, H + 60); c.fill();
  }
  function canoe(c, g, x, y, s, t, env) {
    const bob = Math.sin(t * 2.1) * 6, roll = Math.sin(t * 2.1 + 1.2) * 0.022;
    c.save(); c.translate(x, y + bob); c.rotate(roll); c.scale(s, s);
    const dark = '#150d14';
    // crab-claw sails
    const sail = (mx, my, k, col) => {
      c.fillStyle = col;
      c.beginPath(); c.moveTo(mx, my);
      c.bezierCurveTo(mx - 60 * k, my - 150 * k, mx - 150 * k, my - 300 * k, mx - 195 * k, my - 372 * k);
      c.bezierCurveTo(mx - 52 * k, my - 270 * k, mx + 28 * k, my - 268 * k, mx + 142 * k, my - 350 * k);
      c.bezierCurveTo(mx + 118 * k, my - 250 * k, mx + 74 * k, my - 120 * k, mx, my);
      c.fill();
      c.strokeStyle = dark; c.lineWidth = 6 * k; c.lineCap = 'round';
      c.beginPath(); c.moveTo(mx, my); c.bezierCurveTo(mx - 60 * k, my - 150 * k, mx - 150 * k, my - 300 * k, mx - 195 * k, my - 372 * k); c.stroke();
      c.beginPath(); c.moveTo(mx, my); c.bezierCurveTo(mx + 74 * k, my - 120 * k, mx + 118 * k, my - 250 * k, mx + 142 * k, my - 350 * k); c.stroke();
      c.lineWidth = 1.5 * k; c.strokeStyle = 'rgba(30,14,22,0.55)';
      for (let i = 1; i < 8; i++) { c.beginPath(); c.moveTo(mx - i * 22 * k, my - i * 44 * k); c.quadraticCurveTo(mx, my - i * 40 * k, mx + i * 17 * k, my - i * 42 * k); c.stroke(); }
    };
    sail(190, -52, 0.86, '#5e2e30');
    sail(-130, -56, 1.0, '#763a34');
    // far hull, deck, near hull
    const hull = (dy, col) => {
      c.fillStyle = col;
      c.beginPath(); c.moveTo(-470, -118 + dy);
      c.bezierCurveTo(-420, -30 + dy, -360, 16 + dy, -230, 22 + dy);
      c.lineTo(280, 22 + dy); c.bezierCurveTo(410, 14 + dy, 468, -40 + dy, 512, -132 + dy);
      c.bezierCurveTo(450, -76 + dy, 390, -44 + dy, 280, -34 + dy); c.lineTo(-240, -34 + dy);
      c.bezierCurveTo(-350, -42 + dy, -420, -74 + dy, -470, -118 + dy); c.fill();
    };

    c.fillStyle = dark; c.fillRect(-290, -66, 590, 22);

    c.fillStyle = '#26131a'; fillPoly(c, [[-40, -66], [-18, -134], [70, -146], [132, -66]]);
    const who = (o) => FIG.person(c, { color: dark, far: '#0e0810', cloth: '#2c1218', dress: 'wrap', t, ...o });
    who({ x: -262, y: -62, h: 168, hair: 'bun', p: FIG.stand({ lean: -0.02, handA: [0.34, 0.86 + Math.sin(t * 0.9) * 0.012], handB: [0.02, 0.5], tilt: -0.2, footA: [0.12, 0.035], footB: [-0.1, 0.035] }) });
    who({ x: 252, y: -62, h: 154, face: -1, hair: 'long', p: FIG.seat({ handA: [0.26, 0.42], handB: [0.2, 0.40] }) });
    who({ x: 322, y: -62, h: 104, face: -1, child: 0.9, hair: 'curls', p: FIG.sit({ tilt: -0.3, handA: [0.2, 0.24] }) });
    who({ x: -380, y: -46, h: 160, hair: 'short', p: FIG.kneel({ lean: 0.5, handA: [0.3, 0.2], handB: [0.24, 0.26] }) });
    c.strokeStyle = dark; c.lineWidth = 8; c.beginPath(); c.moveTo(-352, -70); c.lineTo(-470, 26); c.stroke();
    c.fillStyle = '#31161a'; c.fillRect(142, -78, 58, 13);
    hull(14, dark);
    c.fillStyle = '#4a2420'; for (let i = 0; i < 24; i++) fillPoly(c, [[-300 + i * 24, -8], [-288 + i * 24, 6], [-276 + i * 24, -8]]);
    c.restore();

// ==== src/27_scene_dark.js ====

  defineScene('plague', 45.04, { kind: 'dip', dur: 0.52, center: [1172, 824], center2: [786, 884] }, (S) => {

    });
    const FIRE = { x: 962, y: 884 };
    const [fx, fy, fz] = camPoint(cam, 1, FIRE.x, FIRE.y);
    withCam([near, g], cam, 1, () => {
      const gl = (x) => 884 + Math.pow((x - 960) / 960, 2) * 96 + (fbm1(x * 0.004, 241, 3) - 0.5) * 22;
      near.fillStyle = vgrad(near, 870, H, [[0, '#111426'], [1, '#04050c']]);
      near.beginPath(); near.moveTo(-400, H + 300); for (let x = -400; x <= W + 400; x += 14) near.lineTo(x, gl(x) + 6); near.lineTo(W + 400, H + 300); near.fill();
      PROPS.grass(near, t, { y: 890, n: 120, h: 24, color: '#0a0d1c', seed: 243, x0: -300, x1: W + 300, ground: gl, sway: 0.7 });
      PROPS.logs(near, FIRE.x, FIRE.y + 6, 44, '#0c0808');

      glow(g, FIRE.x, FIRE.y + 18, 240, '#8a360c', 0.16 * flick(t, 61));
      const lit = { x: FIRE.x, y: FIRE.y - 36, r: 320, color: '#8f4318', k: 0.48 };
      // sitting where the first family sat
      const breathe = Math.sin(t * 1.6) * 0.005;
      const elder = FIG.person(near, { x: 822, y: 928, h: 290, color: '#160d10', far: '#0d080b', cloth: '#24303e', dress: 'coat', hair: 'bun', scarf: SCARF, wind: 0.15, lit, t, p: FIG.sit({ hip: [-0.06, 0.11], lean: 0.22 + breathe, handA: [0.27, 0.30], handB: [0.22, 0.27], tilt: 0.12 }) });
      FIG.person(near, { x: 1100, y: 930, h: 204, face: -1, child: 0.9, color: '#160d10', far: '#0d080b', cloth: '#5a4032', dress: 'tunic', hair: 'curls', lit, t, p: FIG.sit({ lean: 0.24 - breathe, handA: [0.27, 0.28 + 0.025 * Math.sin(t * 1.1)], handB: [0.22, 0.25], tilt: -0.14 }) });
      g.save(); g.globalAlpha = 0.42; g.strokeStyle = '#8a2608'; g.lineWidth = 4.5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(elder.shoulder[0] + 8, elder.shoulder[1] - 9); g.quadraticCurveTo(elder.shoulder[0] - 24, elder.shoulder[1] - 4, elder.shoulder[0] - 41, elder.shoulder[1] + 9 + Math.sin(t * 3) * 3); g.stroke(); g.restore();
      sparks(g, FIRE.x, FIRE.y - 46, t, { n: 34, spread: 46, height: 330, size: 1.7, alpha: 0.85, seed: 245 });
    });
    env.flames.push({ x: fx, y: fy - 4 * fz, w: 30 * fz, h: 92 * fz, i: 0.98, seed: 1.3, halo: 0.9 });
    env.lights.push({ x: fx, y: fy - 36 * fz, r: 360 * fz, i: 0.82 * flick(t, 62), color: '#ff8a30' });
    env.proj = { amt: 1, sweep: 4000, ghost: 24, solid: { x: fx, y: fy - 34 * fz, r: 150 * fz, k: 0.9 } };
    env.rim = 1.05; env.bloom = 0.46; env.thresh = 0.72; env.vig = 0.30;

  // ---- the same fire -----------------------------------------------------------
  defineScene('finale', 75.72, { kind: 'push', dur: 0.72, center: [962, 800] }, (S) => {

    const pulseK = Math.exp(-Math.max(0, t - 79.5) * 3.2) * (t >= 79.5 ? 1 : 0);
    const intensity = 1.0 - 0.10 * ramp(78.2, 79.2, t) + 0.14 * pulseK;

    sparks(g, H_.ex, H_.ey, t, { n: 12, spread: 130, height: 560, size: 1.4, alpha: 0.5, seed: 5, speed: 0.6 });
