// ridged fractal where steep areas receive less high-frequency detail -> eroded gullies and sharp crests
function erodedRidge(x, y, oct, seed) {
  let sum = 0, amp = 1, dx = 0, dy = 0, norm = 0, prev = 1;
  for (let i = 0; i < oct; i++) {
    const v = valueNoiseD(x, y, seed + i * 31);
    let r = 1 - Math.abs(v[0]);
    r *= r;
    const sgn = v[0] > 0 ? -1 : 1;
    dx += v[1] * sgn * amp; dy += v[2] * sgn * amp;
    const damp = 1 / (1 + 0.22 * (dx * dx + dy * dy));
    sum += amp * r * damp * (0.45 + 0.55 * prev);
    norm += amp;
    prev = r;
    amp *= 0.5;
    const nx = 1.6 * x - 1.2 * y; y = 1.2 * x + 1.6 * y; x = nx;
  }
  return sum / norm;
}

// ---------------------------------------------------------------- world generation (pure & deterministic)
const CSPLINE = [[-1, -38], [-0.42, -22], [-0.22, -9], [-0.11, -3], [-0.055, 1.4], [0.05, 4.5], [0.2, 9], [0.45, 17], [1, 28]];
function spline(pts, v) {
  if (v <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (v <= pts[i][0]) {
      const a = pts[i - 1], b = pts[i];
      return lerp(a[1], b[1], smooth01((v - a[0]) / (b[0] - a[0])));
    }
  }
  return pts[pts.length - 1][1];
}

class WorldGen {
  constructor(seed, features) {
    this.seed = seed >>> 0;
    const S = (k) => new Simplex(ihash(seed, k, 991));
    this.sC = S(1); this.sE = S(2); this.sM = S(3); this.sH = S(4); this.sT = S(5); this.sW = S(6); this.sR = S(7);
    this.sX = S(8); this.sD = S(9); this.sK = S(10); this.sK2 = S(11); this.sG = S(12); this.sF = S(13);
    this.features = features || {};
    this.villageCache = new Map();
    this.colCache = new Map();
  }

  // ---- raw column (no structures)
  baseColumn(x, z, o) {
    const wx = x + this.sX.n2(x / 310, z / 310) * 46 + this.sX.n2(x / 71, z / 71) * 9;
    const wz = z + this.sX.n2(x / 310 + 37, z / 310 - 11) * 46 + this.sX.n2(x / 71 - 5, z / 71 + 23) * 9;
    let cont = this.sC.fbm2(wx / 1500, wz / 1500, 5, 0.52) * 1.55 + 0.1;
    cont = clamp(cont, -1, 1);
    const ero = this.sE.fbm2(wx / 760, wz / 760, 3) * 1.4;
    let temp = this.sT.fbm2(x / 1500 + 3.7, z / 1500 - 1.3, 3, 0.45) * 1.55;
    let hum = this.sW.fbm2(x / 1250 - 7.1, z / 1250 + 4.9, 3, 0.45) * 1.55;
    // keep borders organic
    const bn = this.sD.n2(x / 64, z / 64) * 0.035 + this.sD.n2(x / 17, z / 17) * 0.012;
    temp += bn; hum -= bn;

    const inland = sstep(-0.07, 0.16, cont);
    let h = SEA + spline(CSPLINE, cont);
    const hillAmp = lerp(15, 2.5, sstep(-0.25, 0.45, ero));
    h += this.sH.fbm2(wx / 190, wz / 190, 4) * hillAmp * inland;
    h += this.sH.fbm2(x / 33, z / 33, 3) * 1.5 * inland;

    const desert = sstep(0.14, 0.3, temp) * sstep(0.06, -0.12, hum) * sstep(-0.05, 0.03, cont);

    // mountains
    let mm = sstep(0.03, 0.42, this.sM.fbm2(wx / 1050, wz / 1050, 3) * 1.5);
    mm *= sstep(-0.06, 0.2, cont) * (1 - 0.75 * sstep(0.12, 0.6, ero)) * (1 - desert * 0.85);
    let ridge = 0;
    if (mm > 0.001) {
      ridge = erodedRidge(wx / 330, wz / 330, 6, this.seed + 401);
      h += mm * (Math.pow(ridge, 1.35) * 178 + 10) + mm * this.sD.fbm2(x / 47, z / 47, 3) * 5;
    }

    // desert: dunes and layered mesas
    let mesa = 0;
    if (desert > 0.001) {
      const wind = (x * 0.83 + z * 0.55) / 36 + this.sD.n2(x / 140, z / 140) * 1.7 + this.sD.n2(x / 51, z / 51) * 0.35;
      const f = wind - Math.floor(wind);
      const prof = f < 0.72 ? Math.pow(f / 0.72, 1.35) : Math.pow((1 - f) / 0.28, 1.1);
      const duneAmp = clamp(this.sH.n2(x / 230, z / 230) * 0.8 + 0.55, 0, 1);
      h += prof * duneAmp * 6.5 * desert;
      const mn = this.sF.fbm2(wx / 245, wz / 245, 4, 0.5) + this.sD.n2(x / 19, z / 19) * 0.022 + this.sD.n2(x / 6.5, z / 6.5) * 0.0065;
      const md = sstep(0.35, 0.65, desert);
      if (md > 0) {
        const talus = sstep(0.10, 0.2, mn);
        const t1 = sstep(0.196, 0.214, mn), t2 = sstep(0.31, 0.325, mn), t3 = sstep(0.43, 0.442, mn);
        const lift = talus * talus * 7 + t1 * 14 + t2 * 10 + t3 * 7;
        if (lift > 0) h = lerp(h, h * (1 - t1) + (SEA + 9 + this.sD.n2(x / 90, z / 90) * 1.2) * t1, md) + lift * md;
        mesa = t1 * md;
      }
    }

    // swamp flats
    let swamp = sstep(0.12, 0.3, hum) * sstep(-0.08, 0.05, temp) * sstep(0.34, 0.14, temp - 0.2) * sstep(-0.1, -0.03, cont);
    swamp *= sstep(SEA + 13, SEA + 5, h) * (1 - mm) * sstep(0.0, 0.25, this.sG.n2(x / 420, z / 420) + 0.35);
    if (swamp > 0.001) {
      const flat = SEA + 0.35 + this.sD.fbm2(x / 21, z / 21, 3) * 2.6;
      h = lerp(h, flat, swamp);
    }

    // lakes
    let lake = 0;
    if (inland > 0.5 && mm < 0.2 && desert < 0.3) {
      const ln = this.sF.n2(x / 170 + 71, z / 170 - 13) + this.sD.n2(x / 37, z / 37) * 0.09;
      lake = sstep(0.62, 0.8, ln) * sstep(SEA + 18, SEA + 9, h) * (1 - mm * 5);
      if (lake > 0) h = lerp(h, SEA - 5.5, lake);
    }

    // rivers: meandering zero-crossings of a warped noise, carving valleys
    const rx = wx + this.sX.n2(x / 150, z / 150) * 34, rz = wz + this.sX.n2(x / 150 + 9, z / 150 + 9) * 34;
    const rn = Math.abs(this.sR.n2(rx / 780, rz / 780));
    let river = 0, valley = 0;
    if (cont > -0.09 && rn < 0.17) {
      const wid = 0.017 + sstep(0.1, -0.05, cont) * 0.012;
      valley = Math.pow(sstep(0.17, wid, rn), 1.7) * (1 - 0.88 * sstep(0.05, 0.45, mm));
      if (h > SEA + 2.2) h = lerp(h, SEA + 2.2 + this.sD.n2(x / 29, z / 29) * 0.9, valley * (1 - desert * mesa));
      river = sstep(wid * 1.25, wid * 0.55, rn) * (1 - sstep(0.12, 0.42, mm)) * (1 - desert * 0.9);
      if (river > 0) {
        const bed = SEA - 3.6 + this.sD.n2(x / 13, z / 13) * 0.8;
        if (h > bed) h = lerp(h, bed, river);
      }
    }

    o.h = clamp(h, 6, WORLD_H - 24);
    o.cont = cont; o.temp = temp; o.hum = hum; o.mm = mm; o.desert = desert; o.mesa = mesa; o.swamp = swamp;
    o.lake = lake; o.river = river; o.valley = valley; o.rn = rn; o.village = 0;
    return o;
  }

  biomeOf(x, z, c) {
    const h = c.h;
    if (h < SEA - 1.2 && c.river < 0.3 && c.lake < 0.2 && c.swamp < 0.5) return c.temp > 0.06 && h > SEA - 16 ? BIOME.REEF : BIOME.OCEAN;
    if (c.cont < -0.02 && h < SEA + 2.4 && c.swamp < 0.4) return BIOME.BEACH;
    if (c.mm > 0.38 && h > SEA + 42) return BIOME.MOUNTAIN;
    if (c.desert > 0.5) return c.mesa > 0.25 ? BIOME.MESA : BIOME.DESERT;
    const effT = c.temp - Math.max(0, h - SEA - 38) * 0.004;
    if (effT < -0.27) return BIOME.TAIGA;
    if (c.swamp > 0.45) return BIOME.SWAMP;
    const grove = this.sG.n2(x / 360 + 11, z / 360 - 4) + this.sD.n2(x / 70, z / 70) * 0.12;
    if (grove > 0.5 && c.temp > -0.14 && c.temp < 0.4) return BIOME.GROVE;
    if (c.hum > 0.04) return BIOME.FOREST;
    return BIOME.MEADOW;
  }

  // ---- villages: flatten terrain around the site
  villageSite(gx, gz) {
    const key = gx + ',' + gz;
    let v = this.villageCache.get(key);
    if (v !== undefined) return v;
    v = null;
    const R = 640;
    if (rand01(gx, gz, 5, this.seed) < 0.55) {
      const x = Math.floor(gx * R + 90 + rand01(gx, gz, 6, this.seed) * (R - 180));
      const z = Math.floor(gz * R + 90 + rand01(gx, gz, 7, this.seed) * (R - 180));
      const c = this.baseColumn(x, z, {});
      const bio = this.biomeOf(x, z, c);
      if ((bio === BIOME.MEADOW || bio === BIOME.FOREST || bio === BIOME.TAIGA || bio === BIOME.GROVE) && c.h > SEA + 2 && c.h < SEA + 30 && c.mm < 0.1) {
        let ok = true;
        for (let k = 0; k < 8 && ok; k++) {
          const a = k * Math.PI / 4;
          const d = this.baseColumn(x + Math.cos(a) * 30, z + Math.sin(a) * 30, {});
          if (Math.abs(d.h - c.h) > 7 || d.h < SEA + 0.5) ok = false;
        }
        if (ok) v = { x, z, y: Math.floor(c.h), r: 34, seed: ihash(gx, gz, 8, this.seed) };
      }
    }
    this.villageCache.set(key, v);
    return v;
  }
  villageAt(x, z, margin) {
    const f = this.features.village;
    if (f) { const dx = x - f.x, dz = z - f.z; if (dx * dx + dz * dz < (f.r + margin) ** 2) return f; }
    const R = 640;
    const v = this.villageSite(Math.floor(x / R), Math.floor(z / R));
    if (v) { const dx = x - v.x, dz = z - v.z; if (dx * dx + dz * dz < (v.r + margin) ** 2) return v; }
    return null;
  }

  column(x, z, o = {}) {
    this.baseColumn(x, z, o);
    const ru = this.features.ruin;
    if (ru) {
      const d = Math.hypot(x - ru.x, z - ru.z);
      if (d < ru.r + 18) {
        const w = sstep(ru.r + 18, ru.r - 3, d);
        o.h = lerp(o.h, ru.y + 0.5, w);
        if (w > 0.3) { o.river = 0; o.lake = 0; o.swamp = 0; o.village = Math.max(o.village, d < ru.r + 3 ? 1 : 0.3); }
      }
    }
    const v = this.villageAt(x, z, 22);
    if (v) {
      const d = Math.hypot(x - v.x, z - v.z);
      const w = sstep(v.r + 22, v.r - 6, d);
      o.h = lerp(o.h, v.y + 0.5 + this.sD.n2(x / 31, z / 31) * 0.35, w);
      o.village = w;
      if (w > 0.5) { o.river = 0; o.lake = 0; o.swamp = 0; }
    }
    o.biome = this.biomeOf(x, z, o);
    return o;
  }
  col(x, z) { // cached integer column
    const key = (x + 1048576) * 2097152 + (z + 1048576);
    let c = this.colCache.get(key);
    if (c === undefined) {
      c = this.column(x, z, {});
      c.cliff = this.cliffAmount(x, z, c);
      if (this.colCache.size > 60000) this.colCache.clear();
      this.colCache.set(key, c);
    }
    return c;
  }

  cliffAmount(x, z, c) {
    if (c.village > 0 || c.h < SEA + 5) return 0;
    const n = this.sF.n2(x / 140 - 31, z / 140 + 57);
    return clamp(sstep(0.12, 0.5, n) * (0.25 + c.mm) + c.mm * 0.35, 0, 1) * (1 - c.desert) * sstep(SEA + 6, SEA + 18, c.h);
  }
  density(x, y, z, c) {
    return (c.h - y) + (this.sK.n3(x / 23, y / 15, z / 23) * 7.5 + this.sK.n3(x / 10 + 40, y / 8, z / 10) * 2.2) * c.cliff;
  }
  topSolid(x, z) {
    const c = this.col(x, z);
    if (c.cliff <= 0.02) return Math.floor(c.h);
    for (let y = Math.min(WORLD_H - 2, Math.floor(c.h) + 12); y > Math.floor(c.h) - 14; y--) if (this.density(x, y, z, c) > 0) return y;
    return Math.floor(c.h) - 14;
  }

  strata(x, y, z, c) {
    const w = this.sD.n2(x / 97, z / 97) * 4.5 + this.sD.n2(x / 23, z / 23) * 1.1;
    const s = y + w;
    if (c.desert > 0.45 && y > 52) {
      const band = Math.floor(s / 2.4);
      const r = rand01(band, 3, 0, this.seed);
      return r < 0.4 ? B.red_sandstone : r < 0.62 ? B.terracotta : r < 0.74 ? B.pale_sandstone : B.sandstone;
    }
    if (y < 13 + w) return B.basalt;
    if (y < 36 + w * 1.4) return this.sD.n3(x / 31, y / 19, z / 31) > 0.45 ? B.stone : B.slate;
    const band = Math.floor(s / 3.2);
    const r = rand01(band, 4, 0, this.seed);
    const mt = c.mm > 0.2;
    if (r < (mt ? 0.2 : 0.12)) return B.limestone;
    if (r < (mt ? 0.34 : 0.17)) return B.slate;
    return B.stone;
  }

  snowLine(x, z, c) {
    if (c.temp - Math.max(0, c.h - SEA - 38) * 0.004 < -0.27) return SEA - 20;
    return SEA + 88 + c.temp * 46 + this.sD.n2(x / 41, z / 41) * 6 + this.sD.n2(x / 11, z / 11) * 2.5;
  }

  // surface material stack: returns [top, under, underDepth]
  surfaceFor(x, y, z, c, slope, talus) {
    const n1 = this.sD.n2(x / 26 + 5, z / 26 - 9), n2 = this.sD.n2(x / 7.3, z / 7.3);
    const bio = c.biome;
    if (y < SEA - 1) {
      if (bio === BIOME.SWAMP) return [B.mud, B.mud, 3];
      if (c.river > 0.2 || c.lake > 0.2) return n1 > 0.35 ? [B.clay, B.clay, 2] : n1 + n2 * 0.4 > -0.25 ? [B.gravel, B.gravel, 3] : [B.sand, B.sand, 3];
      if (slope > 2.2) return [this.strata(x, y, z, c), 0, 0];
      if (y < SEA - 17) return n1 > 0.2 ? [B.clay, B.gravel, 2] : [B.gravel, B.gravel, 3];
      return n1 > 0.5 ? [B.gravel, B.sand, 3] : [B.sand, B.sand, 4];
    }
    const snowY = this.snowLine(x, z, c);
    if (slope >= 1.75) {
      if (y > snowY + 8 && slope < 2.7 && n2 > -0.1) return [B.snow, 0, 1];
      return [this.strata(x, y, z, c), 0, 0];
    }
    if (talus && y > SEA + 2) {
      if (c.desert > 0.5) return n2 > 0.1 ? [B.red_sand, B.red_sandstone, 2] : [this.strata(x, y, z, c), 0, 0];
      if (y > snowY) return n2 > 0.2 ? [B.scree, B.scree, 2] : [B.snow, B.scree, 2];
      return [B.scree, B.scree, 3];
    }
    if (slope >= 1.05 && y > SEA + 26 && c.desert < 0.5) {
      if (y > snowY) return n1 + n2 * 0.5 > -0.2 ? [B.snow, B.scree, 1] : [this.strata(x, y, z, c), 0, 0];
      return n1 + n2 * 0.5 > 0.15 ? [B.scree, B.scree, 2] : [this.strata(x, y, z, c), 0, 0];
    }
    if (y <= SEA + 1) {
      if (bio === BIOME.SWAMP) return n1 > -0.1 ? [B.mud, B.mud, 3] : [B.grass, B.mud, 3];
      if (c.temp < -0.24) return n1 > 0 ? [B.gravel, B.gravel, 3] : [B.snow, B.gravel, 3];
      if (c.river > 0.05 || c.valley > 0.85) return n1 + n2 * 0.5 > 0.0 ? [B.gravel, B.gravel, 3] : [B.sand, B.sand, 3];
      return [B.sand, B.sand, 4];
    }
    if (y > snowY) return c.temp - Math.max(0, y - SEA - 38) * 0.004 < -0.27 && y < SEA + 40 && n1 < 0.35 ? [B.snowy_grass, B.dirt, 3] : [B.snow, c.mm > 0.3 ? 0 : B.dirt, 2];
    if (y > snowY - 7 && n2 > 0.25) return [B.snow, B.dirt, 2];
    if (c.desert > 0.5) {
      if (c.mesa > 0.6) return n1 > 0.15 ? [this.strata(x, y, z, c), 0, 0] : [B.red_sand, B.red_sandstone, 3];
      if (c.mesa > 0.02 || this.sF.n2(x / 190, z / 190) > 0.28 + n2 * 0.1) return [B.red_sand, B.red_sandstone, 4];
      return [B.sand, B.sandstone, 5];
    }
    if (c.desert > 0.2 && n1 + n2 * 0.5 > 0.55 - c.desert) return [B.sand, B.sandstone, 3];
    if (bio === BIOME.MOUNTAIN) {
      if (n1 + n2 * 0.4 > 0.38) return [this.strata(x, y, z, c), 0, 0];
      return n1 < -0.35 ? [B.scree, B.dirt, 2] : [B.grass, B.dirt, 2];
    }
    if (bio === BIOME.TAIGA) return [B.snowy_grass, B.dirt, 3];
    if (bio === BIOME.FOREST) return n1 + n2 * 0.35 > 0.12 ? [B.forest_floor, B.dirt, 3] : n1 < -0.55 ? [B.moss_block, B.dirt, 3] : [B.grass, B.dirt, 3];
    if (bio === BIOME.SWAMP) return n1 + n2 * 0.3 > 0.25 ? [B.mud, B.mud, 3] : n1 < -0.35 ? [B.moss_block, B.mud, 3] : [B.grass, B.dirt, 3];
    if (bio === BIOME.BEACH) return [B.sand, B.sand, 4];
    return [B.grass, B.dirt, 3];
  }

  tintsFor(x, z, c) {
    // continuous colour ramps from climate so biome borders blend
    const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
    const cold = sstep(-0.05, -0.3, c.temp - Math.max(0, c.h - SEA - 38) * 0.003);
    const wet = sstep(-0.1, 0.3, c.hum);
    let g = mix3([130, 134, 66], [90, 114, 50], wet);
    let f = mix3([112, 120, 52], [78, 100, 42], wet);
    g = mix3(g, [104, 122, 92], cold); f = mix3(f, [70, 96, 68], cold);
    g = mix3(g, [160, 138, 74], sstep(0.05, 0.6, c.desert)); f = mix3(f, [130, 126, 54], sstep(0.05, 0.6, c.desert));
    g = mix3(g, [86, 96, 40], c.swamp); f = mix3(f, [74, 86, 34], c.swamp);
    const gv = this.sG.n2(x / 360 + 11, z / 360 - 4);
    const gw = sstep(0.34, 0.55, gv) * (1 - cold) * (1 - c.desert);
    g = mix3(g, [134, 152, 58], gw); f = mix3(f, [126, 150, 52], gw);
    const patch = this.sD.n2(x / 47 - 3, z / 47 + 8);
    const dry = sstep(0.15, 0.75, patch) * (1 - wet * 0.6);
    g = mix3(g, [150, 134, 66], dry * 0.55);
    return [g, f];
  }

  caveFields(x, y, z, out, o) {
    const cheese = this.sK.n3(x / 78, y / 44, z / 78) + 0.38 * this.sK2.n3(x / 33, y / 23, z / 33);
    out[o] = cheese;
    out[o + 1] = this.sK2.n3(x / 66, y / 46, z / 66);
    out[o + 2] = this.sK.n3(x / 66 + 101.5, y / 46, z / 66 + 57.2);
  }

  ravineAt(x, z, top) {
    if (top < SEA + 4) return null;
    const mask = this.sM.n2(x / 520 + 53, z / 520 - 21);
    if (mask < 0.42) return null;
    const rv = Math.abs(this.sR.n2(x / 240 + 191, z / 240 + 7) + 0.07 * this.sD.n2(x / 37, z / 37));
    if (rv > 0.028) return null;
    const depth = 26 + 22 * clamp(this.sD.n2(x / 90, z / 90) + 0.5, 0, 1);
    return { rv, depth, w: 0.028 * sstep(0.42, 0.6, mask) };
  }

  // ------------------------------------------------------------ chunk
  generate(cx, cz) {
    const blocks = new Uint16Array(CHUNK * CHUNK * WORLD_H);
    const biomes = new Uint8Array(256);
    const x0 = cx * 16, z0 = cz * 16, seed = this.seed;
    const tops = new Int16Array(24 * 24);
    const cols = new Array(24 * 24);
    for (let j = 0; j < 24; j++) for (let i = 0; i < 24; i++) {
      const x = x0 + i - 4, z = z0 + j - 4;
      cols[j * 24 + i] = this.col(x, z);
      tops[j * 24 + i] = this.topSolid(x, z);
    }
    // base terrain
    for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) {
      const x = x0 + lx, z = z0 + lz, ci = (lz + 4) * 24 + (lx + 4);
      const c = cols[ci], top = tops[ci];
      biomes[lz * 16 + lx] = c.biome;
      const hx = (tops[ci + 1] - tops[ci - 1]) * 0.5, hz = (tops[ci + 24] - tops[ci - 24]) * 0.5;
      let maxD = 0, rise = 0;
      for (const d of [1, -1, 24, -24]) maxD = Math.max(maxD, Math.abs(tops[ci + d] - top));
      for (const d of [3, -3, 72, -72, 2 + 48, -2 - 48]) rise = Math.max(rise, tops[ci + d] - top);
      const slope = Math.max(Math.hypot(hx, hz), maxD * 0.72);
      const talus = rise >= 5 && slope < 1.75 && slope > 0.3 && this.sD.n2(x / 9, z / 9) > -0.35;
      let surf = this.surfaceFor(x, top, z, c, slope, talus);
      const cliffy = c.cliff > 0.02;
      const hi = cliffy ? Math.min(WORLD_H - 2, Math.floor(c.h) + 12) : top;
      let depthBelow = -1;
      for (let y = hi; y >= 0; y--) {
        let solid = true;
        if (cliffy && y > Math.floor(c.h) - 14) solid = this.density(x, y, z, c) > 0;
        if (!solid) { depthBelow = -1; continue; }
        if (depthBelow < 0) {
          depthBelow = 0;
          if (y !== top) surf = this.surfaceFor(x, y, z, c, slope * 0.8, false);
        } else depthBelow++;
        let id;
        if (y <= top - 14 && y !== 0) id = this.strata(x, y, z, c);
        else if (depthBelow === 0) id = surf[0];
        else if (depthBelow <= surf[2] && surf[1]) id = surf[1];
        else id = this.strata(x, y, z, c);
        blocks[bidx(lx, y, lz)] = id;
      }
      // water
      if (top < SEA) {
        const frozen = c.temp < -0.3;
        for (let y = SEA; y > top; y--) {
          const i = bidx(lx, y, lz);
          if (blocks[i] === 0) blocks[i] = (frozen && y === SEA && (c.h > SEA - 5 || this.sD.n2(x / 17, z / 17) > 0.15)) ? B.ice : B.water;
        }
      }
    }

    this.carveCaves(blocks, cx, cz, cols, tops);
    this.placeOres(blocks, cx, cz);
    this.grandCaverns(blocks, cx, cz);
    this.decorate(blocks, cx, cz, cols, tops);
    this.placeTrees(blocks, cx, cz);
    this.placeVillages(blocks, cx, cz);
    this.placeRuin(blocks, cx, cz);
    for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) {
      blocks[bidx(lx, 0, lz)] = B.bedrock;
      if (rand01(x0 + lx, 1, z0 + lz, seed) < 0.55) blocks[bidx(lx, 1, lz)] = B.bedrock;
    }
    return { blocks, biomes };
  }

  carveCaves(blocks, cx, cz, cols, tops) {
    const x0 = cx * 16, z0 = cz * 16;
    let maxTop = 0;
    for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) maxTop = Math.max(maxTop, tops[(lz + 4) * 24 + lx + 4]);
    const ny = Math.min(63, (Math.min(maxTop, 150) >> 2) + 2);
    const grid = new Float32Array(5 * 5 * (ny + 1) * 3);
    for (let gy = 0; gy <= ny; gy++) for (let gz = 0; gz < 5; gz++) for (let gx = 0; gx < 5; gx++)
      this.caveFields(x0 + gx * 4, gy * 4, z0 + gz * 4, grid, ((gy * 5 + gz) * 5 + gx) * 3);
    const f = [0, 0, 0];
    for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) {
      const x = x0 + lx, z = z0 + lz, ci = (lz + 4) * 24 + lx + 4, c = cols[ci], top = tops[ci];
      const wet = top < SEA + 2 || c.river > 0 || c.lake > 0;
      const entrance = !wet && c.village <= 0 && this.sF.n2(x / 54 + 13, z / 54 + 91) > 0.46;
      const limit = wet ? Math.min(top, SEA) - 8 : entrance ? top + 3 : top - 6;
      const rav = c.village <= 0 && !wet ? this.ravineAt(x, z, top) : null;
      const pool = this.sD.n2(x / 130 + 300, z / 130 - 77);

  // ------------------------------------------------------------ villages
  villagePlan(v) {

    }

      const len = Math.max(1, Math.hypot(bx - ax, bz - az));
      for (let s = 0; s <= len; s += 0.5) {
        const px = Math.round(lerp(ax, bx, s / len) + Math.sin(s * 0.35) * 0.7), pz = Math.round(lerp(az, bz, s / len) + Math.cos(s * 0.29) * 0.7);

          put(px + k, gy, pz + m, rand01(px + k, 4, pz + m, 5) < 0.72 ? B.gravel : B.cobble);
          put(px + k, gy + 1, pz + m, 0);
        }
      }
    };
    for (const h of huts) path(v.x, v.z, h.x, h.z);
    // well
    for (let dz = -2; dz <= 1; dz++) for (let dx = -2; dx <= 1; dx++) {
      const edge = dx === -2 || dx === 1 || dz === -2 || dz === 1;
      put(v.x + dx, gy, v.z + dz, B.cobble);
      if (edge) put(v.x + dx, gy + 1, v.z + dz, B.mossy_cobble); else { put(v.x + dx, gy + 1, v.z + dz, 0); put(v.x + dx, gy, v.z + dz, B.water); put(v.x + dx, gy - 1, v.z + dz, B.water); put(v.x + dx, gy - 2, v.z + dz, B.cobble); }
    }

  }

  ruinPlan(f) {

function generateLayer(index, size) {
  const def = LAYER_DEFS[index];
  const m = new Mat(size);
  const [ns, ao] = paintLayer(def[0], m, 1000 + index * 77);
  const cutout = index >= FIRST_CUTOUT_LAYER && !['mushroom_cap', 'mushroom_stem', 'glow_cap', 'crystal_azure', 'crystal_amber', 'lava', 'charwood'].includes(def[0]);
  const out = m.pack(ns, ao, cutout);
  // linear-space average albedo (used for distant terrain, particles and bounce light)
  let r = 0, g = 0, b = 0, n = 0, mk = 0;
  for (let i = 0; i < size * size; i += 3) if (m.al[i] > 0.5) { r += Math.pow(clamp(m.r[i], 0, 255) / 255, 2.2); g += Math.pow(clamp(m.g[i], 0, 255) / 255, 2.2); b += Math.pow(clamp(m.b[i], 0, 255) / 255, 2.2); mk += m.mk[i]; n++; }
  n = n || 1;
  out.avg = [Math.pow(r / n, 1 / 2.2) * 255, Math.pow(g / n, 1 / 2.2) * 255, Math.pow(b / n, 1 / 2.2) * 255];
  out.tintCover = mk / n;
  out.index = index;
  return out;
}

  float e = sat((sky - 0.55) * 3.0);
  if (uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0) {

    float over = smoothstep(roof - 0.75, roof - 0.12, wp.y + (ny > 0.5 ? 0.0 : 0.45));

vec3 rainRipples(vec2 p, float amount){

  for (int k = 0; k < 2; k++) {
    vec2 q = p * (k == 0 ? 2.3 : 3.7) + float(k) * 17.3;
    vec2 cell = floor(q);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 c = cell + vec2(i, j);
      vec2 h = hash22(c);
      float t = fract(uTime * (1.25 + h.x * 0.5) + h.y);
      vec2 d = q - (c + 0.15 + h * 0.7);

const G_FAR_SLOPE = /* glsl */`
uniform sampler2D uFarHeight;
uniform vec4 uFarInfo;
vec3 farNormal(vec2 xz){
  vec2 uv = (xz - uFarInfo.xy) / uFarInfo.z;
  float e = 8.0 / uFarInfo.z;
  float hx = textureLod(uFarHeight, uv - vec2(e, 0.0), 0.0).r - textureLod(uFarHeight, uv + vec2(e, 0.0), 0.0).r;
  float hz = textureLod(uFarHeight, uv - vec2(0.0, e), 0.0).r - textureLod(uFarHeight, uv + vec2(0.0, e), 0.0).r;
  return normalize(vec3(hx, 17.0, hz));
}
// x: unused, y: how strongly this pixel should adopt the smooth slope
vec2 farSlope(vec3 wp, float dist){
  if (uFarInfo.w < 0.5) return vec2(0.0);
  vec2 uv = (wp.xz - uFarInfo.xy) / uFarInfo.z;
  if (uv.x < 0.01 || uv.y < 0.01 || uv.x > 0.99 || uv.y > 0.99) return vec2(0.0);
  float h = textureLod(uFarHeight, uv, 0.0).r;
  float near_ = 1.0 - smoothstep(4.0, 11.0, abs(wp.y - h));
  return vec2(0.0, smoothstep(48.0, 180.0, dist) * near_ * 0.82);
}

const G_TERRAIN_FRAG = /* glsl */`

const vec3 FB[6] = vec3[6](vec3(0,1,0), vec3(0,1,0), vec3(0,0,-1), vec3(0,0,1), vec3(0,1,0), vec3(0,1,0));

Samp sampleOne(vec2 uv, float layer, vec2 dx, vec2 dy){

    albedo *= mix(1.0, 0.56, wl * porosity); rough = mix(rough, 0.2, wl * 0.85);

  if ((flags & 1) != 0) { albedo *= mix(1.0, 0.7, porosity); }

  // mining damage: fracture network spreading from the middle of the face
  if (uBreak.w > 0.0 && !isModel && all(equal(blockPos, floor(uBreak.xyz + 0.5)))) {
    vec3 bT = FT[face], bB = FB[face];
    vec2 p = vec2(fract(dot(vWorld, bT)), fract(dot(vWorld, bB)));
    vec2 q = p * 3.1 + (vec2(texture(uNoiseTex, p * 0.42).b, texture(uNoiseTex, p * 0.42 + 0.41).b) - 0.5) * 1.1;
    vec2 cell = floor(q); float f1 = 9.0, f2 = 9.0;
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 c = cell + vec2(i, j); vec2 pt = c + hash22(c + float(face) * 13.0); float dd = length(q - pt);
      if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
    }
    float web = f2 - f1;
    vec2 cp = p - 0.5;
    float r = length(cp);
    float wob = texture(uNoiseTex, p * 1.7).a - 0.5;
    float reveal = smoothstep(0.02, -0.12, r + wob * 0.22 - uBreak.w * 0.78);
    float net = smoothstep(0.018 + uBreak.w * 0.05, 0.003, web) * reveal * smoothstep(0.38, 0.8, uBreak.w);
    float split = 0.0, lip = 0.0;
    for (int k = 0; k < 6; k++) {
      float fk = float(k);
      if (fk > 1.5 + uBreak.w * 5.0) break;
      float ang0 = fk * 1.047 + hash13(blockPos + fk) * 0.85 + float(face);
      vec2 dir = vec2(cos(ang0), sin(ang0)); vec2 nrmD = vec2(-dir.y, dir.x);
      float along = dot(cp, dir);
      if (along < -0.02) continue;
      float jag = (textureLod(uNoiseTex, vec2(along * 0.85 + fk * 0.17, fk * 0.31), 0.0).b - 0.5) * 0.3 + (textureLod(uNoiseTex, vec2(along * 1.6, fk * 0.57), 0.0).a - 0.5) * 0.035;
      float off = dot(cp, nrmD) - jag * smoothstep(0.0, 0.2, along);
      float len = uBreak.w * (0.55 + 0.35 * hash13(blockPos + fk * 3.7));
      float wdt = (0.009 + 0.024 * uBreak.w) * sat(1.0 - along / max(len, 0.01));
      if (along < len) { split = max(split, smoothstep(wdt, wdt * 0.35, abs(off))); lip = max(lip, smoothstep(wdt * 3.0, wdt * 1.2, off) * step(wdt, off)); }
    }
    float crack = max(split, net * 0.85);
    float chipped = smoothstep(0.55, 0.8, uBreak.w) * smoothstep(0.54, 0.62, texture(uNoiseTex, p * 1.9 + 0.13).a) * smoothstep(0.5, 0.15, r);
    albedo *= 1.0 - crack * 0.86;
    albedo = mix(albedo, albedo * 1.5 + 0.05, sat(lip + chipped * 0.7) * (1.0 - crack));
    crack = max(crack, chipped * 0.45);
    ao *= 1.0 - crack * 0.7;
    vec2 tilt = vec2(dFdx(crack), dFdy(crack));
    N = normalize(N - (normalize(dpx) * tilt.x + normalize(dpy) * tilt.y) * 1.4);
  }

  // emission
  float emis = 0.0;
  bool litFlag = (flags & 16) != 0;
  if (emisScale > 0.0 && ex.r > 0.003) {
    bool needsLit = layerI == ${LAYER.furnace_front} || layerI == ${LAYER.charwood} || layerI == ${LAYER.mushroom_stem};
    if (!needsLit || litFlag) emis = ex.r * emisScale;
    if (layerI == ${LAYER.lava}) {
      vec2 uv2 = uv * 1.37 + vec2(0.31, 0.67) - vec2(uTime * 0.019, uTime * 0.004);
      float e2 = textureGrad(uExtraArr, vec3(uv2, layer), gx * 1.37, gy * 1.37).r;
      float pulse = 0.82 + 0.18 * sin(uTime * 0.7 + m1 * 20.0);
      float big = texture(uNoiseTex, vWorld.xz / 23.0 + uTime * vec2(0.0042, -0.0031)).b;
      float upwell = smoothstep(0.55, 0.74, big);
      float heat = sat((pow(ex.r, 1.45) * 0.96 + pow(e2, 3.5) * 0.17 + upwell * (0.06 + ex.r * 0.5)) * pulse);
      emis = pow(heat, 2.2) * emisScale * 1.5 + 0.006;
      float crustN = texture(uNoiseTex, vWorld.xz / 2.3).a;
      albedo = mix(vec3(0.022, 0.012, 0.009) * (0.5 + crustN), mix(vec3(0.72, 0.07, 0.003), vec3(1.0, 0.43, 0.04), sat(heat * 1.6 - 0.5)), smoothstep(0.14, 0.5, heat));
      rough = mix(0.82, 0.45, heat);
    }
    if (layerI == ${LAYER.charwood}) emis *= 0.75 + 0.25 * sin(uTime * 7.0 + hash13(floor(vWorld * 9.0)) * 40.0);
    if (layerI == ${LAYER.crystal_azure} || layerI == ${LAYER.crystal_amber}) {
      float fres = pow(1.0 - sat(dot(N, V)), 2.0);
      emis *= 0.45 + fres * 1.7 + 0.12 * sin(uTime * 1.3 + hash13(blockPos) * 6.28);
    }
  }

  if (layerI == ${LAYER.lava}) matClass = 5.0;
  float gflags = uObjFlags + ((flags & 1) != 0 ? 4.0 : 0.0);
  float extra = matClass == 1.0 ? 0.0 : microShadow;
  writeG(albedo, ao, N, rough, metal, vLight, emis, matClass, faceOut, extra, gflags);
}`;

// ---------------------------------------------------------------- alpha-tested foliage (leaf cards and plants)
const G_ALPHA_TEST = /* glsl */`
float coverageAlpha(vec2 uv, float a){
  vec2 dx = dFdx(uv * uTexSize), dy = dFdy(uv * uTexSize);
  float mip = max(0.0, 0.5 * log2(max(dot(dx, dx), dot(dy, dy))));
  return a * (1.0 + mip * 0.24);
}`;
const G_CUTOUT_FRAG = /* glsl */`
${G_SURFACE_COMMON}
in vec3 vWorld; in vec3 vNormal; in vec4 vLight; in vec4 vTint; in vec2 vUv;
flat in ivec4 vInfo;
${G_ALPHA_TEST}
void main(){
  int layerI = vInfo.y; float layer = float(layerI); int flags = vInfo.z;
  vec3 c3 = vec3(vUv, layer);
  vec4 ex = texture(uExtraArr, c3);
  float a = coverageAlpha(vUv, ex.a);
  float dist = length(uCamPos - vWorld);
  float th = 0.5 + (ign(gl_FragCoord.xy, uFrame) - 0.5) * 0.46;
  if (a < th) discard;
  if (dist < 0.75 && ign(gl_FragCoord.yx, uFrame + 17.0) > smoothstep(0.25, 0.75, dist)) discard;
  vec4 alb = texture(uAlbedoArr, c3);
  vec4 nr = texture(uNormalArr, c3);
  vec3 albedo = tintApply(alb.rgb, vTint.rgb, ex.b);
  vec3 Ng = normalize(vNormal);
  vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld); vec2 ux = dFdx(vUv), uy = dFdy(vUv);
  vec3 p2 = cross(dpy, Ng), p1 = cross(Ng, dpx);
  vec3 T = p2 * ux.x + p1 * uy.x, Bt = p2 * ux.y + p1 * uy.y;
  float inv = inversesqrt(max(max(dot(T, T), dot(Bt, Bt)), 1e-12));
  vec2 tn = nr.xy * 2.0 - 1.0;
  vec3 N = normalize(Ng + (T * inv * tn.x + Bt * inv * tn.y) * 0.75);
  vec3 V = normalize(uCamPos - vWorld);
  if (dot(N, V) < -0.25) N = normalize(N + V * 0.65);
  float rough = nr.z;
  float m = texture(uNoiseTex, (vWorld.xz + vWorld.y * 0.7) / 23.0).b;
  albedo *= 0.88 + m * 0.26;
  if (uWetness > 0.001) { float e = rainExposure(vWorld, 1.0, vLight.a) * uWetness; albedo *= mix(1.0, 0.72, e); rough = mix(rough, 0.2, e); }
  if (uSnowCover > 0.001 || vWorld.y > 150.0) {
    float s = max(uSnowCover * 0.85, smoothstep(150.0, 174.0, vWorld.y)) * sat(N.y * 1.6 - 0.35) * smoothstep(0.6, 0.9, vLight.a);
    albedo = mix(albedo, vec3(0.72, 0.77, 0.84), s); rough = mix(rough, 0.7, s);
  }
  float ao = nr.w * vTint.a * (0.72 + 0.28 * alb.a);
  float trans = (flags & 2) != 0 ? 1.0 : 0.8;
  writeG(albedo, ao, N, rough, 0.0, vLight, 0.0, 1.0, 6.0, trans, uObjFlags + ((flags & 1) != 0 ? 4.0 : 0.0));
}`;

// ---------------------------------------------------------------- instanced meadow grass
const G_GRASS_VERT = /* glsl */`
precision highp float;
in vec4 aBlade;   // yaw, lean, height scale, width
in float aSide;
in vec4 iPos; in vec4 iTint; in vec4 iLight;
out vec3 vWorld; out vec3 vNormal; out vec4 vLight; out vec4 vTint; out vec2 vUv;
uniform vec3 uCamPos, uPlayerPos;
uniform float uGrassDist;
${G_WIND}
${G_COMMON}
void main(){
  vec3 base = (modelMatrix * vec4(iPos.xyz, 1.0)).xyz;
  float rnd = iPos.w;
  float yaw = rnd * 6.2831 + aBlade.x;
  float cr = cos(rnd * 41.0), sr = sin(rnd * 41.0);
  vec2 off = mat2(cr, sr, -sr, cr) * position.xz;
  float t = position.y;
  float H = iTint.a * (255.0 / 160.0) * aBlade.z;
  float d = length(base.xz - uCamPos.xz);
  float keep = 1.0 - smoothstep(uGrassDist * 0.62, uGrassDist, d + (fract(rnd * 77.7) - 0.5) * uGrassDist * 0.45);
  H *= keep;
  vec2 dir = vec2(cos(yaw), sin(yaw)), perp = vec2(-dir.y, dir.x);
  float lean = aBlade.y * (0.75 + 0.5 * fract(rnd * 13.3));
  float widthK = aBlade.w * (1.0 + smoothstep(18.0, uGrassDist, d) * 1.4) * (1.0 - pow(t, 1.7) * 0.93) * step(0.001, keep);
  vec3 p = base + vec3(off.x, 0.0, off.y);
  p.xz += dir * lean * t * t * H + perp * aSide * widthK;
  p.y += t * H * (1.0 - lean * lean * t * t * 0.34);
  vec2 wnd = windAt(base.xz + off);
  float bendK = t * t * H;
  p.xz += wnd * bendK * 0.52;
  p.y -= dot(wnd, wnd) * bendK * 0.13;
  vec2 pd = p.xz - uPlayerPos.xz; float pl = length(pd);
  if (pl < 0.85 && abs(base.y - uPlayerPos.y) < 1.6) { float k = (0.85 - pl) * t; p.xz += pd / max(pl, 0.02) * k * 0.75; p.y -= k * H * 0.45; }
  vec3 tang = normalize(vec3(dir.x * lean * 2.0 * t + wnd.x * t, 1.0, dir.y * lean * 2.0 * t + wnd.y * t));
  vec3 side = vec3(perp.x, 0.0, perp.y);
  vec3 fn = normalize(cross(side, tang));
  if (dot(fn, uCamPos - p) < 0.0) fn = -fn;
  vNormal = normalize(mix(fn + side * aSide * 0.55, vec3(0.0, 1.0, 0.0), 0.42));
  vWorld = p; vLight = iLight; vTint = vec4(iTint.rgb, mix(0.3, 1.0, smoothstep(0.0, 0.75, t))); vUv = vec2(t, fract(rnd * 31.7 + aBlade.x * 3.1));
  gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
}`;
const G_GRASS_FRAG = /* glsl */`
${G_SURFACE_COMMON}
in vec3 vWorld; in vec3 vNormal; in vec4 vLight; in vec4 vTint; in vec2 vUv;
void main(){
  float t = vUv.x, r = vUv.y;
  vec3 tint = srgbToLin(vTint.rgb);

  writeG(albedo, vTint.a, N, rough, 0.0, vLight, 0.0, 1.0, 6.0, 0.55 + t * 0.45, 0.0);

// ---------------------------------------------------------------- distant terrain
const G_LOD_VERT = /* glsl */`
precision highp float;
in vec4 aNrm; in vec4 aCol; in vec2 aUv;
out vec3 vWorld; out vec3 vNormal; out vec4 vCol; out vec2 vUv;
flat out int vLayer;
uniform float uFarShift;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz; vNormal = aNrm.xyz; vCol = aCol; vUv = aUv; vLayer = int(aNrm.w * 127.0 + 0.5);

const G_LOD_FRAG = /* glsl */`
${G_SURFACE_COMMON}
in vec3 vWorld; in vec3 vNormal; in vec4 vCol; in vec2 vUv;
flat in int vLayer;
uniform sampler2D uLoadedMask;
uniform vec4 uMaskInfo;   // chunk origin x, z, size, enabled
uniform vec4 uHole;       // world rectangle already covered by a finer level
${G_ALPHA_TEST}
void main(){
  int kind = int(vCol.a * 255.0 + 0.5);
  vec2 cc = floor((vWorld.xz - (kind == 3 ? vec2(0.0) : vNormal.xz * 0.3)) / 16.0) - uMaskInfo.xy;
  if (uMaskInfo.w > 0.5 && cc.x >= 0.0 && cc.y >= 0.0 && cc.x < uMaskInfo.z && cc.y < uMaskInfo.z) {
    if (texelFetch(uLoadedMask, ivec2(cc), 0).r > 0.5) discard;
  }
  if (vWorld.x > uHole.x && vWorld.z > uHole.y && vWorld.x < uHole.z && vWorld.z < uHole.w) discard;
  float layer = float(vLayer);
  vec3 dpx = dFdx(vWorld), dpy = dFdy(vWorld);
  vec3 Ng = normalize(vNormal);
  vec3 N = Ng;
  vec3 albedo; float rough = 0.9; float matClass = 0.0; float ao = 1.0;
  float dist = length(vWorld - uCamPos);
  if (kind == 3) {
    float a = coverageAlpha(vUv, texture(uExtraArr, vec3(vUv, layer)).a);
    if (a < 0.46 + (ign(gl_FragCoord.xy, uFrame) - 0.5) * 0.4) discard;
    vec4 tx = texture(uAlbedoArr, vec3(vUv, layer));
    float lm = luma(tx.rgb) / max(luma(textureLod(uAlbedoArr, vec3(0.5, 0.5, layer), 12.0).rgb), 0.01);
    albedo = srgbToLin(vCol.rgb) * clamp(lm, 0.35, 1.9);
    N = normalize(Ng + (vec3(texture(uNoiseTex, vWorld.xz / 3.7).a, texture(uNoiseTex, vWorld.xy / 3.1).a, texture(uNoiseTex, vWorld.zy / 3.3).a) - 0.5) * 0.9);
    matClass = 1.0; ao = 0.45 + 0.55 * vUv.y;
  } else if (kind == 1) {

    vec3 shallow = mix(vec3(0.02, 0.075, 0.085), vec3(0.025, 0.17, 0.15), warm);
    albedo = mix(shallow, vec3(0.006, 0.024, 0.045), sat(depth * 1.5));
    vec4 w1 = texture(uWaterNormals, vWorld.xz / 90.0 + uTime * vec2(0.006, 0.004));
    vec4 w2 = texture(uWaterNormals, vWorld.xz / 37.0 - uTime * vec2(0.011, -0.006));
    float flat_ = 1.0 / (1.0 + dist * 0.004);
    N = normalize(vec3((w1.x - 0.5 + w2.z - 0.5) * 0.42 * flat_, 1.0, (w1.y - 0.5 + w2.w - 0.5) * 0.42 * flat_));
    rough = 0.09 + sat(dist / 1800.0) * 0.14; matClass = 6.0;
  } else {
    // the same materials as the near blocks, projected along the dominant axis
    vec3 face = abs(normalize(cross(dpx, dpy)));
    vec2 p, gx, gy; vec3 T, Bt;
    if (face.y > 0.6) { p = vWorld.xz; gx = dpx.xz; gy = dpy.xz; T = vec3(1, 0, 0); Bt = vec3(0, 0, 1); }
    else if (face.x > face.z) { p = vWorld.zy; gx = dpx.zy; gy = dpy.zy; T = vec3(0, 0, 1); Bt = vec3(0, 1, 0); }
    else { p = vWorld.xy; gx = dpx.xy; gy = dpy.xy; T = vec3(1, 0, 0); Bt = vec3(0, 1, 0); }
    float span = texelFetch(uLayerParams, ivec2(vLayer, 0), 0).x * 2.0;
    vec4 tx = textureGrad(uAlbedoArr, vec3(p / span, layer), gx / span, gy / span);
    vec4 nr = textureGrad(uNormalArr, vec3(p / span, layer), gx / span, gy / span);
    vec3 avg = textureLod(uAlbedoArr, vec3(0.5, 0.5, layer), 12.0).rgb;
    float detail = clamp(luma(tx.rgb) / max(luma(avg), 0.01), 0.45, 1.75);
    albedo = srgbToLin(vCol.rgb) * mix(1.0, detail, 0.85);
    float n1 = texture(uNoiseTex, p / 23.0).a, n2 = texture(uNoiseTex, vWorld.xz / 97.0).b, n3 = texture(uNoiseTex, p / 7.1).r;
    albedo *= 0.74 + n1 * 0.34 + n2 * 0.34 - n3 * 0.1;
    vec2 tn = nr.xy * 2.0 - 1.0;
    N = normalize(Ng + (T * tn.x + Bt * tn.y) * 0.8 + (vec3(texture(uNoiseTex, p / 14.0).a, 0.5, texture(uNoiseTex, p / 14.0 + 0.5).a) - 0.5) * 0.55);
    ao = nr.w * (0.8 + 0.2 * n1);
    if (kind == 2) { rough = 0.2; matClass = 4.0; }

    if (vWorld.y > 148.0 && Ng.y > 0.45) { float s = smoothstep(148.0, 174.0, vWorld.y + (n2 - 0.5) * 30.0 + (n1 - 0.5) * 8.0) * smoothstep(0.45, 0.75, N.y); albedo = mix(albedo, vec3(0.74, 0.78, 0.84), s); if (s > 0.5) matClass = 2.0; }

}`;

    this.dynTerrain = mk(G_VOXEL_VERT, G_TERRAIN_FRAG, surfUniforms({ uObjFlags: { value: 2 } }));

    this.lod = mk(G_LOD_VERT, G_LOD_FRAG, surfUniforms({ uLoadedMask: { value: null }, uMaskInfo: { value: V4() }, uHole: { value: V4() }, uFarShift: { value: 0 } }), { side: THREE.DoubleSide });
    const shadowOpts = { side: THREE.DoubleSide, colorWrite: false };
    this.shadowOpaque = mk(G_VOXEL_VERT, G_SHADOW_FRAG, uni('uTime', 'uWind'), shadowOpts);
    this.shadowCutout = mk(G_VOXEL_VERT, G_SHADOW_CUTOUT_FRAG, uni('uTime', 'uWind', 'uExtraArr', 'uTexSize'), shadowOpts);
    this.shadowGrass = mk(G_GRASS_VERT, G_SHADOW_GRASS_FRAG, uni('uTime', 'uWind', 'uCamPos', 'uPlayerPos', 'uGrassDist'), shadowOpts);

// geometry builders from worker output
function voxelGeometry(d, quads = true) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(d.pos, 3));
  g.setAttribute('aNrm', new THREE.BufferAttribute(d.nrm, 4, true));
  g.setAttribute('aInfo', new THREE.BufferAttribute(d.info, 4, false));
  g.setAttribute('aLight', new THREE.BufferAttribute(d.light, 4, true));
  g.setAttribute('aTint', new THREE.BufferAttribute(d.tint, 4, true));

// ---------------------------------------------------------------- icons rendered from the real 3D materials
const Icons = {
  cache: new Map(), rt: null,
  init() {
    this.size = 96;
    this.rt = new THREE.WebGLRenderTarget(this.size * 2, this.size * 2, { type: THREE.UnsignedByteType, depthBuffer: true });
    this.scene = new THREE.Scene();
    this.camera = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0.1, 10);
    this.camera.position.set(0, 0, 3);
    this.material = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: G_MODEL_VERT, fragmentShader: G_ICON_FRAG, uniforms: modelUniforms(), side: THREE.DoubleSide });
    this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.material);
    this.mesh.frustumCulled = false; this.scene.add(this.mesh);
    this.canvas = document.createElement('canvas'); this.canvas.width = this.canvas.height = this.size;
    this.ctx = this.canvas.getContext('2d');
    this.big = document.createElement('canvas'); this.big.width = this.big.height = this.size * 2;
  },
  get(key) {
    let url = this.cache.get(key);
    if (url) return url;
    const it = ITEMS[key];
    if (!it) return '';
    const m = this.mesh;
    m.geometry = itemGeometry(key);
    m.rotation.set(0, 0, 0); m.position.set(0, 0, 0); m.scale.setScalar(1);
    const kind = it.type === 'block' ? T_KIND[it.block] : -1;
    if (it.type === 'tool') { m.rotation.set(0, -0.28, -0.72); m.scale.setScalar(1.17); m.position.set(-0.04, -0.05, 0); }
    else if (it.type === 'block' && (kind === KIND.cube || kind === KIND.slab || kind === KIND.model || kind === KIND.chest || kind === KIND.glass || kind === KIND.leaves || kind === KIND.campfire)) { m.rotation.set(0.52, -0.785, 0, 'XYZ'); m.scale.setScalar(kind === KIND.leaves ? 0.66 : 0.6); }
    else if (it.type === 'block') { m.rotation.set(0.1, kind === KIND.cross ? -0.785 : 0.25, 0); m.scale.setScalar(0.9); }
    else { m.rotation.set(0.45, -0.5, 0); m.scale.setScalar(0.95); }
    const prev = renderer.getRenderTarget();
    renderer.setRenderTarget(this.rt); renderer.setClearColor(0x000000, 0); renderer.clear(true, true, false);
    renderer.render(this.scene, this.camera);
    const s = this.size * 2, px = new Uint8Array(s * s * 4);
    renderer.readRenderTargetPixels(this.rt, 0, 0, s, s, px);
    renderer.setRenderTarget(prev);
    const bctx = this.big.getContext('2d'), img = bctx.createImageData(s, s);
    for (let y = 0; y < s; y++) img.data.set(px.subarray((s - 1 - y) * s * 4, (s - y) * s * 4), y * s * 4);
    bctx.putImageData(img, 0, 0);
    this.ctx.clearRect(0, 0, this.size, this.size);
    this.ctx.imageSmoothingQuality = 'high';
    this.ctx.drawImage(this.big, 0, 0, this.size, this.size);
    url = this.canvas.toDataURL('image/png');
    this.cache.set(key, url);
    return url;
  },
};

function perObjectLight(mesh) {
  mesh.onBeforeRender = (r, s, c, g, material) => {
    if (!material.uniforms || !material.uniforms.uLight) return;
    material.uniforms.uLight.value.copy(mesh.userData.light);
    material.uniforms.uEmisBoost.value = mesh.userData.emis === undefined ? 1 : mesh.userData.emis;
    material.uniforms.uHit.value = mesh.userData.hit || 0;
    material.uniformsNeedUpdate = true;
  };
}

  _clearChunk(key) {

  setChunk(chunk, list) {

  update(dt, world, player, inventory, onPickup) {
    for (const list of this.byChunk.values()) for (const e of list) {

    }

        magnet = true;
        const pull = V3().subVectors(target, d.pos).normalize().multiplyScalar(14 * dt * (2.4 - dist));

          d.n = left;
          if (!left) { this._removeObj(d); this.drops.splice(i, 1); continue; }
        }
      }
      if (!magnet) d.vel.y -= 16 * dt;
      const nx = d.pos.x + d.vel.x * dt, ny = d.pos.y + d.vel.y * dt, nz = d.pos.z + d.vel.z * dt;
      if (T_SOLID[world.getId(Math.floor(nx), Math.floor(d.pos.y), Math.floor(d.pos.z))]) d.vel.x *= -0.3; else d.pos.x = nx;
      if (T_SOLID[world.getId(Math.floor(d.pos.x), Math.floor(d.pos.y), Math.floor(nz))]) d.vel.z *= -0.3; else d.pos.z = nz;
      if (!magnet && T_SOLID[world.getId(Math.floor(d.pos.x), Math.floor(ny - 0.16), Math.floor(d.pos.z))]) { d.vel.y = 0; d.vel.x *= 0.82; d.vel.z *= 0.82; d.pos.y = Math.floor(ny - 0.16) + 1.16; d.rest = true; } else d.pos.y = ny;
      if (world.getId(Math.floor(d.pos.x), Math.floor(d.pos.y), Math.floor(d.pos.z)) === B.water) { d.vel.multiplyScalar(0.92); d.vel.y += 20 * dt; }
      if (T_SOLID[world.getId(Math.floor(d.pos.x), Math.floor(d.pos.y), Math.floor(d.pos.z))]) d.pos.y += dt * 3;

      d.v.y -= (d.leafy ? 5 : 17) * dt;

  },
};

const G_VFLAME_VERT = /* glsl */`
precision highp float;
out vec2 vUv; out vec3 vWorld; uniform float uTime;
void main(){
  vUv = uv;
  vec3 p = position;
  float h = uv.y;
  p.x += sin(uTime * 8.0 + h * 4.0) * 0.008 * h * h + sin(uTime * 15.0) * 0.004 * h;
  p.z += cos(uTime * 7.0 + h * 5.0) * 0.007 * h * h;
  vec4 wp = modelMatrix * vec4(p, 1.0); vWorld = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
  gl_Position.z = (gl_Position.z + gl_Position.w) * 0.05 - gl_Position.w;
}`;
const G_VFLAME_FRAG = /* glsl */`
precision highp float;
in vec2 vUv; in vec3 vWorld;
uniform sampler2D uNoiseTex; uniform float uTime, uFrame;
${G_COMMON}
${G_GBUF}
void main(){
  float y = vUv.y, x = vUv.x * 2.0 - 1.0;
  float n1 = texture(uNoiseTex, vec2(vUv.x * 0.4, y * 0.55 - uTime * 0.95)).a - 0.5;
  float n2 = texture(uNoiseTex, vec2(vUv.x * 0.9 + 0.4, y * 1.2 - uTime * 1.5)).a - 0.5;
  x += (n1 * 1.2 + n2 * 0.6) * y;
  float w = smoothstep(0.0, 0.22, y) * pow(max(1.0 - y, 0.0), 0.62) * 1.05;
  float body = smoothstep(w, w * 0.2, abs(x)) * smoothstep(1.0, 0.5, y + n2 * 0.6);
  if (body < 0.28 + (ign(gl_FragCoord.xy, uFrame) - 0.5) * 0.5) discard;
  float core = smoothstep(0.55, 0.0, length(vec2(x * 1.7, (y - 0.24) * 2.1)));
  vec3 col = mix(vec3(0.95, 0.16, 0.01), vec3(1.0, 0.5, 0.05), smoothstep(0.1, 0.85, body * (1.15 - y)));
  col = mix(col, vec3(1.0, 0.86, 0.46), core);
  writeG(col, 1.0, vec3(0.0, 1.0, 0.0), 1.0, 0.0, vec4(0.0), (3.0 + core * 9.0) * (0.5 + body * 0.5), 0.0, 6.0, 0.0, 3.0);
}`;

  async renderAt(t, opts = {}) {

  for (;;) {
    const cam = Pipeline.camera;
    Game.world.update(cam.position.x, cam.position.z, Q.viewDist, 0, 0); Game.world.applyPending(80);
    const left = Game.world.missing;
    text.textContent = 'cutting terrain · ' + left + ' chunks to go'; fill.style.width = (66 + 28 * clamp(1 - left / (Q.viewDist * Q.viewDist * 3), 0, 1)) + '%';
    if ((Game.world.missing === 0 && Game.world.lodPending < 12) || performance.now() - tW > 20000) break;
    await sleep(30);
  }
  text.textContent = 'compiling shaders'; fill.style.width = '97%'; await nextFrame();
  Game.tick(0.016); Game.applyEnvironment(0.016, true); Game.render(0.016); await nextFrame();
  fill.style.width = '100%';
  document.getElementById('loading').classList.add('done');

  let last = performance.now(), frames = 0, acc = 0, accN = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const raw = now - last; last = now;
    const dt = Math.min(0.05, Math.max(0.001, raw / 1000));
    Stats.ft = lerp(Stats.ft, raw, 0.06); Stats.fps = 1000 / Stats.ft;
    const c0 = performance.now();
    renderer.info.reset();
    try {
      Game.tick(dt);
      Game.render(dt);
      UI.updateHUD(dt, Game);
    } catch (e) { console.error(e); window.__lastError = String(e.stack || e); }
    Stats.cpu = lerp(Stats.cpu, performance.now() - c0, 0.08);
    Stats.calls = renderer.info.render.calls; Stats.tris = renderer.info.render.triangles;
    accN++; acc += raw; if (acc > 250) { UI.updateDebug(Game, Stats); acc = 0; accN = 0; }
    if (++frames === 20) {
      window.__ready = true;
      if (QS.get('play')) Game.startNew(QS.get('seed') || '4242', QS.get('play'));
    }
  }
  requestAnimationFrame(loop);
}
boot().catch((e) => { console.error(e); fatal(String(e.stack || e)); });

</script>
